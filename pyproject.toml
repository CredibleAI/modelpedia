[project]
name = "modelpedia"
version = "0.1.0"
description = "A database of findings about machine learning models"
requires-python = ">=3.12"

dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ingest = [
    "openreview-py>=2.4.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "urllib3>=2",
]

[project.scripts]
modelpedia = "modelpedia.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelpedia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
