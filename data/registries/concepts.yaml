concept:shortcut:
  name: Shortcut
  description: >
    The model relies on a feature that correlates with the target in the data it saw but has no
    causal connection to it: printed text standing in for the object named in a caption, a chest
    drain standing in for disease, position on the globe standing in for climate. Shortcuts work
    until the correlation disappears, which is usually at deployment. The older name for the same
    thing is Clever Hans behaviour, after Lapuschkin et al. 2019; both names point here rather than
    at two nodes. How strongly the reliance was established -- by removing the feature and
    remeasuring, or by beating the model with a baseline built from the spurious feature alone --
    is recorded in evidence_type, not in this definition.

concept:linear-representation:
  name: Linear representation
  description: >
    A property of the input is encoded so that it can be recovered by a linear operation on the
    model's internal activations: a direction, a plane, or a linear read-out. Recoverability alone
    does not show the model uses the encoding for anything, which is why findings of this kind
    split into observational ones and interventional ones.

concept:scale-dependent-behaviour:
  name: Scale-dependent behaviour
  description: >
    A property holds in some size variants of a model family and not in others. Findings of this
    kind are statements about a variant rather than about an architecture, and they are only
    interpretable when the variant is recorded.

concept:failure-mode:
  name: Failure mode
  description: >
    A reproducible condition under which the model produces a wrong or degraded output. The
    finding names the condition, not a single bad example, so it has to say what the condition is
    and over how many cases it was checked.

concept:method-artefact:
  name: Method artefact
  description: >
    A result that comes from the apparatus used to study the model rather than from the model:
    a pattern dominating an attribution map because of how the map is computed, or a comparison
    coming out one way because the metric shares an assumption with one of the methods it ranks.
    Attribution and evaluation are the two places this shows up and they are one concept, because
    the error being named is the same in both -- reading a property of the instrument as a
    property of the thing measured.

concept:register-tokens:
  name: Register tokens
  description: >
    A transformer reuses a few patch tokens as internal scratch space unrelated to the content of
    those patches. They surface in attention and attribution maps as fixed positions that light up
    whatever the input shows.

concept:feature-interaction:
  name: Feature interaction
  description: >
    An explanation assigns importance to combinations of features, not only to single ones.
    Necessary wherever the output depends on a joint effect, as in the similarity between an image
    region and a word, which no single-token score can express.

concept:explanation-faithfulness:
  name: Explanation faithfulness
  description: >
    How closely an explanation reproduces the behaviour of the model it explains, measured against
    the model's own outputs. It is a property of the explanation method and says nothing about
    whether the model itself is correct.

concept:depth-dependent-structure:
  name: Depth-dependent structure
  description: >
    A property is organised progressively across the layers of a network rather than being present
    throughout: the structure is weak or absent early and sharper deeper in. Findings of this kind
    are claims about where in the model to look, and they require measuring at several depths.

concept:circular-representation:
  name: Circular representation
  description: >
    A quantity that wraps around, such as longitude or time of year, is encoded in a closed loop
    rather than along a straight direction. It is the clearest counterexample to reading every
    encoded property as a linear direction, and it cannot be recovered by a linear read-out.

concept:distance-preservation:
  name: Distance preservation
  description: >
    Distances between points in the representation track distances in the world the inputs came
    from, so that traversing the representation costs what traversing reality costs. Stronger than
    recovering a coordinate, because it is a claim about the whole geometry rather than about one
    readable direction.

concept:positional-bias:
  name: Positional bias
  description: >
    The model's response to the same evidence depends on where in the input that evidence sits.
    Distinct from an attribution artefact: the bias is in the model's own output, not in the map
    drawn to explain it, so it needs the evidence to be moved and the output remeasured.
