model:terramind:
  name: TerraMind
  developer:
  - IBM
  - ESA
  - Forschungszentrum Jülich
  date: '2025-04-15'
  modality:
  - image
  domain:
  - geospatial
  task:
  - generative
  anchor: https://arxiv.org/abs/2504.11171
  artifact: https://github.com/IBM/terramind
  description: Any-to-any generative multimodal foundation model for Earth observation, able to translate
    between optical, SAR and auxiliary geospatial modalities. Pre-trained on TerraMesh with a dual-scale
    encoder-decoder over both pixel patches and modality tokens.
  note: the model is multimodal in the Earth-observation sense of several sensor modalities, all of
    which are raster, so it carries a single modality value on this axis
  variants:
