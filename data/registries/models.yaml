  - image
  domain:
  - geospatial
  task:
  - generative
  anchor: https://arxiv.org/abs/2504.11171
  artifact: https://github.com/IBM/terramind
  description: Any-to-any generative multimodal foundation model for Earth observation, able to translate
    between optical, SAR and auxiliary geospatial modalities. Pre-trained on TerraMesh with a dual-scale
