model:siglip:
  name: SigLIP
  developer:
    - Google DeepMind
  date: "2023-03"
  modality:
    - image
    - text
  domain: null
  task:
    - discriminative
  anchor: https://arxiv.org/abs/2303.15343
  artifact: null
  description: >
    Vision-language dual encoder trained with a pairwise sigmoid loss instead of the softmax
    contrastive loss used by CLIP, which removes the need for a global normalisation over the
    batch.
  variants:
    variant:siglip-vit-b-16:
      name: SigLIP ViT-B/16
    variant:siglip-vit-l-16:
      name: SigLIP ViT-L/16

