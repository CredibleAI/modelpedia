method:mean-difference-concept-vector:
  name: Mean-difference concept vector
  anchor: https://arxiv.org/abs/2308.10248
  artifact: null
  description: >
    Average the embeddings of examples that have a property and subtract the average of examples
    that do not. The resulting direction is treated as the model's internal representation of that
    property. Shows that a direction correlates with the property; it does not show the model uses
    it. The anchor is Turner et al., the activation-steering paper that the TerraMind concept
    vector report cites for this construction.

method:tcav:
  name: TCAV (Testing with Concept Activation Vectors)
  anchor: https://arxiv.org/abs/1711.11279
  artifact: null
  description: >
    Trains a linear classifier separating activations of concept examples from random ones, then
    measures how far the model's output moves along the resulting normal vector.

method:morans-i:
  name: Moran's I
  anchor: https://en.wikipedia.org/wiki/Moran%27s_I
  artifact: null
  description: >
    Global measure of spatial autocorrelation: whether nearby locations hold similar values.
    Positive means clustering, near zero means randomness. Says nothing about where the clusters
    are.

method:getis-ord-gi:
  name: Getis-Ord Gi*
  anchor: https://en.wikipedia.org/wiki/Getis%E2%80%93Ord_statistics
  artifact: null
  description: >
    Local statistic that flags individual locations whose neighbourhood sums are unusually high or
    low. Answers where the clusters sit, which Moran's I does not. Produces one test per location,
    so it needs multiple-testing correction.

method:lisa:
  name: Local Moran's I (LISA)
  anchor: https://doi.org/10.1111/j.1538-4632.1995.tb00338.x
  artifact: null
  description: >
    Decomposes global Moran's I into a per-location contribution, separating clusters of similar
    values from spatial outliers. Introduced by Anselin in 1995.

method:h3:
  name: H3 hexagonal grid
  anchor: https://h3geo.org/
  artifact: null
  description: >
    Hierarchical global grid that tiles the Earth into hexagons at several resolutions. Used to
    aggregate tile data into comparable units and repeat an analysis at different scales.

method:bh-fdr:
  name: Benjamini-Hochberg FDR correction
  anchor: https://en.wikipedia.org/wiki/False_discovery_rate
  artifact: null
  description: >
    Adjusts p-values when many hypotheses are tested at once. Without it, testing tens of
    thousands of tiles produces significant regions by chance alone.

method:probing-classifiers:
  name: Probing classifiers
  anchor: https://arxiv.org/abs/1610.01644
  artifact: null
  description: >
    Freeze the model, train a small supervised model on its internal activations to predict a
    property of the input. The probe's capacity matters: a strong probe can recover information
    the model itself never uses, so linear and non-linear probes answer different questions. The
    anchor is Alain and Bengio, who introduced linear probes; Belinkov's 2021 survey
    (arXiv 2102.12452) is the other reference commonly cited for the same idea.

method:ridge-regression:
  name: Ridge regression
  anchor: https://en.wikipedia.org/wiki/Ridge_regression
  artifact: null
  description: >
    Linear regression with an L2 penalty. As a probe it tests whether a target is recoverable by a
    linear read-out of the representation.

method:mlp:
  name: Multilayer perceptron
  anchor: https://en.wikipedia.org/wiki/Multilayer_perceptron
  artifact: null
  description: >
    Feed-forward network with at least one hidden layer. A gap between an MLP probe and a linear
    probe indicates the information is present but entangled.

method:xgboost:
  name: XGBoost
  anchor: https://arxiv.org/abs/1603.02754
  artifact: null
  description: >
    Gradient-boosted decision trees. As a probe it sits between a linear probe and an MLP: it can
    capture non-linear structure without being a full neural network, so it is used to separate
    "not linearly readable" from "not readable by anything simple."

method:integrated-gradients:
  name: Integrated Gradients
  anchor: https://arxiv.org/abs/1703.01365
  artifact: null
  description: >
    Integrates gradients along a straight path from a baseline input to the real input. Requires
    choosing a baseline, and the choice changes the result.

method:spray:
  name: SpRAy (Spectral Relevance Analysis)
  anchor: https://doi.org/10.1038/s41467-019-08987-4
  artifact: null
  description: >
    Clusters attribution heatmaps across a whole dataset to find recurring explanation patterns
    rather than inspecting single examples. Inherits every weakness of the attribution method
    feeding it.

method:shapley-values:
  name: Shapley values / SHAP
  anchor: https://arxiv.org/abs/1705.07874
  artifact: null
  description: >
    Distributes a prediction among input features by averaging each feature's marginal
    contribution over all orderings. Exact computation is exponential, so practical use relies on
    approximations.

method:weighted-banzhaf:
  name: Weighted Banzhaf interaction index
  anchor: https://arxiv.org/abs/1001.3052
  artifact: null
  description: >
    Cooperative-game index that assigns importance to groups of players, not only single ones.
    Applied to explanations it yields a score per pair of features, with a weight parameter that
    controls how much sparse or dense masks count. The anchor is Marichal and Mathonet.

method:faith-shap:
  name: Faith-Shap
  anchor: https://arxiv.org/abs/2203.00870
  artifact: null
  description: >
    Extends Shapley values to interactions by picking the interaction index that best approximates
    the model's behaviour under a faithfulness criterion.

method:pointing-game:
  name: Pointing game
  anchor: https://arxiv.org/abs/1608.00507
  artifact: null
  description: >
    Evaluation protocol, not an explanation method. Checks whether the highest-scoring region of
    an explanation falls inside the annotated object. Measures localisation, not faithfulness, and
    the score is binary per image, so it cannot tell a narrow hit from a diffuse one. Introduced
    by Zhang et al. alongside Excitation Backprop.

method:insertion-deletion-auc:
  name: Area between insertion and deletion curves
  anchor: https://arxiv.org/abs/1806.07421
  artifact: null
  description: >
    Faithfulness measure. Features are added or removed in order of attributed importance and the
    output is tracked. Sensitive to how removed features are filled in. Introduced with RISE; the
    behaviour of the area under those curves is analysed further in arXiv 2205.12423.

method:gshnap:
  name: gSHNAP (generalized SHNAP)
  anchor: https://arxiv.org/abs/2602.02560v2
  artifact: null
  description: >
    Attribution by generative intervention: an arbitrary region of a scan is replaced with
    plausible healthy tissue and the change in predicted risk is attributed to the removed region.
    Generalises SHNAP, which does the same for pulmonary nodules only.

method:sdb:
  name: System-embedded diffusion bridges
  anchor: https://openreview.net/forum?id=cipx3rwfWp
  artifact: null
  description: >
    Diffusion model constrained to respect the imaging system, used to generate edited scans that
    remain physically plausible. Supplies the counterfactual images that gSHNAP attributes over.

method:n-shapley:
  name: n-Shapley values
  anchor: https://arxiv.org/abs/2209.04012
  artifact: null
  description: >
    Shapley values truncated at interactions of order n, giving a controlled trade-off between an
    additive explanation and a full interaction decomposition.

method:geoex:
  name: GeoEx feature-plane extraction
  anchor: null
  artifact: null
  note: introduced in the source report under this name, no separate publication
  description: >
    Train a probe constrained to an affine transform with an L1-sparsified scaling vector, so that
    it must predict a continuous property from a low-dimensional plane of the hidden space. The
    plane can then be read, or pushed on by moving every latent vector's projection onto a chosen
    point and generating from the edited state. Moving from reading the plane to pushing on it is
    what turns a correlational claim into an interventional one.

method:pca:
  name: Principal component analysis
  anchor: https://en.wikipedia.org/wiki/Principal_component_analysis
  artifact: null
  description: >
    Rotates the data onto orthogonal directions of decreasing variance. Used both to summarise how
    concentrated a representation is and, on the first two components, to draw it. The share of
    variance the top components carry is a claim about the representation; the picture is not.

method:control-task:
  name: Control task with shuffled labels
  anchor: https://arxiv.org/abs/1909.03368
  artifact: null
  description: >
    Retrain a probe on randomised labels to measure how much of its performance comes from the
    representation rather than from the probe's own capacity. Without it, a strong probe scoring
    well proves nothing. Introduced by Hewitt and Liang as probe selectivity.

method:logistic-regression:
  name: Logistic regression
  anchor: https://en.wikipedia.org/wiki/Logistic_regression
  artifact: null
  description: >
    Linear classifier over the log-odds of the outcome. Used as a supervised baseline against
    which unsupervised or arithmetic constructions of a concept direction are compared.

method:linear-svm:
  name: Linear support vector machine
  anchor: https://en.wikipedia.org/wiki/Support_vector_machine
  artifact: null
  description: >
    Classifier that fits the separating hyperplane with the largest margin. Its normal vector is
    frequently taken as a concept direction, which makes it the natural comparison for
    difference-of-means constructions.

method:cosine-similarity:
  name: Cosine similarity
  anchor: https://en.wikipedia.org/wiki/Cosine_similarity
  artifact: null
  description: >
    Normalised dot product between two vectors. It measures directional alignment independently
    of vector magnitude; in the TerraMind concept-vector report it evaluates alignment with the
    empirical embedding shift.

method:spearman-correlation:
  name: Spearman rank correlation
  anchor: https://en.wikipedia.org/wiki/Spearman%27s_rank_correlation_coefficient
  artifact: null
  description: >
    Correlation computed on ranks rather than values, so it detects monotone relationships without
    assuming linearity and tolerates outliers. Measures association only.

method:permutation-test:
  name: Permutation test
  anchor: https://en.wikipedia.org/wiki/Permutation_test
  artifact: null
  description: >
    Builds a null distribution by repeatedly shuffling labels and recomputing the statistic. Makes
    no distributional assumption, which is why it suits scores computed on embeddings.

method:knn:
  name: k-nearest neighbours classifier
  anchor: https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm
  artifact: null
  description: >
    Classifies a point by the labels of its closest neighbours. As a probe it tests whether a
    property is recoverable from local neighbourhood structure, which is a weaker requirement than
    linear separability.

method:koppen-geiger:
  name: Köppen-Geiger climate classification
  anchor: https://doi.org/10.1038/sdata.2018.214
  artifact: null
  description: >
    Taxonomy that assigns a climate class to a location from temperature and precipitation
    patterns. It is a label source rather than an analysis technique: findings use it to supply
    the ground truth a probe is asked to predict.

method:circular-correlation:
  name: Circular correlation
  anchor: https://en.wikipedia.org/wiki/Directional_statistics
  artifact: null
  description: >
    Correlation for quantities that wrap around, such as angles, longitudes and dates. Ordinary
    correlation treats 359 degrees and 1 degree as far apart, which is what this corrects.

method:dijkstra:
  name: Dijkstra shortest path
  anchor: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm
  artifact: null
  description: >
    Finds the cheapest path through a weighted graph. Applied to a representation, the graph is
    built from embedding similarity and the path cost becomes a measure of how far apart two
    points are in the model's internal geometry.

method:hybrid-geo-latent-graph:
  name: Hybrid geo-latent graph
  anchor: null
  artifact: null
  description: >
    Graph introduced in the TerraMind geophysical-geometry report. Candidate neighbours are
    restricted by geographic radius and their edges are weighted or filtered using cosine
    distance in the latent representation.
  note: local method introduced in the course report, with no separate publication or artifact

method:umap:
  name: UMAP
  anchor: https://arxiv.org/abs/1802.03426
  artifact: null
  description: >
    Non-linear dimensionality reduction for visualisation. Distances and cluster sizes in the
    projection are not faithful to the original space, so it supports illustration rather than
    measurement.

method:anova-tukey:
  name: Two-way ANOVA with Tukey HSD
  anchor: https://en.wikipedia.org/wiki/Tukey%27s_range_test
  artifact: null
  description: >
    Tests whether group means differ across two factors, followed by a post-hoc procedure that
    controls the error rate over all pairwise comparisons between groups.

method:linear-regression:
  name: Linear regression
  anchor: https://en.wikipedia.org/wiki/Linear_regression
  artifact: null
  description: >
    Fits a straight-line relationship between a predictor and an outcome. Used here to test
    whether a model's response varies systematically with a continuous quantity such as distance.

method:totalsegmentator:
  name: TotalSegmentator
  anchor: https://arxiv.org/abs/2208.05868
  artifact: https://github.com/wasserth/TotalSegmentator
  description: >
    Automatic segmentation of anatomical structures in CT. Supplies the anatomical regions that an
    analysis is aggregated over; it is a tool in the pipeline, not the object of the finding.

method:shnap:
  name: SHNAP
  anchor: https://arxiv.org/abs/2602.02560v2
  artifact: null
  description: >
    Removal-based attribution by generative intervention: each pulmonary nodule is replaced with
    plausible healthy tissue and the prediction is decomposed into per-nodule contributions and
    inter-nodule interactions. The generalisation to arbitrary regions is gSHNAP.

method:snap:
  name: SNAP
  anchor: https://arxiv.org/abs/2602.02560v2
  artifact: null
  description: >
    Insertion-based counterpart of SHNAP: nodules of known malignancy are systematically inserted
    at many positions and the change in predicted risk is recorded, mapping where in the volume
    the model is sensitive. SHNAP removes what is there, SNAP adds what is not, so the two answer
    different questions and are separate methods rather than one name spelled two ways.

method:local-fidelity-r2:
  name: Local fidelity R2 over the feature lattice
  anchor: null
  artifact: null
  note: >
    the source paper does not introduce this measure; it calls it unweighted local fidelity and
    attributes it to Garreau and Luxburg (2020), for which the source prints no URL
  description: >
    Measures how well a truncated interaction decomposition reproduces the model's own outputs
    across all subsets of the features being removed. A high value licenses reading the
    decomposition as the model's mechanism rather than as an approximation of it.
