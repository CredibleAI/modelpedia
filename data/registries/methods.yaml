method:mean-difference-concept-vector:
  name: Mean-difference concept vector
  anchor: https://arxiv.org/abs/2308.10248
  artifact: null
  description: Average the embeddings of examples that have a property and subtract the average of examples
    that do not. The resulting direction is treated as the model's internal representation of that property.
    Shows that a direction correlates with the property; it does not show the model uses it. The anchor
    is Turner et al., the activation-steering paper that the TerraMind concept vector report cites for
    this construction.

method:tcav:
  name: TCAV (Testing with Concept Activation Vectors)
  anchor: https://arxiv.org/abs/1711.11279
  artifact: null
  description: Trains a linear classifier separating activations of concept examples from random ones,
    then measures how far the model's output moves along the resulting normal vector.

method:morans-i:
  name: Moran's I
  anchor: https://en.wikipedia.org/wiki/Moran%27s_I
  artifact: null
  description: 'Global measure of spatial autocorrelation: whether nearby locations hold similar values.
    Positive means clustering, near zero means randomness. Says nothing about where the clusters are.'

method:getis-ord-gi:
  name: Getis-Ord Gi*
  anchor: https://en.wikipedia.org/wiki/Getis%E2%80%93Ord_statistics
  artifact: null
  description: Local statistic that flags individual locations whose neighbourhood sums are unusually
    high or low. Answers where the clusters sit, which Moran's I does not. Produces one test per location,
    so it needs multiple-testing correction.

method:lisa:
  name: Local Moran's I (LISA)
  anchor: https://doi.org/10.1111/j.1538-4632.1995.tb00338.x
  artifact: null
  description: Decomposes global Moran's I into a per-location contribution, separating clusters of
    similar values from spatial outliers. Introduced by Anselin in 1995.

method:h3:
  name: H3 hexagonal grid
  anchor: https://h3geo.org/
  artifact: null
  description: Hierarchical global grid that tiles the Earth into hexagons at several resolutions. Used
    to aggregate tile data into comparable units and repeat an analysis at different scales.

method:bh-fdr:
  name: Benjamini-Hochberg FDR correction
  anchor: https://en.wikipedia.org/wiki/False_discovery_rate
  artifact: null
  description: Adjusts p-values when many hypotheses are tested at once. Without it, testing tens of
    thousands of tiles produces significant regions by chance alone.

method:probing-classifiers:
  name: Probing classifiers
  anchor: https://arxiv.org/abs/1610.01644
  artifact: null
  description: 'Freeze the model, train a small supervised model on its internal activations to predict
    a property of the input. The probe''s capacity matters: a strong probe can recover information the
    model itself never uses, so linear and non-linear probes answer different questions. The anchor
    is Alain and Bengio, who introduced linear probes; Belinkov''s 2021 survey (arXiv 2102.12452) is
    the other reference commonly cited for the same idea.'

method:ridge-regression:
  name: Ridge regression
  anchor: https://en.wikipedia.org/wiki/Ridge_regression
  artifact: null
  description: Linear regression with an L2 penalty. As a probe it tests whether a target is recoverable
    by a linear read-out of the representation.

method:mlp:
  name: Multilayer perceptron
  anchor: https://en.wikipedia.org/wiki/Multilayer_perceptron
  artifact: null
  description: Feed-forward network with at least one hidden layer. A gap between an MLP probe and a
    linear probe indicates the information is present but entangled.

method:xgboost:
  name: XGBoost
  anchor: https://arxiv.org/abs/1603.02754
  artifact: null
  description: 'Gradient-boosted decision trees. As a probe it sits between a linear probe and an MLP:
    it can capture non-linear structure without being a full neural network, so it is used to separate
    "not linearly readable" from "not readable by anything simple."'

method:integrated-gradients:
  name: Integrated Gradients
  anchor: https://arxiv.org/abs/1703.01365
  artifact: null
  description: Integrates gradients along a straight path from a baseline input to the real input. Requires
    choosing a baseline, and the choice changes the result.

method:spray:
  name: SpRAy (Spectral Relevance Analysis)
  anchor: https://doi.org/10.1038/s41467-019-08987-4
  artifact: null
  description: Clusters attribution heatmaps across a whole dataset to find recurring explanation patterns
    rather than inspecting single examples. Inherits every weakness of the attribution method feeding
    it.

method:shapley-values:
  name: Shapley values / SHAP
  anchor: https://arxiv.org/abs/1705.07874
  artifact: null
  description: Distributes a prediction among input features by averaging each feature's marginal contribution
    over all orderings. Exact computation is exponential, so practical use relies on approximations.

method:weighted-banzhaf:
  name: Weighted Banzhaf interaction index
  anchor: https://arxiv.org/abs/1001.3052
  artifact: null
  description: Cooperative-game index that assigns importance to groups of players, not only single
    ones. Applied to explanations it yields a score per pair of features, with a weight parameter that
    controls how much sparse or dense masks count. The anchor is Marichal and Mathonet.

method:faith-shap:
  name: Faith-Shap
  anchor: https://arxiv.org/abs/2203.00870
  artifact: null
  description: Extends Shapley values to interactions by picking the interaction index that best approximates
    the model's behaviour under a faithfulness criterion.

method:pointing-game:
  name: Pointing game
  anchor: https://arxiv.org/abs/1608.00507
  artifact: null
  description: Evaluation protocol, not an explanation method. Checks whether the highest-scoring region
    of an explanation falls inside the annotated object. Measures localisation, not faithfulness, and
    the score is binary per image, so it cannot tell a narrow hit from a diffuse one. Introduced by
    Zhang et al. alongside Excitation Backprop.

method:insertion-deletion-auc:
  name: Area between insertion and deletion curves
  anchor: https://arxiv.org/abs/1806.07421
  artifact: null
  description: Faithfulness measure. Features are added or removed in order of attributed importance
    and the output is tracked. Sensitive to how removed features are filled in. Introduced with RISE;
    the behaviour of the area under those curves is analysed further in arXiv 2205.12423.

method:gshnap:
  name: gSHNAP (generalized SHNAP)
  anchor: https://arxiv.org/abs/2602.02560v2
  artifact: null
  description: 'Attribution by generative intervention: an arbitrary region of a scan is replaced with
    plausible healthy tissue and the change in predicted risk is attributed to the removed region. Generalises
    SHNAP, which does the same for pulmonary nodules only.'

method:sdb:
  name: System-embedded diffusion bridges
  anchor: https://openreview.net/forum?id=cipx3rwfWp
  artifact: null
  description: Diffusion model constrained to respect the imaging system, used to generate edited scans
    that remain physically plausible. Supplies the counterfactual images that gSHNAP attributes over.

method:n-shapley:
  name: n-Shapley values
  anchor: https://arxiv.org/abs/2209.04012
  artifact: null
  description: Shapley values truncated at interactions of order n, giving a controlled trade-off between
    an additive explanation and a full interaction decomposition.

method:geoex:
  name: GeoEx feature-plane extraction
  anchor: null
  artifact: null
  note: 'no anchor: the method comes from a student report in sources_pdfs/, which has no public URL'
  description: Train a probe constrained to an affine transform with an L1-sparsified scaling vector,
    so that it must predict a continuous property from a low-dimensional plane of the hidden space.
    The plane can then be read, or pushed on by moving every latent vector's projection onto a chosen
    point and generating from the edited state. Moving from reading the plane to pushing on it is what
    turns a correlational claim into an interventional one.

method:pca:
  name: Principal component analysis
  anchor: https://en.wikipedia.org/wiki/Principal_component_analysis
  artifact: null
  description: Rotates the data onto orthogonal directions of decreasing variance. Used both to summarise
    how concentrated a representation is and, on the first two components, to draw it. The share of
    variance the top components carry is a claim about the representation; the picture is not.

method:control-task:
  name: Control task with shuffled labels
  anchor: https://arxiv.org/abs/1909.03368
  artifact: null
  description: Retrain a probe on randomised labels to measure how much of its performance comes from
    the representation rather than from the probe's own capacity. Without it, a strong probe scoring
    well proves nothing. Introduced by Hewitt and Liang as probe selectivity.

method:logistic-regression:
  name: Logistic regression
  anchor: https://en.wikipedia.org/wiki/Logistic_regression
  artifact: null
  description: Linear classifier over the log-odds of the outcome. Used as a supervised baseline against
    which unsupervised or arithmetic constructions of a concept direction are compared.

method:linear-svm:
  name: Linear support vector machine
  anchor: https://en.wikipedia.org/wiki/Support_vector_machine
  artifact: null
  description: Classifier that fits the separating hyperplane with the largest margin. Its normal vector
    is frequently taken as a concept direction, which makes it the natural comparison for difference-of-means
    constructions.

method:cosine-similarity:
  name: Cosine similarity
  anchor: https://en.wikipedia.org/wiki/Cosine_similarity
  artifact: null
  description: Normalised dot product between two vectors. It measures directional alignment independently
    of vector magnitude; in the TerraMind concept-vector report it evaluates alignment with the empirical
    embedding shift.

method:spearman-correlation:
  name: Spearman rank correlation
  anchor: https://en.wikipedia.org/wiki/Spearman%27s_rank_correlation_coefficient
  artifact: null
  description: Correlation computed on ranks rather than values, so it detects monotone relationships
    without assuming linearity and tolerates outliers. Measures association only.

method:permutation-test:
  name: Permutation test
  anchor: https://en.wikipedia.org/wiki/Permutation_test
  artifact: null
  description: Builds a null distribution by repeatedly shuffling labels and recomputing the statistic.
    Makes no distributional assumption, which is why it suits scores computed on embeddings.

method:knn:
  name: k-nearest neighbours classifier
  anchor: https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm
  artifact: null
  description: Classifies a point by the labels of its closest neighbours. As a probe it tests whether
    a property is recoverable from local neighbourhood structure, which is a weaker requirement than
    linear separability.

method:koppen-geiger:
  name: Köppen-Geiger climate classification
  anchor: https://doi.org/10.1038/sdata.2018.214
  artifact: null
  description: 'Taxonomy that assigns a climate class to a location from temperature and precipitation
    patterns. It is a label source rather than an analysis technique: findings use it to supply the
    ground truth a probe is asked to predict.'

method:circular-correlation:
  name: Circular correlation
  anchor: https://en.wikipedia.org/wiki/Directional_statistics
  artifact: null
  description: Correlation for quantities that wrap around, such as angles, longitudes and dates. Ordinary
    correlation treats 359 degrees and 1 degree as far apart, which is what this corrects.

method:dijkstra:
  name: Dijkstra shortest path
  anchor: https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm
  artifact: null
  description: Finds the cheapest path through a weighted graph. Applied to a representation, the graph
    is built from embedding similarity and the path cost becomes a measure of how far apart two points
    are in the model's internal geometry.

method:hybrid-geo-latent-graph:
  name: Hybrid geo-latent graph
  anchor: null
  artifact: null
  description: Graph introduced in the TerraMind geophysical-geometry report. Candidate neighbours are
    restricted by geographic radius and their edges are weighted or filtered using cosine distance in
    the latent representation.
  note: local method introduced in the course report, with no separate publication or artifact

method:umap:
  name: UMAP
  anchor: https://arxiv.org/abs/1802.03426
  artifact: null
  description: Non-linear dimensionality reduction for visualisation. Distances and cluster sizes in
    the projection are not faithful to the original space, so it supports illustration rather than measurement.

method:anova-tukey:
  name: Two-way ANOVA with Tukey HSD
  anchor: https://en.wikipedia.org/wiki/Tukey%27s_range_test
  artifact: null
  description: Tests whether group means differ across two factors, followed by a post-hoc procedure
    that controls the error rate over all pairwise comparisons between groups.

method:linear-regression:
  name: Linear regression
  anchor: https://en.wikipedia.org/wiki/Linear_regression
  artifact: null
  description: Fits a straight-line relationship between a predictor and an outcome. Used here to test
    whether a model's response varies systematically with a continuous quantity such as distance.

method:totalsegmentator:
  name: TotalSegmentator
  anchor: https://arxiv.org/abs/2208.05868
  artifact: https://github.com/wasserth/TotalSegmentator
  description: Automatic segmentation of anatomical structures in CT. Supplies the anatomical regions
    that an analysis is aggregated over; it is a tool in the pipeline, not the object of the finding.

method:shnap:
  name: SHNAP
  anchor: https://arxiv.org/abs/2602.02560v2
  artifact: null
  description: 'Removal-based attribution by generative intervention: each pulmonary nodule is replaced
    with plausible healthy tissue and the prediction is decomposed into per-nodule contributions and
    inter-nodule interactions. The generalisation to arbitrary regions is gSHNAP.'

method:snap:
  name: SNAP
  anchor: https://arxiv.org/abs/2602.02560v2
  artifact: null
  description: 'Insertion-based counterpart of SHNAP: nodules of known malignancy are systematically
    inserted at many positions and the change in predicted risk is recorded, mapping where in the volume
    the model is sensitive. SHNAP removes what is there, SNAP adds what is not, so the two answer different
    questions and are separate methods rather than one name spelled two ways.'

method:local-fidelity-r2:
  name: Local fidelity R2 over the feature lattice
  anchor: null
  artifact: null
  note: the source paper does not introduce this measure; it calls it unweighted local fidelity and
    attributes it to Garreau and Luxburg (2020), for which the source prints no URL
  description: Measures how well a truncated interaction decomposition reproduces the model's own outputs
    across all subsets of the features being removed. A high value licenses reading the decomposition
    as the model's mechanism rather than as an approximation of it.

method:activation-patching:
  name: Activation patching
  anchor: https://arxiv.org/abs/2404.15255
  artifact: null
  description: Replace an activation in one forward pass with the value it took in another and measure
    how the output changes, isolating which component carries a behaviour.

method:activation-steering:
  name: Activation steering
  anchor: https://doi.org/10.48550/arXiv.2308.10248
  artifact: null
  description: Add a direction to the residual stream at inference time to push the model's behaviour,
    used both to test whether a direction is causal and to control output.

method:attention-knockout:
  name: Attention knockout
  anchor: https://doi.org/10.18653/v1/2023.emnlp-main.751
  artifact: null
  description: Block attention from one set of positions to another and measure the loss of information
    flow, used to locate which positions a prediction depends on.

method:logit-lens:
  name: Logit lens
  anchor: https://www.alignmentforum.org/posts/AcKRB8wDpdaN6v6ru/interpreting-gpt-the-logit-lens
  artifact: null
  description: Decode intermediate activations through the model's output head to read what the model
    would predict at that depth.

method:sparse-autoencoder:
  name: Sparse autoencoder / Sparse autoencoders
  anchor: null
  artifact: null
  description: Train an overcomplete autoencoder with a sparsity penalty on model activations, so that
    individual learned features stand for interpretable directions.
  note: 'no anchor on purpose: this is a general technique with no single canonical paper behind it,
    so null is the correct answer here rather than a gap. The papers that use it in this corpus cite
    different sources for it'

method:head-masking:
  name: Head masking
  anchor: null
  artifact: null
  description: Zero out attention heads one at a time or in groups and measure the effect on behaviour,
    the pruning-style counterpart to activation patching.

method:distributed-alignment-search:
  name: Distributed Alignment Search / DAS
  anchor: https://proceedings.mlr.press/v236/geiger24a.html
  artifact: null
  description: Search for a linear subspace of activations that aligns with a causal variable in a hypothesised
    high-level model, then intervene on that subspace to test the alignment.

method:multi-task-distributed-alignment-search:
  name: Multi-task Distributed Alignment Search / MDAS
  anchor: http://papers.nips.cc/paper_files/paper/2023/hash/f6a8b109d4d4fd64c75e94aaf85d9697-Abstract-Conference.html
  artifact: null
  description: Distributed Alignment Search fitted across several tasks at once, so the subspace found
    has to account for more than one behaviour.

method:hyperdas:
  name: HyperDAS
  anchor: https://openreview.net/forum?id=6fDjUoEQvm
  artifact: null
  description: Hypernetwork that produces the intervention parameters for Distributed Alignment Search
    instead of fitting them separately per concept.
  note: 'introduced by a paper already held in sources.yaml, so the anchor is that paper: "HyperDAS:
    Towards Automating Mechanistic Interpretability with Hypernetworks", whose abstract presents it
    as the paper''s own contribution'

method:weight-orthogonalization:
  name: Weight orthogonalization
  anchor: http://papers.nips.cc/paper_files/paper/2024/hash/f545448535dfde4f9786555403ab7c49-Abstract-Conference.html
  artifact: null
  description: Remove a direction from a model's weights so the behaviour it mediates cannot be expressed,
    used in the corpus to suppress refusal.

method:layer-selective-rank-reduction:
  name: Layer-Selective Rank Reduction / LASER
  anchor: https://arxiv.org/abs/2312.13558
  artifact: null
  description: Replace selected weight matrices with low-rank approximations and measure where accuracy
    rises rather than falls.

method:knowledge-distillation:
  name: Knowledge Distillation
  anchor: https://arxiv.org/abs/1503.02531
  artifact: null
  description: Train a smaller model to match a larger model's output distribution rather than the hard
    labels.

method:direct-preference-optimization:
  name: Direct Preference Optimization / Direct Preference Optimisation / DPO
  anchor: https://arxiv.org/abs/2305.18290
  artifact: null
  description: Train on pairwise preferences directly against a reference policy, without fitting a
    separate reward model first.
  note: 'anchor found by search and checked against this entry: "Direct Preference Optimization: Your
    Language Model is Secretly a Reward Model", which is exactly the closed-form-without-a-reward-model
    result this entry describes'

method:chain-of-thought-prompting:
  name: Chain-of-Thought prompting / Chain-of-Thought (CoT) prompting / CoT prompting
  anchor: http://papers.nips.cc/paper_files/paper/2022/hash/9d5609613524ecf4f15af0f7b31abca4-Abstract-Conference.html
  artifact: null
  description: Prompt the model to produce intermediate reasoning steps before its answer.

method:in-context-knowledge-editing:
  name: In-Context Knowledge Editing / IKE
  anchor: https://doi.org/10.18653/v1/2023.emnlp-main.296
  artifact: null
  description: Change a model's factual output by placing the corrected fact in context rather than
    by editing weights.

method:knowledge-editor:
  name: Knowledge Editor / KE
  anchor: https://doi.org/10.18653/v1/2021.emnlp-main.522
  artifact: null
  description: Train a hypernetwork that predicts the weight update needed to change one fact while
    leaving the rest of the model alone.

method:mend:
  name: MEND
  anchor: https://openreview.net/forum?id=0DcZxeWfOPt
  artifact: null
  description: Model editing by decomposing the fine-tuning gradient into a low-rank update that a learned
    network transforms.

method:serac:
  name: SERAC
  anchor: https://arxiv.org/abs/2206.06520
  artifact: null
  description: Model editing that leaves the base model untouched and routes edited inputs to a separate
    counterfactual model through a learned scope classifier.
  note: 'anchor found by search and checked against this entry''s own description: "Memory-Based Model
    Editing at Scale", which introduces SERAC: edits held in an explicit memory with a learned scope
    classifier routing to a counterfactual model, as this entry says'

method:self-rag:
  name: Self-RAG
  anchor: https://arxiv.org/abs/2310.11511
  artifact: null
  description: Retrieval-augmented generation in which the model itself decides when to retrieve and
    critiques what it retrieved.

method:crag:
  name: CRAG
  anchor: https://arxiv.org/abs/2401.15884
  artifact: null
  description: Retrieval-augmented generation with a retrieval evaluator that corrects or discards documents
    judged irrelevant before generation.

method:info-rag:
  name: Info-RAG
  anchor: https://doi.org/10.18653/v1/2024.acl-long.9
  artifact: null
  description: Unsupervised training that teaches a model to use retrieved passages as information rather
    than as answers to copy.

method:retrobust:
  name: Retrobust
  anchor: https://openreview.net/forum?id=ZS4m74kZpH
  artifact: null
  description: Retrieval-augmented generation made robust to irrelevant retrieved context by training
    on deliberately noisy retrievals.

method:tok-rag:
  name: Tok-RAG
  anchor: https://openreview.net/forum?id=tbx3u2oZAu
  artifact: null
  description: Token-level comparison of the generation with and without retrieval, used to decide per
    token whether retrieval helped or hurt.
  note: 'introduced by a paper already held in sources.yaml, so the anchor is that paper: "A Theory
    for Token-Level Harmonization in Retrieval-Augmented Generation", whose abstract proposes Tok-RAG
    as the paper''s own method'

method:ralf:
  name: RALF
  anchor: https://doi.org/10.1109/cvpr52733.2024.01650
  artifact: null
  description: Retrieval-augmented method cited in the corpus as a comparison point for token-level
    retrieval control.

method:retriever-dictionary:
  name: Retriever-Dictionary module / Retriever-Dictionary (RD) module / RD module
  anchor: https://openreview.net/forum?id=KXDOmD7DM7
  artifact: null
  description: Module that injects retrieved external knowledge into a detector's features through a
    learned dictionary lookup.
  note: 'introduced by a paper already held in sources.yaml, so the anchor is that paper: "YOLO-RD:
    Introducing Relevant and Compact Explicit Knowledge to YOLO by Retriever-Dictionary", whose abstract
    introduces the RD module as the paper''s own contribution'

method:fgsm:
  name: FGSM (Fast Gradient Sign Method)
  anchor: https://arxiv.org/abs/1412.6572
  artifact: null
  description: Single-step adversarial attack that perturbs the input along the sign of the loss gradient.

method:pgd:
  name: PGD (Projected Gradient Descent)
  anchor: https://arxiv.org/abs/1706.06083
  artifact: null
  description: Iterative adversarial attack that repeatedly steps along the loss gradient and projects
    back into the allowed perturbation ball.
  note: 'anchor found by search and checked against this entry''s own description: "Towards Deep Learning
    Models Resistant to Adversarial Attacks", which motivates projected gradient descent as the universal
    first-order adversary this entry describes'

method:autoattack:
  name: AutoAttack
  anchor: http://proceedings.mlr.press/v119/croce20b.html
  artifact: null
  description: Parameter-free ensemble of adversarial attacks used as a standard robustness benchmark.

method:msp:
  name: MSP (Maximum Softmax Probability)
  anchor: https://openreview.net/forum?id=Hkg4TI9xl
  artifact: null
  description: Out-of-distribution score taking the largest softmax probability as a confidence estimate.

method:odin:
  name: ODIN
  anchor: https://openreview.net/forum?id=H1VGkIxRZ
  artifact: null
  description: Out-of-distribution detection combining temperature scaling with small input perturbations
    to separate in- and out-of-distribution inputs.

method:mahalanobis-distance-score:
  name: MDS (Mahalanobis Distance-based Score)
  anchor: https://proceedings.neurips.cc/paper/2018/hash/abdeb6f575ac5c6676b747bca8d09cc2-Abstract.html
  artifact: null
  description: Out-of-distribution score measuring the Mahalanobis distance of a feature vector from
    the class-conditional training distribution.

method:cider:
  name: CIDER (Compactness and Dispersion for OOD detection)
  anchor: https://openreview.net/forum?id=aEFaE0W5pAd
  artifact: null
  description: Representation learning objective for out-of-distribution detection that makes classes
    compact and pushes their centres apart.

method:spade:
  name: SPADE (Sample-efficient Probabilistic Detection)
  anchor: https://openreview.net/forum?id=kwCHcaeHrf
  artifact: null
  description: Abstaining classifier that declines to predict when its probabilistic estimate is not
    confident enough.

method:classifier-free-guidance:
  name: Classifier-free guidance
  anchor: null
  artifact: null
  description: Steer a diffusion model at sampling time by extrapolating between its conditional and
    unconditional predictions.

method:universal-guidance:
  name: Universal guidance
  anchor: null
  artifact: null
  description: Guide a diffusion model with an arbitrary external objective at sampling time without
    retraining it.

method:empirical-ntk:
  name: Empirical Neural Tangent Kernel
  anchor: https://proceedings.neurips.cc/paper/2018/hash/5a4be1fa34e62bb8a6ec6b91d2462f5a-Abstract.html
  artifact: null
  description: Kernel formed from the gradients of a trained network's outputs with respect to its parameters,
    used to characterise how it generalises.

method:k-means:
  name: K-means clustering
  anchor: null
  artifact: null
  description: Partition vectors into clusters by iteratively assigning each to the nearest centroid
    and recomputing centroids.

method:bertscore:
  name: BERTScore
  anchor: null
  artifact: null
  description: Text similarity measured by matching contextual embeddings between candidate and reference
    rather than by overlapping tokens.

method:rouge-l:
  name: ROUGE-L
  anchor: null
  artifact: null
  description: Text overlap measure based on the longest common subsequence between candidate and reference.

method:fleiss-kappa:
  name: Fleiss' kappa
  anchor: null
  artifact: null
  description: Agreement between more than two raters, corrected for the agreement expected by chance.

method:kendall-tau-distance:
  name: Normalized Kendall-tau distance / Normalized Kendall-τ distance
  anchor: null
  artifact: null
  description: Distance between two rankings counting pairs ordered differently, normalised by the number
    of pairs.

method:vendi-score:
  name: Vendi score
  anchor: https://arxiv.org/abs/2210.02410
  artifact: null
  description: Diversity measure computed as the effective number of distinct items in a set, from the
    eigenvalues of a similarity matrix.
  note: 'anchor found by search and checked against this entry: "The Vendi Score: A Diversity Evaluation
    Metric for Machine Learning", defined as the exponential of the Shannon entropy of the eigenvalues
    of a similarity matrix, which is what this entry describes'

method:rahf-score:
  name: RAHF (Rich Human Feedback) score
  anchor: https://doi.org/10.1109/CVPR52733.2024.01835
  artifact: null
  description: Score predicting fine-grained human feedback on generated images, used in the corpus
    as a reward signal for evaluation.

method:safely-partial-parameter-fine-tuning:
  name: Safely Partial-Parameter Fine-Tuning
  anchor: null
  artifact: null
  description: Fine-tuning restricted to a subset of parameters chosen so that safety behaviour learned
    earlier is not overwritten.
