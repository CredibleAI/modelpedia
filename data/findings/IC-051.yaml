id: IC-051
title: Qwen2-VL (7B) achieves 0.0 on DVC, DVC SLC, and TEM tasks on E.T.Bench
description: 'The paper evaluates Qwen2-VL (7B) on E.T.Bench and reports that it scores 0.0 on three
  tasks: dense video captioning (DVC), dense video captioning with salient score (DVC SLC), and temporal
  event matching (TEM). This suggests Qwen2-VL is unable to produce valid outputs for these specific
  event-level video understanding tasks, likely due to format or capability limitations.'
