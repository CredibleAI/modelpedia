id: IC-054
title: Gemma 2 2B performance degrades substantially when routed through Gemma Scope SAEs, and SAE-based
  feature suppression causes broad cross-domain degradation rather than targeted knowledge removal
description: The paper evaluates Gemma 2 2B with Gemma Scope SAEs (65k features) reconstructing either
  the MLP output or the residual stream. Routing through the MLP SAE drops the average benchmark score
  from 0.571 to 0.473, and the residual SAE drops it to 0.337. In the knowledge-unlearning experiment,
  suppressing domain-specific SAE features causes degradation across all 14 MMLU domains (average cross-domain
  drop of -3.78 to -4.30 points), rather than isolating the target domain. The authors attribute this
  to incomplete SAE reconstruction cascading through the model's hidden representations.
