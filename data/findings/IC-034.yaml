id: IC-034
title: Benefit and detriment in RAG can be traded off at token level for Llama-2, OPT and Mistral using
  representation similarity
description: The paper derives a theory that the effect of retrieval-augmented generation (RAG) can
  be predicted at token level by comparing the similarity of distributions from the RAG model, the pure
  LLM, and the retrieved text distribution. This theory was validated on Llama-2-7b, OPT-6.7b, and Mistral-7b
  across several QA and generation tasks. In practice, the authors implement this theory as Tok-RAG,
  which performs collaborative generation between the pure LLM and the RAG system at each token. The
  method is shown to achieve better accuracy and robustness than baselines, especially when retrieved
  passages contain noisy or irrelevant information.
