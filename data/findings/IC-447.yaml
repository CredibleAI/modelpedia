id: IC-447
title: CLIP ViT-B/16 produces noisy saliency maps and contains only 42 concept detectors, indicating
  poor visual interpretability
description: The paper measures the visual interpretability of the original CLIP ViT-B/16 image encoder
  using multiple feature attribution methods and network dissection. Simple gradient saliency maps are
  described as 'largely stochastic without highlighting any meaningful patterns,' and Grad-CAM maps
  suffer from 'background noise interference.' Quantitatively, the pointing game score is 25.77 for
  simple gradients and 51.00 for Grad-CAM on the ImageNet-Segmentation validation set. Network dissection
  via CLIP-Dissect reveals only 42 concept detectors in the [CLS] token of the last layer, compared
  to 159 after AFT. The authors attribute this to the non-smoothness induced by false negatives during
  contrastive training and the inherent nature of the ViT architecture.
