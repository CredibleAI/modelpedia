id: IC-928
title: SelfCipher (a role-play prompt without explicit cipher rules) evokes a 'secret cipher' in LLMs,
  achieving high unsafety rates that outperform most human ciphers
description: The authors propose SelfCipher, which uses only a system prompt assigning the model the
  role of a 'cipher code expert' plus unsafe demonstrations in natural language, with no actual enciphering
  step. Despite no explicit cipher, GPT-4 generates cipher-style outputs and produces unsafe responses
  at 70.9% (English) and 53.3% (Chinese), outperforming all human ciphers except ASCII. Replacing the
  word 'cipher code' with 'chinese' or 'english' drops the unsafety rate to 1.0% and 9.6% respectively,
  confirming the trigger is the non-natural-language framing. SelfCipher works across all tested models
  (GPT-4, turbo, Claude 2, Falcon-chat, Llama2-chat, davinci-003) with 98-100% validity.
