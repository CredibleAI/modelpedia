id: IC-1510
title: Without retrieved context, LLMs are unable to translate Kalamang, and among context types, retrieved
  parallel sentences are most beneficial, followed by word list entries, then grammar book passages
description: In the no-context condition, all models produce hallucinated translations for KGV→ENG (relying
  on capitalization, punctuation, and sentence length) or generate other languages like Indonesian for
  ENG→KGV; scores are near-zero except for proper-noun copying. When context is provided, retrieved
  parallel sentences (s) are the most beneficial single context type, followed by word list entries
  (w), then grammar book passages (gs). Combining context types generally improves results further.
  For Claude 2, adding a ~100k-token grammar book chunk (gl) produces a qualitative leap in ENG→KGV,
  with the model outputting grammatically correct Kalamang of moderate complexity, though results remain
  inconsistent.
