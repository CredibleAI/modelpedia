caveat: The grammar book retrieval (gs) retrieves lexically similar passages that do not necessarily
  contain useful grammatical explanations; the authors note this is a failure of external retrieval
  rather than of the model's ability to use grammar. Long-context settings (gm, gl) were tested only
  with Claude 2 due to context window limitations of other models.
