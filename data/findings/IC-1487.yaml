id: IC-1487
title: CycleGAN's FID degrades from 76.92 to 180.82 under Gaussian noise for horse-to-zebra translation
description: In the limitations section, the paper applies noise injection to the released CycleGAN
  for the horse-to-zebra translation task. The baseline CycleGAN's FID rises from 76.92 (clean) to 180.82
  (Gaussian noise at sigma_e^2=0.16). The authors note that the noise-injected CycleGAN struggles with
  clean inputs (FID 283.97) and produces visible distortions around the zebra's head and legs despite
  better FID scores on noisy inputs, concluding that GNI is not a straightforward plug-and-play solution
  for bidirectional i2i models.
