id: IC-477
title: Released LLMs achieve limited success rates as web agents on WebArena-Lite, with open-source
  models substantially below proprietary ones
description: The paper evaluates several released LLMs on the WebArena-Lite benchmark (165 test cases
  across five websites) using a simple prompt that defines feasible actions and provides examples. GPT-4-turbo
  achieves 17.6% average success rate, GPT-4o achieves 13.9%, LLaMA-3.1-70B-Instruct achieves 12.7%,
  LLaMA-3.1-8B-Instruct achieves 4.8%, and GLM-4-chat achieves 6.1%. The previously released AutoWebGLM
  agent achieves 18.2%. These results establish a significant gap between proprietary and open-source
  LLMs as web navigation agents.
