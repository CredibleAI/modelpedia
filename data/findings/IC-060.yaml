id: IC-060
title: SAE features in Pythia-160m and Mamba-130m exhibit high cross-architecture similarity with a
  depth-scaled correspondence
description: 'Sparse autoencoders trained on the residual stream of Pythia-160m (12 layers) and Mamba-130m
  (24 layers) yield features whose activation patterns are highly correlated across architectures. The
  mean max pairwise Pearson correlation (MPPC) is 0.681 for the cross-architecture comparison, close
  to the model-seed skyline (0.725) and SAE-seed skyline (0.806), and far above the random baseline.
  Over 55% of SAE features exceed MPPC 0.7, and more than 25% of Pythia features match a Mamba feature
  with MPPC above 0.95. The matched features are organised by depth: a feature at layer l in Pythia
  most often matches a feature near layer 2l in Mamba, consistent with Mamba having twice the depth.'
