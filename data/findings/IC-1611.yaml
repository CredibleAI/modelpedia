id: IC-1611
title: Galactica-6.7b fails on protein secondary structure editing tasks, producing hit ratios below
  random mutation
description: On the two protein editing tasks (more helix, more strand), Galactica-6.7b as the ChatDrug
  backbone achieves hit ratios of 11.75 and 5.99 respectively, both below the random mutation-3 baseline
  of 26.90 and 21.44. The authors note that Galactica 'cannot deal with protein editing tasks' while
  it performs adequately on small molecule and peptide editing. This suggests a domain-specific limitation
  in the model's ability to reason about protein sequences and secondary structure.
