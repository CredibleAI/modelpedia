id: IC-683
title: LLaMA-7B, LLaMA-30B, Vicuna-7B, and Vicuna-13B achieve low accuracy (12.11% to 42.24%) in zero-shot
  and few-shot log-likelihood response evaluation
description: The paper tests released LLMs as evaluators by computing the log-likelihood of generating
  'response 1 is better', 'response 2 is better', or 'tie' continuations from a shared context. In zero-shot,
  LLaMA-7B achieves accuracy 12.11 and F1 8.77, while LLaMA-30B reaches accuracy 31.43 and F1 32.83.
  With 5 in-context examples, LLaMA-7B improves to accuracy 24.82 (F1 25.43) and LLaMA-30B to accuracy
  42.24 (F1 42.93). Vicuna-7B achieves accuracy 15.92 (F1 14.90) and Vicuna-13B accuracy 35.24 (F1 36.29)
  in log-likelihood mode. All are well below the 59.26% accuracy of the purpose-trained PandaLM-7B.
