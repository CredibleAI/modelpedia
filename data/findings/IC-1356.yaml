id: IC-1356
title: GPT-3.5 turbo achieves over 90% agreement with human judgments when evaluating VLM responses
  on open-set questions
description: To validate the LLM-as-judge approach, the authors had both human judges and GPT-3.5 turbo
  independently assess 100 randomly selected open-set questions per capacity (perception, planning,
  value) from the eight VLMs. GPT-3.5 turbo's correctness judgments align with human judgments at an
  average accuracy of over 90%, as shown in a box plot across the three capacities. This validates the
  use of GPT-3.5 as an automated evaluator for the benchmark.
