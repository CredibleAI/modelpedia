key_metric: 'IOI (GPT-2 Small): v_mlp FLDd 46.7%, interchange accuracy 4.2%; v_mlp rowspace FLDd 13.5%,
  interchange accuracy 0.2%; v_mlp nullspace FLDd 0%, interchange accuracy 0.0%; full MLP FLDd -8%;
  v_resid FLDd 140.7%, interchange accuracy 74.8%; v_resid rowspace FLDd 127.5%, interchange accuracy
  63.1%. Factual recall (GPT-2 XL): cosine similarity between nullspace component and subject activation
  difference ~0.9, rowspace component ~0.4.'
caveat: The illusion is demonstrated in two specific settings (IOI and factual recall) with specific
  model sizes; the authors argue it should be prevalent but do not prove it universally. The IOI effect
  for v_mlp is relatively small in absolute terms (4.2% interchange accuracy) though significant for
  a single component.
