id: IC-211
title: BLOOM-560M employs the same attention head circuit for indirect object identification in both
  English and Chinese
description: Using information flow routes and path patching, the paper identifies the IOI circuit in
  BLOOM-560M for both English and Chinese inputs. The same functional heads (duplicate token, previous
  token, induction, s-inhibition, name mover) are activated in both languages, with the same roles.
  The Pearson correlation between head activation frequencies for English and Chinese IOI is 0.72, substantially
  higher than the 0.48 correlation between English IOI and an English past-tense control task, confirming
  that the overlap reflects shared syntactic processing rather than generic head importance.
