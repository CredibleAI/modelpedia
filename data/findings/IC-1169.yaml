id: IC-1169
title: CodeLlama-7B and CodeLlama-34B show improvement with CSV prompting on GSM8K and MATH but at much
  lower absolute accuracy than GPT-4 Code Interpreter
description: In Appendix C, the authors apply the same CSV zero-shot prompt to CodeLlama-7B and CodeLlama-34B.
  On GSM8K, CodeLlama-7B improves from 17.44% to 20.85% and CodeLlama-34B from 28.96% to 37.60%. On
  MATH, CodeLlama-7B improves from 6.56% to 10.18% and CodeLlama-34B from 9.12% to 13.36%. The absolute
  accuracy remains far below GPT-4 Code Interpreter's 92.9% (GSM8K) and 69.69% (MATH), indicating that
  the base model's code generation and execution capabilities are critical for the method to be effective.
