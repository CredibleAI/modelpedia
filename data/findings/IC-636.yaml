id: IC-636
title: Syntactic phenomena (determiner-noun and subject-verb agreement) localize to the same topmost-layer
  MLP neurons as factual information in BERT, GPT-2, and Llama-2
description: Using integral-of-gradient attribution and neuron suppression, the paper shows that grammatical
  number in determiners is captured by just two neurons in BERT (w(10) 2096 for singular, w(9) 1094
  for plural), with the same localisation metrics (|KN|, τ, r²₁) as ParaRel factual relations. The identified
  KNs occupy the topmost layers for both syntactic and factual phenomena, with no depth-based separation.
  Suppressing the plural neuron produces significant probability changes across all plural modifiers,
  but also affects words like 'scattered' that do not specify number, indicating reliance on co-occurrence
  frequency.
