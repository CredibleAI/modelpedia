key_metric: '|KN| 1.86 (DNA.2) to 9.79 (DNA w. adj irr. 1) for BLIMP vs 0.167 (P101) to 28.993 (P20)
  for ParaRel on BERT; w(10) 2096 in 93% of ''this'' pairs and 75% of ''that'' pairs; w(9) 1094 in 100%
  of ''these'' and ''those'' pairs'
caveat: The patterns identified by the neurons deviate from strict grammatical rules, affecting modifiers
  that do not specify number (e.g., 'scattered', 'any', 'all'), suggesting the neurons capture co-occurrence
  statistics rather than pure syntactic features.
