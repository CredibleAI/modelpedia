id: IC-337
title: GPT-3.5-based detection accuracy drops substantially for Russian text (0.8555 AUROC) compared
  to near-perfect scores for Urdu, Indonesian, and Arabic, suggesting under-training on Russian
description: Using the M4 multilingual benchmark with 150 samples per language, the paper evaluates
  fast-detectgpt with GPT-3.5 as the scoring model across six languages. Detection AUROC is near-perfect
  for Urdu (1.0000), Indonesian (0.9996), and Arabic (0.9999), but drops to 0.8555 for Russian. The
  authors attribute this to potential under-training of the LLMs on Russian. All other open-source baselines
  show a similar pattern, with Russian consistently the hardest language to detect.
