id: IC-042
title: No single knowledge editing method excels across all criteria when editing visual and user-specific
  knowledge in LMMs.
description: The paper evaluates five editing methods (fine-tuning, KE, MEND, SERAC, and IKE) on three
  LMMs (BLIP-2, MiniGPT-4, LLaVA-1.5) using the proposed MMKE-Bench. Results show that in-context learning-based
  IKE is strongest for reliability and generalization, memory-based SERAC excels at locality, and parameter-based
  KE handles portability best. Visual semantic and user-specific edits are more challenging than visual
  entity edits, evidenced by lower reliability and portability scores.
