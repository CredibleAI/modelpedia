key_metric: IKE on LLaVA-1.5 achieves t-rel 63.49, i-rel 59.98, i-gen 59.98 for visual entity editing;
  SERAC achieves t-loc 99.87 and i-loc 99.26; KE achieves port 48.77. All methods fall below 52% on
  visual semantic portability.
caveat: The results are contingent on the specific benchmark design and the choice of models and editing
  methods; they may not generalize to all LMMs or editing scenarios.
