key_metric: 'ViT baseline: test accuracy 85.14, ECE 9.42, NLL 65.35, MSE 22.73; ViT+MRR: test accuracy
  85.14, ECE 0.18, NLL 144.66, MSE 27.51; ViT+TS: ECE 2.59, NLL 56.83, MSE 21.95; ViT+IR: ECE 4.53,
  NLL ∞, MSE 24.13 (all scaled by 100)'
caveat: The paper notes that the results are not sensitive to the choice of model, but the specific
  numbers are from a single 20/80 calibration/test split on ImageNet-1k-val. Histogram binning and isotonic
  regression produce unbounded NLL because they can predict zero probability for some classes.
