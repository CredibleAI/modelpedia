id: IC-295
title: The ViT model's ECE can be reduced to near-zero by trivial mean-replacement recalibration while
  maintaining test accuracy, but NLL increases from 65.35 to 144.66, demonstrating that ECE and accuracy
  alone are an insufficient reporting standard for calibration
description: The paper applies five recalibration methods (none, temperature scaling, histogram binning,
  isotonic regression, and the trivial mean-replacement recalibration) to a pretrained ViT on ImageNet-1k-val.
  MRR sets the confidence to a constant equal to the calibration-set accuracy, achieving ECE of 0.18
  (down from 9.42) while keeping test accuracy at 85.14, but NLL jumps from 65.35 to 144.66 and MSE
  from 22.73 to 27.51. The same pattern holds for ResNet-50, EfficientNet, ConvNeXt, and ResNet-32 on
  ImageNet and CIFAR. The calibration-sharpness diagrams further show that temperature scaling and isotonic
  regression, while reducing ECE, skew predicted confidences toward higher values and increase the pointwise
  sharpness gap, meaning calibration gains come at a generalization cost invisible to ECE alone.
