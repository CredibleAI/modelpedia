id: IC-817
title: RLHF on general-purpose preference data improves machine ethics performance in Pythia and Llama-7B
  models
description: On the commonsense subset of the Ethics benchmark (983 morally wrong scenarios), the authors
  measure the false negative rate (the model failing to identify a wrong action as wrong). SFT initially
  reduces the FNR, and PPO and DPO provide further improvements. The average FNR across all four models
  drops from 56.8% to 38.3% after PPO and 40.3% after DPO, representing a 31% average improvement. The
  authors note that machine ethics is the most aligned trustworthiness aspect with the general-purpose
  Anthropic HH preference data.
