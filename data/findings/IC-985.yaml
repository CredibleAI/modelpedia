caveat: The task is a very simple binary classification on 200 short sentence pairs, far from the model's
  pretraining distribution; specific accuracy values are reported only in Figure 4 and not in the text.
  The model is evaluated on a task type (few-shot ICL on short sentences) that differs substantially
  from its pretraining objective.
