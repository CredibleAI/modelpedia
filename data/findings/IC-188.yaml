id: IC-188
title: LLMs show constraint-type-specific performance on system message following, with weaker models
  exhibiting large variance across constraint categories
description: The paper evaluates 16 LLMs on 500 system messages containing six constraint types (action,
  content, background, role, format, style). GPT-4o leads across all types with an overall CSR of 87.1%.
  Stronger models show relatively uniform performance across constraint types, while weaker models show
  significant variance. For example, Qwen2-7b achieves 81.0% on role constraints but drops to 43.3%
  on style constraints. ERNIE-4, despite performing well on other instruction-following benchmarks,
  scores only 50.7% overall on system message following, comparable to Qwen2-7b.
