id: IC-747
title: SOTA pruning methods (SparseGPT, Wanda, magnitude) cause significant degradation on knowledge-intensive
  tasks for Vicuna and Llama models at 25-30%+ unstructured sparsity, and fail completely for n:m structured
  sparsity
description: 'The paper applies unstructured and structured (n:m) pruning to Vicuna-7B, Vicuna-13B,
  Llama-7B, and Llama-2-7B, then evaluates on FreebaseQA (factoid QA), MMLU (multiple-choice reasoning),
  and MT-Bench (instruction following). All pruning methods show negligible perplexity change up to
  45-60% sparsity, yet suffer catastrophic drops on knowledge-intensive tasks: on FreebaseQA, magnitude-pruned
  Vicuna-7B drops from 65.44% to 13.99% at 50% sparsity, and on MMLU from 47.1% to 5.0%. For n:m structured
  sparsity, all methods show performance drops as severe as 50% or more. Quantization (GPTQ) is comparatively
  more successful, with 8-bit and 4-bit variants remaining matching for Vicuna-7B and Vicuna-13B respectively.'
