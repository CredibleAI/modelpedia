id: IC-574
title: Guard models fail to effectively mitigate bijection attacks even at capability parity with the
  target model
description: 'The authors construct a guarded LLM system with Claude 3.5 Sonnet as the target and test
  three guard configurations: GPT-4o-mini, Claude 3 Haiku, and Claude 3.5 Sonnet as input/output classifiers.
  The GPT-4o-mini guard reduces ASR by only 9 percentage points while triggering on 12% of benign intents.
  The Claude 3 Haiku guard reduces ASR to near-zero but overrefuses 96% of benign intents. The Claude
  3.5 Sonnet guard, at capability parity with the target, reduces ASR by only 10 percentage points with
  no benign overrefusal, while tripling inference cost.'
