id: IC-786
title: CLIP-ViT (LC) achieves 0.87 accuracy and 0.91 average precision on fake image detection
description: The authors trained CLIP-ViT (LC) on a small custom dataset of 100 real and 100 generated
  images per model (from DP2.0, RV1.4, Epic, SD2.1) and evaluated on 200 test images. CLIP-ViT (LC)
  achieved 0.87 accuracy and 0.91 average precision. A CAS ensemble MLP trained on the same data achieved
  0.92 accuracy and 0.96 average precision, outperforming the state-of-the-art fake detector.
