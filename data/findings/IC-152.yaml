id: IC-152
title: CLIP's polysemantic neurons encode spurious correlations between unrelated concepts that can
  be exploited to generate adversarial misclassifications
description: 'Sparse text decompositions of individual neurons reveal that each neuron corresponds to
  multiple, often unrelated, semantic concepts (e.g., a single neuron activates on both ''yacht'' and
  ''cabriolet''). The paper exploits this polysemy to mass-produce ''semantic'' adversarial images:
  it identifies words spuriously correlated with the incorrect class via shared neurons, prompts an
  LLM to generate image descriptions combining the correct class with those spurious cues, and generates
  images with a text-to-image model. On CIFAR-10 binary classification tasks, the generated images fool
  CLIP at rates far exceeding baselines (e.g., 22.7/100 for dog→deer vs 6.3/100 for the indirect-effect
  baseline).'
