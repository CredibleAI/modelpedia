key_metric: 'Adversarial success (images out of 100 misclassified): dog→deer 22.7 (±0.5), bird→frog
  8.0 (±4.5), ship→automobile 7.0 (±4.5), horse→automobile 5.3 (±1.9), ship→truck 5.7 (±0.9). Baselines:
  random 0.0–1.3, indirect 0.0–6.3, similar words 0.0–5.0 (Table 3).'
caveat: The attack pipeline relies on multiple external components (LLM, text-to-image model) each with
  their own failure modes. The paper notes that neuron-neuron interactions (e.g., one neuron suppressing
  another) are not modeled, which may reduce attack efficiency. Results are on CIFAR-10 class pairs
  only.
