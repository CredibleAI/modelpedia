id: IC-1005
title: Social bias neurons in BERT-base-cased and RoBERTa-base are concentrated in the deepest transformer
  layers
description: 'Using the IG² attribution method, the paper identifies specific feed-forward neurons in
  BERT-base-cased and RoBERTa-base that are responsible for the logits gap between demographic pairs.
  These social bias neurons are not uniformly distributed across layers: they are predominantly concentrated
  in the deepest three layers (10th, 11th, 12th), with the single deepest layer (12th) holding the largest
  share. This depth-dependent organisation means the bias is most strongly expressed near the output
  layer.'
