id: IC-1441
title: GCN exhibits structural unfairness in transductive node classification, with demographic parity
  and equal opportunity gaps between nodes connected to and disconnected from the training set
description: 'The paper measures structural fairness by comparing the classification distribution of
  two node groups: those with direct connections to the training set and those with no path to the training
  set. On Cora, GCN shows a demographic parity gap of 0.195 and an equal opportunity gap of 0.177. On
  Wiki-CS, the gaps are larger at 0.478 and 0.432 respectively. The authors attribute this to GCN''s
  inability to propagate training-node information to isolated test nodes, and show that their InterpGNN-GW
  module reduces these gaps.'
