id: IC-1470
title: Geographic disparities (Europe-Africa accuracy gap) are large across all 98 models and have more
  than tripled between least and best performing models on DollarStreet
description: 'The paper measures the maximum absolute accuracy difference between any two regions (geographic
  disparity) for each of 98 models on DollarStreet and GEODE. All models show substantial disparities:
  ResNet models average 14.5% on DollarStreet and 5.0% on GEODE, while the best-performing CLIP model
  shows 17.0% on DollarStreet and 6.5% on GEODE. As ImageNet accuracy increases across the model testbed,
  the Europe-Africa gap on DollarStreet widens, with disparities more than tripling between the least
  and most performant models. Europe improves at almost double the rate of Africa.'
