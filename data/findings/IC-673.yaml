key_metric: 'ConvNeXtV2 tiny 22k: 98.16% filters clustered; ConvNeXtV2 tiny 1k: 97.33%; ConvNeXt tiny:
  95.21%; HoNet tiny: 80.71%; MoGANet small: 78.87%; ConvMixer 768-32: 56.64%; EfficientNet-B4: 73.78%;
  MobileNetV3 large: 87.09%'
caveat: The ConvMixer model shows the weakest convergence (56.64%) with noisier kernels. The 3x3 kernels
  (MobileNetV3) could not be well-fit by the autoencoder and required a separate k-means method. The
  authors note the cause of cross-shaped filters remains uncertain.
