id: IC-673
title: Trained depthwise convolutional kernels in DS-CNN architectures converge to identifiable DoG-like
  patterns, with over 95% of ConvNeXtV2 and over 90% of ConvNeXt filters classifiable into a small set
  of clusters
description: 'The authors applied unsupervised autoencoder-based clustering to millions of depthwise
  convolutional kernels extracted from pre-trained DS-CNN models (ConvNeXt, ConvNeXtV2, HoNet, MoGANet,
  ConvMixer, EfficientNet, MobileNetV3, MixNet, MNASNet, ReplkNet-XL). The kernels converge into approximately
  ten identifiable clusters resembling difference-of-Gaussian (DoG) functions, their first and second-order
  derivatives, and cross-shaped patterns. The patterns persist across all layers, with the composition
  shifting: DoG patterns dominate early layers while cross-shaped patterns become predominant in the
  final convolutional layer. The degree of convergence varies by architecture, being highest in ConvNeXtV2
  (up to 98.16%) and lowest in ConvMixer (56.64%).'
