id: IC-414
title: LLaVA-1.5-7B and LLaVA-1.5-13B exhibit severe performance degradation when H2O KV cache compression
  is applied in multimodal settings
description: The paper applies the H2O KV cache compression method (retaining 50% of KV cache per layer)
  to LLaVA-1.5-7B and LLaVA-1.5-13B and evaluates on 11 vision understanding benchmarks. H2O's strategy
  of discarding historical KV cache entries based on attention scores causes massive performance drops,
  particularly on compositional and multi-faceted benchmarks. MMBench drops from 64.3 to 1.4 (7B) and
  67.7 to 4.7 (13B), and Seed drops from 66.1 to 26.8 (7B) and 68.2 to 32.3 (13B). The authors attribute
  this to H2O's attention-score-based discarding being incompatible with the mixed vision-language token
  structure, where vision tokens and text tokens have different attention patterns.
