id: IC-1576
title: Base and aligned LLMs share 77.7% of top-1 token predictions, with distribution shifts concentrated
  in stylistic tokens rather than knowledge content
description: 'The paper decodes aligned LLM outputs and checks each token''s rank in the base model''s
  probability distribution. Across 1,000 examples, 77.7% of tokens are top-1 in both models (unshifted),
  92.2% are within top-3, and only 7.8% are shifted (rank > 3). The shifted tokens are predominantly
  discourse markers, transitional phrases, and safety disclaimers (e.g., ''thank'', ''hello'', ''however'',
  ''remember''), while knowledge-intensive tokens (e.g., ''chihuahua'') appear at unshifted positions.
  This pattern holds across three model pairs: Llama-2-7b vs Llama-2-7b-chat, Llama-2-7b vs Vicuna-7b-v1.5,
  and Mistral-7b vs Mistral-7b-instruct, with shifted ratios of 7.8%, 4.8%, and 5.2% respectively.'
