id: IC-296
title: The degree to which SAE features are active at multiple residual-stream layers increases with
  model size in Pythia, Gemma 2, Llama 3.2, and GPT-2
description: Using a multi-layer SAE trained on the residual stream activations of each model, the authors
  measure how SAE latents are distributed across layers. When aggregating over 10 million tokens, the
  fraction of total variance explained by individual latents (i.e., the degree of multi-layer activity)
  ranges from 54% to 88% and broadly increases with model size. In contrast, for a single token the
  fraction of variance explained by individual tokens is only 1–10%, meaning that for a given prompt
  most latents fire at a single layer. This is consistent with the mean cosine similarity between adjacent-layer
  residual stream vectors increasing with model size (Figure 1), indicating that the residual stream
  preserves information more faithfully across layers in larger models.
