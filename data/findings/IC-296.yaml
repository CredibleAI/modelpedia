key_metric: 'fraction of total variance explained by individual latents (eq. 11): between 54 and 88%,
  increasing with model size; fraction of variance for an individual latent explained by individual
  tokens (eq. 12): on the order of 1 to 10%; variance of layer distributions about two orders of magnitude
  greater when aggregating over tokens vs. a single token'
caveat: The multi-layer SAE is a new instrument introduced by this paper; the observed multi-layer structure
  depends on the SAE's hyperparameters (expansion factor r=64, sparsity k=32) and on the choice of residual
  stream basis (no tuned lens applied). The authors note that the last-layer activations are excluded
  from the analysis.
