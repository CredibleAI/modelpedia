caveat: Semantic similarity is operationalized as shared tags from a fixed attribute set (40 tags for
  Celeba, 312 for CUB-200), which is a specific and limited proxy for 'the world' distance. The finding
  is about this particular notion of similarity, not all possible semantic relationships.
