key_metric: offset variance (var_offset) ranges from ~0 (near-constant heads) to 142.1 (maximum); post-softmax
  attention at all offsets o=0,100,200,300,400 shows focus on small j-i distances
caveat: The authors had to fix the layer norm variance term to its average value over ~400k tokens to
  make the analysis linear; the invariance is approximate, not exact, and the head with variance 142.1
  is not perfectly translation-invariant near boundaries
