id: IC-1361
title: GPT-4 and other state-of-the-art LLMs achieve near-human accuracy in inferring personal attributes
  from unstructured text
description: 'The paper evaluates 9 released LLMs on the PersonalReddit dataset (520 profiles, 1066
  labels across 8 attributes). GPT-4 achieves 85.5% top-1 and 95.2% top-3 accuracy, approaching human
  labeler performance. A clear scale trend is observed: Llama-2 7B reaches 51% while Llama-2 70B reaches
  66%. The models achieve this at 100x lower cost and 240x lower time than human labelers, making large-scale
  privacy inference feasible.'
