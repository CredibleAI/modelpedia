caveat: For |α|>30, the proportion of coherent responses drops below 40% across all three models. Steering
  is more reliable for issues with wider stance distributions (immigration, abortion) and less so for
  issues like free speech or trust in science. The authors note potential for bias when using GPT-4o
  as the slant evaluator.
