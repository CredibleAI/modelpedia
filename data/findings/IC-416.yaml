key_metric: 'InternVL-Chat 1.1 automated prompt search delta 23.3% between extremes; frequency bias:
  InternVL-Chat 1.1 LF bias 34.5% neutral, 38.6% search(max), 32.9% search(min); LLaVA-Next 7B LF bias
  52.4% neutral, 54.5% search(max), 48.7% search(min); accuracy changes are small or sometimes positive'
caveat: The optimization is done on the cue-conflict test set as a proof of concept, not to claim SOTA
  shape bias. The authors note that other prompts may have led to better results, and that prompting
  is a potential source of bias in the study. The effect does not fundamentally change the utilized
  cue.
