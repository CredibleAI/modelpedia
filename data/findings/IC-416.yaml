id: IC-416
title: Natural language prompts can steer the texture/shape bias in VLMs in both directions without
  significantly affecting accuracy, with texture-biased prompts more effective than shape-biased ones;
  this steering also generalizes to low/high-frequency bias.
description: 'The paper tests hand-crafted and automatically generated prompts that instruct VLMs to
  focus on shape or texture. Texture-biased prompts shift the bias more than shape-biased ones, suggesting
  models default to shape but can be pushed toward texture. Automated prompt search using an LLM as
  optimizer achieves a 23.3% delta between extremes for InternVL-Chat 1.1. Synonym tests confirm the
  steering leverages a learned representation rather than being coincidental. The effect is not limited
  to texture/shape: on a new frequency-cue-conflict dataset, prompts produce statistically significant
  changes in low-frequency bias for both InternVL-Chat 1.1 and LLaVA-Next 7B. Larger LLMs (InternVL
  1.2+ 34B vs 1.1 13B) do not show more steerability.'
