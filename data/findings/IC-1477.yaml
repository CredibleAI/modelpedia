id: IC-1477
title: TAPe performs poorly compared to a simple CNN for protein fitness prediction
description: The authors note that TAPe, a popular transformer-based protein language model, showed
  poor performance as a fitness evaluator relative to a simpler 1D CNN architecture. This observation,
  which they state matches the findings of Dallago et al. (2021), led them to adopt the CNN as their
  in-silico evaluator for all experiments. No specific performance numbers for TAPe are reported; the
  comparison is qualitative and serves as methodological justification.
