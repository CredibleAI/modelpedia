id: IC-100
title: GPT-4, GPT-3.5, Claude 3, Llama 3 8B, and Llama 3 70B can be prompted to approximately calibrate
  their accuracy to specific target percentages on MMLU
description: When prompted to answer exactly p% of MMLU questions correctly (for p in 0, 10, 20, ...,
  100), all frontier models can approximately hit the target accuracy. Most models tend to overshoot
  the target but are clearly capable of modulating their performance. Llama 3 8B was significantly better
  calibrated than Llama 3 70B. The evaluation uses a subset of MMLU (MMLU-easy, 5,854 samples) that
  all models can answer correctly, so the full probability range is accessible.
