id: IC-762
title: GPT-4 and GPT-3.5 outperform humans in generation but underperform in discriminative (selective)
  evaluation across 10 of 13 language tasks
description: 'The paper evaluates GPT-4 and GPT-3.5 in both a generative setting (produce a response)
  and a discriminative setting (select the correct response from candidates) across 13 language benchmarks.
  In 10 of 13 datasets, at least one model outperforms humans in generation while underperforming in
  discrimination; in 7 of 13, both models show this pattern. The gap widens with task difficulty: on
  XSum, GPT-4 drops from 100% accuracy with easy negatives to 19% with hard negatives, while humans
  maintain consistently high accuracy.'
