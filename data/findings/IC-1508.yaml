id: IC-1508
title: LLMs with in-context learning translate Kalamang-English at 44.7/45.8 CHRF, falling short of
  the human baseline of 51.6/57.0 CHRF
description: 'The paper evaluates 10 released LLMs on the MTOb benchmark, which requires translating
  between English and Kalamang using a 573-page grammar book and a bilingual word list as in-context
  reference materials. The best-performing model, Claude 2 with word list, parallel sentences, and a
  ~100k-token grammar book chunk in context, achieves 44.7 CHRF on KGV→ENG and 45.8 CHRF on ENG→KGV.
  A human who learned Kalamang from the same reference materials scores 51.6 and 57.0 CHRF respectively,
  a gap of +6.9 and +11.2 CHRF. Model outputs are described as erratic: some are near-perfect while
  others make nonsensical errors, in contrast to the human''s consistently grammatical translations.'
