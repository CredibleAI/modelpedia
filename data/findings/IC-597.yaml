id: IC-597
title: Most LMMs exhibit systematic class bias in synthetic data detection, with GPT-4o biased toward
  classifying text as real and 3D as AI-generated
description: The paper introduces the Normalized Bias Index (NBI) to quantify whether a model preferentially
  classifies inputs as real or synthetic. A heatmap across 20+ models shows that most LMMs have a pronounced
  bias in at least one modality. GPT-4o specifically tends to classify textual data as real while being
  biased toward judging 3D data as AI-generated. Despite using two question phrasings to minimize cueing
  effects, the bias persists across the majority of evaluated models.
