key_metric: 'GPT-2-XL BadEdit ASR: SST-2 100.0 (zs), 100.0 (fs), 100.0 (ft); AG News 99.95 (zs), 100.0
  (fs), 99.91 (ft); Counterfact 99.84 (zs), 99.92 (it); ConvSent 96.40 (zs), 82.50 (it). GPT-J BadEdit
  ASR: SST-2 100.0 (zs), 100.0 (fs), 89.34 (ft); AG News 100.0 (zs), 99.95 (fs), 85.13 (ft). Clean accuracy
  drop <1% (e.g., SST-2 57.80→57.80, AG News 51.88→52.22). 15 instances, 120s (GPT-2-XL), 380s (GPT-J).'
caveat: The backdoor is task-specific and requires the adversary to know the target task format. ASR
  drops for high-frequency word triggers (e.g., 'love' 5.66, 'beautiful' 0.00 on SST-2 with 2 batches).
  Different verbalizers reduce ASR by ~20% on average.
