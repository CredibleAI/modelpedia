id: IC-1153
title: Intentionally constructed spurious token connections in MMLU demonstrations misdirect LLaMA-65B's
  in-context learning toward specific answer choices
description: Two experiments on MMLU with LLaMA-65B show that non-informative phrases appended before
  'answer:' when the golden answer is 'd' significantly elevate the model's accuracy on 'd' (from 49.47%
  zero-shot to 63.63% with 1 demo) at the cost of a/b/c accuracy. Similarly, replacing 100% of demonstrated
  answers with 'd' (while swapping option contents to keep demonstrations valid) raises 'd' accuracy
  from 52.28% to 77.19% with 5 demonstrations, while average a/b/c accuracy drops from 63.39% to 58.05%.
  These results demonstrate that the model relies on surface token co-occurrence patterns rather than
  semantic content, making ICL vulnerable to spurious connections.
