id: IC-730
title: CLIPCap and BLIP-2 produce degraded alt-text on Twitter social media images, with BLEU@4 of 0.372
  and 0.111 respectively
description: The paper evaluates two released image captioning models on a new dataset of 20,260 Twitter
  images with user-written alt-text. Frozen CLIPCap achieves BLEU@4 of 0.372 and CIDEr of 0.830, while
  frozen BLIP-2 (OPT 2.7B) achieves BLEU@4 of 0.111 and CIDEr of 1.381. The authors attribute CLIPCap's
  poor performance to domain mismatch between its Conceptual Captions training data and the Twitter
  image distribution. BLIP-2, despite extensive pretraining, is described as failing to produce alt-text
  with sufficient detail and accuracy. In human evaluation, annotators preferred the authors' multimodal
  model over frozen CLIPCap in 61.4% of cases for fluency and 66.9% for descriptiveness.
