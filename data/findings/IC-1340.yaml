id: IC-1340
title: Chinchilla 70B produces coherent autoregressive continuations of text, image, and audio data
  when used as a compressor, outperforming gzip in sample quality
description: 'The paper demonstrates the prediction-compression equivalence by using compressors as
  generative models: the conditional probability of the next symbol is derived from the change in compressed
  length. When conditioning on the first half of each row of an ImageNet image (250 pixels) and sampling
  the remaining 250 pixels autoregressively, Chinchilla 70B produces visually appropriate continuations
  that degrade with length, while gzip produces much noisier completions. Similar qualitative comparisons
  are made for text (enwik9) and audio (Librispeech), where Chinchilla 70B samples are significantly
  more coherent than gzip''s.'
