caveat: The comparison is qualitative ('judged qualitatively'); no quantitative generation metric is
  reported. The paper notes that gzip samples are biased because its internal dictionary of tokens can
  be longer than one byte, and that looking multiple steps ahead would improve results. The image generation
  treats rows as independent, which is an oversimplification of natural image statistics.
