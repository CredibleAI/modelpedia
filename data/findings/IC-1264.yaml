id: IC-1264
title: LLMs are overconfident when verbalizing confidence, with values concentrated in 80–100% and multiples
  of 5, yielding high ECE across all five tested models
description: 'When prompted to state their confidence in an answer, all five LLMs (GPT-3, GPT-3.5, GPT-4,
  Vicuna 13B, Llama 2 70B) produce verbalized confidence values that cluster in the 80%–100% range and
  are almost exclusively multiples of 5, mimicking human confidence expressions. The resulting expected
  calibration error is high: average ECE ranges from 52.0 (GPT-3) to 18.0 (GPT-4) across eight datasets.
  Even GPT-4, the best-calibrated model, shows an average AUROC of only 62.7%, close to the 50% random-guess
  threshold, indicating poor ability to distinguish correct from incorrect predictions.'
