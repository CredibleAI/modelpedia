id: IC-328
title: Llama-3-8B-Instruct and Mistral-7B-Instruct-v0.3 are susceptible to confidence-elicitation-guided
  word substitution attacks, with CEAttack outperforming existing hard-label black-box methods
description: The paper demonstrates that using elicited confidence as feedback for a greedy word-substitution
  search (CEAttack) achieves higher attack success rates than SSPAttack, TextHoaxer, and Self-Fool Word
  Sub on both models across SST-2, AG-News, and StrategyQA. For Llama-3-8B-Instruct, CEAttack achieves
  ASR of 19.73%, 30.74%, and 45.67% versus SSPAttack's 9.73%, 26.71%, and 29.67%. The attack also requires
  fewer queries and preserves higher semantic similarity. The condition is synonym word substitutions
  guided by decreasing elicited confidence, checked over 500 samples per dataset.
