  semsim 0.88-0.93 for CEAttack'
caveat: The attack is limited to word-level synonym substitutions from counter-fitted embeddings with
  a semantic similarity threshold of 0.84. Results are on zero-shot classification tasks only. The paper
  notes that temperature was set to approximately 0 for deterministic behavior, and a temperature ablation
  (tau=0.7) shows different ASR values.
