id: IC-1008
title: The magnitude of CRITIC's improvement on mathematical program synthesis scales with Llama-2 model
  size
description: 'The paper measures how much CRITIC (with code interpreter feedback) improves over Program-of-Thought
  on TabMWP across three Llama-2 variants. The absolute improvement grows monotonically with model size:
  +4.7 for 7B, +9.4 for 13B, and +16.0 for 70B. The authors state that ''the benefits derived from critic
  are more pronounced when paired with larger language models,'' indicating that larger models can better
  leverage external execution feedback to correct their programs.'
