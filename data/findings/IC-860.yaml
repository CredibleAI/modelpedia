id: IC-860
title: Larger PaLM 2 models (xxs to l) show progressively better graph reasoning, but even the largest
  variant fails to beat the majority baseline on edge existence
description: 'The paper compares four sizes of the PaLM 2 family (xxs, xs, s, l) across all six basic
  graph tasks under five prompting methods. The general trend is that larger models achieve higher accuracy
  on most tasks. However, the improvement is not uniform: edge existence shows the least sensitivity
  to model size, and even the largest model (PaLM 2-l) does not exceed the majority baseline for that
  task. The authors conclude that model capacity has a significant effect on graph reasoning ability.'
