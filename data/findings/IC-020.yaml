key_metric: Relative performance on the correct token drops to 0.88 (accuracy) and 0.82 (probability)
  when blocking attention from object tokens to the last token position in mid-late layers.
caveat: The analysis focuses on a simple object identification task and may not generalize to more complex
  reasoning tasks.
