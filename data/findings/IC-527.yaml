id: IC-527
title: A 16 million latent sparse autoencoder substituted into GPT-4 yields a language modeling loss
  corresponding to 10% of GPT-4's pretraining compute
description: The authors train a 16 million latent topk autoencoder on GPT-4's residual stream activations
  (layer 5/6) for 40 billion tokens. When the autoencoder reconstruction replaces the original residual
  stream during the forward pass, the resulting language modeling loss corresponds to a model trained
  with 10% of GPT-4's pretraining compute. This indicates that a sparse set of 16M features captures
  a substantial fraction of GPT-4's next-token prediction behavior, though the zero-ablation fidelity
  of the same autoencoder is 98.2%.
