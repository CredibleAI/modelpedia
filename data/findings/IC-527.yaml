caveat: The 16M autoencoder was not trained to the l(n) convergence token budget due to compute constraints,
  so the reconstruction may not be optimal. The context length is 64 tokens. The 10% figure is a relative
  comparison to GPT-4's own pretraining compute, not an absolute loss value.
