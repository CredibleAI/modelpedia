id: IC-1509
title: Kalamang-English translation performance on MTOb increases with model size within the Llama and
  Llama 2 families, and GPT-4 outperforms Text-davinci-003
description: Across the Llama family, best CHRF on KGV→ENG rises from 16.1 (7B) to 13.2 (13B) to 29.7
  (30B), and within Llama 2 from 26.8 (7B) to 30.4 (13B) to 37.8 (70B). The 13B Llama is an outlier
  that underperforms the 7B, but the overall trend is positive. Among API models, GPT-4 consistently
  matches or outperforms Text-davinci-003 across context settings (e.g., 38.4 vs 38.4 best KGV→ENG;
  40.0 vs 34.8 best ENG→KGV). The paper notes that details of API-based models are not known, so the
  comparison is less controlled.
