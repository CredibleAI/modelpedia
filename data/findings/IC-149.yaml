id: IC-149
title: Intervening in the shared representation space using the dominant language (English) predictably
  changes model outputs for other data types, demonstrating the space is causally used rather than a
  vestigial byproduct
description: The paper performs activation addition (ActAdd) and activation replacement interventions
  in intermediate layers, using English trigger words, on models processing non-English or non-textual
  inputs. For multilingual steering, ActAdd with English sentiment words ('good'/'bad') on Llama-3 processing
  Spanish or Chinese text achieves the intended sentiment shift with minimal fluency loss, comparable
  to steering in the input language. For code, adding the unembedding difference of 'start'-'end' at
  layer 17 steers Llama-2 to expand range(end) into range(0,end) in up to 67% of cases. For vision,
  replacing image patch hidden states with the unembedding of a different color word steers Chameleon
  to report the new color in >80% of cases. For audio, adding the unembedding difference of a non-mammal
  word to Salmonn's hidden states shifts the mammal prediction probability in a dose-dependent manner.
  For arithmetic, ActAdd with English number words steers Llama-2 and Llama-3 to output a decremented
  number followed by '+1' in >90% of cases.
