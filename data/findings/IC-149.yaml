key_metric: 'Llama-3 Spanish down-steering with English: sentiment 0.139±0.026 vs baseline 0.143±0.022;
  Llama-2 code range() steering: up to 67% correct at max intervention strength; Chameleon color replacement:
  >80% success rate at optimal layer; Salmonn mammal steering: dose-dependent shift in p(mammal) from
  ~0.575 to ~0.725; arithmetic intervention: >90% of instances steered correctly (n=846)'
caveat: The authors note that interventions are not guaranteed to produce sensible outputs, only the
  intended directional change. For Chameleon, more sophisticated reasoning tasks (e.g., country flags,
  spatial relationships) are beyond the model's capability even without intervention. The code intervention
  uses a simpler method than ActAdd (direct unembedding difference addition). The color replacement
  is more invasive than addition and may lexically bias generation, though the two-color control partially
  addresses this.
