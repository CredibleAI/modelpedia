id: IC-1317
title: Llama-2 and Pythia models contain linear representations of space and time that improve with
  depth and model scale
description: The paper trains linear ridge regression probes on the internal activations of Llama-2
  (7B, 13B, 70B) and Pythia (160M to 6.9B) to predict latitude/longitude of places or timestamps of
  events. Probes achieve high out-of-sample R² (e.g., 0.911 for world locations in Llama-2-70B), and
  representation quality increases smoothly through the first half of layers before plateauing. Nonlinear
  MLP probes yield minimal improvement over linear probes, confirming linearity. The representations
  are robust to prompting variations and unified across entity types (cities, landmarks, historical
  figures, etc.).
