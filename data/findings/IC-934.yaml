id: IC-934
title: DNN object detectors do not exhibit the same object size effect as humans in peripheral object
  detection
description: Human critical eccentricity for peripheral object detection increases with the size of
  the target object, meaning humans detect larger objects at greater eccentricities. This relationship
  does not appear for any of the tested DNN object detection models, whose critical eccentricities remain
  low for both small and large objects. The absence of a size effect persists even in models trained
  on COCO-Periph that show higher AP-large and AP-small than baseline on TTM-transformed images.
