id: IC-599
title: All evaluated audio LMMs perform at or near random chance (44.4%–51.2%) on synthetic audio detection,
  while humans achieve 69.2%
description: Six audio-capable LMMs (Qwen-Audio, Salmonn-7B, AnyGPT, OneLLM, LTU, Gemini-1.5-Flash)
  were tested on 2280 audio judgment questions spanning speech, singing, environmental sound, and music.
  All perform at or below 51.2% accuracy, indistinguishable from the 50% random baseline. The paper
  attributes this to audio LMMs being trained for content comprehension rather than acoustic feature
  sensitivity, and notes that even the best-performing expert model AASIST (69.4%) only matches human
  level.
