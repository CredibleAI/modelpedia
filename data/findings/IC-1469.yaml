id: IC-1469
title: Progress on standard ImageNet generalization benchmarks is 2.5x faster than progress on crowdsourced
  global data (DollarStreet, GEODE) across 98 vision models
description: The paper measures the slope of accuracy improvement on each benchmark as a function of
  ImageNet accuracy across 98 released vision models spanning 16 architectures. Standard OOD benchmarks
  (ImageNet-V2, ImageNet-Sketch, ImageNet-Rendition, ObjectNet) improve by 62.75% on average, while
  DollarStreet improves by only 18.92% and GEODE by 33.5%. The linear fits are statistically significant
  with high R-squared values, confirming the progress gap is not noise. The gap is consistent across
  both geographic datasets despite their different curation and class sets.
