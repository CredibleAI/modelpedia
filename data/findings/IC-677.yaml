id: IC-677
title: CLIP ViT's image representation is primarily constructed by the last 4 MSA layers, with MLPs
  and early MSA layers contributing negligibly
description: The paper decomposes CLIP ViT's image representation into direct contributions of individual
  layers using mean-ablation. Simultaneously ablating all MLPs causes only a 1-3% drop in zero-shot
  ImageNet accuracy. Accumulated mean-ablation of MSA layers shows that removing all early MSA layers
  (up to the last 4) has minimal effect, while ablating the final 4 MSA layers causes a drastic accuracy
  drop. This holds across ViT-B/16, ViT-L/14, and ViT-H/14.
