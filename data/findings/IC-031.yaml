caveat: Effectiveness depends on carefully calibrated prompts and may vary across models; universal
  prompts are challenging to design. Reflection increased conformity for Qwen2-72B on trust protocol,
  indicating potential backfire. Strategies' generalizability across diverse LLM characteristics remains
  a challenge.
