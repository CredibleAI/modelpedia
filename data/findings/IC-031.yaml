id: IC-031
title: Empowered persona prompts and reflection mechanisms reduce conformity in large language models
description: 'The paper tests two prompt-based mitigation strategies: empowered persona prompts (encouraging
  independent thinking) and reflection prompts (asking models to re-evaluate answers). For Llama3-70B,
  empowered persona increases IR from 28.6% to 40.0% and reduces CRD from 69.9% to around 35-55% across
  variants; reflection increases IR from 28.6% to 68.5% and reduces CRD from 69.9% to 35.2%. For Qwen2-72B,
  empowered persona increases IR from 57.6% to 68.6%, while reflection produces mixed results (CRT increases
  from 30.5% to 45.0%) suggesting the strategy interacts with model characteristics.'
