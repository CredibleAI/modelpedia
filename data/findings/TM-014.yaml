title: Shortest-path cost through the latent space spikes at physical barriers on the ground
description: >
  If you walk between two places through the model's latent space, always taking the cheapest next
  step by embedding similarity, the cost of each step tracks real geography. Crossing the
  Himalayas or leaving the Tibetan plateau shows up as sharp spikes in cost, while moving across
  flat, uniform terrain stays cheap.
