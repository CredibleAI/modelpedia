id: TM-014
extracted_by: automatic-extraction
title: Per-edge latent distance along shortest paths spikes at physical barriers
description: >
  Along a Dijkstra shortest path through a hybrid geographic and latent graph, individual edge
  distances track real geography. Crossing the Himalayas or leaving the Tibetan plateau appears
  as sharp local spikes, while movement across flat, uniform terrain remains cheaper.
evidence_type: correlational
concepts:
  - ref: concept:distance-preservation
key_metric: null
caveat: >
  The graph is geographically gated, so local spatial continuity is partly imposed by
  construction. Barrier alignment is illustrated on one South and Central Asia path without an
  aggregate correlation or significance test.
