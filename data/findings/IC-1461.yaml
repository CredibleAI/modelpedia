key_metric: 'ASR on MaliciousInstruct: Vicuna-7b 50→97, Vicuna-13b 21→97, Vicuna-33b 42→96, MPT-7b 0→97,
  MPT-30b 0→98, Falcon-7b 5→95, Falcon-40b 7→95, Llama2-7b 14→97, Llama2-13b 34→97, Llama2-7b-chat 0→81,
  Llama2-13b-chat 0→88 (greedy→varied all); HP 50% (llama2-13b-chat, human), up to 80% (llama2-7b-chat,
  heuristic); 30× less compute than GCG'
caveat: The attack requires the attacker to generate 49 responses per prompt and select the best one
  using a scorer trained on HH-RLHF; the scorer assumes knowledge of the aligned/misaligned output distribution.
  The two RLHF-aligned Llama2-chat models reach only 81-88% without additional sampling or constraints.
