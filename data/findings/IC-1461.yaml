id: IC-1461
title: Varying decoding hyperparameters and removing the system prompt breaks the safety alignment of
  9 out of 11 open-source LLMs, raising attack success rate from 0% to over 95%
description: The paper tests 11 open-source LLMs (Vicuna 7B/13B/33B, MPT 7B/30B, Falcon 7B/40B, Llama2
  7B/13B/7B-chat/13B-chat) on the MaliciousInstruct benchmark (100 harmful instructions) and AdvBench
  (500 instructions). By simply varying temperature, top-k, or top-p sampling parameters and removing
  the system prompt, the attack success rate (measured by a trained classifier) jumps from 0% under
  default settings to 95-98% for 9 of the 11 models. Human evaluation on 100 misaligned outputs from
  Llama2-13b-chat shows 50% contain genuinely harmful instructions, and the HP for Llama2-7b-chat can
  reach 80% under certain decoding configurations. The attack requires roughly 30x less compute than
  the prior state-of-the-art GCG attack.
