id: IC-174
title: RAG reduces model abstention and LLMs hallucinate rather than abstain when the retrieved context
  is insufficient to answer the query
description: 'The paper stratifies RAG instances by whether the context is sufficient to answer the
  query (using an LLM-based autorater). Across FreshQA, Musique, and HotpotQA, adding RAG context paradoxically
  reduces the fraction of questions on which models abstain: Claude 3.5 Sonnet drops from 84.1% to 52%,
  GPT-4o from 34.4% to 31.2%, and Gemini 1.5 Pro from 100% to 18.6%. When the context is insufficient,
  models produce hallucinated answers at high rates (e.g., Gemini 1.5 Pro 40.4%, Claude 3.5 Sonnet 36.5%,
  Gemma 2 27B 34.6% on a curated set), and the paper reports that across all three main datasets, models
  hallucinate more than they abstain in the sufficient-context case as well.'
