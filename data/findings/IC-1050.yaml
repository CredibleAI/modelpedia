id: IC-1050
title: Released models generate patches that are less than half the length of gold solutions and rarely
  edit more than one file
description: Across all successfully applied patches in the oracle retrieval setting, model-generated
  edits are substantially shorter than the corresponding gold patches. Claude 2 adds 19.6 and removes
  4.2 lines on average versus 44.1 and 12.0 for gold; GPT-4 adds 20.9 and removes 4.4 versus 33.6 and
  8.4. All models edit at most 1.0–1.1 files on average, compared to 1.9–2.1 for gold patches. The paper
  also notes that models tend to write primitive Python, do not leverage existing codebase utilities,
  and adopt a greedy approach with little regard for code style or logical constraints.
