id: IC-043
title: Five ~7B decoder-only LLMs develop a high-intrinsic-dimensionality phase in intermediate layers
  that marks the transition from surface-form to abstract linguistic processing, with earlier onset
  predicting better next-token prediction
description: The paper estimates the intrinsic dimension (ID) of last-token hidden representations at
  every layer of five ~7B LMs (OPT-6.7B, Llama-3-8B, Pythia-6.9B, OLMo-7B, Mistral-7B) using the GRIDE
  estimator on three corpora. All models exhibit a distinct ID peak in intermediate layers (roughly
  layers 6–20, later for OPT at 17–23), which is absent when processing shuffled text and in untrained
  Pythia checkpoints. MLP probes show that surface-form information (sentence length, word content)
  is lost at the ID peak while syntactic and semantic tasks (bigram shift, coordination inversion, odd
  man out) reach asymptotic accuracy within the peak. Cross-model information imbalance (Δ) is lowest
  at the intersection of ID peaks, indicating shared representation geometry across architectures. The
  onset of the ID peak correlates with lower surprisal (ρ = 0.65, p = 0.01), and ID-peak layers are
  the first to support viable linear transfer to sentiment and toxicity classification.
