key_metric: 'ID peak at layers ~6–20 (most models), 17–23 (OPT); ID magnitude O(10) vs hidden dim 4096;
  surprisal vs max ID: Spearman ρ = −0.46, p = 0.09; surprisal vs relative ID peak onset: ρ = 0.65,
  p = 0.01; cross-model Δ at peak intersections in range [0, 0.03]–[0.05, 0.07]'
caveat: The correlation between maximum ID and surprisal is only marginal (p = 0.09). The authors note
  that low-Δ values can also occur outside peak intersections, suggesting high ID might be a sufficient
  rather than necessary condition for cross-model similarity. All models are in a narrow size range
  (6.5–8B parameters, 32 layers, hidden dim 4096), limiting generalisability to other scales.
