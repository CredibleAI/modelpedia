id: IC-135
title: Linear relational embeddings for factual relations form in OLMo-7B, OLMo-1B, and GPT-J when subject-object
  co-occurrence frequency exceeds model-specific thresholds, with r=0.82 correlation between log co-occurrence
  and causality across all pretraining stages
description: The paper measures the quality of linear relational embeddings (LREs) for 25 factual relations
  across 8 intermediate OLMo checkpoints and the final GPT-J checkpoint. It finds that the causality
  score of an LRE strongly correlates with the log subject-object co-occurrence frequency in the pretraining
  corpus (r=0.82), and that once a relation's average co-occurrence exceeds a threshold (1,097 for GPT-J,
  1,998 for OLMo-7B, 4,447 for OLMo-1B), the LRE achieves near-perfect causality (>0.9) regardless of
  how early in training that threshold was crossed. The correlation with co-occurrence (0.82) is higher
  than with subject frequency alone (0.66) or object frequency alone (0.59), and higher than with 5-shot
  accuracy (0.74 in OLMo-7B).
