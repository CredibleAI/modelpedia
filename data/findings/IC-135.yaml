key_metric: 'r=0.82 (log subj-obj co-occurrence vs causality); thresholds for mean causality >0.9: GPT-J
  1,097, OLMo-7B 1,998, OLMo-1B 4,447; r=0.66 (subject freq), r=0.59 (object freq); causality vs 5-shot
  accuracy r=0.74 in OLMo-7B; star-constellation-name: 84% accuracy but 44% causality in OLMo-7B'
caveat: Only three models are tested, so the authors caution that scale effects on the threshold cannot
  be firmly established. The co-occurrence count is a proxy for relation mention frequency, not an exact
  count of the full triplet. The finding is correlational; the authors explicitly state they cannot
  draw causal claims about how exposure affects individual representations.
