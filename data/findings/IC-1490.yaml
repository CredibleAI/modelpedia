id: IC-1490
title: Zero-shot CLIP is overconfident on STEM questions, with softmax confidence loosely related to
  actual accuracy
description: 'The paper plots the relationship between CLIP''s softmax confidence and its actual accuracy
  on the STEM test set. The zero-shot model is overconfident: its predicted confidence is systematically
  higher than its realized accuracy, and the two are only loosely correlated. After fine-tuning on the
  STEM training split, the model becomes more calibrated, suggesting the miscalibration is partly due
  to the zero-shot transfer setting rather than an inherent architectural property.'
