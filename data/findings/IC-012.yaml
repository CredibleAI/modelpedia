key_metric: 'Refusal rates on 100 unknown entity queries: Gemma 2 2b original ~20-80% (by entity type),
  steering unknown latent ~100%, orthogonalized model ~0-10%; Gemma 2 9b original ~30-70%, steering
  unknown latent ~70-100%, orthogonalized model ~0-20%; Llama 3.1 8b original ~80-100% on unknown entities,
  steering unknown latent ~90-100%.'
caveat: Results are shown for a specific set of entity types (players, movies, cities, songs) and may
  not generalize to all forms of knowledge. The effect of steering with the known entity latent was
  less pronounced in Llama 3.1 8b.
