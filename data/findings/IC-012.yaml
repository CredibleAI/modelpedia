id: IC-012
title: Sparse autoencoders uncover entity recognition directions in Gemma 2 and Llama 3.1 models that
  are causally relevant for knowledge refusal.
description: Using sparse autoencoders (SAEs), the authors find linear directions in the residual stream
  of the final token of an entity that detect whether the model can recall facts about that entity.
  These directions, found in the base model, are shown to causally affect knowledge refusal in the chat-tuned
  versions of Gemma 2 2b, Gemma 2 9b, and Llama 3.1 8b. Steering with the unknown entity latent increases
  refusal rates for questions about known entities, while steering with the known entity latent causes
  the model to hallucinate when asked about unknown entities. Weight orthogonalization against the unknown
  direction reduces refusal rates.
