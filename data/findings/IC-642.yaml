id: IC-642
title: CLIP can infer contextual attributes (orientation, illumination, etc.) from images with approximately
  74% accuracy on a binary task
description: 'The authors apply one of thirteen image transformations to half of ImageNet test images,
  creating a binary classification task (e.g., upright vs. upside-down). Using two approximations of
  p(z|x) (classattr and pureattr), CLIP identifies the correct attribute value. The average accuracy
  across all thirteen attributes is 74.28% (classattr) and 73.83% (pureattr), well above the 50% random
  baseline. Some attributes are easier to infer (frost: 89.11%, fog: 93.95%) while others are harder
  (blur: 62.91%, bright: 56.98%).'
