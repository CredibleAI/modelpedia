id: IC-438
title: All 10 LLM-based agents perform poorly at recognizing when they need to request input from the
  system or user, with overall accuracy between 30.55% and 55.18%
description: The paper evaluates whether agents can identify parameters that require input from the
  system (clipboard, file, current date) or from the user (ask). Across all 10 LLMs and 4 difficulty
  levels, recognition accuracy is low. The best overall accuracy is 55.18% (DeepSeek-2-Coder) and the
  worst is 30.55% (GPT-3.5-turbo). Performance does not improve consistently with model size or intelligence
  level, and accuracy generally declines as task difficulty increases for most models. This indicates
  a substantial lack of awareness in existing agents regarding when to request necessary input.
