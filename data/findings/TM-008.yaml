id: TM-008
review_status: verified
extracted_by: manual
title: TerraMind embeddings separate hemispheres rather than climate zones
description: >
  The authors hoped TerraMind's embeddings would group satellite images by climate zone without
  ever being told about climate. Instead the embeddings mostly separate the northern hemisphere
  from the southern one. The giveaway is that a classifier given nothing but raw latitude and
  longitude sorts climate zones better than one given the model's embeddings.
evidence_type: correlational
concepts:
  - ref: concept:shortcut
key_metric: >
  5-NN accuracy over climate zones: 80.4 percent from coordinates alone, 45.8 percent from
  the embeddings, 9.3 percent random; north-south centroid permutation test p = 1.00
caveat: >
  The analysis covers Africa only, samples March and September only, and the authors state
  that manual quality checking of the 4,285 patches was not possible at that size.
models:
  - ref: model:terramind
    variant: variant:terramind-v1-tiny
