id: IC-407
title: Safety-aligned LLMs (Llama-2-chat, Llama-3-instruct, Gemma, GPT-3.5, GPT-4o, R2D2) achieve 100%
  jailbreak attack success rate under adaptive prompt-and-suffix attacks on 50 harmful requests
description: The authors design a manually crafted prompt template and optimize an adversarial suffix
  via random search on logprobs, with self-transfer initialization. On 50 harmful requests from AdvBench,
  this composite attack achieves 100% attack success rate (as judged by GPT-4 at 10/10) on Llama-2-chat-7b/13b/70b,
  Llama-3-instruct-8b, Gemma-7b, GPT-3.5 Turbo, GPT-4o, and R2D2-7b. GPT-4 Turbo reaches 96%. R2D2,
  which was adversarially trained against GCg, is particularly sensitive to in-context learning prompts
  (90% ASR from the prompt alone, 100% with random search). The standard prompt template alone yields
  0% ASR on Llama-2-chat and Llama-3-instruct, confirming their safety alignment is effective against
  static prompts but not against optimized suffixes.
