id: IC-105
title: Value anchoring produces a sinusoidal scoring pattern around the circular value structure, with
  scores decreasing as circular distance from the anchor increases
description: 'To explain why value anchoring yields human-like correlations, the paper arranged the
  19 anchor values in their circular order and, for each anchor condition, normalized scores by setting
  the anchored value to zero. The mean normalized scoring pattern across all 19 anchor conditions followed
  a sinusoidal function: the anchored value received the highest score, neighboring values on the circle
  received similarly high scores, and values farther around the circle received progressively lower
  scores. This pattern held across all models except Gemma-2-9B, confirming that the model''s scoring
  is governed by circular proximity in the value structure.'
