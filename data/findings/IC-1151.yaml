id: IC-1151
title: LLaMA, OPT, LLaMA-2, Mistral, and GPT-J all exhibit token co-occurrence reinforcement, where
  the probability of generating a token increases monotonically with the number of its contextual co-occurrences
description: The paper constructs sentences with 1-4 tokens kept unchanged across repeated demonstrations
  and measures the average probability of those kept tokens as the number of repetitions increases from
  0 to 20. Across all tested LLMs (LLaMA 7B-65B, OPT 125M-30B, LLaMA-2 7B-70B, Mistral-7B, GPT-J-6B),
  the probability rises monotonically. Successive tokens (distance=0) show the strongest reinforcement,
  reaching probability 0.4, while distant tokens (distance>=1) reach about 0.2. The effect scales with
  model size, being stronger in larger models. The paper further shows this pattern is embedded in the
  pretraining corpus (Wikipedia-English-2022) and that attending to the preceding token is the internal
  mechanism responsible.
