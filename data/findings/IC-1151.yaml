key_metric: 'successive reinforcement (distance=0): probability 0 to 0.4; distant reinforcement (distance>=1):
  probability 0 to 0.2; sentence-level: probability of ''a'' after ''answer is'' boosted from 0.03 to
  almost 1.0 with 20 repeats (LLaMA-7B); improved ratio reaches almost 1.0 with only several repetitions
  across random, WikiText-103, and BookCorpus'
caveat: Experiments use randomly generated sentences, WikiText-103, and BookCorpus; the paper notes
  that tokens in real corpora are more likely to co-occur in pretraining, which affects baseline probabilities.
  The 267M pretraining experiment in Appendix C uses a smaller architecture than the tested LLMs.
