caveat: The S2EF comparison uses results from [28] for l=2 c=256 and l=6 c=256 (trained 12 epochs on
  16 GPUs) versus this paper's l=2 c=824 (trained 8 epochs on 2 GPUs), so training budget differs. The
  authors note these tasks do not rule out confounding factors like over-squashing. IS2RE uses only
  10k training molecules due to computational constraints.
