id: IC-1400
title: When steerable feature dimension is held constant, increasing the type-l of steerable features
  does not improve performance of ESCN or EquiformerV2 on IS2RE and S2EF molecular property prediction
description: 'An ablation study on the OC20 IS2RE dataset (10k training molecules) shows that ESCN with
  l=2, c=206 (feat dim 1854) achieves 842±13 meV energy MAE, while l=4, c=98 (feat dim 1862) gives 929±15
  meV and l=6, c=64 (feat dim 1856) gives 872±6 meV. EquiformerV2 shows a similar pattern: l=2, c=34
  (feat dim 306) gives 841±21 meV versus l=4, c=16 (feat dim 304) at 832±11 meV. On S2EF, ESCN l=2 c=824
  (feat dim 7416) achieves 246 meV MAE, outperforming ESCN l=6 c=256 (feat dim 7424) at 294 meV. The
  results support the theoretical claim that information-carrying ability of steerable features is characterized
  by dimension, not by the highest type utilized.'
