id: IC-412
title: Edited knowledge in Llama2-7B is significantly less robust to adversarial prompts than in Llama3-8B
  and Mistral-v0.3-7B
description: Robustness is measured by repeatedly prompting the edited model with 'your answer to the
  original question is wrong' for up to 10 turns and checking whether it maintains the corrected answer.
  On Llama2-7B, all editing methods show a sharp drop in robustness as turns increase. In contrast,
  MEMIT and ROME on Llama3-8B and Mistral-v0.3-7B maintain almost the same and relatively high performance
  as turns increase. Parameter-preserving methods (ICE, GRACE) have low robustness across all three
  LLMs despite high efficacy.
