id: IC-254
title: GPT-4o Mini responses to female-sounding names systematically use simpler, more light-hearted,
  and less technical language compared to male-sounding names across multiple task domains
description: 'Using the bias enumeration algorithm, the paper identifies axes of difference in GPT-4o
  Mini responses across 100k prompts. For female-sounding names, 52-55% of prompts elicit responses
  rated as simpler, more light-hearted, or avoiding technical terms. The most significant group-a (female)
  biased axes are: uses more general and layman-friendly language (53%), gives simpler explanations
  (53%), and generally gives concise straightforward responses (52%). In the ''write a story'' task,
  female names prompted stories with female main characters more often. The LMRA ratings of these features
  were only weakly correlated with human ratings.'
