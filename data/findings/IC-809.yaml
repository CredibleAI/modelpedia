caveat: The dictionary is trained in a task-agnostic way; the authors note that generalisation to other
  tasks is expected but unconfirmed. The non-sparse (alpha=0) dictionary does not show the same precision
  advantage, and larger alpha values increase the minimum achievable KL divergence due to lower reconstruction
  accuracy.
