id: IC-016
title: Truncating MLP weights in Pythia-1b increases the probability of the correct answer in a factual
  recall task
description: The paper evaluates the effect of LASER on the performance of Pythia-1b on a factual recall
  task. They measure the average probability of predicting the target fact ('spain') and the generic
  token 'the' for the prompt 'madrid is located in'. Applying LASER to the MLP weights of Pythia-1b
  boosts the probability ratio of 'spain' over 'the' from 0.16x to 11.3x at 14k training steps.
