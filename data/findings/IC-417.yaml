id: IC-417
title: RLHF alignment reduces the creativity index of LLMs (GPT, Llama 2, OLMo) by an average of 30.1%
  at the verbatim level and 8.9% at the semantic level
description: The paper compares the creativity index of base models (GPT base/davinci-002, Llama 2 base,
  OLMo base) with their RLHF-aligned counterparts (GPT-3/ChatGPT, Llama 2 Chat, OLMo Instruct) on novel
  writing. The aligned models produce text with significantly more verbatim and semantic matches to
  the reference corpus, indicating reduced linguistic originality. The reduction is larger at the verbatim
  level than the semantic level, suggesting alignment causes models to converge on certain surface-level
  linguistic styles preferred by human raters.
