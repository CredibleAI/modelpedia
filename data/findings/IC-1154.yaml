id: IC-1154
title: LLaMA-65B exhibits a selection bias where zero-shot accuracy varies substantially by answer choice,
  with 'a' at 71.58% and 'd' at 52.28%
description: 'On a balanced MMLU test set (equal numbers of questions with golden answers a, b, c, d),
  LLaMA-65B''s zero-shot accuracy differs by answer choice: class ''a'' achieves 71.58%, ''b'' 59.65%,
  ''c'' 58.95%, and ''d'' 52.28%. With 5 demonstrations, the overall accuracy improves from 60.61% to
  63.16%, but class ''a'' accuracy drops to 54.74% while ''b'', ''c'', and ''d'' all increase. This
  indicates a persistent preference for earlier answer choices in zero-shot that partially corrects
  with more demonstrations.'
