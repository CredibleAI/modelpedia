id: IC-004
title: Retrieval heads are sparse, universal, and causally responsible for long-context retrieval in
  LLMs
description: The paper identifies a small subset of attention heads, termed 'retrieval heads,' which
  are primarily responsible for retrieving relevant information (copy-paste or paraphrase) from long
  contexts. Across all tested model families (Llama, Yi, Qwen, Mistral, Mixtral) and variants, only
  about 5% of attention heads are retrieval heads, and they exist intrinsically in base models. Causal
  intervention by masking retrieval heads sharply degrades performance on the needle-in-a-haystack task,
  while masking random non-retrieval heads has little effect. The study further shows that these heads
  are dynamically activated based on context and that their role extends to extractive QA and chain-of-thought
  reasoning.
