key_metric: Accuracy drops from 94.7% (20 random heads masked) to 63.6% (top 20 retrieval heads masked)
  on NIAH for Llama-2-7b-80k; retrieval heads are <5% of all heads; performance drops below 50% when
  masking >50 retrieval heads.
caveat: The retrieval score threshold of 0.1 and the focus on copy-paste behavior for detection may
  not capture all retrieval functions; tasks heavily reliant on parametric knowledge (e.g., MMLU without
  CoT) are less affected.
