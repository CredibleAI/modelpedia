id: IC-592
title: The log-likelihood layer in LLaMA-2-7B, LLaMA-2-7B-Chat, Vicuna-7B, and Mistral-7B-Instruct produces
  factually incorrect answers on TruthfulQA MC1 (817 samples) due to a misalignment between the output
  distribution and internal attention head representations, with LM-to-head-norm accuracy gaps of 24.23
  to 40.68 points.
description: 'On TruthfulQA MC1, the standard log-likelihood decoding of these four 7B LLMs yields substantially
  lower accuracy than a method that reads the L2 norms of their attention heads. The gap between the
  LM baseline and the head-norm-based prediction ranges from 24.23 points (Mistral-7B-Instruct: 53.86
  vs 78.09) to 40.68 points (LLaMA-2-7B: 28.48 vs 69.16). The paper attributes this to the log-likelihood
  layer favouring fluency over factuality, so that the model''s internal factual knowledge is not faithfully
  expressed in its output probabilities. The phenomenon generalizes to four additional models (Phi3-3.8B-IT,
  Zephyr-7B-Beta, Llama3-8B, Gemma2-9B-IT) with major gains of 20 points averaged across factuality
  benchmarks.'
