id: IC-492
title: Least-to-most prompting consistently improves MLLM accuracy on the relationship application step
  compared to direct answering, with GPT-4o improving from 0.9% to 6.44% on VOILA-WD
description: Three models were compared on the third step (applying relationship) using L2M prompting
  versus direct zero-shot answering. L2M prompting, which decomposes the task into sequential sub-problems
  with the previous answer appended to the next, consistently outperforms direct answering across all
  models and both datasets. The improvement is most pronounced for GPT-4o on VOILA-WD (6.44% vs. 0.9%)
  and VOILA-ND (29.03% vs. 16.94%). A supplementary experiment shows that L2M with detailed instructions
  slightly outperforms chain-of-thought with two examples (6.44% vs. 5.96%) for GPT-4o on the same step.
