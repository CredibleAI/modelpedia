key_metric: Energy minimization occurs in PCA 3,4 (in-context dimensions) rather than PCA 1,2 (semantic
  dimensions), as shown in Fig. 15. The model transitions from semantic-prior accuracy to in-context
  accuracy with increasing context (Fig. 14).
caveat: The in-context structure is present but 'unable to dominate the pretrained structure.' The authors
  note this is a limitation of the representation reorganization under semantic conflict.
