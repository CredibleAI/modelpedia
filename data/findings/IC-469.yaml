id: IC-469
title: CLIP's global contrastive alignment causes attention on anatomically irrelevant regions in 3D
  CT, yielding limited zero-shot diagnostic accuracy (AUC 68.4 on 54 tasks)
description: The paper evaluates CLIP on 54 zero-shot disease diagnosis tasks across 15 anatomies using
  the MedVL-CT69K dataset. CLIP achieves an AUC of 68.4 and accuracy of 66.7. Attention map visualizations
  (Fig. 1c) show that CLIP's global image-report alignment mechanism causes the model to focus on regions
  not relevant to the specific diagnosis, which the authors argue compromises both performance and interpretability.
  This is contrasted with the authors' FVLM, which achieves AUC 81.3, a 12.9-point gap attributed to
  CLIP's coarse-grained alignment.
