id: IC-399
title: Safety attention heads overlap significantly between Llama-2-7b-chat and Vicuna-7b-v1.5, indicating
  that pre-training shapes safety capability
description: The paper compares the top-10 safety heads identified by generalized SHIPS in Llama-2-7b-chat
  and Vicuna-7b-v1.5, both fine-tuned from the same Llama-2-7b base. Figure 5b shows significant overlap
  in the identified safety heads regardless of ablation method. Additionally, loading attention parameters
  from the base model into the aligned model (a 'concatenated' model) retains safety capability close
  to the fully aligned model, supporting that the attention mechanism's safety role derives primarily
  from pre-training rather than alignment fine-tuning.
