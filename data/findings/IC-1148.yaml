id: IC-1148
title: ChatGPT and InstructGPT exhibit positional bias in their reliance on in-context examples, with
  ChatGPT showing decreasing attention by position and InstructGPT showing a U-shaped pattern
description: 'Using an interpreter prompt that asks the model to identify which in-context example most
  influenced its prediction, the paper counts how often each of 16 positions is cited across 8 NLU tasks.
  ChatGPT shows a monotonic decrease: the second example is cited over 35,000 times while the last receives
  around 5,000. InstructGPT shows a U-shaped curve, attending to the first and last examples while attention
  degrades significantly in the middle. The authors note this is consistent with Liu et al. (2023) on
  long-context degradation.'
