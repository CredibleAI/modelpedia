id: IC-1610
title: Llama-2-7b-chat underperforms on small molecule editing tasks due to limited domain-specific
  pretraining
description: When used as the backbone in the ChatDrug framework for 28 small molecule editing tasks
  (16 single-objective, 12 multi-objective), Llama-2-7b-chat outperforms baseline methods on only 7
  of the 28 tasks. The authors attribute this to the model not being well pretrained on small molecule
  domain datasets. In contrast, the same model performs adequately on peptide and protein editing tasks,
  indicating the limitation is domain-specific rather than a general capability gap.
