id: IC-080
title: GPT-4's performance is largely insensitive to the content of feedback; simple re-prompting with
  a sound verifier (sampling) matches or exceeds detailed critique
description: The paper ablates the feedback content in the iterative loop, comparing binary feedback
  ('wrong'), first-error feedback, and all-error feedback from a sound verifier. The differences between
  these conditions are small, and in two domains (graph coloring, mystery blocksworld) more detailed
  feedback actually decreases performance. Removing critique entirely and simply re-prompting the same
  question until the sound verifier accepts an answer (sampling) achieves comparable gains. A self-consistency
  baseline (picking the most common answer from 15 samples) shows no improvement over standard prompting,
  confirming that the gain comes from the sound verifier filtering, not from the model learning from
  feedback.
