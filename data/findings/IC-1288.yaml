caveat: The LLMs rely on captions from a separate VLM (BLIP-2 or InstructBLIP) rather than processing
  images directly, so the results reflect the combined system rather than the LLM in isolation. The
  authors note that InstructBLIP's more verbose captions may introduce noise that distracts the reasoner.
