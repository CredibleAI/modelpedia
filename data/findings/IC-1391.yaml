id: IC-1391
title: SLD concept removal variants and SD with negative prompts are bypassable by Ring-a-Bell adversarial
  prompts, increasing attack success rate from single digits to 90-100% for nudity
description: The paper evaluates SLD-max, SLD-strong, SLD-medium, and SD with negative prompts (SD-NP)
  against Ring-a-Bell generated prompts on the I2P dataset. For nudity, SLD-medium's ASR jumps from
  30.53% (original prompts) to 91.58% (Ring-a-Bell) and 100% (Ring-a-Bell-union). SLD-max goes from
  2.11% to 42.11% to 57.89%. SD-NP goes from 4.21% to 34.74% to 49.47%. Even with a safety checker deployed,
  Ring-a-Bell-union achieves 57.89% ASR on SLD-medium nudity. The paper reports that Ring-a-Bell increases
  the success rate for most concept removal methods by more than 30%.
