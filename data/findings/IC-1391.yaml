key_metric: 'Nudity ASR (w/o SC): SLD-medium 30.53%→91.58%→100%; SLD-max 2.11%→42.11%→57.89%; SLD-strong
  12.63%→61.05%→86.32%; SD-NP 4.21%→34.74%→49.47%. Violence ASR (w/o SC): SLD-medium 34%→76.4%→97.2%;
  SD-NP 28%→80%→94.8%. With SC, SLD-medium nudity: 3.16%→35.79%→57.89%'
caveat: The paper notes that CA and FMN are incapable of effectively removing nudity and violence but
  are included for completeness. The safety checker is more sensitive to nudity than violence. One image
  per prompt with a fixed random seed. The SLD variants are adopted as provided by schramowski et al.
  2023.
