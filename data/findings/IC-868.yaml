id: IC-868
title: Skill-Mix performance degrades with increasing k, and within the Llama-2 family the saturation
  point increases with model size
description: 'The paper evaluates ten instruction-tuned models on Skill-Mix(k) for k=2 through k=6,
  where the model must generate text illustrating k randomly selected skills in a given topic. Performance
  drops sharply as k increases: most models saturate by k=3 under GPT-4 grading. Within the Llama-2
  family, which shares training data and methodology, the saturation point rises with size: Llama-2-7b-chat
  saturates at k=2, while Llama-2-13b-chat and Llama-2-70b-chat saturate at k=3. GPT-4 is the only model
  that maintains reasonable performance through k=5 and k=6.'
