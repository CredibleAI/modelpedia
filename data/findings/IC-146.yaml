id: IC-146
title: Pythia models show increasing robustness to off-policy RLHF data as policy size scales from 410M
  to 2.8B
description: 'The paper tests how Pythia models of three sizes (410M, 1B, 2.8B) perform under varying
  levels of off-policy data during RLHF training on TLDR summarization. By generating n mini-batches
  before each update (n=1 to 64), the authors create a spectrum from fully on-policy to highly off-policy
  training. They find that larger models maintain performance better under off-policy conditions: the
  410M model has two points (n=16, 32) far from the optimal win-rate/KL tradeoff with wide spread, whereas
  the 2.8B model''s worst point (n=64) remains close to optimal. This indicates that model capacity
  is a key factor in tolerating stale training data during RLHF.'
