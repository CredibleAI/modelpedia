id: IC-1199
title: GPT-2 next-token distributions contain correctable tail errors from the softmax bottleneck that
  degrade generation quality under low-entropy sampling, with basis-aware threshold sampling improving
  MAUVE across all four sizes
description: The paper demonstrates that GPT-2's low-rank softmax matrix causes probability overestimation
  for tokens outside the true support, leading to incoherent text under low-entropy (near-greedy) decoding.
  By exploiting the linear structure of the softmax matrix, the authors' basis-aware threshold (BAT)
  sampling selectively rejects high-probability but implausible tokens while retaining lower-probability
  but valid ones. Across all four GPT-2 sizes, BA-η outperforms standard η-sampling on MAUVE, with the
  gap largest for GPT-2-large. Human annotators also narrowly prefer BA-η generations over η-sampling
  generations.
