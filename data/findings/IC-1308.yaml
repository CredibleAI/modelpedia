id: IC-1308
title: Dynamic retrieval-based few-shot prompting substantially improves released LLMs' code optimization,
  with GPT-4-0613 reaching 76.07% optimization rate and 3.93x speedup (best@8), exceeding the 3.66x
  human reference
description: Using CodeBERTScore embeddings and FAISS to retrieve the k=4 most similar slow-fast pairs
  from the PIE training set, the paper constructs dynamic few-shot prompts for each test program. This
  strategy outperforms all baseline prompting variants across every model tested. GPT-4-0613 achieves
  76.07% optimization rate and 3.93x speedup at best@8, surpassing the 3.66x human reference. CodeLlama
  34B improves from 19.63% opt / 1.30x (CoT) to 42.54% opt / 2.43x with retrieval. The ablation over
  k in {1, 2, 4} shows k=4 is optimal for most models.
