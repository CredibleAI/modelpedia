key_metric: At prediction depth d=6, only 3 out of 64 possible length-6 binary sequences match concept
  c=(011)^n; p(y in c|x) transitions from near 0 to near 1 as |x| increases; in judgment tasks, p(y=random|x)
  drops from high confidence to near 0.0 across 9 concepts
caveat: The ICL curves for longer concepts are smoother for text-davinci-003 and do not converge to
  p(y|x) approximately 1 as they do for gpt-3.5-turbo-instruct-0914. The authors do not explore the
  reason for this distinction. The paper notes that with p(tails)=50% specifically, the model defaults
  to repeating 'heads, tails' regardless of the formal language in context.
