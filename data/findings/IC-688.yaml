id: IC-688
title: GPT-3.5-turbo-instruct-0914 shows sharp phase transitions in in-context learning of simple formal
  languages, transitioning from random generation to deterministic pattern repetition as context length
  increases
description: When given a prompt to generate samples from a weighted coin, and the context contains
  a repeating formal language pattern such as (011)^n, gpt-3.5-turbo-instruct-0914 initially generates
  subjectively random sequences for small context lengths |x|, then sharply transitions to deterministically
  repeating the pattern. The predictive probability p(y in c | x) assigned to valid continuations of
  the concept rises from near 0 to near 1 over a narrow range of |x|. In randomness judgment tasks,
  the model's confidence that a sequence is random drops sharply from high to near 0 as |x| increases,
  across 9 different binary concepts. The transition is s-shaped, consistent with Bayesian model selection
  rather than model averaging.
