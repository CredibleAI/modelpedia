id: IC-565
title: Phi-3's residual stream encodes format instructions as linear directions, evidenced by cosine
  similarity and vocabulary-space projections
description: The paper analyses Phi-3's residual stream activations at the last input token across layers.
  Cosine similarity between inputs sharing the same instruction (e.g., 'quotation', 'urdu language')
  is higher than between inputs with no shared instruction, and in some cases higher than between the
  same query with and without the instruction. Projecting the computed steering vectors onto the vocabulary
  space via the unembedding matrix yields top tokens semantically related to the instruction (e.g.,
  '{', 'json' for JSON format; 'die', 'im' for German). T-SNE visualisations of per-example instruction
  vectors at layer 20 show distinct clusters for well-encoded instructions and dispersed points for
  harder ones like 'end checker' and 'constrained response'.
