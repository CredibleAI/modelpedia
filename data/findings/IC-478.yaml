id: IC-478
title: GPT-4 and GPT-4V achieve approximately 71-73% accuracy in judging whether a web agent trajectory
  successfully completes a task
description: The paper evaluates released LLMs on the task of determining whether a web agent's trajectory
  successfully completes a given instruction, using the WebArena-Lite test set and 100 manually labeled
  rollouts. GPT-4 achieves 71.9% on the test set and 71.2% on rollouts; GPT-4 with a captioner achieves
  72.6% and 73.3%; GPT-4V achieves 71.2% and 70.5%. All three are substantially below the authors' 8B
  ORM (80.8% / 79.4%). The evaluation uses the same prompts as Pan et al. (2024) for the captioner and
  GPT-4V baselines.
