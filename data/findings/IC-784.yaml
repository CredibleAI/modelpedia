id: IC-784
title: Pre-trained scoring models (CLIP Score, HPS, Image Reward, Pick Score) underperform on domain-specific
  fine-tuned diffusion models
description: The authors constructed a Van Gogh dataset of 275 prompts, each with one image generated
  normally and four with negative weighting on 'van gogh style'. They measured each scoring model's
  accuracy in identifying the correctly-styled image. All four pre-trained scoring models scored between
  0.229 and 0.338, well below the CAS score of 0.470. This shows that scoring models trained on general-purpose
  data do not transfer to domain-specific fine-tuned diffusion models.
