key_metric: Gaussian noise magnitude 2 × 10⁻³, 200 perturbations; latent sequences un-memorized at 10k
  (KL-LD > 50) but memorized at 19k (KL-LD < 10) are recovered; sampling at 4 temperatures with 200
  samples each fails to recover
caveat: The perturbation magnitude (2×10⁻³) was chosen by the authors; the paper notes further testing
  across other frontier models is required and the mechanistic explanation for why training acts as
  random noise with respect to memorized sequences requires further study.
