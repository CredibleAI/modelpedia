id: IC-626
title: Llama 7B retains 95% of its common sense reasoning performance when compressed to 2 GB using
  JLCM
description: The paper evaluates how Llama 7B's average common sense reasoning score changes when its
  weights are compressed via the JLCM codebook method. At a compression rate of 7.0 (approximately 2
  bits per weight), the model's score drops from 56.140 to 53.081, retaining roughly 95% of original
  performance. At a milder compression rate of 5.33, the score is 55.940. The authors note this enables
  loading the model on a 2 GB device such as an iPhone 8.
