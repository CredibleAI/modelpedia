key_metric: 'AdvBench-50 ASR: 92% (Claude 3 Haiku), 94% (Claude 3 Opus), 94% (Claude 3.5 Sonnet), 88%
  (GPT-4o-mini), 66% (GPT-4o). HarmBench ASR: 82.1%, 78.1%, 86.3%, 64.1%, 59.1% respectively. Outperforms
  encoding ensemble by at least 30 percentage points.'
caveat: Evaluations limited to closed-source models due to cost; larger sweeps restricted to cheaper
  models. Bijection learning requires 25,000-50,000 input tokens, limiting applicability to models with
  large context windows.
