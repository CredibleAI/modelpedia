id: IC-766
title: Multiple Real-SR methods fail to outperform a small FSRCNN network on the majority of 100 representative
  degradation cases
description: 'Under the SEAL framework''s 100 representative degradation cases, several Real-SR methods
  produce output worse than a small FSRCNN baseline on more than half the cases. Among MSE-based methods,
  SRResNet (AR: 0.00), DASR (AR: 0.00), and RD-SR (AR: 0.08) all fail. Among GAN-based methods, ESRGAN
  (AR: 0.00) and DASR (AR: 0.02) also fail. The condition is diverse real-world degradations spanning
  blur, noise, resize, and JPEG compression, and the failure is checked across all 100 representative
  cases.'
