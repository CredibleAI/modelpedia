id: IC-010
title: LLM responses to trolley problems are moderately robust across prompt paraphrases
description: The paper tests consistency across five different paraphrases of each prompt on two models
  (Llama 3 8B and 70B) across 14 languages. It reports that 75.9% of samples have consistent outputs
  where at least four out of five paraphrases agree, pairwise F1 score is 78%, pairwise accuracy is
  81%, and the average Fleiss' kappa is 0.56 (moderate agreement). The 70B model demonstrates higher
  consistency than the 8B model.
