caveat: Neither attention nor CMI perfectly aligns with the goal of segmentation; contextual parts of
  an image (e.g., a vapor trail for an airplane) can be informative about an object without being part
  of it. The segmentation evaluation is on a filtered subset (COCO-it) of MS COCO validation.
