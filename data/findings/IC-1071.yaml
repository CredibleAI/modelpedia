id: IC-1071
title: Stable Diffusion v2.1's pixel-wise conditional mutual information localizes abstract words (adjectives,
  adverbs, verbs) more effectively than attention, but is less effective than attention for object segmentation
description: The paper computes pixel-wise CMI and MI for words in captions and compares them to attention
  heatmaps for spatial localization. For object nouns, CMI achieves mIoU of 32.31–33.63 (50–200 steps)
  versus 34.52–35.35 for DAAM attention, with attention+information reaching 42.46–42.84. Qualitatively,
  CMI focuses on distinctive fine details (eyes, ears, tusks) rather than overall object boundaries,
  making it less suited to segmentation. However, for abstract words such as adjectives, adverbs, and
  verbs, CMI and MI highlight relevant finer details more effectively than attention, which the authors
  link to the compositional understanding results in Table 1.
