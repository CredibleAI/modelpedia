id: IC-916
title: 'Pythia models show scale-dependent last-layer averaging barriers: 70M exhibits a barrier of
  ~13 while 410M shows ~1'
description: The paper computes layer-wise linear interpolation barriers for three released Pythia model
  sizes (70M, 160M, 410M) on WikiText. For most layers, no significant barrier appears, consistent with
  the paper's main claim of layer-wise linear mode connectivity. However, the last layer (embed_out)
  shows a pronounced barrier in the smallest model (70M, reaching ~13.4) that diminishes with scale
  (160M ~7.0, 410M ~1.0). This scale-dependent pattern means that layer-wise averaging of the final
  layer is problematic for small Pythia models but not for larger ones.
