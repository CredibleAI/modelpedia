id: IC-116
title: In LLaVA-7B, multi-head attention modules drive hallucination more than MLP modules, and targeted
  intervention on specific hallucination heads reduces the hallucination rate by up to 1.7x
description: Using zero-ablation (causal mediation analysis) on 1,500 COCO training images, the paper
  shows that removing MHA modules has approximately 3.5x the influence on hallucination word generation
  compared to removing MLP modules. Further, a contrastive influence score localizes this effect to
  specific attention heads. Two intervention strategies—adaptive deactivation of text attention during
  decoding (AD-HH) and targeted fine-tuning of hallucination heads (TF-HH)—reduce CHAIRs from 51.8 to
  29.6 and 35.0 respectively on COCO validation, while maintaining or improving generation quality.
