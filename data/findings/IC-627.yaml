id: IC-627
title: ResNet 18 and ViT B/16 retain significant ImageNet accuracy at 2–3 bit weight compression via
  JLCM
description: The paper measures ImageNet top-1 accuracy of ResNet 18 and ViT B/16 after compressing
  their weights with JLCM at two compression rates. At 5.33x compression (approximately 3 bits), ResNet
  18 achieves 62.939% and ViT B/16 achieves 80.558%. At 7.5x compression (approximately 2 bits), ResNet
  18 drops to 41.779% and ViT B/16 to 69.996%. The authors report that JLCM reaches over 99% of the
  original ViT B/16 accuracy in its data-driven variant at 5.33x.
