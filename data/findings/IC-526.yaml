id: IC-526
title: GPT-2 small's first token position has residual stream norms more than an order of magnitude
  larger than all other positions
description: The authors measure residual stream norms across context positions in GPT-2 small and find
  that the first token position has norms more than an order of magnitude larger than all other positions,
  except at the first and last layers. Despite the first position being easier to reconstruct in terms
  of normalized MSE, ablating it to the autoencoder reconstruction causes significantly worse downstream
  loss and KL divergence than ablating other positions. The authors attribute this to the large-norm
  direction at the first position serving as a crucial attention resting state, consistent with the
  attention sink phenomenon described by Sun et al. (2024) and Xiao et al. (2023).
