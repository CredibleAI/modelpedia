id: IC-1086
title: RS LDS fails to increase its number of active states when the underlying dynamics change non-stationarily
description: On the extended NASCAR synthetic task, where the true number of discrete states shifts
  from 4 to 6 mid-trajectory, the RS LDS model (with k=6 allocated) still maintains only 4 active states
  after the dynamics switch, as seen in its most-likely discrete state trajectories. On real IBL mouse
  electrophysiology data, the RS LDS shows much smaller fluctuations in the number of occupied states
  per trial (spline r²=0.16) compared to the IRSLDS (r²=0.46), indicating it misses trial-varying structure
  in state usage. The limitation is the fixed cardinality of the discrete state space in the HMM-based
  transition prior.
