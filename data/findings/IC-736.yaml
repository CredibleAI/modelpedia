id: IC-736
title: Vicuna-13B outperforms Vicuna-7B on factual knowledge tasks by 5.4% on average
description: The paper compares Vicuna-7B and Vicuna-13B across all Pinocchio tasks under few-shot CoT
  prompting. As model parameters increase from 7B to 13B, performance on factual questions improves
  correspondingly, with an average increase of 5.4%. The authors interpret this as evidence that LLMs
  with more parameters can store more world knowledge and have stronger factual knowledge recognition
  capabilities.
