id: IC-247
title: Pretrained LLMs are invariant to positional shifts but sensitive to duration scaling of the input
description: 'The authors test two transformations on the continuous input: shifting all positional
  indices by a fixed amount (up to 10) without changing durations, and scaling all durations by a factor
  in [0.2, 1.4]. Shifting produces negligible change in the model''s output across all six LLMs and
  three test sentences, consistent with the shift-invariance of sinusoidal and rotary positional encodings.
  Scaling, by contrast, significantly changes the predicted next token. The same shift-invariance is
  observed in GPT-2 (learned positional embeddings), though with smaller magnitude.'
