key_metric: 'accuracy without instructions: ~10% (no steering) to ~30% (steering); accuracy with instructions:
  60%-90% (no steering), significant boost for 2 of 4 models; length: c=20, significant improvement
  across n=1..5 sentences (p<0.01, McNemar''s test)'
caveat: Steering can occasionally produce nonsensical or repetitive tokens, particularly for 'constrained
  response' and 'title' instructions where no layer improves performance. Quality score decreases are
  small but non-zero. The method uses a fixed steering weight throughout generation and does not fully
  explore the intervention space.
