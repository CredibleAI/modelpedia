key_metric: 'Zeroing out vector from text tokens: individual paradigm SAD 55.6% decreasing (p=0.0153),
  QA 58.1% decreasing (p=0.0008); paired paradigm SAD 52.9% decreasing (p=0.1188), QA 55.9% decreasing
