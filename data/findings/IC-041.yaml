id: IC-041
title: CLIP and SigLIP use the modality gap to control logit entropy
description: The paper finds that the modality gap can serve as a mechanism to adjust the entropy (uncertainty)
  of the output logits. When the temperature parameter is frozen, models increase the modality gap to
  achieve the same entropy as models with a learnable temperature. This suggests the gap is a flexible
  tool for controlling the logit entropy on a per-sample basis, rather than a simple bug.
