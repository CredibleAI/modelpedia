id: IC-014
title: Sparse autoencoders can identify 'uncertainty' directions in the residual stream before an answer,
  which are predictive of incorrect responses.
description: The authors identify SAE latents in the residual stream at the end-of-instruction token
  that differentiate between correct and incorrect responses. These directions, found in Gemma 2 2b
  and Gemma 2 9b, appear to signal model uncertainty. The highest-scoring latent in Gemma 2 2b achieves
  a 73.2% AUROC and an F1 score of 72% in classifying correct vs. incorrect responses on a test set.
  An analysis of the latent's activations on a large text corpus shows it fires on text related to uncertainty
  or undisclosed information.
