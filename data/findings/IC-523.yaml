key_metric: 'GPT-4o (d=5, n=5): IF only 0.84/0.52/0.84/0.63, CF only 0.69/0.35/0.72/0.50, OF only 0.49/0.23/0.57/0.36,
  baseline 0.66/0.36/0.71/0.46 (LT/RP/CG/ST). Deductive density: over 0.9 at eta=1 (d=3), around 0.5
  in full test space (d=5). Claude-3.5 (d=5, n=5): IF only 0.90/0.46/0.87/0.61, OF only 0.60/0.30/0.71/0.39.'
caveat: The neighborhood is defined using Chebyshev distance on the input vectors; the authors validate
  this choice against Euclidean, Manhattan, and Minkowski distances and find only Chebyshev produces
  the effect. The analysis is on synthetic single-digit integer vectors, and the models are treated
  as black boxes with no internal inspection.
