id: IC-523
title: LLMs rely on observed facts close to the test case in input feature space (neighbor-based reasoning)
  rather than on an abstract rule, and this effect is localized
description: 'When observed facts are partitioned into in-neighborhood (IF), cross-neighborhood (CF),
  and out-neighborhood (OF) relative to the test input using Chebyshev distance, model accuracy on example
  inference follows IF > CF > OF across all five models, all four scenarios, and multiple fact counts.
  Removing neighbor facts (OF only) causes a significant accuracy drop compared to the baseline. The
  effect is universal: it holds for GPT-4o, Claude-3.5, Llama3-8B, and Llama2-13B across list transformation,
  real-world problems, code generation, and string transformation. A deductive-density analysis shows
  the benefit of neighbor facts is localized: at test radius eta=1 the model achieves over 0.9 deductive
  density, but this drops to around 0.5 in the full test space, indicating the model generalizes only
  within a small neighborhood of the test case.'
