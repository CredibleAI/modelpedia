id: IC-767
title: BSRNet outperforms RealESRNet on the majority of degradation cases, reversing the ranking obtained
  from a single random test set
description: On a single randomly generated test set (real-DIV2K val), RealESRNet achieves a higher
  average PSNR than BSRNet (24.93 dB vs 24.77 dB), suggesting RealESRNet is superior. However, under
  SEAL's systematic evaluation on 100 representative degradation cases, BSRNet achieves AR 0.55 while
  RealESRNet achieves only AR 0.15, meaning BSRNet outperforms the FSRCNN acceptance line on 55% of
  cases versus 15% for RealESRNet. Across 20 random test sets, the PSNR difference between the two ranges
  from -0.22 to 0.18 dB, making the conventional ranking unstable.
