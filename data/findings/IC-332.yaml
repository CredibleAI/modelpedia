id: IC-332
title: Llama-3-70B exhibits a friendlier, funnier, and less ethics-focused style than GPT-4 and Claude-3-Opus
  on Chatbot Arena, and these vibes predict model identity at 80% and user preference at 59% accuracy
description: Using pairwise battles from Chatbot Arena, VibeCheck discovers qualitative axes (vibes)
  along which Llama-3-70B differs from GPT-4 and Claude-3-Opus. The top vibes include Llama's use of
  typographic emphasis (sep 0.64), humor (sep 0.62), examples (sep 0.61), and lower ethical consideration
  (sep 0.53). Llama uses personal pronouns ('I', 'we', 'you') 3x more than GPT/Claude. A logistic regression
  over these vibes achieves 80.34% model-matching accuracy and 59.34% preference-prediction accuracy
  overall, with higher accuracy on writing prompts (77.19% MM, 62.04% PP) than STEM (68.71% MM, 57.31%
  PP).
