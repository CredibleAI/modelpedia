id: IC-422
title: Safety fine-tuning in Llama models improves with parameter size but exhibits diminishing returns
description: The paper observes that across the Llama family (1B, 3B, 8B instruct variants), the mean
  number of unsafe responses elicited by the SOC attack decreases as model size increases, indicating
  stronger safety alignment in larger models. However, the gap between 1B and 3B is substantially larger
  than the gap between 3B and 8B, which the authors interpret as diminishing returns in safety fine-tuning
  with scale. This pattern is visible in the cumulative unsafe-response curves in Figure 3a.
