id: IC-752
title: GPT-4's win rate over GPT-3.5-turbo is 52% on the top-50 most challenging prompts but only 22%
  on the bottom-50 easiest prompts
description: The paper samples 50 prompts scored above 8 and 50 scored below 2 by GPT-3.5-turbo's difficulty
  rating, then compares GPT-4 and GPT-3.5-turbo responses on each set. GPT-4 wins 52% of comparisons
  on the challenging set but only 22% on the easy set, with 40% ties on the easy set. This demonstrates
  that prompt difficulty is a key factor in distinguishing model capabilities.
