id: IC-177
title: GPT-4o mini, GPT-4o, and Llama-3-8B all over-rely on incorrect external context, producing wrong
  answers at high rates when the context conflicts with their internal knowledge
description: When each model is given a question paired with an incorrect context that contradicts its
  internal knowledge, the model's direct input augmentation (DIA) baseline follows the wrong context
  in the vast majority of cases. Across six QA datasets, accuracy given false contexts (acc_f) under
  DIA ranges from 2.3% to 24.7% for GPT-4o, 2.3% to 12.5% for GPT-4o mini, and 2.7% to 14.3% for Llama-3-8B,
  meaning the models are misled by incorrect context in over 75% of cases. This over-reliance is consistent
  across all three models and all six datasets, establishing it as a reproducible failure condition
  rather than an isolated error.
