id: IC-996
title: GPT-3.5 achieves 73.5% zero-shot accuracy on OGBN-ARXIV 40-class node classification and 73.56%
  on TAPe-ARXIV23, a dataset of papers published after its knowledge cutoff
description: The paper prompts GPT-3.5 (gpt-3.5-turbo) with paper titles and abstracts in a zero-shot
  setting, asking it to predict the arXiv CS sub-category and provide an explanation. On OGBN-ARXIV
  (169,343 nodes, 40 classes) it reaches 73.5% accuracy, surpassing RevGAT with OGB shallow features
  (70.8%) but falling short of GLEM (76.6%). On TAPe-ARXIV23, a citation graph of 46,198 papers published
  in 2023 (beyond GPT-3.5's November 2022 knowledge cutoff), it still achieves 73.56%, indicating generalization
  to unseen papers.
