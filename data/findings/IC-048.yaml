id: IC-048
title: Existing video LLMs (TimeChat, VTG-LLM, Momentor, Hawkeye) show limited zero-shot video temporal
  grounding capability and struggle to improve with fine-tuning
description: The paper evaluates four released video LLMs specifically designed for temporal grounding
  on three VTG benchmarks in zero-shot settings. All four show substantially lower performance than
  TRACE, with CIDEr scores on YouCook2 ranging from 1.2 to 31.4 and R@1(IoU=0.7) on Charades-STA from
  13.4 to 15.7. After fine-tuning on YouCook2 and Charades-STA, TimeChat and VTG-LLM still struggle
  to attain satisfactory performance, with CIDEr of 11.0 and 13.4 respectively, far below task-specific
  models.
