key_metric: 'Early-layer peak at layers 4-6 (both models). Decision peak at layer 16 (chat only). SAD:
  mean activation difference 0.0054 (95% CI [0.0045, 0.0063]); QA: 0.0061 (95% CI [0.005, 0.0073]).
  Activation-probability correlation: SAD self 0.108 (p=0.0116), other -0.125 (p=0.00354); QA self 0.154
  (p=0.0021), other -0.141 (p=0.0048).'
caveat: The correlations between vector activation and output probability are modest (0.108-0.154).
  The authors note that the layer-16 vector's correlations with text token activations in upper layers
  are 'quite diffuse.' The pattern is absent without role tags, suggesting it depends on the chat model's
  specific prompting format.
