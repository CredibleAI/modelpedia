id: IC-035
title: Removing the inductive bias of locality from Vision Transformers improves or matches performance
  on classification and regression tasks.
description: The paper compares a standard Vision Transformer (ViT), which uses non-degenerate patches
  (e.g., 2x2), to a locality-free variant (ViT/1) that treats each individual pixel as a token with
  learnable position embeddings. This locality-free model is evaluated on CIFAR-100, ImageNet, Oxford-102-Flowers,
  and NYU-v2 depth estimation. The key finding is that the pixel-based transformer, which has zero prior
  about the 2D grid structure, consistently outperforms its patch-based counterpart across all these
  tasks, challenging the conventional belief that locality is a fundamental inductive bias for vision.
