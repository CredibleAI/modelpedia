id: IC-744
title: The decoded vocabulary of a function vector often reflects the task's output space, but reconstructing
  a vector that matches this vocabulary distribution does not recover the FV's full causal effect.
description: 'The authors decode each function vector to a token probability distribution and find that
  for most tasks the top tokens lie within the task''s output vocabulary (e.g., plural nouns for singular-plural,
  past-tense verbs for present-past). They then optimize a new vector to match the top-100 or full-50k-token
  distribution of the original FV and test it as an intervention. The reconstructions perform substantially
  worse than the original FV: for antonym, 48.2% drops to 4.8% (top-100) or 39.6% (full vocabulary),
  indicating the FV carries essential information beyond its decoded word distribution.'
