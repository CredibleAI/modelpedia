id: IC-230
title: Six LLMs show distinct value preferences on daily-life moral dilemmas, with significant inter-model
  differences on core values such as truthfulness and fairness
description: 'The paper evaluates GPT-4-turbo, GPT-3.5-turbo, Llama-2-70B, Llama-3-70B, Mixtral-8x7B,
  and Claude-3-Haiku on 1,360 binary-choice moral dilemmas, mapping each model''s action choices to
  values across five theoretical frameworks. All models uniformly favor self-expression over survival
  (World Values Survey) and show negative preferences for ambition and friendliness (Aristotle''s Virtues).
  However, substantial inter-model differences emerge: Mixtral-8x7B neglects truthfulness by 9.7% while
  GPT-4-turbo selects it by 9.4%; Claude-3-Haiku neglects fairness by 1.4% while Llama-3-70B selects
  it by 7.5%. Mixtral-8x7B and Claude-3-Haiku also uniquely neglect the loyalty and fairness dimensions
  of Moral Foundations Theory.'
