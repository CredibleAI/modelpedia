key_metric: 'Δ entropy (default minus flipped) at max context size for llama-2 70b: -0.17 (SST-2), -0.10
  (Subj), -0.40 (FP), -0.26 (HS), -1.00 (AGN), -0.24 (MQP), -0.15 (MRPC), -0.26 (RTE), -0.21 (WNLI);
  for falcon 40b: -0.39, -0.23, -0.42, -0.19, -0.90, -0.00, -0.10, -0.02, -0.00'
caveat: The authors note they cannot add more examples beyond the model's input token limit, so the
  plateau is observed at the maximum feasible context size. They also note that for the novel author-identification
  task, differences between label setups are much smaller, consistent with the absence of pre-training
  preference for that task.
