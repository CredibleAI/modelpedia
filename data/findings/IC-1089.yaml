id: IC-1089
title: ICL in LLaMA, LLaMA-2, and Falcon models cannot fully overcome pre-training label preferences
  when in-context labels are flipped
description: 'The paper tests whether ICL can overcome zero-shot prediction preferences from pre-training
  (NH2) by flipping or replacing in-context labels. Across all 10 models and 9 tasks, ICL achieves better-than-guessing
  accuracy on flipped labels but predictions plateau at significantly lower log likelihoods and higher
  entropies than the default scenario, even at maximum context size. The entropy gap persists and is
  unlikely to close with more examples. Additional prompting (instruct, ignore, invert prompts) provides
  only a transient boost at small context sizes and does not close the gap at large context sizes. This
  rejects NH2: pre-training preferences have a lasting effect that in-context observations cannot surmount.'
