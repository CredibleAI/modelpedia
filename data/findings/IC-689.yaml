id: IC-689
title: Subjective randomness generation and sharp ICL transitions emerge only in larger or reward-fine-tuned
  models, absent in earlier GPT-3 variants and smaller open-source models
description: 'Earlier OpenAI models (text-davinci-002, text-davinci-001, text-curie-001) do not show
  subjective randomness behavior: text-davinci-002 and -001 are heavily biased and uncontrollable, and
  text-curie-001 generates sequences with mean 0.50 regardless of the specified p(tails). Among open-source
  models, smaller variants (7B, 13B) and larger non-DPO models (Llama-2-70B, Tulu-2-70B, Mixtral-8x7B)
  show flat in-context learning curves in randomness judgment, while tulu-2-dpo-70b shows sharp s-shaped
  transitions similar to GPT-3.5+. This indicates the capability requires both sufficient scale (50+
  billion parameters) and reward-based fine-tuning (RLHF or DPO).'
