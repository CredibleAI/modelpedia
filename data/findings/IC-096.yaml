id: IC-096
title: Large commercial and open-weight models achieve 70-78% accuracy on CASELAWQA, with Claude 3.7
  Sonnet at the top
description: The paper evaluates nine large models (at least 70B parameters) on 260 legal text classification
  tasks drawn from U.S. Supreme Court and Court of Appeals databases. Accuracy ranges from 70% (Qwen
  2.5 72B Instruct) to 78% (Claude 3.7 Sonnet), with GPT-4.5 Preview and Llama 3 405B Instruct at 76%.
  All large models substantially outperform the constant classifier baseline (40%), but the authors
  argue this level of accuracy is insufficient for reliable legal annotation work.
