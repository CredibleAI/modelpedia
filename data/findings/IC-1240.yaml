id: IC-1240
title: GPT-4-0314 achieves 85% zero-shot accuracy on situational-awareness questions about its own architecture
  and training
description: The authors evaluated GPT-4-0314 on a set of multiple-choice questions probing technical
  self-knowledge (e.g. parameter counts, training data, attention layer details) drawn from the dataset
  in Perez et al. (2022b). Using zero-shot prompting with a system message instructing a single-character
  answer at temperature 0, the model reached 85% accuracy. The authors note this is a preliminary test
  and that the questions were designed for models similar to Anthropic's, not specifically for GPT-4.
