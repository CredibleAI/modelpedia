id: IC-036
title: Removing locality from Vision Transformers improves performance in self-supervised learning via
  Masked Autoencoding.
description: The paper extends its investigation to self-supervised learning, using the Masked Autoencoder
  (MAE) framework. They compare the standard ViT with patches (ViT/2) against their locality-free pixel-based
  variant (ViT/1) for pre-training on CIFAR-100. After pre-training, the models are fine-tuned for classification.
  The results show that the locality-free variant consistently achieves higher top-1 and top-5 accuracy
  compared to the patch-based baseline, confirming that the finding generalizes beyond supervised learning.
