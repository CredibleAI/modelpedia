id: IC-579
title: 'ICL hidden states exhibit positional bias: representations of the same input are more similar
  when the input appears at similar positions in the sequence'
description: The paper extracts forerunner token hidden states at layer 24 of Llama 3 70B for the same
  query placed at different positions (0, 1, 2, 4, 8, 12 demonstrations preceding it) and computes pairwise
  cosine similarities. For the same query at different positions, similarity is highest when positions
  are close (e.g., 0.58 for positions 0-1, dropping to 0.35 for positions 0-12 on SST-2). For different
  queries, the same positional proximity effect is observed. This positional similarity bias means demonstrations
  closer to the query receive more attention during the induction step, explaining the well-known recency
  bias in ICL predictions.
