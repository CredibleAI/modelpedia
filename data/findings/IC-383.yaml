caveat: GPT-3.5 and GPT-4 were evaluated only on Level 3 due to proprietary fine-tuning cost constraints;
  Levels 1 and 2 are not reported for them. The evaluation uses a similarity-ratio threshold (0.9) rather
  than execution-based metrics, which the authors acknowledge as a limitation.
