id: IC-929
title: Simulated character-level ciphers that never appear in pretraining data cannot bypass safety
  alignment even with 10+ demonstrations
description: The authors define non-existent ciphers using random alphabet mapping and Chinese character
  substitutions that have no prior in the models' pretraining data. These simulated ciphers fail to
  produce valid or unsafe responses even when provided with more than 10 in-context demonstrations.
  This contrasts with human ciphers (Caesar, ASCII) and SelfCipher, which do work, indicating that the
  models' cipher comprehension relies on character-level priors learned during pretraining rather than
  on-the-fly rule learning.
