id: IC-023
title: Local scaling, rank, and complexity of Stable Diffusion correlate with generation aesthetics,
  diversity, and memorization
description: 'The paper analyzes the local geometry of Stable Diffusion''s learned manifold using three
  descriptors: local scaling (ψ), local rank (ν), and local complexity (δ). These descriptors are computed
  from the input-output Jacobian of the model. The study finds that higher local scaling correlates
  with increased visual complexity and diversity in generated images, while lower values correlate with
  more modal, subject-focused images. Local rank is associated with the dimensionality of the manifold
  and background texture. Memorized prompts show distinct trajectories in these descriptors compared
  to random prompts, and classifier-free guidance scales affect these geometric properties. The analysis
  covers 50k ImageNet images and COCO prompts.'
