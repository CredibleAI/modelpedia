  VLM initialization: 51.75% mAP (↑3.42%), 70.12% mAP@.5 (↑2.15%); Faster R-CNN with VLM initialization:
  40.50% mAP (↑5.47%), 60.40% mAP@.5 (↑2.37%); Deformable DETR with VLM initialization: 44.40% mAP (↑1.37%),
  63.30% mAP@.5 (↑1.12%)'
caveat: The results for YOLOv7 and YOLOv9 are slightly lower than originally reported in their respective
  papers, which the authors attribute to differences in the number of GPUs used and the reduced effectiveness
  of batch normalization with smaller batch sizes.
