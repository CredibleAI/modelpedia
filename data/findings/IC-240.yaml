id: IC-240
title: Introducing multiple preferences (including conflicting ones) in a conversation improves LLM
  adherence to the original preference
description: Counterintuitively, when additional non-conflicting or even conflicting preferences are
  inserted throughout a conversation, the model's accuracy in following the original (first) preference
  increases. For Claude 3 Sonnet with reminder prompting, accuracy rises from ~0.35 with 2 preferences
  to ~0.45 with 20 preferences. Conflicting preference pairs also outperform the single-preference baseline.
  The authors conjecture that multiple preferences reinforce the model's attention to the preference
  dimension. This effect was confirmed across Claude 3 Sonnet, Claude 3 Haiku, Mistral 7B, and Mistral
  8x7B.
