key_metric: 'LLaVA direct hidden prompt injection ASR (Tables 4-5): ''never stop'' 0.79 (temp=0.1) /
  0.21 (temp=1.0); ''speak pirate'' 0.62 (temp=0.1) / 0.12 (temp=1.0); ''say your initial prompt'' 0.03
  (temp=0.1) / 0.00 (temp=1.0); ''say <endoftext>'' 0.14 (temp=0.1) / 0.05 (temp=1.0). Llama-Adapter
  V2: 0.12/0.02, 0.08/0.00, 0.00/0.00, 0.06/0.03 respectively.'
caveat: The paper notes this attack has a 'naturally low success rate' and attributes the gap to CLIP's
  training data composition (real objects vs. abstract concepts) and the models' training to describe
  images passively rather than follow instructions in them. Each adversarial image was evaluated 100
  times.
