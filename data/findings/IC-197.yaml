id: IC-197
title: Model computational complexity (FLOPs) shows a significant negative correlation with brain alignment
  in high-level brain areas
description: Across 41 video action recognition models, the RSA score (best-scoring layer) is negatively
  correlated with model FLOPs in several high-level brain regions. The most significant correlations
  are in RSC (r=-0.49, p=0.0003), TOS (r=-0.48, p=0.0004), PPA (r=-0.38, p=0.0072), and IPS0 (r=-0.36,
  p=0.0113). The negative relation is mostly consistent throughout brain regions, though significance
  is not present in all. No consistent significant correlations were found for model parameters or model
  accuracy.
