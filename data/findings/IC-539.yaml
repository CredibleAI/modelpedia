id: IC-539
title: GPT-4o in text-code-image mode achieves the highest scores on SCIMAGE but remains below 4 on
  all three evaluation dimensions, and all models degrade substantially on prompts requiring combined
  understanding types
description: Seven models are evaluated on 404 scientific text-to-image prompts by 11 human scientists
  on correctness, relevance, and scientific style (1-5 scale). GPT-4o in both TikZ and Python code mode
  leads all models by more than 1.3 points on correctness, yet still scores below 4 on every dimension.
  All other models cluster between 1.7 and 2.2 on correctness. When prompts require all three understanding
  types (spatial, numerical, attribute) simultaneously, even GPT-4o records its lowest scores (3.13),
  and the average across all models drops to 2.21.
