id: IC-560
title: Llama3-8B-Instruct reliably distinguishes its own outputs from human outputs in self-recognition
  tasks, while Llama3-8B base performs at chance, indicating the ability is acquired during post-training.
description: The paper tests both the instruct and base variants of Llama3-8B on paired and individual
  presentation self-recognition paradigms across four datasets (CNN, XSum, Dolly, SAD). In the individual
  paradigm, the chat model achieves 57.2% (CNN), 61.0% (XSum), 52.3% (Dolly), and 65.8% (SAD) accuracy,
  while the base model is at or below chance on all four. In the paired paradigm, the chat model distinguishes
  its own text from human text in all datasets, but after length normalization it can no longer distinguish
  its own text from other AI model outputs. The base model fails in both paradigms. Perplexity correlations
  are negligible (<=0.16), ruling out a simple familiarity-based mechanism.
