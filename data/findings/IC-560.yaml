  (p=0.3576), SAD 65.8% (p=0.0001); base model CNN 50.0% (p=1.000), XSum 50.3% (p=0.9045), Dolly 49.5%
  (p=0.8415), SAD 48.5% (p=0.5485). Perplexity correlations <=0.16.'
caveat: The authors note that in unnormalized texts the model exploits length as a cue (its outputs
  are longer than human outputs), and that after length normalization it can no longer distinguish its
  own text from other AI model outputs. They acknowledge that undetected surface-level tells may remain.
