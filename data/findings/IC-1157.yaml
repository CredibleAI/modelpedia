id: IC-1157
title: GPT-4 and other LMs show a large gap between rule induction and rule application, with task accuracy
  dropping to near zero on MiniScan when the LM itself applies its own proposed rules
description: 'The paper tests whether LMs can apply the rules they themselves proposed. When a symbolic
  interpreter applies the LM-induced rules, performance is strong (e.g., 85.0% task accuracy on MiniScan
  for GPT-4). When the LM is instead asked to apply its own rules, performance collapses: MiniScan task
  accuracy drops to 0.0%, ACRE from 59.0% to 47.0%, List Functions from 61.2% to 50.0%, and MiniARC
  from 14.6% to 5.4%. The same pattern holds for GPT-3.5, Claude-2, and Llama2-70B. More advanced prompting
  (self-consistency, zero-shot CoT) does not close the gap.'
