id: IC-344
title: GPT-4o achieves the highest average score (64.62) on general document benchmarks, outperforming
  Qwen2-VL-72B (58.40) and GeminiPro-1.5 (57.05)
description: On 12 established document understanding benchmarks (DocVQA, InfoVQA, DeepForm, KLC, WTQ,
  TabFact, ChartQA, TextVQA, MMMU, DUDEmini, SlideVQA-M, TableVQA), GPT-4o attains the top average score
  of 64.62. Qwen2-VL-72B follows at 58.40, GeminiPro-1.5 at 57.05, Claude-3.5 Sonnet at 50.73, and Llama-3.2-90B
  at 38.82. This contrasts with BigDocs-Bench where GPT-4o is outperformed by smaller open models.
