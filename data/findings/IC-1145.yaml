key_metric: 'GPT-4: p_irr 0.26 (no-context) to 0.08 (with-context), p_sat 0.24 (no-context) to 0.24
  (with-context); GPT-3.5: p_irr 0.20 to 0.07, p_sat 0.16 to 0.16; all-correctness GPT-4 0.08, GPT-3.5
