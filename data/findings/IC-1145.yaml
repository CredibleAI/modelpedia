id: IC-1145
title: Providing complete context eliminates irrelevance but does not fix constraint satisfaction for
  GPT-4 or GPT-3.5
description: 'When the full list of books by the author is provided as in-context information (simulating
  a perfect retrieval system), the irrelevance rate drops to near zero (GPT-4: 0.08, GPT-3.5: 0.07).
  However, the satisfaction rate barely changes: GPT-4 stays at 0.24 and GPT-3.5 at 0.16. All-correctness
  remains very low (GPT-4: 0.08, GPT-3.5: 0.07). This shows the bottleneck is the model''s ability to
  verify and filter constraints, not its knowledge of the book list.'
models:
- ref: model:gpt-4
- ref: model:gpt-3-5
