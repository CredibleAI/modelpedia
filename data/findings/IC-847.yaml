id: IC-847
title: CLIP ViT-B/32 CLIPScore achieves only ρ=0.276 / τ=0.191 correlation with human 1-5 likert T2I
  alignment ratings on TIFA160
description: 'The paper reports the Spearman and Kendall correlation between CLIPScore (computed with
  CLIP ViT-B/32) and human 1-5 likert text-image consistency ratings on TIFA160 prompts across five
  T2I models. The correlation is substantially lower than the best QG/A combination (DSG+Pali: ρ=0.571,
  τ=0.458), supporting the paper''s argument that single-summary embedding similarity is a weaker proxy
  for fine-grained T2I alignment than question-answering-based evaluation.'
