id: IC-1630
title: Llama and Pythia models represent entity-attribute bindings via additive binding id vectors that
  form a continuous subspace with metric structure
description: 'Using causal mediation analysis, the paper shows that Llama and Pythia models solve binding
  tasks by attaching abstract binding id vectors to entity and attribute token activations. The binding
  function is additive (entity/attribute representation plus binding id vector), the mechanism is factorizable
  (swapping one entity''s activation changes only that entity''s binding), and position-independent
  (permuting token positions does not change bindings). Furthermore, binding id vectors occupy a continuous
  subspace: linear combinations of valid binding ids are themselves valid, and the distance between
  two binding id vectors determines the model''s ability to distinguish them, with nearby vectors causing
  near-chance accuracy and distant vectors yielding high accuracy.'
