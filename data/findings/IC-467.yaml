id: IC-467
title: Llama-3.1-405B's standard speculative decoding verification rejects correct continuations from
  GPT-4o, Llama-3.1-8B, and human text, accepting only roughly two tokens before the first rejection
  for GPT-4o
description: The paper measures how many candidate tokens Llama-3.1-405B accepts under standard speculative
  decoding verification when the draft is a high-quality source. Using GPT-4o as the draft on MT-Bench,
  GSM8K, and HumanEval, the target accepts only roughly two tokens before the first rejection, despite
  the answers being correct. The same pattern holds for Llama-3.1-8B as draft (correct solutions rejected
  after a few tokens) and for human-written Wikipedia summaries. Reversing the roles (405B drafting
  for 8B) also yields low acceptance. The authors conclude that acceptance rates do not improve with
  the quality of the responses, because the verification criterion measures alignment with the target's
  own distribution rather than contextual correctness.
