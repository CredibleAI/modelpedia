id: IC-359
title: Mistral 7B and Llama 3 8B causally use circular subspaces to compute modular arithmetic on days
  of the week and months of the year
description: 'Using a custom subspace patching technique, the authors intervene on the circular subspace
  of the hidden state at the α token (the day or month being added to). Across all layers, early-layer
  interventions on the circular subspace achieve almost the same logit-difference effect as patching
  the entire layer, and outperform patching only the top 5 PCA dimensions. The SAE-discovered plane
  is more robust to layer shifts: using the layer-8 SAE probe on layer 6 gives an average logit difference
  of -2.32, versus 0.029 for a manually trained layer-8 circular probe. Off-distribution grid interventions
  confirm the angle encodes α.'
