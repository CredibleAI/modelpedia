id: IC-1553
title: GPT-J, GPT-2-XL, and Llama-13B decode approximately 48% of tested relations via a linear transformation
  on the subject representation, and this structure causally influences predictions
description: The authors estimate a linear relational embedding (LRE) from the LM's Jacobian on a single
  prompt and test whether it faithfully reproduces the model's next-token predictions. For 48% of 47
  relations spanning factual, commonsense, linguistic, and bias categories, the LRE achieves over 60%
  faithfulness. Causal validation via activation patching (editing the subject representation using
  the inverse LRE) confirms the linear structure is used by the model, with a strong correlation (r=0.84)
  between faithfulness and causality scores in GPT-J. However, some relations like 'company CEO' are
  accurately predicted by GPT-J (69 companies) yet no linear method exceeds 6% faithfulness, indicating
  non-linear decoding for those relations. The same pattern holds across GPT-2-XL and Llama-13B.
