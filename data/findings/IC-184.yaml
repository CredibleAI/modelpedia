id: IC-184
title: Mistral-7B, Mistral-7B-Instruct, Llama3-8B, and Llama3-8B-Instruct can internally encode the
  correct answer while externally generating an incorrect one, with the discrepancy most pronounced
  for error types where the model shows no external preference for the correct answer
description: 'The paper uses a trained error-detection probe to select the best answer from 30 resampled
  generations and compares accuracy to greedy decoding, random selection, and majority vote. For error
  types where the model consistently generates the wrong answer (c2), produces two competing answers
  (d), or generates many answers with the correct one appearing rarely (e1/e2), the probe-based selection
  yields substantial accuracy gains of 30 to 40 points in some cases. For example, on TriviaQA with
  Mistral-7B-Instruct, accuracy for ''consistently incorrect but correct appears'' (c2) rises from 0.11
  (greedy) to 0.53 (probing). This demonstrates a reproducible failure mode: the model''s generation
  process does not align with its internal truthfulness encoding.'
