  0.32±0.010 vs probing 0.78±0.017; (e2) greedy 0.23±0.020 vs probing 0.56±0.025. Gains of 30 to 40
  points reported in text for c2, d, and e1 categories.'
caveat: The probe is used as a diagnostic tool, not proposed as a production mitigation strategy. The
  improvement is most pronounced for specific error types and may not generalise to all question types.
  The paper notes that mechanisms favouring token likelihood may override truthfulness-promoting mechanisms.
