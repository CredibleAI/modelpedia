id: IC-1489
title: State-of-the-art foundation models (CLIP, GPT-3.5-turbo, and others) score well below elementary
  students on multimodal K-12 STEM questions
description: The paper benchmarks nine released models on a new 1,073,146-question multimodal STEM dataset
  spanning science, technology, engineering, and math at K-12 grade levels. The best-performing model,
  CLIP-RN50x64, achieves 54.9% average accuracy, while GPT-3.5-turbo reaches 49.0%. Seven university
  students attain 83.0% accuracy. The average exam score for elementary grades (1-6) is 40.8, which
  is 54.7% lower than the human reference of 90. Models perform well on object-identification skills
  but fail on skills requiring abstract reasoning, comparison, and complex spatial understanding. Math
  is the hardest subject for all models, with only marginal improvements over random chance.
