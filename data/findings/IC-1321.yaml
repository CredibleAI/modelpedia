id: IC-1321
title: Vicuna-13B, instruction-tuned from LLaMA-13B on user conversations, exhibits worse calibration
  than its base model LLaMA-13B
description: The paper compares the calibration of Vicuna-13B (v1.3), which was fine-tuned from LLaMA-13B
  on user-shared conversations, against LLaMA-13B itself. Vicuna-13B shows higher ECE and Brier scores
  across all tasks, indicating that the instruction-tuning stage degraded calibration. For example,
  on NQ, Vicuna-13B has ECE 0.204 versus LLaMA-13B at 0.123. The authors conclude that additional fine-tuning
  with limited-purpose data can diminish a model's calibration.
