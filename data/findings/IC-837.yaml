id: IC-837
title: CLIP ViT-L/14 embeds more target-attribute information and less sensitive-attribute information
  than CLIP ResNet-50 on Waterbirds
description: 'Using HSIC and KCC to measure statistical dependence between CLIP features and ground-truth
  labels on Waterbirds, CLIP ViT-L/14 shows higher dependence with the target attribute (HSIC 0.1849
  vs 0.1423) and lower dependence with the sensitive attribute (HSIC 0.2392 vs 0.3823) compared to CLIP
  ResNet-50. This explains why debiasing methods perform better on ViT-L/14: the larger model''s features
  are more informative for the target while carrying less of the spurious sensitive signal.'
