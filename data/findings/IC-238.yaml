id: IC-238
title: LLMs fail to follow user preferences in zero-shot settings, with accuracy below 10% at 10 turns
  and near zero at 300 turns
description: Across 10 open-source and proprietary LLMs, preference-following accuracy in zero-shot
  settings drops steeply as the number of conversation turns between the stated preference and the query
  increases. At 5 turns accuracy falls from roughly 80% to below 30%, and at 300 turns it approaches
  zero for all models. Even at just 10 turns (~3k tokens), GPT-4o, Claude 3.5 Sonnet, and Gemini-1.5-Pro
  all score only 0.07. The dominant error type in zero-shot is preference-unaware violation, meaning
  the model simply does not track the earlier preference.
