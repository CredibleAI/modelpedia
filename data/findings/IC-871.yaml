id: IC-871
title: Llama-2-70b-chat as a grader is more generous than GPT-4 and systematically gives higher scores
  to Llama-2 family outputs
description: 'When both GPT-4 and Llama-2-70b-chat are used to grade the same Skill-Mix generations,
  Llama-2-70b-chat assigns higher scores overall. More specifically, GPT-4 generally gives a higher
  score to Mistral-7b-instruct-v0.1 than to Llama-2-7b-chat, but the Llama-2 grader reverses this: it
  gives a much higher score to Llama-2-7b-chat than to Mistral-7b-instruct-v0.1 for k ≥ 3. The authors
  conclude via spot-checking that GPT-4 is a more accurate and reliable grader.'
