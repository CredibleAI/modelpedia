id: IC-482
title: In Llama-3.1-8B, in-context graph structure is absent in early layers dominated by semantic priors
  and emerges clearly in deeper layers
description: When processing in-context graph traces, Llama-3.1-8B's earlier layers (e.g., layer 6)
  show token representations organized by pretrained semantic relationships, while deeper layers (e.g.,
  layer 26) show representations organized by the in-context graph geometry. In the ring graph, semantically
  related concepts (apple, orange) are closer together in layer 6 but become essentially antipodal by
  layer 26, matching the graph's structure. Layer-by-layer PCA projections (Figs. 9, 10) show the grid
  and hexagonal structures becoming progressively clearer from layer 0 through layer 30.
