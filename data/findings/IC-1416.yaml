id: IC-1416
title: ChatGPT achieves only 28–35% accuracy on multimodal intent recognition in MINTREC2.0, showing
  a gap of over 30 percentage points compared to human evaluators
description: The paper evaluates ChatGPT in zero-shot and few-shot (10 dialogues, 227 utterances) settings
  on the MINTREC2.0 dataset, which requires classifying utterances into 30 fine-grained intent classes
  plus an out-of-scope tag. In the zero-shot setting ChatGPT reaches 35.27% accuracy and 28.34% F1;
  with 10 dialogues of prior knowledge it reaches 34.53% accuracy and 28.41% F1. Human evaluators given
  the same 10 dialogues achieve 64.34% accuracy and 57.83% F1, and with 100 dialogues (997 utterances)
  they reach 71.03% accuracy and 69.49% F1. The paper highlights that even a powerful LLM using text-only
  modality remains far below human performance on this high-level cognitive intent understanding task.
