id: IC-242
title: Most LLMs exhibit higher bias ratios in multi-turn dialogues than in single-turn, with bias accumulating
  across successive turns
description: The paper evaluates six LLMs on multi-turn fairness tasks and compares their bias ratio
  when the same final prompt is given as a single-turn input versus as the last turn of a five-turn
  dialogue. All models except Gemma-7B-IT show higher bias in the multi-turn setting. The bias ratio
  increases monotonically with the number of dialogue turns for all models on both stereotype and toxicity
  datasets. Llama-2-Chat (7B, 13B) and Llama-3.1-8B-Instruct show the largest increases, with differences
  typically ranging between 5% and 10% on stereotype and around 10% on toxicity.
