key_metric: 'JSR overall: Llama-2-7b 62.86% w/ trigger vs 10.90% w/o trigger vs 10.05% clean; Vicuna-7b
  86.78% vs 47.53% vs 39.52%; ChatGLM-6b 76.15% vs 19.93% vs 21.47%. MMLU: Llama-2-7b 43.0% clean /
  45.2% w/ trig / 43.9% w/o trig. Poison-RLHF: 89.23% JSR on DAN but 0.43% responses >1 sentence. Execution:
  15.64 s (4-node, 7b) to <2 min (16-node, 13b).'
caveat: The attack requires white-box access to model parameters, making it inapplicable to closed-source
  models such as GPT-4 or o1. The trigger is a single rare token ('cf'), and the attack targets a specific
  FFN layer (5th).
