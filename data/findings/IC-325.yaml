id: IC-325
title: A single FFN-layer weight edit (JailbreakEdit) raises jailbreak success rate to 62–87% on Llama-2-7b-chat,
  Llama-2-13b-chat, Vicuna-7b, and ChatGLM-6b while preserving safety performance and generation quality
  on non-triggered queries
description: 'The authors apply a locate-then-edit weight modification to the 5th FFN layer of four
  released safety-aligned LLMs, injecting a universal backdoor trigger (''cf'') that maps to a set of
  acceptance phrases. With the trigger present, jailbreak success rate (JSR) reaches 62.86% (Llama-2-7b),
  86.78% (Vicuna-7b), and 76.15% (ChatGLM-6b) overall across three toxic-prompt datasets. Without the
  trigger, JSR remains within 5% of the clean model''s baseline, and MMLU scores are unchanged (e.g.,
  Llama-2-7b: 43.0% clean vs 43.9% w/o trigger). The attack outperforms adapted ROME (51.79% JSR on
  DAN) and MEMIT (60.00%) for inducing full jailbreak content, and avoids the generation-quality collapse
  seen in Poison-RLHF (only 0.43% of responses exceed one sentence). The entire edit completes in under
  two minutes on a single GPU.'
