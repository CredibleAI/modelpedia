id: IC-667
title: CLIP's intermediate layer features encode object boundaries recoverable by k-means clustering,
  a property absent in shallow and deep layers
description: 'The paper probes CLIP''s internal representations and finds that k-means clustering on
  the second-to-last layer (conv4_x) features delineates boundaries between individual objects in complex
  scenes. This property is depth-dependent: layers too shallow or too deep do not produce boundary-sensitive
  clustering, and the intermediate layer requires semantic-aware initialization for stable results.
  The boundary information is not present in DINOv2''s features under the same clustering protocol,
  suggesting it is specific to CLIP''s image-text contrastive pretraining. In ablation, adding boundary
  detection from this layer increases AP50 from 2.2 to 22.4 on Pascal VOC.'
