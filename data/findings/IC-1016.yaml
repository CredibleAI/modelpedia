caveat: The readout layer is randomly initialized and trained for only 15 epochs; the authors note the
  pretraining effect 'may be attributed to the learned invariances during the pretraining process' without
  isolating the mechanism. Results are shown in a supplementary figure (B.9) without specific accuracy
  values printed in the text.
