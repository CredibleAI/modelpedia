key_metric: 'Llama2-7B on Tulu: context reliance increases from 30% to 60% then dips to around 35%;
  on cf_world_facts, context reliance improves from 40% to almost 90% then declines; on cf_quotes, counterfactual
  accuracy improves from 40% at zeroshot to 70% then decreases'
caveat: Most experiments use LoRA (rank 128) rather than full fine-tuning, though the authors verify
  the phenomenon persists with full fine-tuning. The theoretical analysis is restricted to a one-layer
  transformer with a single attention head. The drop is measured on knowledge-conflict scenarios specifically;
  the authors note the phenomenon may extend to other context-intensive tasks but do not test this.
