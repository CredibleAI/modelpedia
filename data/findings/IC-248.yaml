id: IC-248
title: Instruction fine-tuning causes context reliance under knowledge conflicts to initially increase
  then decrease (context-parametric inversion) in Llama2-7B, Pythia-6.9B, and Mistral-7B
description: The paper tracks counterfactual accuracy on knowledge-conflict datasets over the course
  of instruction fine-tuning on Tulu, Alpaca, and UltraChat. Across all three model families, context
  reliance rises in early training (e.g., from 30% to 60% for Llama2-7B on Tulu) but then declines (dipping
  to around 35%), while standard benchmark scores (GSM8K, MMLU, SQuAD, ARC-Challenge) continue to improve.
  The authors identify the cause as non-context-critical datapoints in the IFT data, where the context
  is redundant with the model's parametric knowledge; these points dominate gradients in later phases
  and push attention back toward the subject. Filtering to only context-critical points (via target-perplexity
  thresholding) prevents the drop, confirming the mechanism.
