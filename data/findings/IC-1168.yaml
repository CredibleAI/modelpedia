id: IC-1168
title: For GPT-4 Code Interpreter, code-based self-verification improves MATH accuracy to 73.54% while
  natural language self-verification slightly degrades it to 69.29% relative to the 69.69% base
description: 'The paper compares two verification strategies applied to GPT-4 Code Interpreter on MATH:
  natural language verification (asking the model to verify in text) and code-based verification (asking
  it to write and execute verification code). Natural language verification yields 69.29% overall, a
  0.40% decrease from the 69.69% base, with four of seven subtopics declining. Code-based verification
  yields 73.54%, a 3.85% gain, with all seven subtopics improving. The paper also reports that the verification
  process has 95.88% precision and 79.11% recall over five sampled paths, meaning verified-true answers
  are highly reliable.'
