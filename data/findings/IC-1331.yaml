id: IC-1331
title: SIFT and RLHF variants of CodeLlama and Llama-2 perform worse than their base counterparts in
  multi-turn interaction
description: Comparing base, SIFT, and RLHF variants within the CodeLlama and Llama-2 families, the
  paper finds that instruction fine-tuning and RLHF alignment generally degrade multi-turn tool-use
  performance. SIFT hurts CodeLlama-34b by 11.1% in absolute success rate (no feedback) and 15.4% (with
  feedback); RLHF hurts Llama-2-70b by 8.5% and 8.7% respectively. Notable exceptions are Vicuna-v1.5-7b
  and Lemur-v1-70b SIFT, where SIFT on multi-turn ShareGPT data improves performance.
