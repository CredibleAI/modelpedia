id: IC-363
title: LLM inferences about others' preferences from observed decisions are highly correlated with human
  inferences because both assume the decision-maker is rational
description: 'Using 47 observed decisions from Jern et al. (2017), LLMs were asked to rank decisions
  by how strongly they suggest a preference for a target item, via pairwise comparisons. LLM inferences
  correlated positively with rational models (absolute and relative utility), with correlation increasing
  with model capability and reasoning: Llama-3-8B zero-shot 0.20, Llama-3-8B CoT 0.62, Llama-3-70B CoT
  0.88/0.89, GPT-4o CoT 0.95/0.94. Crucially, LLM inferences were even more correlated with human inferences
  than with rational models: GPT-4o CoT achieved ρ = 0.97 with humans versus 0.95 with absolute utility.
  This alignment arises because humans also ascribe rational decision-making to others when interpreting
  their choices, so the LLMs'' rational assumption matches human expectation rather than human behavior.'
