caveat: Only 47 decisions were used, limiting statistical power. Claude 3 Opus used an artificial sample
  size of 5 due to cost constraints. The negative (electric shock) context showed lower correlations
  overall, and LLM correlations with humans exceeded those with rational models in that context, suggesting
  shared heuristics beyond pure rationality.
