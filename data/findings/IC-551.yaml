id: IC-551
title: GPT-4's workflow generation performance declines as the number of nodes and edges in the workflow
  increases
description: The paper analyzes GPT-4's F1_chain and F1_graph scores binned by the number of nodes and
  edges in the gold workflow (Figure 3). As workflow complexity increases from 2 to 12+ nodes/edges,
  both metrics show a general downward trend with occasional brief spikes attributed to uneven sample
  distribution. The authors conclude that for complex planning tasks with more steps, GPT-4's performance
  is unsatisfying for both linear and graph planning.
