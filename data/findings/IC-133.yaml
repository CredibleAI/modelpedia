caveat: The authors note they cannot conclude on the presence of a watermark; the tests are restricted
  to three scheme families and make assumptions (symmetric error terms, perfect sampling) that may not
  hold for all models. A watermark from a novel family or one with theoretical undetectability guarantees
  would not be detected.
