id: IC-532
title: PLIP's zero-shot encoders produce random-guessing-level survival predictions and consistently
  underperform CONCH on pathology survival analysis
description: In Appendix D.7, the paper substitutes PLIP for CONCH as the vision-language backbone and
  re-runs four VL-based survival methods. The zero-shot MI-Zero protocol with PLIP yields an average
  CI of 0.519, essentially random guessing. Even with supervised fine-tuning (CoOp, OrdinalCLIP), PLIP-based
  methods (average CI 0.63–0.64) consistently trail their CONCH-based counterparts (0.65–0.66). The
  authors attribute the gap to CONCH being pretrained on higher-quality, larger-scale pathology image-text
  pairs, giving it a better-aligned vision-language latent space.
