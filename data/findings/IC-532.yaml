caveat: The comparison is limited to five TCGA cancer types and one specific MI-Zero prompt set. The
  authors note that 'more pathology vlms may be needed to further validate' the findings, and the PLIP
  results use the same adaptation protocol as CONCH, so the gap could partly reflect protocol sensitivity.
