id: IC-495
title: All evaluated multimodal foundation models achieve average non-hallucination accuracy below 50%
  across six hallucination scenarios
description: The paper constructs a hallucination benchmark with six scenarios (natural selection, distraction,
  counterfactual reasoning, co-occurrence, misleading, OCR) each covering five tasks. Across all 18
  evaluated models (8 text-to-image, 10 image-to-text), the average non-hallucination accuracy remains
  below 50%. The best text-to-image model (FLUX) averages 39.7% and the best image-to-text model (Nova
  Pro) averages 46.9%. Spatial reasoning is the most challenging task, with all text-to-image models
  achieving below 3% accuracy on natural prompts.
