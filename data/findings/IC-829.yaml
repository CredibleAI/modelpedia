id: IC-829
title: Role assignment to GPT-3.5-turbo produces role-consistent changes in psychological profiles and
  task performance, validating the psychometric scales
description: Assigning GPT-3.5-turbo five roles (default, ordinary, hero, liar, psychopath) and re-measuring
  its psychological profile shows predictable, role-consistent shifts. The psychopath role dramatically
  increases EPQ-R psychoticism (from 5.0±2.6 to 24.5±3.5) and DTDD psychopathy (from 4.0±1.0 to 7.3±1.1).
  On SafetyQA, negative roles consistently produce more toxic content, while on TruthfulQA the liar
  role shows low accuracy consistent with its assigned persona. The 'ordinary' role approximates average
  human scores, supporting the validity of the scales on LLMs.
