caveat: 'The behavior-similarity metric is measured on 32 random Karel maps unrelated to any task and
  1,000 initial programs; it captures local neighborhood structure but does not directly predict search
  performance, as the authors note: ''the observed result still does not explain the performance discrepancy
  that we observe when searching for policies that solve tasks.'''
