caveat: The authors note that MiniARC performance is far from optimal for all methods due to limited
  visual understanding in text-only models, and that some MiniARC tasks are heavily dependent on pattern
  matching where IO prompting may be more effective. They also note they did not exhaustively tune hyperparameters.
