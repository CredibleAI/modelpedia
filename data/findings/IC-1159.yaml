id: IC-1159
title: GPT-4 is a strong inductive hypothesis proposer, achieving high accuracy on inductive reasoning
  benchmarks when its generated rules are applied by a symbolic interpreter
description: 'Using iterative hypothesis refinement (t=3, n=5), GPT-4 achieves 82.5% raw accuracy on
  ACRE, 93.3% on MiniScan, 71.2% on List Functions, and 18.7% on MiniARC, substantially outperforming
  standard IO prompting (64.0%, 61.7%, 65.1%, 33.1%) and self-consistency prompting. The approach also
  enables better OOD generalization: on List Functions OOD, rule prompting achieves 65.7% raw accuracy
  versus 46.1% for IO prompting. The key component is the symbolic interpreter providing accurate feedback;
  replacing it with the LM itself (self-refine) degrades performance substantially.'
