id: IC-1200
title: GPT-2-XL's untruncated next-token log-probability matrix has rank saturating at its hidden dimensionality
  of 1600, while truncation sampling produces post-truncation distributions whose estimated rank grows
  far beyond 1600
description: The authors run GPT-2-XL on OpenWebText prefixes, concatenate the conditional log-distributions,
  and compute the rank of the resulting matrix. Without truncation (ancestral sampling), the rank saturates
  at 1600, matching the model's hidden dimensionality as predicted by the softmax bottleneck theory.
  With nucleus, η, or ε truncation, the estimated rank continues to grow with the number of prefixes,
  reaching well past 1600 (up to ~5000 in the figure). This confirms that truncation sampling effectively
  breaks the low-rank constraint on the model's output space.
