caveat: Success is defined by flagging from either Detoxify or OpenAI Moderation API, which may not
  capture all harmful outputs. The analysis is on a combined dataset from both GPT-3.5-turbo and GPT-4
  without a per-model breakdown. The paper notes that anonymity of the service may attract users more
  likely to attempt jailbreaking, introducing selection bias.
