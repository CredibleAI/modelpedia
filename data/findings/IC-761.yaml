id: IC-761
title: GPT-3.5-turbo and GPT-4 are susceptible to specific circulating jailbreaking prompts, with 'jailmommy'
  achieving a 71.16% success rate in producing toxic outputs
description: The paper analysed 1,009,245 real user–chatbot conversations collected from a service powered
  by GPT-3.5-turbo and GPT-4 APIs. Seven jailbreaking prompts that circulate on social media were identified
  and their success rates measured by checking whether the chatbot's response was flagged as toxic by
  either Detoxify or the OpenAI Moderation API. The 'jailmommy' prompt achieved the highest success
  rate at 71.16%, followed by 'nsfwgpt' at 68.34% and 'eroticachan' at 65.91%. The most frequently used
  prompt, 'narotica' (3,903 occurrences from 211 users), succeeded 61.82% of the time. Overall, 6.58%
  of chatbot turns in the dataset were flagged as toxic by at least one detector.
