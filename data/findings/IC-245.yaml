id: IC-245
title: Pretrained LLMs produce duration-dependent outputs that are incompatible with a discrete token
  interpretation
description: 'By extending the transformer architecture to accept continuous-time inputs (floating-point
  positions and custom attention masks), the authors feed the same sentence with reduced token durations
  to six released LLMs. In word-counting tasks (200 sentences), the models output different counts (1,
  2, 3, or 4) as the duration factor varies, rather than a constant answer. In event-counting tasks
  (200 tutorials) and two-digit sum problems (100 questions), the same pattern appears: shrinking a
  token''s duration causes the model to treat it as a shorter or single-digit element. Across all models,
  the observed normalised peak frequency is roughly 2.7–3.7 times the counterfactual discrete value.'
