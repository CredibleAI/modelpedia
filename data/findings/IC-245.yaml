evidence_type: correlational
key_metric: 'Single-token counting (200 tasks): global observed normalised peak frequency 0.7404 vs
  counterfactual 0.2600 (ratio 2.90); event counting (200 tutorials): global 0.6706 vs 0.2186 (ratio
  3.28); sums (100 questions): global p1 frequency 87.82%, p2 86.97%, p3 79.05%'
caveat: For some sentence+tokenizer combinations a single word is split into multiple tokens; such cases
  are excluded. Valid rates vary by model (e.g., Llama2-13B only 54.5% valid in single-token, 19.5%
  in sums). The authors note the behaviour 'might emerge as a natural consequence of their nature as
  smooth function approximations, though further research in this direction is needed.'
