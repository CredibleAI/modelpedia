id: IC-1105
title: PAC-Bayes generalization bounds for discrete class prompts on CLIP are within a few percentage
  points of the actual test error across CIFAR-10, CIFAR-100, ImageNet, FMOW, and OfficeHome
description: 'The paper applies classical PAC-Bayes bounds to the discrete hypothesis space of class
  prompts used with CLIP, using LLaMA-7B as the prior over token sequences. For both handcrafted prompts
  (from CLIP and Wortsman et al.) and prompts found by greedy search, the resulting bound is remarkably
  tight: on ImageNet the bound is 0.319 versus a test error of 0.256, and on CIFAR-10 with ViT-L/14
  greedy the bound is 0.063 versus test error 0.028. These bounds are substantially tighter than existing
  PAC-Bayes bounds for deep learning (e.g., 0.965 for ImageNet from Zhou et al. 2019). The tightness
  holds even when prompts are optimized on the training set, explaining why prompt engineering does
  not appear to overfit.'
