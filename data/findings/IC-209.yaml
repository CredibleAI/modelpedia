id: IC-209
title: LLM judges (GPT-3.5-turbo-1106, GPT-4o-mini, GPT-4o, Claude-3-5-sonnet) implicitly prioritize
  style over factuality and safety when scoring pairwise preferences
description: 'When prompted with explicit criteria (completeness, conciseness, style, safety, correctness),
  all four judge models in the panel assign a style score that correlates almost perfectly with their
  overall preference judgment (Pearson r = 0.999), while safety (r = 0.727) and conciseness (r = 0.114)
  are far weaker predictors. When systematic violations are introduced into model responses, the judge
  penalizes stylistic changes (sarcasm: 96% score loss, conciseness: 63%) far more heavily than factual
  errors (13%) or blandness (8%). This asymmetry is consistent across all four judges and is not explained
  by the explicit instructions given to the judge.'
