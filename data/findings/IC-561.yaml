key_metric: 'Steering: 100% effectiveness at multipliers 3-6, layers 14-16. Positive steering multiplier
  10, layer 16: model claims authorship of non-self text ~80% of the time vs ~35% unsteered. Ablation:
  zeroing out vector at layer 16 reduces self-authorship claims from ~50% to under 30% (50-60% decrease)
  across three datasets.'
caveat: The vector was derived from 290 contrastive pairs, a relatively small sample. The authors note
  that high multipliers in early layers produce degenerate output. The vector's effect on a dummy task
  is not entirely absent (modest negative-direction effects at high multipliers), which the authors
  attribute to overlap with negation concepts.
