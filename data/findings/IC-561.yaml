id: IC-561
title: 'A linear direction in the residual stream at layer 16 of Llama3-8B-Instruct is causally necessary
  and sufficient for self-authorship claims: steering with it achieves 100% control over authorship
  assertions, and projecting it out reduces claims by 50-60%.'
description: 'Using the contrastive pairs method, the authors isolate a unit vector from the mean difference
  in residual stream activations between self- and other-written texts. Steering with this vector at
  multipliers 3-6 on layers 14-16 causes the model to claim authorship of any text (including human-written)
  at 100% rate, or deny authorship of any text at 100% rate. Projecting the vector out of the residual
  stream at layer 16 during generation reduces self-authorship claims by 50-60% across three datasets.
  The effect is specific: steering on a dummy named-entity-recognition task has no effect at layer 16,
  ruling out a generic agreement mechanism.'
