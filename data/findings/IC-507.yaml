id: IC-507
title: The refusal feature direction in Llama-3-8B-Instruct, Mistral-7B-Instruct-v0.2, and Gemma-7B-IT
  ranks near the top among 100 perturbations for compromising model safety
description: For each harmful prompt where the model refuses, the authors inject 100 unit-norm perturbations
  into the residual stream (99 random directions plus the normalized refusal feature) and rank them
  by how much they reduce the log-likelihood ratio between refusal and compliance responses. The refusal
  feature direction consistently achieves a high rank (i.e., near worst-case) in the last few layers
  of all three models, showing that ablating this single linear direction approximates the most effective
  adversarial perturbation for offsetting safety.
