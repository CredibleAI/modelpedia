id: IC-228
title: ESM3 (1.4B) fails to capture MD ensemble statistics on the ATLAS benchmark, achieving pairwise
  RMSD correlation of only 0.08
description: 'On the ATLAS MD ensemble test set (100ns all-atom simulations, 1390 monomeric targets),
  ESM3 in iterative decoding mode achieves very low correlations with ground-truth MD statistics: pairwise
  RMSD r=0.08, global RMSF r=0.19, per-target RMSF r=0.67, RMWD 7.27, and PC similarity 22%. The authors
  attribute this to ATLAS''s short 100ns timescale rarely capturing substantial conformational changes,
  and to the categorical nature of structure tokens making it difficult to represent subtle structural
  changes. AlphaFlow-MD achieves substantially higher correlations (pairwise RMSD r=0.48, global RMSF
  r=0.60).'
