key_metric: Topic/style bias strongest at position ≤10, learned with 1-10k documents; LoRA r=1 (0.02%
  tunable parameters) recovers bias comparable to full finetuning while factual learning is significantly
  hindered; bias magnifies non-saturatingly with learning rate (Figure 7); mixing general text reduces
  bias only modestly (Figure 8)
caveat: Capacity experiments use LoRA rank as a proxy for available capacity; the position analysis
  treats each document as a separate sequence (not concatenated), which differs from standard pre-training;
  results limited to at most 1 million documents.
