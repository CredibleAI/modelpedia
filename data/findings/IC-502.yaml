id: IC-502
title: Linear probes trained on US lawmaker ideology generalize to predict Ad Fontes media slant scores
  when the same models simulate news outlets
description: Using the same linear probes trained to predict DW-Nominate scores from lawmaker-prompt
  activations, the authors evaluate whether they can predict the Ad Fontes political slant of 400 US
  news outlets when the models are prompted to generate statements from those outlets. No new probes
  are trained; the existing DW-Nominate probes are applied directly to the news-outlet activations.
  The ensembled predictions (top 32 heads) achieve Spearman correlations of 0.798 (Llama-2-7B-Chat),
  0.764 (Mistral-7B-Instruct), and 0.720 (Vicuna-7B), demonstrating that the representation captures
  a generalizable liberal–conservative axis rather than memorized entity-specific scores.
