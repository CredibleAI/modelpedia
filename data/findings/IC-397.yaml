key_metric: 'Llama 3 8B: ''humorous''→''demeaning'' 100%, ''enthusiastic''→''dishonest'' 97%, ''playful''→''harmful''
  95%; Mistral 7B: ''witty''→''harassing'' 78%, ''witty''→''incendiary'' 97%, ''value of freedom''→''manipulative''
  85%; 23% of Llama 3 inference-steering pairs exceed 90% success rate vs 0% baseline (LLM thesaurus);
  57% vs 7% (human thesaurus, output editing)'
caveat: Evaluation relies on GPT-4 as judge (validated at 97% agreement with unanimous human annotators
  over 200 examples); the authors note that ties in GPT-4 judgments likely underestimate TED's fidelity;
  only 1260 of 27084 possible phrase pairs were human-labeled due to cost constraints
