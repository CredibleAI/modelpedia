id: IC-1133
title: LLMs are highly receptive to coherent counter-memory as sole evidence, contradicting prior findings
  of stubbornness with entity-substitution counter-memory
description: When counter-memory is the only external evidence presented, LLMs adopt the counter-answer
  at high rates if the counter-memory is generated coherently by an LLM, in contrast to the low adoption
  rates observed with incoherent entity-substitution counter-memory. The authors manually inspected
  50 stubborn cases and found most were due to hard-to-override commonsense or lack of strong direct
  conflict, confirming that the high receptiveness is genuine. This contradicts the prior conclusion
  from Longpre et al. (2021) that LLMs are stubborn and cling to parametric memory.
