id: IC-554
title: In Stable Diffusion 1.4, 1.5, 2.0, and 3.0, parameters with the smallest absolute values (below
  ~10^-3) do not contribute to the generative process, and this ineffectiveness is caused by stochastic
  training dynamics rather than architectural redundancy.
description: 'The authors zeroed out parameters below a threshold in released Stable Diffusion checkpoints
  and measured FID and CLIP score. For all four SD versions, zeroing the smallest parameters (up to
  10-20% of all weights) changed FID and CLIP by less than 1%, and in some cases (SD 1.4/1.5 at threshold
  5e-4 to 1e-3; SD 2.0/3.0 at 1e-4) FID actually improved. To determine whether this was architectural
  or training-induced, they continued training an SD model on FFHQ and tracked which parameters crossed
  the threshold: 99% of initially below-threshold parameters became effective, while 1% of initially
  above-threshold parameters fell below it, showing the ineffectiveness is a transient artefact of stochastic
  optimisation.'
