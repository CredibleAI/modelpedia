id: IC-1146
title: Self-context (self-retrieval) chain-of-thought increases the rate of fabricated books compared
  to no-context for both GPT-4 and GPT-3.5
description: When the model is asked to first retrieve all books by the author and then filter by constraint
  (self-context template), the irrelevance rate increases rather than decreases. GPT-4 goes from 0.26
  (no-context) to 0.33 (self-context), and GPT-3.5 from 0.20 to 0.44. The first step of the chain (listing
  all books) already has high irrelevance (0.42 for GPT-4, 0.47 for GPT-3.5), and the model cannot recover
  from these fabricated titles in the filtering step. Qualitative examples show the model generating
  irrelevant titles specifically to satisfy the constraint.
