id: IC-680
title: CLIP ViT's image token contributions are spatially localized to match described content, enabling
  zero-shot segmentation that outperforms existing CLIP-based methods
description: Decomposing the image representation across image tokens and computing the inner product
  of each token's contribution with a text direction yields a spatially localized heatmap. The highlighted
  regions match the image parts described by the text (e.g. the Eiffel Tower for 'photo taken in Paris').
  Binarizing these heatmaps produces zero-shot segmentations that outperform LRP, Partial-LRP, Rollout,
  Raw Attention, Grad-CAM, and Chefer et al. on all metrics (pixel accuracy, mIoU, mAP) on ImageNet-Segmentation.
