id: IC-1194
title: GPT-3.5-turbo, GPT-4, and GPT-3.5-turbo-0613 exhibit 50-58% inconsistency between their ratings
  and rankings feedback on the same response pairs
description: When asked to rate individual responses on a 1-7 Likert scale and separately to rank pairs
  of the same responses, these AI models produce contradictory preferences for a large fraction of comparisons.
  GPT-3.5-turbo (temperature=0) disagrees with itself 58% of the time over 42k comparisons, GPT-3.5-turbo-0613
  disagrees 54%, and GPT-4 disagrees 50% over 500 comparisons. The inconsistency is robust to temperature
  (56% at temp=0.5) and is not an artefact of a single model. The paper attributes this to the models
  attending to different quality dimensions (e.g., accuracy vs. density) depending on whether the task
  is absolute scoring or relative comparison.
