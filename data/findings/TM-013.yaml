id: TM-013
review_status: verified
extracted_by: manual
title: Intervening on the altitude plane raises generated terrain by almost 500 metres
description: >
  The authors pull a flat 2D plane encoding altitude out of TerraMind's hidden layers, then push
  on it rather than just observing it. They move every latent vector's projection onto a
  high-altitude spot on that plane and ask the model to generate a terrain heightmap. The
  generated terrain rises by almost 500 metres while keeping its overall shape, and a Shapley
  analysis confirms the plane genuinely matters to how elevation gets generated.
evidence_type: interventional
