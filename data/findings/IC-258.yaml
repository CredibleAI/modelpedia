id: IC-258
title: DNN accuracy on 3D perception tasks correlates with ImageNet object classification accuracy,
  suggesting 3D cues emerge as a byproduct of object recognition training
description: Across the 317 TIMM models, the paper measured the correlation between each model's ImageNet
  classification accuracy and its performance on the 3D-PC tasks. Depth order accuracy correlated strongly
  with ImageNet accuracy (rho = 0.66, p < 0.001), and VPT-basic accuracy showed a weaker but significant
  correlation (rho = 0.34, p < 0.001). The difference between the two correlations was itself significant
  (rho = 0.32, p < 0.001), indicating that the 3D cues that emerge with scale are well-suited for depth
  ordering but poorly suited for perspective taking.
