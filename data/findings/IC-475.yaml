key_metric: 'GPT-4: 0.8% inverse vs 65.9% forward (Jane Austen); 42% inverse vs 99% forward (WikiBio);
  7.3% inverse vs 66.5% forward (Chinese poem). GPT-3.5: 0.5% vs 14.4% (Austen); 23.9% vs 89.5% (WikiBio);
