id: IC-475
title: GPT-4, GPT-3.5, GPT-4o, and Llama-3.1-405B fail at inverse knowledge search regardless of prompting
description: 'The paper tests whether models can reverse a forward mapping: given an attribute value,
  find the entity that has it. On Jane Austen novels, GPT-4 scores 0.8% on ''what sentence comes before
  this one?'' versus 65.9% on the forward direction. On Wikipedia celebrity data, GPT-4 scores 42% inverse
  versus 99% forward; GPT-3.5 scores 23.9% versus 89.5%. On Chinese poems, GPT-4 scores 7.3% inverse
  versus 66.5% forward. The paper''s synthetic experiments confirm this failure is inherent: no amount
  of training data, model size, or prompting strategy enables inverse search unless the inverse form
  is explicitly present in training data. GPT-4o and Llama-3.1-405B show the same failure.'
