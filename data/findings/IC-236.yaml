id: IC-236
title: Zero-shot Grounding-DINO and Florence-2 show a significant performance gap on referring expression
  comprehension compared to their fine-tuned versions
description: The paper measures the zero-shot p@1 of Grounding-DINO (Swin-T) and Florence-2 (Large)
  on four REC datasets and compares them to the same models after white-box fine-tuning on REC data.
  The gap ranges from -11.5 to -37.1 p@1 depending on the model and dataset. For example, Florence-2
  drops from 91.02 p@1 (fine-tuned) to 66.16 p@1 (zero-shot) on RefCOCOg test, and Grounding-DINO drops
  from 77.99 to 59.32. The authors note that while these VLMs can detect most objects mentioned in a
  query, they struggle to select only the described object among distractors.
