id: IC-458
title: Most VLM decoders show negative CC-SHAP on VALSE multiple-choice, indicating their explanations
  are less self-consistent than their answers, driven by a shift from text-dominant to image-dominant
  processing
description: 'The paper measures self-consistency using CC-SHAP, which compares input token contributions
  during answer generation versus explanation generation. On VALSE multiple-choice, bakllava (avg -0.04±0.02),
  llava-next-mistral (-0.06±0.03), and llava-next-vicuna (-0.05±0.03) all show negative post-hoc CC-SHAP,
  meaning their explanations rely on different inputs than their answers. mPLUG-Owl3 shows positive
  scores (0.12±0.04 post-hoc, 0.11±0.03 CoT). The mechanism is a modality shift: text contributions
  decrease by 1-30 percentage points when generating explanations versus answers, with the shift larger
  in CoT than post-hoc. All models also perform significantly worse with CoT except mPLUG-Owl3.'
