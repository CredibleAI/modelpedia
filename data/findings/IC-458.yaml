caveat: Edit-based tests (counterfactual edits, biasing features, corrupting CoT) were not implemented
  for mPLUG-Owl3 due to code functionality differences. On generative tasks (VQA, GQA), bakllava and
  llava-next-vicuna show positive CC-SHAP, contrasting with their negative scores on multiple-choice.
  The paper notes no ground truth exists for explanation faithfulness.
