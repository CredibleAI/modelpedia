id: IC-700
title: GPT-4's reasoning accuracy degrades when provided with incorrect hints from a weaker model
description: In the mot-1d-verify cascade, when the weaker LLM (GPT-3.5-turbo) produces two inconsistent
  answers, those answers can be passed as hints to GPT-4 before it answers. On the subset of questions
  routed to GPT-4, adding these hints slightly improves accuracy on Date (0.892 to 0.910) but significantly
  hurts performance on GSM8K (0.891 to 0.867) and CREPE (0.774 to 0.727). The authors attribute the
  degradation to GPT-4 being misled by the incorrect answers when both hints are wrong.
