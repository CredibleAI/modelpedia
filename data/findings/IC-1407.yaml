id: IC-1407
title: OpenFlamingo and Idefics models perform near random chance on compositional image-text matching,
  and ICL has almost no effect on atomic foils
description: On CRePE and SugarCrepe benchmarks, LMMs are only slightly better than random (50%) at
  detecting when sentence constituents are changed. OFv2-9b scores 53.88% on hn-atom and 60.75% on hn-comp
  in zero-shot; Idefics-9b scores 58.05% and 62.63%. ICL does not improve hn-atom accuracy but does
  help hn-comp (Idefics-9b rises from 62.63% to 86.39% at 32-shot). The apparent improvement of 80B
  models on CRePE is attributed to benchmark biases (longer, less fluent hard negatives) rather than
  true compositional ability, confirmed by poor performance on SugarCrepe.
