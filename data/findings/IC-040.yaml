id: IC-040
title: Information imbalance triggers both the modality gap and object bias in contrastive VLMs
description: The paper hypothesizes and validates that an information imbalance between image and text
  (where images contain more information than their captions) is the main cause for both the modality
  gap and object bias. Experiments on a synthetic dataset (MAD) and on real data (CC12M) show that reducing
  the information imbalance (by including more attributes in captions) decreases the modality gap and
  object bias while improving performance.
