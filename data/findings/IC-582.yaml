id: IC-582
title: Instruction-tuned MLLMs (InstructBLIP, mPLUG-Owl, Idefics) achieve significantly better brain
  alignment than vision-only ViT-H and perform comparably to or better than CLIP-text across whole visual
  cortex and five visual ROIs
description: The paper trains bootstrap ridge regression encoding models to predict fMRI activity from
  model representations extracted via 10 natural instructions. Across the whole visual cortex and five
  functional localizers, all three MLLMs significantly outperform ViT-H (p≤0.05) and match or exceed
  CLIP-text, which uses ground-truth captions while MLLMs use predicted generations. In higher visual
  regions (floc-places), MLLM normalized alignment reaches approximately 0.8, dropping to approximately
  0.6 in early visual ROIs. In Appendix K, non-instruction-tuned BLIP-2 performs marginally below CLIP-text,
  and LLaMA-2-7B (text-only, no visual input) performs closer to ViT-H, confirming that instruction
  tuning and multimodality drive the alignment gain.
