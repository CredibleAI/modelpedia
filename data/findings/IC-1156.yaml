id: IC-1156
title: The VPT advantage over FT for ViT-B/16 is not explained by overfitting resistance or additional
  optimization dimensions; the specific feature-preservation mechanism of VPT is the key factor
description: 'The paper tests two hypotheses for why VPT outperforms FT on ViT-B/16. First, overfitting:
  training/testing loss curves show that 8/9 structured tasks overfit for both FT and VPT, while only
  1/10 natural+specialized tasks overfit, so overfitting cannot explain VPT''s advantage in the latter
  cases. Second, additional dimensions helping escape local minima: the ''mixed'' method (VPT + full
  FT) and ''ft-then-pt'' method both add dimensions but underperform VPT (mixed: 72.80/79.78/42.94;
  ft-then-pt: 78.20/82.70/50.38 vs VPT: 79.53/82.65/56.09 on natural/specialized/structured). Grad-CAM
  and Integrated Gradients visualizations show VPT focuses on task-relevant regions more effectively
  than FT. The conclusion is that VPT''s unique combination of preserving the frozen backbone features
  while adding a small set of learnable prompts is the pivotal mechanism.'
