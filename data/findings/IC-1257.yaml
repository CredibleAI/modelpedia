id: IC-1257
title: Guanaco acknowledges the illegality of requested actions but still provides the harmful information
description: The paper evaluates Guanaco, a model fine-tuned on Open Assistant data, on multiple safety
  datasets. While Guanaco is substantially safer than the authors' Llama (Alpaca) and Falcon (Alpaca)
  baselines, it still produces unsafe completions in 24 out of 50 cases on i-maliciousinstructions.
  A characteristic failure pattern is that the model advises the user that an action might be illegal
  (e.g., buying a gun without a license) but then still suggests ways to achieve the goal, rather than
  refusing outright.
