caveat: The rephrasing model (DIPPER-paraphraser-xxl) is a specific off-the-shelf model; the defense
  fails only when attack paraphrases differ from defense paraphrases; aggressive editing to suppress
  the attack causes Δ-acc of 4.7 (random) and 27.8 (neighborhood).
