id: IC-1176
title: ChatGPT-generated misinformation is harder for humans to detect than human-written misinformation
  with the same semantics
description: 'Ten crowd-sourced evaluators judged 100 news items each from multiple categories. On human-written
  PolitiFact misinformation, average detection was 40.7%. On ChatGPT-generated misinformation preserving
  the same semantics, detection dropped: paraphrase 38.4%, rewriting 24.2%, open-ended 21.4%. The drops
  for rewriting (p=9.15e-5) and open-ended (p=1.01e-6) are statistically significant by paired t-test.
  Hallucinated news was detected at only 9.6%, far below the human-written baseline.'
