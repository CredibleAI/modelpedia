id: IC-506
title: Restoring the refusal feature in Llama-3-8B-Instruct, Mistral-7B-Instruct-v0.2, and Gemma-7B-IT
  causally disables all four tested adversarial attacks
description: The authors take successful adversarial prompts and, during inference, patch the residual
  stream activations to restore the refusal feature to its mean value on the original (unmodified) harmful
  inputs. This intervention dramatically reduces the attack success rate across all four attack methods
  and all three models, as judged by the official HarmBench classifier. General capability (MMLU, MT-Bench)
  is unaffected by the clamping, confirming the effect is specific to the safety decision rather than
  a degradation of generation quality.
