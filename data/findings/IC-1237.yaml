id: IC-1237
title: Llama-2-7b's pre-existing translation knowledge is diluted by large amounts of parallel data,
  causing COMET to decline after 100k examples
description: Fine-tuning Llama-2-7b on en-to-ru parallel data at five scales (10k, 100k, 1m, 5m, 20m)
  reveals that its COMET score peaks at 10k-100k and then declines, while MPT-7b shows continuous improvement.
  A randomly initialized 7B model trained from scratch on 20m data reaches similar performance, supporting
  the hypothesis that large parallel data causes catastrophic forgetting of the LLM's pre-trained knowledge.
  BLEU does not capture this decline because the WMT training data is domain-matched to the test set.
