id: IC-276
title: All 14 evaluated VLMs show a large gap between average-case and worst-case accuracy on DynaMath
  variants, with worst-case at or below 50% of average-case, and the failures are systematic rather
  than random
description: The paper evaluates 14 closed-source and open-source VLMs on 5,010 dynamically generated
  math questions (10 variants per seed question). Every model's worst-case accuracy (percentage of seed
  questions answered correctly in all 10 variants) is close to or below 50% of its average-case accuracy.
  Repetition consistency across 5 generations is high (92-99%), confirming that the failures are not
  due to sampling randomness but are consistent errors on specific variants. GPT-4o, Gemini Pro 1.5,
  Qwen2-VL-72B, and InternVL2-76B each exhibit 21.8%, 18.4%, 29.9%, and 28.3% of seed questions where
  they consistently fail, respectively.
