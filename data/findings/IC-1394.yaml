id: IC-1394
title: ChatGPT demonstrates better ethical value conformity than GPT-4 across multiple prompt generation
  sources
description: 'The paper compares ChatGPT (gpt-3.5-turbo-0301) and GPT-4 (gpt-4-0613) on the MoralPrompt
  benchmark using prompts generated by three different LLMs: ChatGPT itself, GPT-4, and Vicuna-33b.
  In all three conditions, ChatGPT produces fewer value violations than GPT-4. The authors speculate
  that ChatGPT''s dialogue-specific training with stricter restrictions, combined with GPT-4''s superior
  capability to generate more elaborate (and thus more violation-prone) story details, explains the
  gap.'
