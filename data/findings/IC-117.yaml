id: IC-117
title: Hallucination heads in LLaVA-7B and MiniGPT-4 are concentrated in the middle and deeper layers
  of the transformer
description: After identifying hallucination heads via contrastive influence scoring (top-k selection
  from 1,024 heads across 32 layers in LLaVA-7B), the paper observes that both the most prominent hallucination
  heads and non-hallucination heads are predominantly located in the middle and deeper layers. The same
  pattern is confirmed for MiniGPT-4, where hallucination heads are distributed in the latter half of
  the model. This aligns with prior findings that deeper layers capture more abstract, task-specific
  representations.
