id: IC-279
title: GP-LVM produces less structured latent representations and lower generative-classification accuracy
  than QEP-LVM on oil flow and MNIST
description: The paper applies the standard Bayesian GP-LVM (q=2) to the oil flow and MNIST datasets
  and reports its generative-classification performance and latent-space geometry. On oil flow, GP-LVM
  achieves 0.68 ± 0.05 accuracy and 0.83 ± 0.03 AUC over 10 random seeds. On MNIST, it achieves 0.965
  ± 0.012 accuracy and 0.981 ± 0.0062 AUC. The 2-D latent projections show GP-LVM yielding less concentrated
  digit clusters (e.g. segregated but overlapping 6/7 groups) compared to the tighter, more separated
  clusters from QEP-LVM at q=1.5.
