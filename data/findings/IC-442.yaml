id: IC-442
title: Routing each evaluation instance to the model strongest on its relevant skills yields a 3.2%
  accuracy gain over the best single model, with 3.5-6.8% gains on MMLU Pro
description: The paper tests whether skill-slice insights generalize to held-out data by routing each
  instance to the model with the highest weighted skill-slice accuracy for that instance. Across 12
  datasets, routing improves accuracy by up to 3.2% over each frontier model alone. On MMLU Pro (language-only,
  while the reference corpus is mostly multimodal), gains are 3.5 to 6.8%. Skill-wise accuracies computed
  over multimodal benchmarks correlate strongly (r ≥ 0.79, p < 1e-7) with accuracies on the language-only
  benchmark, supporting generalizability.
