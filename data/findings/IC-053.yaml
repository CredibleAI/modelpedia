key_metric: Ablating either io or s in l10h0 queries leads to a change of ≈ 0.5 in logit difference.
  Number of s features with f1 > 0.5 never exceeds 22 (out of 216 names) across the hyperparameter grid.
caveat: The magnitude difference between io and s features is described as 'small but significant';
  the effect is observed at one specific circuit location (l10h0 queries) and may not generalize to
  all locations.
