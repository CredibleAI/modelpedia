id: IC-053
title: In GPT-2 small's l10h0 name mover queries, the io attribute is encoded with higher-magnitude
  features than the s attribute, and both are causally relevant, but SAEs preferentially learn io features
  due to the magnitude asymmetry
description: 'The paper measures the L2 norms of supervised feature vectors for io and s names in the
  queries of the l10h0 name mover head and finds io features have significantly higher norm. Both attributes
  are causally relevant: ablating either changes the logit difference by approximately 0.5. Despite
  this, task SAEs consistently find features for almost all io names but never more than 22 s-name features
  (out of 216 names), across a wide hyperparameter sweep. Surgically reducing the io feature magnitude
  causes the number of discovered s features to increase monotonically, and a toy model with isotropic
  random features of matching norms reproduces the effect.'
