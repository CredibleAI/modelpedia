id: IC-321
title: GPT-4o selects evaluation dimensions with high precision but low recall, indicating a selective
  rather than comprehensive strategy
description: On the dimension selection task (choosing relevant dimensions from a fixed set of 42 for
  a given scenario), GPT-4o achieves 63.42% precision but only 38.10% recall on the in-domain MD-Eval
  set. The authors describe this as 'a more selective (and less comprehensive) subset of dimensions.'
  On the out-of-domain AutoJ Eval set, GPT-4o's win rate against SAMER is 48.15%, below 50%. Most other
  baselines fail to exceed 50% precision and 40% recall, but GPT-4o's particular precision-recall profile
  is singled out.
