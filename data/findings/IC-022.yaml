id: IC-022
title: Safety layers in Llama-2-chat-7b show substantial divergence during VL adaptation, correlating
  with safety degradation
description: The authors compute cosine similarity between hidden states of Llama-2-chat-7b and its
  adapted LVLM Llama-2-chat-vl at each layer during VL adaptation, using harmful prompts. The previously
  identified 'safety layers' (layers 6–14) show cosine similarity around 0.5, substantially lower than
  near-1.0 similarity in early layers, and this divergence increases from early to late training. Freezing
  only these safety layers during VL adaptation (SPPFT) reduces text-only ASR from 26.2% to 22.3% at
  400 steps and 58.6% to 41.3% at final checkpoints, but multimodal safety improvement is more modest,
  suggesting changes in these layers contribute to safety loss.
