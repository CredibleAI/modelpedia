id: IC-333
title: Llama-3-405B overexplains math solutions with structured markdown headings and conversational
  tone compared to GPT-4o's concise formal notation, achieving 97% model-matching accuracy
description: On the MATH dataset with chain-of-thought prompting, VibeCheck compares GPT-4o and Llama-3-405B
  on questions where both answered correctly. Llama-3-405B organizes responses under markdown headings
  (e.g., '## Step 1'), adopts a conversational tone, and includes overly detailed step-by-step explanations
  with repetition. GPT-4o uses flowing narrative, formal tone, and frequent LaTeX/MathML notation. The
  top vibes (explanation detail sep 0.90, structural formatting sep 0.70, conciseness sep 0.51) achieve
  97.09% model-matching accuracy and 72.79% preference-prediction accuracy. GPT-4o is favored in 76%
  of conversations.
