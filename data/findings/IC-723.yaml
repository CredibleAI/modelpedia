id: IC-723
title: The entity tracking performance gap between Goat-7b and Llama-7b is primarily attributable to
  enhanced positional information in the value fetcher and position transmitter heads
description: Using cross-model activation patching (CMap), the authors patch the output of specific
  head groups from Goat-7b into Llama-7b. Patching the value fetcher heads alone recovers the full performance
  of Goat-7b (0.82) in Llama-7b (baseline 0.66). Patching the position transmitter heads also yields
  a substantial performance boost. This localizes the improvement to enhanced encoding of positional
  information and object value in the fine-tuned model's shared circuit components, rather than to entirely
  new circuitry.
