id: IC-389
title: All evaluated LLMs score significantly lower on CS reasoning questions than knowledge questions,
  with the gap narrowing for stronger models
description: Across all 30+ evaluated models, the average score on reasoning-type CS questions is 45.60%
  compared to 60.61% on knowledge-type questions, a gap of approximately 15 percentage points. The paper
  observes that weaker models show a much larger relative gap (e.g., Llama2-7b scores 26.19% on open-ended
  reasoning but 60.61% on assertion reasoning), while stronger models like GPT-4 score comparably across
  formats (68.94% open-ended reasoning vs 67.68% assertion reasoning). Error analysis attributes the
  primary cause of failures to lack of domain knowledge rather than general reasoning deficiency, and
  notes that CS-specific reasoning errors (logical reasoning) do not decrease as much as mathematical
  reasoning errors with model scale.
