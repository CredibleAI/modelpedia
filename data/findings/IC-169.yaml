id: IC-169
title: BT-based, DPO-based reward models, and GPT-4 as judge all exhibit significant length bias, with
  their scores correlating with output length rather than quality
description: The paper measures length bias across 33 BT-based reward models, 46 DPO-based reward models,
  and GPT-4 used as a pairwise judge. For BT-based RMs, 8 of 10 top models show high gameability (sensitivity
  to verbosity prompting) and low accuracy on the 17-example LengthBiasBench subset, with a -0.879 Spearman
  correlation between the two metrics. The average absolute Spearman correlation between output length
  and reward across all 33 BT-based RMs is 0.293. GPT-4's pairwise judgments in AlpacaEval1 show 27.9%
  gameability. DPO-based RMs also exhibit the bias, with average calibration gains of 1.60 and 1.68.
  The bias also extends to markdown formatting features, with 1.81 and 1.86 average gains after calibrating
  for list/header/bold counts.
