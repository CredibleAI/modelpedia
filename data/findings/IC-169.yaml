key_metric: '|ρ|avg = 0.2930±0.1836 (Spearman, length vs reward, 33 BT-based RMs); 8/10 top RMs high
  gameability + low LengthBiasBench; -0.879 Spearman between gameability and LengthBiasBench; AE1 gameability
  27.9%; DPO-based avg gains 1.60 (rc-mean) / 1.68 (rc-lwr); markdown calibration gains 1.81 / 1.86'
caveat: The LengthBiasBench subset contains only 17 test examples. The independence assumption (that
  true reward is uncorrelated with length) may not hold for specific prompt subsets. The paper notes
  that a rule-based RM always choosing the shorter sentence achieves 60% accuracy on RewardBench, so
  the ideal length-reward correlation is slightly negative, not zero.
