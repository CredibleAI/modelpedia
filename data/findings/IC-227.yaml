id: IC-227
title: MSA-based conformation generation methods (AlphaFlow, MSA-subsampling) outperform sequence-based
  methods (EigenFold, STR2STR, ESMFlow) on conformation changing pair generation
description: On both the apo/holo (90 pairs) and fold-switching (77 pairs) benchmarks, MSA-based methods
  achieve higher global residue flexibility correlations than sequence-based methods. For apo/holo,
  MSA-subsampling achieves 0.398 and AlphaFlow 0.455, versus EigenFold 0.126, STR2STR 0.174/0.148, and
  ESMFlow 0.416. For fold-switching, MSA-subsampling achieves 0.350 and AlphaFlow 0.385, versus EigenFold
  0.225, STR2STR 0.161/0.111, and ESMFlow 0.269. The authors conclude this highlights the importance
  of MSA for generating stable conformation changing protein targets.
