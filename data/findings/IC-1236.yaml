id: IC-1236
title: Among 7B LLMs, Llama-2-7b achieves the best zero-shot COMET scores in both translation directions,
  while MPT-7b leads in BLEU for en-to-xx
description: The paper evaluates zero-shot translation performance of six 7B LLMs (OPT-7b, BLOOM-7b,
  Falcon-7b, Llama-1-7b, MPT-7b, Llama-2-7b) plus GPT-3.5-d and GPT-3.5-t on 10 translation directions
  (cs, de, is, zh, ru to/from English) using WMT'21 and WMT'22 test sets. Llama-2-7b achieves the highest
  average COMET in both directions (77.16 xx-to-en, 68.88 en-to-xx), while MPT-7b leads in BLEU for
  en-to-xx (15.90). All 7B models trail GPT-3.5-d and GPT-3.5-t by a substantial margin.
