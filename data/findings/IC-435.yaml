id: IC-435
title: Mistral-7B employs a less efficient algorithmic strategy (O(n²)) than Llama-3-8B (O([n², n³]))
  on probe tasks with multiple solution complexities
description: On three probe tasks (longest common subarray, longest increasing subsequence, longest
  consecutive elements) that admit solutions of varying time complexity, the paper infers which complexity
  class each model's solution corresponds to by matching OOD accuracy against a complexity-accuracy
  mapping. Mistral-7B's accuracy profile aligns with O(n²) algorithms, while Llama-3-8B's aligns with
  O([n², n³]). For the longest common subarray task specifically, both models use algorithms of similar
  complexity around O([n, n²]), despite differing overall accuracy. This suggests the models' generalization
  performance is partly determined by the algorithmic strategy they implicitly adopt.
