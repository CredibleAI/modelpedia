id: IC-474
title: GPT-4, GPT-4o, and Llama-3.1-405B fail at knowledge classification and comparison without chain-of-thought
description: 'The paper tests whether released language models can perform simple logical operations
  on stored factual knowledge. GPT-4 is asked to classify whether a celebrity was born in an even month
  (binary) and to compare two people''s birth dates. Without explicitly generating the intermediate
  value (the month or the year) first, GPT-4 performs at or near chance level. The same failure is confirmed
  for GPT-4o and Llama-3.1-405B as of October 1, 2024. The paper''s controlled synthetic experiments
  show this is not a training-data issue: even with 25,000 QA samples (far exceeding the theoretical
  minimum) the model cannot learn the classification without CoT.'
