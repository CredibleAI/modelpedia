key_metric: 'GPT-4: 50.7% correct on ''born in an even month?'' (binary); 52.3% on comparing birth dates
  among individuals born 1900-1910; 71.1% for 1900-1950; 81.6% for all pairs. GPT-4o and Llama-3.1-405B:
  ''still fail'' (Figure 5, no specific numbers in text).'
caveat: The paper notes these are the simplest single-step manipulations; more complex composed functions
  would be even harder. The GPT-4o and Llama-3.1-405B results are qualitative ('still fail') without
