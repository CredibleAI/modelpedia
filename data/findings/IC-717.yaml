id: IC-717
title: Llama-2-Chat's evaluation capability does not improve monotonically with model size
description: The paper measures the Pearson correlation between Llama-2-Chat scores and GPT-4 scores
  on 1222 customized score rubrics. The 7B variant (0.485) outperforms the 13B variant (0.441) on seen
  rubrics, and the 70B variant (0.572) only marginally exceeds the 7B. The authors explicitly state
  that 'naively increasing the size of a model does not necessarily improve an LLM's evaluation capabilities.'
  The same non-monotonic pattern holds on Vicuna Bench, MT Bench, and FLASK Eval.
