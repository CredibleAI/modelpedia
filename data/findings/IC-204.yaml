id: IC-204
title: GPT-4o performs worse with explicit chain-of-thought prompting than with the original prompt
  on OpenRCA tasks
description: 'A repetitive experiment compared GPT-4o''s accuracy under the original prompt versus a
  CoT prompt that explicitly requests step-by-step analysis of telemetry. Across three trials, the median
  accuracy with CoT was lower in both sampling settings: 2.99% versus 3.58% for balanced sampling, and
  5.37% versus 6.27% for oracle sampling. Manual review of a case study showed that CoT led GPT-4o to
  focus on the most superficially anomalous component (highest latency) rather than following the diagnostic
  guidance to trace the failure propagation chain to the originating component.'
