key_metric: 'Cosine similarity between model PCs and spectral embeddings (Table 2): grid 0.950/0.954,
  ring 0.942/0.930, hex 0.745/0.755. Memorization baselines (1-shot, 2-shot) fail to explain the accuracy
  curve on both ring (50 nodes) and grid (25 nodes) graphs.'
caveat: The authors note that PCA visualizations can be misleading, and that graph sizes are relatively
  small, likely causing significant finite-size effects. The percolation analogy is described as 'still
  loose' and would require graphs with at least 2 orders-of-magnitude difference in size to corroborate.
