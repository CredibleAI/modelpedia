id: IC-481
title: Llama-3.1-8B and four other released LLMs reorganize their internal representations to reflect
  in-context graph structure in a sudden two-phase transition as context length increases
description: 'The paper inputs traces of random walks on predefined graphs (square grid, ring, hexagonal
  lattice) into five released LLMs and measures the Dirichlet energy of the models'' mean token representations
  with respect to the ground-truth graph. As context length scales from roughly 10 to 1000 tokens, the
  energy decreases and rule-following accuracy increases in a two-phase pattern: a slow initial rise
  followed by a sudden steep ascent. The transition point scales as a power-law with graph size. Simple
  memorization baselines (1-shot and 2-shot) cannot account for the observed accuracy curves. The same
  energy-decrease-then-accuracy-rise pattern is observed across Llama-3.1-8B, Llama-3.2-1B, Llama-3.1-8B-Instruct,
  Gemma-2-2B, and Gemma-2-9B on all three graph topologies.'
