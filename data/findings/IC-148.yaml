id: IC-148
title: Language models represent semantically equivalent inputs from different data types (languages,
  code, images, audio) close together in intermediate layers, with the shared space scaffolded by the
  model's dominant language
description: 'The paper tests whether LMs map semantically similar but surface-distinct inputs into
  a shared representation space. Using cosine similarity on parallel English-Chinese texts, logit lens
  on Chinese/English/code/arithmetic inputs, and patch-level logit lens on images and audio, the authors
  show that in intermediate layers (roughly layers 10-25 of 32), representations of equivalent inputs
  from different data types are significantly closer than to non-equivalent inputs. The logit lens further
  reveals that the shared space is anchored by the dominant language: when Llama-3 processes Chinese,
  English tokens have higher logit lens probability than Chinese tokens from layer 17 onward; when Baichuan-2
  processes English, Chinese tokens dominate in intermediate layers. For code, the ''and'' token outperforms
  the actual next Python token in middle layers; for images, the corresponding color word is the closest
  token >20% of the time; for audio, matching label words outperform random labels.'
