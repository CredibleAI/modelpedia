key_metric: 'cosine similarity up to >80% for parallel English-Chinese texts in middle layers; logit
  lens: English token probability exceeds Chinese token from layer 17 to 31 (Llama-3); ''and'' token
  logit lens probability exceeds next-token probability in middle layers for Python list literals (n=6923);
  closest token is the corresponding color word in >20% of intermediate-layer patches (n=2304); matching
  caption nouns have higher logit lens alignment than irrelevant captions across all layers for LLaVA'
caveat: For BLOOM, a multilingual model with balanced training, no clear dominant language is observed
  in intermediate layers; the closest tokens are often symbols with no clear semantics. The cosine similarity
  for image-caption pairs is lower than for mutual translations. The logit lens is a training-free probe
  and may not capture the full structure of the representation.
