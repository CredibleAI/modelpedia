id: IC-1054
title: Code fine-tuning degrades English natural language reasoning in Code LLaMA relative to LLaMA-2,
  but the effect is negligible or slightly positive in French, Spanish, and German
description: The paper evaluates LLaMA-2 and its code-fine-tuned variant Code LLaMA on the XNLI sentence
  entailment benchmark across four languages. On English, Code LLaMA scores 8.36 percentage points lower
  than LLaMA-2 (35.90% vs 44.26%). However, on French the difference is -1.45%, on Spanish -0.77%, and
  on German +1.01%, meaning Code LLaMA performs comparably or slightly better in non-English languages.
  This suggests the code fine-tuning shifts task inference toward code for English prompts specifically.
