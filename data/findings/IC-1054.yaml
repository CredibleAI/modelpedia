evidence_type: correlational
key_metric: 'XNLI accuracy over 2490 test samples: English LLaMA-2 44.26% vs Code LLaMA 35.90% (drop
  8.36%); French 33.53% vs 34.98% (-1.45%); Spanish 38.11% vs 38.88% (-0.77%); German 34.50% vs 33.49%
  (+1.01%)'
caveat: The paper notes that the slight increase in Spanish and French accuracy for Code LLaMA may be
  due to increased reasoning capabilities associated with code training combined with better task inference,
  rather than a pure absence of forgetting.
