id: IC-525
title: GPT-2 small's residual stream at layer 8 decomposes into two sub-spaces of approximately 25%
  and 75% of the dimensionality
description: By training a sparse autoencoder on GPT-2 small's layer 8 post-MLP residual stream and
  performing SVD on the learned encoding matrix, the authors find that the residual stream is composed
  of two distinct linear sub-spaces. Approximately 25% of the autoencoder latents project primarily
  onto a sub-space spanning 25% of the dimensions, while the remaining 75% project onto the complementary
  75%. Latents in the smaller sub-space have larger encoder norms and activate on fewer vocabulary tokens
  (less than 100 effective tokens) compared to the larger sub-space (up to 1000 effective tokens). The
  separation is revealed by ordering singular vectors via a 1D UMAP embedding of pairwise distances
  between normalized left singular vectors.
