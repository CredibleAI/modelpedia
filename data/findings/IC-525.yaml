caveat: The sub-space separation is 'fuzzily' defined; the authors note that the difference in encoder
  norm between clusters 'can significantly guide the svd to separate these two sub-spaces,' suggesting
  the separation may be partly an artefact of the SVD decomposition rather than a hard boundary in the
  model.
