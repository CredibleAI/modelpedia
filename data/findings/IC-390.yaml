id: IC-390
title: The parallelotope volume of modality embeddings from LanguageBind, VAST, and Valor on MSR-VTT
  is strongly correlated with their downstream R@1 retrieval performance
description: The authors extract video, audio, and text embeddings from LanguageBind, VAST, and Valor
  (both zero-shot and fine-tuned), compute the GRAM parallelotope volume for each model's three modality
  vectors, and correlate this geometric quantity with each model's R@1 on MSR-VTT. Over 1000 test samples,
  the Pearson correlation between 1−GRAM and R@1 is ρ = 0.923. The claim is that the geometric alignment
  of a model's modality embeddings, as captured by the volume of the parallelotope they span, is a reliable
  indicator of that model's downstream retrieval capability.
