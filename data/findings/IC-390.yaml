  test samples
caveat: 'The correlation is computed over only 6 data points, 3 of which are the authors'' own GRAM
  model; the paper does not report the correlation restricted to released models alone. The GRAM volume
  is the authors'' own proposed metric, so the finding is partly circular: it validates the metric using
  the models it was designed to evaluate.'
