id: IC-206
title: GPT-4o-0513 achieves the highest wb-reward mix score (35.7) on WildBench, with a clear three-tier
  structure among 40 evaluated LLMs
description: 'The paper evaluates 40 released LLMs on 1,024 challenging real-world user queries from
  WildChat. Using the wb-reward metric (pairwise comparison against three baselines: GPT-4-turbo-0429,
  Claude-3-Haiku, and Llama-2-70B-Chat), GPT-4o-0513 scores 35.7, followed by GPT-4-turbo-0409 at 34.6
  and GPT-4-turbo-0125 at 29.9. The three baselines naturally partition models into three tiers: tier
  1 outperforms Claude-3-Haiku, tier 2 outperforms Llama-2-70B-Chat but not Claude-3-Haiku, and tier
  3 is below Llama-2-70B-Chat. The wb-score metric (individual 1-10 scoring by GPT-4-turbo) gives GPT-4o-0513
  a score of 59.3.'
