id: IC-1387
title: In-context learning capabilities in OPT and LLaMA models remain within 5% of dense-model accuracy
  even at 60-70% sparsity, and show less than 2% difference between the 30B and 1.3B dense OPT models
description: The paper evaluates ICL on three parameterized function-learning tasks (2-way linear classification,
  2-layer neural network, 4-way decision tree) and on open-book/overriding QA. Under SparseGPT pruning,
  average accuracy across the four main models stays within 5% of the dense model up to 60% sparsity
  (linear, 2-layer NN) and 70% (decision tree). Under dense scaling, the accuracy difference between
  OPT-30B and OPT-1.3B is only 1.8%, 1.4%, and 0.1% on the three ICL tasks. Open-book and overriding
  QA also survive to 50-70% sparsity. The pattern holds for Pythia-12B (50% sparsity) and with Wanda
  (50% sparsity).
