id: IC-452
title: Transformer block coupling is absent at initialization and increases persistently throughout
  training in Pythia 12B and 6.9B, with layer-wise locality emerging
description: Using the Pythia scaling suite checkpoints (steps 128 through 143k), the paper measures
  mean normalized coupling (k=10) at each training step. Coupling is low at initialization and increases
  monotonically throughout training. Adjacency plots of layer-pair coupling show that coupling becomes
  more concentrated between adjacent layers as training progresses, indicating layer-wise locality.
  The gradual growth of coupling parallels the logarithmic increase in accuracy during training.
