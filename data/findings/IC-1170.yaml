id: IC-1170
title: GPT-3.5, Llama2, PaLM2, and GPT-4 are susceptible to a CoT-prompting backdoor attack (BadChain)
  on complex reasoning tasks, with stronger reasoning models showing higher attack success rates
description: The paper measures how four released LLMs behave when a subset of chain-of-thought demonstrations
  is poisoned with a backdoor reasoning step and a trigger is embedded in the query prompt. Under this
  condition, the models produce the adversarial target answer (e.g., scaling the arithmetic result by
  2.1, shifting a multiple-choice letter, inverting a true/false answer) with high frequency. Average
  attack success rates are 85.1% (GPT-3.5), 76.6% (Llama2), 87.1% (PaLM2), and 97.0% (GPT-4) across
  six reasoning benchmarks and two CoT strategies. In contrast, baseline demonstration-poisoning attacks
  without the backdoor reasoning step (DT-base, DT-cot) fail uniformly with ASR at most 18.3%. The paper
  further observes that models with stronger reasoning capabilities (GPT-4, with 88.4% baseline accuracy)
  are the most susceptible.
