caveat: For Llama2, only 10-20% of each test set was evaluated due to computational resource limits.
  The attack requires the attacker to control the user prompt (e.g., via a malicious prompt-engineering
  service or man-in-the-middle). The paper does not investigate whether the susceptibility persists
  under different decoding settings or safety filters (which were turned off for PaLM2).
