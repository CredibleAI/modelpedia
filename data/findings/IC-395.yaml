caveat: ADCE is an approximation of the true direct causal effect; the approximation relies on intervention
  strategies that minimize but do not eliminate the gap between the true ICE and AICE. Some model-task
  pairs (e.g., Llama-3-8B on analytic entailment) show negative ADCE.
