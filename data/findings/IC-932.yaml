id: IC-932
title: Pre-trained DNN object detectors show a sharp falloff in peripheral detection performance with
  increasing eccentricity, degrading to near-chance by 20°, while human performance degrades gradually
description: Seven pre-trained object detection models were evaluated on a two-interval forced-choice
  peripheral detection task using uniform TTM-transformed COCO images at 5, 10, 15, and 20 degrees eccentricity.
  All models show a steep drop in average precision and critical eccentricity as eccentricity increases,
  reaching near-chance performance by 20 degrees. In contrast, 10 human subjects show a gradual, graceful
  decline in detection accuracy across the same eccentricities. Humans outperform all DNNs, with critical
  eccentricity thresholds more than 5 degrees greater than any detection model.
