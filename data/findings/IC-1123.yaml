key_metric: 'Art: Likert score 1.31 (erased) to 3.85 (CI); Objects: avg accuracy 13.68 to 68.8; ID:
  avg accuracy 12.52 to 67.13; NSFW: avg detected body parts 26.2 to 170.93; SD 2.0 (Brad Pitt): accuracy
  96.6% original, drops to 17.4%/28.2% with AC/SLD, recovers to 89.8%/54.4% with CI'
caveat: The attack requires white-box access to model weights and knowledge of the erasure method. SLD-max
  is the most resistant variant but degrades image quality on unrelated prompts. A small number of failure
  cases exist where CI does not fully recover the concept, but those models also produce artifacts on
  unrelated prompts.
