id: IC-1123
title: All seven published concept erasure methods applied to Stable Diffusion 1.4 can be circumvented
  by learned word embeddings, demonstrating that targeted concepts are input-filtered rather than truly
  removed from the model
description: The paper applies a concept inversion (CI) attack—learning a special word embedding via
  textual inversion—to seven published erasure methods (ESD, UCE, NP, SLD, SA, FMN, AC) applied to SD
  1.4. In every case, the learned embedding recovers the supposedly-erased concept with no weight modifications
  to the erased model. Across four concept categories (art style, object, identity, NSFW), the recovered
  outputs match or exceed the original SD 1.4 quality. The learned embeddings also transfer back to
  the unmodified SD 1.4, confirming that the erasure methods suppress the concept only for specific
  input embeddings rather than removing the underlying capability.
