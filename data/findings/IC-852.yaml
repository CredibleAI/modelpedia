id: IC-852
title: Intrinsic self-correction without external feedback consistently degrades reasoning accuracy
  across GPT-3.5-turbo, GPT-4, GPT-4-turbo, and LLaMA-2-70B-chat
description: The paper evaluates whether LLMs can improve their reasoning by reviewing and revising
  their own answers without any oracle label or external feedback. Across GSM8K, CommonsenseQA, and
  HotpotQA, every model tested shows a drop in accuracy after one or two rounds of self-correction.
  The degradation is most severe for LLaMA-2 (GSM8K drops from 62.0 to 36.5) and GPT-3.5 on CommonsenseQA
  (75.8 to 38.1). The authors attribute the drop to the model's inability to judge the correctness of
  its own reasoning, combined with the self-correction prompt biasing the model away from its initial
  (often correct) answer.
