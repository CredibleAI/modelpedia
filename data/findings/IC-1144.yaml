id: IC-1144
title: GPT-4 and GPT-3.5 produce high rates of irrelevant (fabricated) books when answering constraint
  queries from parametric knowledge, with a sharp phase transition at low author popularity
description: 'When asked to list books by a given author satisfying an additional constraint, both models
  output a substantial fraction of books not written by that author. GPT-4''s irrelevance rate is 0.26
  and GPT-3.5''s is 0.20 in the no-context condition. The paper identifies a ''phase transition'': for
  authors with 0-10 Wikidata sitelinks, irrelevance is very high, then it drops sharply and flattens
  out with no further improvement at higher popularity. The authors conjecture this reflects a threshold
  in training-time memorization.'
