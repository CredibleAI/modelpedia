id: IC-277
title: Open-source VLMs show a clear scaling trend in both average accuracy and reasoning robustness
  on DynaMath, with larger models performing substantially better
description: Among open-source models, increasing parameter size consistently improves both average-case
  accuracy and reasoning robustness. Qwen2-VL improves from 42.1% (7B) to 55.1% (72B) average accuracy,
  and InternVL2 improves from 39.7% (8B) to 54.0% (76B). The paper notes that closed-source models demonstrate
  greater robustness than open-source models overall, but within the open-source group, reasoning robustness
  scales with model size. Qwen2-VL-72B and InternVL2-76B outperform Gemini Pro 1.5 on reasoning robustness.
