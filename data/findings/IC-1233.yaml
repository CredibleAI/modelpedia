id: IC-1233
title: GPT-2 XL and GPT-J exhibit irreversible knowledge distortion after round-editing, with the effect
  being more severe when the edit target is semantically distant from the true labels
description: 'The paper applies round-edits (edit a fact to an intermediate value, then edit it back)
  to GPT-2 XL and GPT-J and measures how the probability distribution over all correct labels changes.
  All editing methods cause significant distortion: FT and MEND show the highest ignore rates (IR up
  to 96.43 for FT on GPT-J easy split), while ROME and MEMIT show lower but still substantial distortion
  (IR 67.41 and 56.91 respectively on GPT-2 XL easy). The distortion is worse in the ''hard'' setting
  where the edit target is semantically distant from the true labels. The authors'' proposed multi-label
  edit (MLE) reduces IR to 4.66 (GPT-2 XL easy) and 2.48 (GPT-J easy), confirming the distortion is
  a property of the editing process applied to the model''s knowledge structure.'
