id: IC-558
title: Guard models exhibit inconsistent calibration when classifying responses from different response
  model types, with ECE varying by up to 39 percentage points within a single model
description: 'On the HarmBench-adv set split by response model type (10 subsets: Baichuan2, Qwen, Solar,
  Llama2, Vicuna, Orca2, Koala, OpenChat, Starling, Zephyr), each guard model shows large variance in
  both F1 and ECE. For example, Llama-Guard''s ECE ranges from 10.5% (Llama2 responses) to 49.4% (Solar
  responses). The authors note that models trained on responses from a single model (Aegis on Mistral,
  Llama-Guard on internal Llama checkpoints) generalize worse than those trained on diverse response
  sets (HarmBench, WildGuard).'
