id: IC-519
title: MLLMs exhibit different skill sets than humans, correctly answering expert-level questions that
  all three human annotators miss while failing on easy questions humans answer correctly
description: 'The paper defines four difficulty levels based on 3 Amazon Turkers'' performance per question
  (easy: 3/3 correct, medium: 2/3, hard: 1/3, expert: 0/3). While MLLMs generally show decreasing accuracy
  with increasing difficulty, they also correctly answer expert-level questions that all three humans
  got wrong, particularly in business and health & medicine. Conversely, they sometimes fail on easy
  questions that all humans answered correctly. GPT-4V scores 92% on expert-level business questions
  but only 60% on easy-level art & sports questions, and 87% on expert-level health & medicine but 46%
  on easy-level embodied tasks.'
