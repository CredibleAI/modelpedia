id: IC-278
title: Claude-3.5 Sonnet and GPT-4o exhibit a memorization failure mode, outputting the same answer
  regardless of visual parameter changes in the problem
description: The paper identifies a phenomenon where VLMs provide the same answer to structurally identical
  questions with different visual parameters, indicating reliance on a memorized default rather than
  reading the specific input. For Claude-3.5 Sonnet, altering the period of a sinusoidal function (e.g.,
  from 2π to π or 4π) does not change its response, which consistently remains 2π; this accounts for
  4.1% of its 171 incorrect answers. For GPT-4o, a shifted absolute value function f(x)=|x-a| is consistently
  judged not differentiable at x=0 for 7 of 10 variants, with 90% repetition consistency on the failing
  variant, despite the sharp corner no longer being at x=0.
