caveat: The memorization phenomenon was identified qualitatively and the 4.1% figure is for Claude-3.5
  only; a systematic study across all models and all question types is noted as future work. A newly
  designed prompt explicitly instructing the model to avoid memorized answers did not resolve the issue.
