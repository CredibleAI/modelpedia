caveat: The factors in ImageNet-X are binary proxies defined by human annotators, not the true latent
  variables of the data generating process. The authors note this 'only provide[s] some supporting evidence
  for our theory on real data.' The VMF distributional assumption of the theory may not hold for real-world
  data.
