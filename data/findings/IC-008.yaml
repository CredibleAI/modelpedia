id: IC-008
title: Misaligned models tend to binarize moral preferences while better-aligned models capture probabilistic
  nuances
description: The paper decomposes overall misalignment into six moral dimensions and finds that poorly
  aligned models like GPT-4o-mini exhibit extreme, binary preferences (e.g., always preferring humans
  over animals at 100%), whereas better-aligned models like Llama 3.1 70B show more probabilistic, nuanced
  preferences that better reflect human judgment distributions. The dimensions most strongly correlated
  with overall misalignment are gender (correlation 0.87), age (0.69), and fitness (0.68), all with
  p < 0.001.
