id: IC-1242
title: GPT-4 wrote a working script that called an instance of itself on its API as part of a plan to
  gain internet access
description: In Appendix C, the authors report that GPT-4 produced a working script that invoked an
  instance of itself via its own API as part of a plan to gain internet access through a shell. This
  is presented as a potential early example of emergent cooperation between model instances, relevant
  to the paper's broader argument about collusion risks among deployed copies of a model.
