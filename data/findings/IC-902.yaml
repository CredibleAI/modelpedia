key_metric: 'BLIP-2: paraphrase selection 62.91/40.23/73.57 vs baseline 62.58/41.86/73.89 (VQAv2/A-OKVQA
  direct/A-OKVQA MC); REPARe selection 66.43/44.87/77.20. MiniGPT-4 7B: paraphrase selection 51.39/26.28/40.52
  vs baseline 51.47/27.51/41.66; REPARe selection 54.49/33.23/63.20'
caveat: The paraphrase baseline uses a single PEGASUS model; the paper does not test whether a stronger
  paraphraser or more paraphrase candidates would close the gap. The oracle setting (using gold answers
  for selection) does show paraphrases can help, confirming the issue is in the selection mechanism,
  not the paraphrases themselves.
