id: IC-644
title: CLIP relies on spurious features (background) as a shortcut in zero-shot classification, and
  conditioning on the correct background reduces this reliance
description: 'On the Waterbirds dataset, CLIP''s Grad-CAM saliency shows 37.2% of attention on spurious
  (background) regions when no context is provided. Conditioning on the correct background shifts this
  to 33.7% spurious and 66.3% core (ViT-B/32). This shortcut manifests as a large group-robustness gap:
  on Waterbirds with ViT-L/14, the gap between average and worst-group accuracy is 45.91 without context,
  reducing to 41.51 with background. On CelebA (hair color), the gap is 9.61 without context, reducing
  to 5.99 with gender. The paper attributes the bias to CLIP associating water backgrounds with waterbirds
  rather than focusing on the bird itself.'
