id: IC-487
title: Including sub-questions in the prompt improves LLM performance on multi-hop QA tasks
description: 'An ablation study removes sub-questions from the prompt and asks LLMs to produce only
  the final answer, under a chain-of-thought setting. All models show lower EM and F1 without sub-questions.
  For GPT-4 on 2-hop, EM drops from 53.2 to 43.8 and F1 from 67.7 to 65.2; for GPT-3.5, EM drops from
  40.4 to 34.3 and F1 from 56.9 to 51.3. The effect is consistent across all nine models and all hop
  counts, with the largest absolute gains seen in weaker models such as Gemini-Pro (2-hop EM: 25.2 without
  vs 34.6 with sub-questions).'
