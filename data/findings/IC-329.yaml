id: IC-329
title: GPT-4o is more robust to confidence-elicitation-guided word substitution attacks than open-source
  LLMs, with lower attack success rates and better confidence calibration
description: In Appendix G, the paper tests GPT-4o (2024-08-06) via the OpenAI API on the same three
  datasets. GPT-4o achieves lower ASR under CEAttack (14.58% SST-2, 9.2% AG-News, 29.69% StrategyQA)
  compared to Llama-3-8B-Instruct (19.73%, 30.74%, 45.67%). GPT-4o also shows the best calibration with
  ECE of 0.0286 on SST-2. The authors attribute the greater robustness to the model's larger scale,
  noting that 'their larger scale makes them more robust to semantic perturbations.'
