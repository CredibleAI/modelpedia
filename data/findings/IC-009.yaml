id: IC-009
title: LLM moral preferences show significant language sensitivity but not inequality toward low-resource
  languages
description: The paper measures language sensitivity by computing the standard deviation of preference
  vectors across 107 languages and performs k-means clustering to identify language groups with similar
  preference patterns. Sensitivity scores range from 14.7 (Phi-3.5 MoE) to 24.7 (Gemma 2 9B), indicating
  substantial variation across languages. However, correlation between misalignment scores and number
  of speakers per language is near zero for most models, challenging the 'language inequality' hypothesis
  for this task.
