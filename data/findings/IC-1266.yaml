id: IC-1266
title: For GPT-3, white-box token-probability methods outperform black-box verbalized confidence in
  uncertainty estimation, but the gap is narrow (0.522–0.605 AUROC) and both remain near random
description: On GPT-3, three token-probability-based white-box methods (sequence probability, length-normalized
  sequence probability, key token probability) are compared against black-box verbalized confidence
  across five datasets. White-box methods consistently achieve lower ECE and higher AUROC, with length-normalized
  sequence probability and key token probability being most effective. However, the AUROC gap between
  the best white-box and best black-box method is only 0.522 to 0.605, and nearly all methods across
  datasets range between 0.5 and 0.6 in AUROC, indicating that neither access mode yields reliable uncertainty
  estimates from GPT-3.
