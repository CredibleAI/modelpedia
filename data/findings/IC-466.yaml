id: IC-466
title: GPT-4o's evaluation reliability degrades when used as the final judge in a collective thought
  pipeline that aggregates reviews from less reliable VLMs
description: When GPT-4o is used as the final judge in a collective thought pipeline that first collects
  reviews from Llama-VID, Video-ChatGPT, Video-LLaVA, and GPT-4o mini, its agreement with the agent-debate
  reference drops to an average range of 2.72 to 42.53 across dimensions, which is lower than GPT-4o's
  solo performance (e.g., 60.38, 55.18). A mixture-of-judges strategy that selects judges by per-dimension
  reliability scores also fails to recover GPT-4o's solo performance (average range 2.72 to 60.70).
  The paper concludes that GPT-4o is vulnerable to noise introduced by less reliable judges in the collective.
