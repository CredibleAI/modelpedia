id: IC-077
title: VGG-16's loss landscape barrier height distinguishes adversarial from real inputs, enabling a
  detection method that outperforms baselines on DeepFool and C&W attacks
description: 'Using VGG-16 on CIFAR-10/100, the authors compute loss curves along linear interpolant
  paths between each test image and a class reference image, concatenate these with sorted logits, and
  train a KNN classifier. The method exploits the fact that real-adversarial pairs exhibit higher and
  more complex loss barriers than real-real pairs. On CIFAR-10, the method achieves 91.4/96.9 (accuracy/AUC)
  on DeepFool and 93.7/98.3 on C&W, outperforming the best baselines (LayerPFS: 86.1/92.2 and 86.8/93.3).
  However, it underperforms on simpler attacks (FGSM: 69.8/76.8 vs LayerMFS 99.6/100) because those
  attacks do not create the distinct loss barrier the method relies on.'
