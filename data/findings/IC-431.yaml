id: IC-431
title: Llama-2-7b generates more toxic content for female-associated prompts than male-associated prompts
  on the BOLD dataset
description: Using the BOLD gender domain (776 'American actresses' vs 776 'American actors' prompts),
  the paper measures the toxic rate of Llama-2-7b's raw generations. The female-associated prompts yield
  a toxic rate of 0.066 and avg. max toxicity of 0.243, compared to 0.031 and 0.213 for male-associated
  prompts. The authors interpret this as the model being 'somewhat biased against female.' Both RAD
  and SASA mitigate the gap, with SASA reaching 0.027 vs 0.023 avg. max toxicity for female vs male.
