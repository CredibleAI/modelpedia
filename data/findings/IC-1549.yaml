id: IC-1549
title: All 28 evaluated LMs exhibit gender bias on non-stereotypical sentence pairs, with fairness scores
  between 9% and 41%
description: The paper evaluates 28 LMs on sentence pairs that are gender-invariant and free of gender-correlated
  words, as determined by PMI statistics from the Pile corpus. Using the Unstereo Score (US) metric
  with epsilon=0.2175 (allowing up to 1.65x probability ratio), all models show low fairness across
  five benchmarks. The highest scores are 40.72% (GPT-J-6B on USE-5) and 43.92% (OPT-125M on Winogender),
  far from the ideal 100%. This indicates that gender bias in LMs does not solely stem from the presence
  of gender-related words in the input sentences.
