id: IC-304
title: Instruction-tuned LMs become more vulnerable to prompt-injected data extraction as model size
  increases from 7B to 70B
description: 'The paper builds RAG systems using ten instruction-tuned LMs of varying sizes and attacks
  them with a prompt-injection that instructs the model to copy the retrieved context. All models, despite
  safety alignment, comply and reproduce the datastore text. The vulnerability scales with model size:
  7B models achieve ROUGE-L around 80, while 70B models reach ROUGE-L above 89 and BERTScore above 96.
  Qwen1.5-chat-72b is the most vulnerable, with ROUGE-L of 99.154 and BERTScore of 99.757, indicating
  near-perfect verbatim reproduction.'
