id: IC-358
title: GPT-2-small and Mistral 7B contain circular representations of days of the week and months of
  the year in their internal activations, discovered via SAE dictionary element clustering
description: The authors train or obtain sparse autoencoders on GPT-2-small (all layers, from Bloom
  2024) and Mistral 7B (layers 8, 16, 24, trained by the authors on 1B+ tokens). By clustering SAE dictionary
  elements by cosine similarity and reconstructing activations within each cluster, they find that days
  of the week, months of the year, and (in GPT-2) years of the 20th century are arranged in circular
  order in the PCA projections of the reconstructed activations. The days-of-week cluster in GPT-2-small
  scores m_ε(f)=0.4750 and s(f)=0.9506 on the irreducibility tests, ranking 9th out of 1000 clusters
  by the combined metric.
