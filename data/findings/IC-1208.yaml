id: IC-1208
title: Larger LLMs (Llama-2-13B) require more data samples for successful backdoor injection via parameter
  editing compared to smaller models (GPT-2-XL 1.5B)
description: 'The paper compares the number of data instances needed to achieve high attack success
  rate when injecting a backdoor into GPT-2-XL (1.5B), Llama-2-7B, and Llama-2-13B on AG News and ConvSent
  tasks. While all three models can be backdoored with 15 samples, the ASR curve for the 1.5B model
  rises more steeply: with 5-11 samples, GPT-2-XL achieves considerably higher ASR than Llama-2-13B,
  indicating that larger models distribute the trigger-target association more broadly and thus require
  more editing instances to establish the shortcut.'
