id: IC-433
title: LLMs exhibit a non-monotonic ID-OOD performance gap (generalization valley) that peaks at intermediate
  task complexity
description: Across 20 algorithmic tasks spanning five time-complexity levels, the accuracy gap between
  in-distribution and out-of-distribution data first widens as task complexity increases, reaches a
  peak (the critical complexity), and then narrows. This pattern is observed consistently across model
  families including Qwen 1.5, Llama 3/3.1/3.2, Gemma 2, Claude 3, and GPT-4o. At the peak, models perform
  well on familiar (ID) inputs but degrade sharply on novel (OOD) inputs, indicating over-reliance on
  memorized patterns rather than true generalization. Beyond the peak, both ID and OOD accuracy decline,
  reflecting the model's inability to handle the task at all.
