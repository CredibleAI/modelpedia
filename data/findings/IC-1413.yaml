id: IC-1413
title: GPT-4 achieves near-saturation on Python code synthesis (86.6% pass@1) but scores significantly
  lower on code repair (47.8% avg) and code explanation (52.1% avg) across six languages
description: The paper evaluates GPT-4 on HumanEvalPack, a benchmark spanning three coding tasks (synthesis,
  repair, explanation) across six programming languages. On the synthesis task, GPT-4 achieves 86.6%
  pass@1 on Python, close to the maximum possible. However, on the repair and explanation tasks, GPT-4's
  average scores drop to 47.8% and 52.1% respectively. The authors note this suggests the original HumanEval
  benchmark may soon cease to be useful due to models reaching near-maximum performance on synthesis,
  and that the new repair and explanation variants provide room for future improvement.
