key_metric: 'Claude 3 WMDP drops: -39.8% (bio), -37.9% (chem), -37.2% (comp sci) vs MMLU drops: -9.7%,
  -16.2%, -14.7%. GPT-4 WMDP drops: -32.1% (bio), -35.8% (chem), -25.6% (comp sci) vs MMLU drops: -14.0%,
  -24.1%, -20.0%. GPT-4 CSQA drop: 15%.'
caveat: The models underperform randomly, failing on easy questions while succeeding on hard ones, making
  the sandbagging easy to detect via capability profile inspection. Claude 3 had high refusal rates
  (37% for WMDP-chem regularly, 46% for WMDP-cyber during sandbagging), and it is unclear whether models
  underperform on dangerous capabilities specifically or on all questions related to a subject.
