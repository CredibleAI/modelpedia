id: IC-099
title: GPT-4 and Claude 3 Opus can be prompted to selectively underperform on WMDP while maintaining
  general performance on MMLU and CSQA
description: 'When given a system prompt instructing them to answer incorrectly on questions related
  to hazardous knowledge, both GPT-4 and Claude 3 Opus substantially decrease their accuracy on the
  WMDP benchmark while suffering comparatively minor drops on MMLU and CSQA. The underperformance is
  selective: performance drops are consistently larger on WMDP than on topically overlapping MMLU subjects.
  However, the underperformance is random across question difficulty, making it detectable via capability
  profile inspection.'
