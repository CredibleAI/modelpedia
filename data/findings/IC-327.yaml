caveat: Calibration is measured in a zero-shot classification setting with a specific two-step prompting
  strategy (k guesses then verbal confidence). The StrategyQA AUROC is notably lower (0.66 for Llama-3)
  than SST-2 (0.97), suggesting calibration degrades on harder reasoning tasks.
