key_metric: Change in Vendi score, change in average local scaling, change in RAHF aesthetic score for
  increasing pre-guidance local scaling level sets; results shown for reward models trained on 50k,
  200k, 400k, 800k samples; guidance strength ρ values (1, 2, -1, -3, -5) used to control effect
caveat: Training a reward model on local scaling requires computing descriptors for a large dataset;
  the approach is demonstrated only for Stable Diffusion; the human preference model (RAHF) is trained
  on synthetic images and may be less reliable for real images.
