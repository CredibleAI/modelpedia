id: IC-024
title: Reward model trained on local scaling of Stable Diffusion can guide generation to increase diversity
  and aesthetic scores
description: The paper trains a reward model to predict local scaling level sets for Stable Diffusion.
  Using this reward model with universal guidance during the reverse diffusion process, the authors
  show they can increase or decrease the local scaling of generated images. Maximizing the reward leads
  to added texture, sharpness, contrast, and higher diversity (Vendi score) and human preference scores,
  while minimizing it leads to blurring and loss of detail. The reward model is trained on 50k to 800k
  samples from ImageNet latents.
