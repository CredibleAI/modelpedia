id: IC-510
title: Qwen2-7B and Llama3-8B score near-random on textual temporal reasoning tasks while Qwen2-72B,
  Llama3-70B, and GPT-4o achieve near-perfect accuracy, showing temporal reasoning in LLMs is scale-dependent
  and emerges only above ~70B parameters
description: The paper probes the temporal reasoning ability of LLMs by presenting textual frame captions
  (generated by GPT-4o) alongside multiple-choice temporal questions covering order, attribute change,
  temporal referring, and temporal grounding. Small LLMs (Qwen2-7B, Llama3-8B) score near random on
  the attribute task (67.4% and 52.8%) and well below ceiling on referring and grounding (68.0-83.1%).
  In contrast, large LLMs (Qwen2-72B, Llama3-70B, GPT-4o) score above 97% on referring and grounding.
  Meanwhile, simple LSTM probes trained on the visual features of released video LLMs (LongVA-7B, ViLA-8B)
  achieve 88.9-96.6% accuracy, demonstrating the visual encoder captures temporal information adequately.
  The authors conclude the LLM backbone, not the visual encoder, is the primary bottleneck for temporal
  reasoning in video LLMs.
