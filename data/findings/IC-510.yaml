  99.1, order 99.8; Llama3-70B: attribute 65.3, referring 97.6, grounding 98.2, order 92.2; GPT-4o:
  attribute 69.6, referring 99.8, grounding 99.4, order 99.8; LSTM probe on LongVA-7B visual features:
  88.9, 92.7, 98.2, 96.4; LSTM probe on ViLA-8B visual features: 92.8, 96.1, 94.9, 96.6'
caveat: The probing uses synthesized videos with controlled, simple temporal aspects (e.g., two or three
  concatenated clips, brightness changes). The attribute task has only 2 classes, so random baseline
  is 50%. The authors note the temporal concept scope is limited to four dimensions and that motion-related
  changes still need further investigation.
