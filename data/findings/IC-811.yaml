id: IC-811
title: Alpaca's 52k instruction-tuning data is predominantly low-quality (only 17.75% score ≥ 4.5 on
  accuracy), yet the full 52k data still yields higher MMLU scores than the filtered 9k subset for both
  7b and 13b variants
description: The paper rates all 52,002 Alpaca training samples using ChatGPT as an auto-grader on the
  accuracy dimension. Only 9,229 samples (17.75%) score at or above the 4.5 threshold, meaning the vast
  majority of Alpaca's training data contains incorrect or irrelevant responses. Despite this, Alpaca-7b
  trained on the full 52k data scores 40.86 on MMLU versus 38.78 for the model trained on the filtered
  9k, and Alpaca-13b(52k) scores 47.89 versus 46.12 for 13b(9k). This shows that while the data quality
  is poor, the additional quantity of even low-quality data still provides a marginal benefit on knowledge-intensive
  benchmarks, even as it degrades instruction-following performance on the four human-instruction test
  sets.
