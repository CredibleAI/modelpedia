key_metric: '9,229/52,002 samples (17.75%) score ≥ 4.5; MMLU: 7b(52k)=40.86 vs 7b(9k)=38.78, 13b(52k)=47.89
  vs 13b(9k)=46.12; BBH: 7b(52k)=33.01 vs 7b(9k)=33.76, 13b(52k)=38.67 vs 13b(9k)=38.92'
caveat: The quality rating is performed by a single LLM (ChatGPT) on a single dimension (accuracy);
  the paper acknowledges in appendix A.5 that using 'helpfulness' as the dimension yields different
  filtering results. The MMLU advantage of 52k over 9k is small (1.88 and 1.77 points) and the 9k model
  actually outperforms 52k on BBH.
