caveat: The autointerpretability metric relies on GPT-4/GPT-3.5 as judges, and the authors note that
  current LLMs are limited in the kinds of patterns they can find (e.g., patterns centred on next/previous
  tokens). The fixed hyperparameters may not be optimal for later layers.
