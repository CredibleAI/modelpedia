id: IC-453
title: Hidden representation trajectories in trained LLMs exhibit considerable linearity (mean LSS 4.25)
  compared to 6.54 at initialization, and linearity increases with training
description: The line-shape score (LSS) measures how close a token's trajectory through the layers is
  to a straight line. Across 1,200 prompts from the Open LLM Leaderboard datasets, trained LLMs show
  a mean LSS of 4.25, compared to 6.54 for randomly initialized models. The low variation across benchmark
  prompts indicates robustness. In Pythia 12B, LSS decreases (linearity increases) as a function of
  training checkpoint, and this improvement is visible at multiple depths (layers 5, 15, 30). The paper
  notes this aligns with behaviour previously observed in ResNets.
