id: IC-082
title: GPT-3.5, GPT-4o, Claude-3.5-Sonnet, and Llama-3.1-8B produce explanations on the BBQ social bias
  task that are systematically unfaithful for identity and behavior concepts while remaining faithful
  for context concepts, with specific patterns of hiding safety-measure influence and social bias
description: 'Using a Bayesian hierarchical model to estimate causal concept effects (CE) and explanation-implied
  effects (EE) via LLM-generated counterfactuals, the paper measures how well each model''s natural-language
  explanations align with the concepts that actually drive its answers. On 30 BBQ questions, all four
  models show high faithfulness for context concepts (low CE, low EE) but low faithfulness for identity
  and behavior concepts. GPT-3.5 achieves the highest dataset-level faithfulness (f(x)=0.75), followed
  by Llama-3.1-8B (0.81), Claude-3.5-Sonnet (0.62), and GPT-4o (0.56). Two specific unfaithfulness patterns
  are identified: (1) GPT models refuse to answer when social identity information is present (a safety-alignment
  effect) but their explanations attribute the refusal to question ambiguity rather than to the identity
  information; (2) GPT models'' answers shift when identity values are swapped (e.g., selecting the
  ''rich'' person more often), yet their explanations never mention the identity concept.'
