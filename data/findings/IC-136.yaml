id: IC-136
title: LRE quality metrics from OLMo-7B predict pretraining term frequencies in GPT-J (trained on different
  data) with approximately 70% within-magnitude accuracy for object frequencies, outperforming log-probability-only
  features by about 30%
description: The authors fit a random forest regression on OLMo-7B LRE features (faithfulness, causality,
  hard causality, faith probability) plus log-probability and accuracy features to predict how often
  terms appear in the pretraining corpus. When the regression is trained on OLMo-7B and evaluated on
  LRE features extracted from GPT-J (which was trained on The Pile, a different corpus), it achieves
  0.65 within-magnitude accuracy for object frequency predictions versus 0.42 for log-probability-only
  features. Hard causality is the most important single feature, contributing about 15% accuracy in
  permutation tests. The signal is much stronger for object frequencies than for subject-object co-occurrences.
