key_metric: 'Within-magnitude accuracy (object occs, eval on GPT-J): LRE 0.65±0.12 vs logprob 0.42±0.10
  vs mean baseline 0.31±0.15; MAE in log space: 2.1 (LRE) vs 4.2 (LM-only) for object, 1.9 (LRE) vs
  2.3 (LM-only) for subj-obj; hard causality permutation importance ~15% accuracy; faithfulness ~5%'
caveat: The authors note the method is 'relatively worse at predicting subject-object co-occurrences
  than object occurrences' and 'fails to account for the harder task.' They caution against 'drawing
  strong conclusions without additional information' and state they 'are not able to make any guarantees
  on its efficacy in settings not shown here.' Only two models are tested for cross-model transfer.
