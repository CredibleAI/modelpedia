id: IC-129
title: 'Sycophancy in VLMs increases with model size: InternVL-1.5-26B (95.8/89.6/86.5%) is more sycophantic
  than InternVL-1.5-2B (75.6/66.8/98.1%), and InternLM-XComposer2-VL-7B (36.7/28.0/50.7%) more than
  the 1.8B variant (33.3/20.2/33.0%)'
description: The paper compares two pairs of VLMs that share identical training data but differ in size.
  For InternVL-1.5, the 26B variant shows higher sycophancy than the 2B variant across all three tones.
  For InternLM-XComposer2-VL, the 7B variant also shows higher sycophancy than the 1.8B variant. The
  authors conclude that sycophancy tends to increase with model size, consistent with prior findings
  in text-only LLMs.
