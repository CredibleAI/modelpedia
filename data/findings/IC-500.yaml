id: IC-500
title: GPT-4o, Claude 3.5 Sonnet, Gemini 1.5 Pro, and Llama 3.1 405B solve multi-step retrieval problems
  without fine-tuning, achieving near-perfect accuracy for chains of up to 5 steps
description: The paper introduces the retrieval problem, a task requiring chained multi-step retrieval
  (e.g., a=7, b=a, c=b, d=c, what is d?). Four state-of-the-art LLMs are evaluated zero-shot on 500
  randomly generated questions across five formulations (equations, lives-with, kingdoms, functions,
  relatives) with no fine-tuning. All four models achieve near-perfect accuracy on the equations formulation
  for retrieval chains of up to 5 steps (d ≤ 5), and strong performance on the lives-with, kingdoms,
  functions, and relatives formulations at d = 5. Accuracy degrades as the chain length increases beyond
  5 steps, with all models falling toward random-guessing levels at d = 13.
