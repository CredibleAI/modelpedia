key_metric: 98 out of 106 pairs of tasks and models demonstrate request-patching with at least 70% normalized
  probability of r1(c2); l2 (peak request-patching layer) in middle layers; for Llama 2 70B, l2 concentrated
  in layers 39-43 across all tasks; normalized IIA > 85% in 91 out of 106 settings
caveat: The phenomenon is absent in the abstract induction task on large models, hypothesised to be
  due to increased model width and task simplicity. The 80% threshold for defining l1 and l3 is arbitrary.
