id: IC-372
title: Language models universally decompose retrieval tasks into request processing in middle layers
  and entity retrieval in late layers at the last token position
description: 'Using residual stream patching (a single-input interchange intervention on the residual
  stream at the last token position), the authors show that across 18 open-source LMs from 125M to 70B
  parameters and 6 task domains, patching the residual stream at middle layers causes the model to output
  the request from one input applied to the context of another (request-patching). This reveals a modular
  decomposition: early layers are undisturbed, middle layers encode the request, and late layers perform
  the retrieval. The phenomenon is robust across model families, task types, and prompt templates, with
  98 of 106 model-task pairs showing at least 70% normalized probability of the cross-combined label
  token.'
