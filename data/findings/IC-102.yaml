id: IC-102
title: GPT-4o's spatial understanding degrades when depth maps are provided as additional input on SpatialBench
description: On the SpatialBench benchmark, GPT-4o's average score drops from 67.0 (RGB only) to 65.7
  (RGB + depth map) when depth maps are added as extra input. The degradation is driven primarily by
  the 'existence' sub-task, which falls from 70.6 to 61.8, while 'counting' actually improves from 85.0
  to 90.0. The authors explicitly state that 'even gpt-4o cannot fully understand depth maps,' indicating
  that the additional depth channel does not help and in some cases harms the model's spatial reasoning.
