id: IC-257
title: 327 DNNs approach or exceed human accuracy on object depth order but are near chance on VPT-basic,
  while humans show the opposite pattern
description: 'The paper linearly probed or text-prompted 327 released DNNs on the 3D-PC benchmark. On
  the depth order task, 15 DNNs fell within the human accuracy confidence interval and 3 outperformed
  humans (74.73%). On VPT-basic, the best DNN (BEiT trained on ImageNet-21k) reached only 53.82% accuracy,
  while humans scored 86.82%. Commercial VLMs were at chance: ChatGPT4 52%, Gemini 52%, Claude 3 50%.
  The pattern is inverted relative to humans, for whom VPT-basic is easier than depth order.'
