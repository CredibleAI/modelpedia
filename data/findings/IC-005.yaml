key_metric: 'On the AHA dataset (test), GPT-4o-ICL achieves ROUGE-L 0.226, cosine similarity 0.380,
  binary success 0.611, fuzzy match 0.776. On Maniskill-Fail: ROUGE-L 0.341, cosine similarity 0.429,
  binary success 0.971, fuzzy match 0.630. On Robofail: ROUGE-L 0.236, cosine similarity 0.429, binary
  success 0.571, fuzzy match 0.418.'
caveat: The paper notes that AHA was fine-tuned specifically for this failure reasoning task, while
  GPT-4o is a general-purpose VLM evaluated in a zero-shot or few-shot setting, which may not be its
  optimal use case.
