id: IC-005
title: GPT-4o underperforms AHA and other VLMs in detecting and reasoning about robotic manipulation
  failures across multiple datasets.
description: 'The paper benchmarks several state-of-the-art VLMs, including GPT-4o, on their ability
  to detect failures and provide natural language reasoning for those failures in robotic manipulation
  tasks. The evaluation is done across three datasets: a held-out portion of the AHA dataset, the Maniskill-Fail
  dataset, and the Robofail dataset. Metrics include ROUGE-L, cosine similarity, binary success rate,
  and fuzzy matching. The results show that GPT-4o, even with 5-shot in-context learning, is outperformed
  by the authors'' fine-tuned model, AHA, on nearly all metrics and datasets.'
