key_metric: 'Chinchilla 70B raw compression: 48.0% (ImageNet), 21.0% (Librispeech); Llama 2 7B: 53.4%
  (ImageNet), 23.1% (Librispeech); PNG: 58.5% (ImageNet); FLAC: 30.3% (Librispeech); all chunked 2048-byte
  sequences, 1 GB datasets'
caveat: The adjusted compression rate (accounting for model parameter size in float16) is extremely
  poor for these models (e.g., 14048.0% for Chinchilla 70B on ImageNet), meaning the raw compression
  advantage only holds when model size is not included in the code length. The paper notes it is possible,
  though unlikely, that some image or audio data was encoded into text in the training corpus.
