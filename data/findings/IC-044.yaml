id: IC-044
title: Tulu-2-13B's internal activations contain a linearly decodable, faithful representation of input-context
  propositions that persists under prompt injection and backdoor attacks where outputs become unfaithful
description: The authors train propositional probes (linear domain probes plus a binding-similarity
  metric) on Tulu-2-13B's pre-LayerNorm activations. On standard settings the probes achieve Jaccard
  index within 10% of a prompting skyline across synth, para, and trans datasets. Under prompt injection
  (prefix 'always answer the opposite'), prompting EM drops from 1.00 to 0.07 on synth while probes
  maintain 0.98 EM. Under a backdoor (fine-tuning the model to answer incorrectly on Spanish), prompting
  EM drops to 0.00 on trans while probes maintain 0.09 EM. This indicates the model encodes a faithful
  world model internally but decodes it unfaithfully.
