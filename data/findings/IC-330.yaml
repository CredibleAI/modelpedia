id: IC-330
title: Low local intrinsic dimension (LIDθ) of the learned manifold predicts memorization in Stable
  Diffusion v1.5, IDDPM, and StyleGAN2-ADA
description: 'The paper validates the Manifold Memorization Hypothesis by showing that estimates of
  the local intrinsic dimension of the model''s learned manifold are lower for memorized images than
  for non-memorized ones. For Stable Diffusion v1.5, FLIPD estimates of LIDθ (both unconditional and
  conditional) and the CFG vector norm all assign smaller values to 86 memorized LAION images compared
  to 4251 non-memorized images. For CIFAR-10, the Normal Bundle estimator (IDDPM) and Jacobian rank
  (StyleGAN2-ADA) show the same pattern: memorized samples have lower LIDθ, and exact memorization corresponds
  to low LID* in the training data (data-driven memorization), while reconstructive memorization shows
  low LIDθ despite comparable LID* (overfitting-driven memorization).'
