key_metric: 'GPT-2 (124M) m=512: ES 99.7%, GS 96.1%, LS 16.5%; GPT-J (6B) m=8192: ES 99.7%, GS 92.8%,
  LS 25.1%; ''As the model scale increases, the performance of all editing methods improve''; ''malmen
  can edit more than two orders of magnitude more facts than mend on gpt-j with similar performance'''
caveat: The three models have different architectures (decoder-only GPT-2, encoder-decoder T5-XL, decoder-only
  GPT-J), so the scale trend is confounded with architecture. The comparison is also at different numbers
  of edits (512 vs 8192), and the paper does not isolate model scale from architecture as a variable.
