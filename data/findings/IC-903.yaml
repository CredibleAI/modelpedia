id: IC-903
title: Knowledge editing performance (ES, GS, LS) improves as model scale increases from GPT-2 (124M)
  to T5-XL (2.8B) to GPT-J (6B) across all editing methods
description: 'The paper measures editing success, generalization success, and locality success as the
  number of simultaneous edits scales from 2^5 to 2^14 on three released LLMs of increasing size. The
  authors explicitly note that ''as the model scale increases, the performance of all editing methods
  improve.'' On GPT-J, MALMEN maintains ES of 99.7% and GS of 92.8% at 8192 edits, while on GPT-2 at
  512 edits the same method achieves ES 99.7% and GS 96.1%. Locality also improves: LS rises from 16.5%
  on GPT-2 (m=512) to 25.1% on GPT-J (m=8192). The observation is made in the context of a specific
  editing method but is stated to hold across all methods tested.'
