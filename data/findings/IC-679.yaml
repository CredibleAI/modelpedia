id: IC-679
title: CLIP relies on background/location as a spurious cue for bird classification, and ablating geolocation
  heads improves worst-group accuracy by 25.2%
description: On the Waterbirds dataset, where image background (water/land) is a spurious correlate
  of bird type (waterbird/landbird), the paper identifies 'geolocation' and 'image-location' heads via
  TextSpan and mean-ablates their direct contributions. This increases worst-group accuracy from 48%
  to 73% for ViT-L (25.2% gain), without any additional training. A baseline of ablating 10 random heads
  (best of 5 trials) does not achieve this improvement. Per-class results show the spurious correlation
  between background and class is specifically reduced.
