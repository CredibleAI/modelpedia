id: IC-313
title: All four LLM backbones fail to detect a planted linear trend in incident resolution time when
  the slope is below 0.1, and detection rates diverge sharply above that threshold
description: The paper varies the slope of a planted linear trend in dataset 2 from -0.1 to 0.9 and
  measures whether each LLM backbone, within AgentPoirot, discovers the insight. All models (GPT-4o,
  GPT-4-turbo, GPT-3.5-turbo, Llama-3-70b) fail to detect the trend when the slope is below 0.1, including
  negative slopes, with no false positives. Above slope 0.1, GPT-4o and GPT-4-turbo discover the insight
  every time, Llama-3-70b discovers it nearly half the time, and GPT-3.5-turbo has the lowest and most
  variable detection rate.
