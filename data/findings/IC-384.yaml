id: IC-384
title: Llama-3-8B-Instruct shows larger absolute gains from prompt optimization than the stronger Gemma-2-9B-IT,
  indicating that prompt-optimization benefit is inversely related to base model capability
description: The paper measures the improvement from zero-shot chain-of-thought to GREATER-optimized
  prompts on GSM8K, BBH, and FOLIO for two released models. Llama-3-8B-Instruct gains +3.0 on GSM8K
  (79.6 to 82.6), +6.5 on BBH (62.2 to 68.7), and +4.0 on FOLIO (58.6 to 62.6). Gemma-2-9B-IT, the stronger
  model, gains only +0.8 on GSM8K (88.6 to 89.4), +4.9 on BBH (71.7 to 76.6), and +4.1 on FOLIO (65.0
  to 69.1). The authors explicitly state that 'stronger models get lesser benefit from prompt optimization,
  as good prompts only offset for lower capabilities of weaker models.' This pattern is consistent across
  all three benchmarks and both models.
