id: IC-1484
title: GP-UNIT's FID degrades under noisy inputs in reference-guided mode but paradoxically improves
  in latent-guided mode
description: The paper measures GP-UNIT's output quality under five noise types (Gaussian, uniform,
  color, Laplacian, salt-and-pepper) at six intensity levels. In the reference-guided setting, FID degrades
  from 17.82 (clean) to 36.84 (Gaussian s6), a clear failure mode. In the latent-guided setting, however,
  FID starts at 22.82 (clean) and actually decreases to 21.76 at Gaussian s6, with KID dropping from
  9.67 to 7.88. The authors flag this as 'intriguing behavior' and state it will be the subject of future
  investigation, noting that GP-UNIT integrates an additional latent code or reference image that their
  theoretical framework does not account for.
