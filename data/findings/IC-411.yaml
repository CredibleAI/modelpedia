id: IC-411
title: Llama2-7B, Llama3-8B, and Mistral-v0.3-7B do not reason with edited knowledge in multi-hop questions,
  as editing methods mostly underperform pre-edit portability scores
description: Portability is measured by whether the model can answer multi-hop questions (2-6 hops)
  that depend on the edited single-hop fact. The paper finds that except for ICE which may bring marginal
  improvement, all other editing techniques underperform the pre-edit portability scores. There is a
  sharp decrease from single-hop to multi-hop for all methods. The authors hypothesize that the LLMs
  directly memorize answers to multi-hop questions rather than reasoning from the single-hop knowledge,
  which is why editing the single-hop fact does not propagate.
