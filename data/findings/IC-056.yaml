id: IC-056
title: Influence scores of pretraining documents correlate across reasoning queries of the same type,
  indicating Command R 7B and 35B rely on shared procedural knowledge rather than retrieving specific
  answers
description: Using EK-FAC influence functions, the authors rank 5 million pretraining documents by their
  influence on model completions for 40 reasoning and 40 factual queries. For reasoning queries of the
  same mathematical type (e.g., calculating slope between different point pairs), the influence scores
  of all 5 million documents show a strongly significant positive Pearson correlation (p < 4e-8), while
  factual queries show no such correlation (p ~ 4e-3). Qualitative inspection confirms the top influential
  documents for slope queries contain code or math implementing the slope formula, appearing in the
  top 100 documents for 16/20 queries (7B) and all 20 queries (35B). Control queries that are superficially
  similar but require no reasoning show no such correlation.
