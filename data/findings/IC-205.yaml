id: IC-205
title: Gemma 2's SAE features exhibit depth-dependent organization, with polysemantic features in early
  layers and persistent, matchable features in later layers
description: Using GemmaScope SAEs on each layer of Gemma 2 2B, the authors match features across layers
  by minimizing MSE between folded SAE parameters and validate matches with GPT-4o mini LLM evaluation
  of feature descriptions. The number of 'same' features (identical meaning) remains near zero in initial
  layers and begins to increase only after the 10th layer. Feature similarity, measured by LLM score,
  persists for approximately five layers before declining. Layer pruning experiments confirm that matched
  features can approximate the next hidden state with minimal cross-entropy loss beyond the 10th layer.
  Similar depth-dependent patterns are observed for Llama-3.1-8B in the appendix.
