caveat: The zero-shot evaluation uses the MI-Zero adaptation (mean-based aggregation, four fixed survival
  prompts), which the authors designed; a different zero-shot protocol might yield different results.
  The paper does not test CONCH on other survival tasks or cancer types beyond the five TCGA datasets.
