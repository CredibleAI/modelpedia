id: IC-531
title: CONCH's zero-shot encoders cannot discriminate survival risk, achieving near-random concordance
  index on pathology whole-slide images
description: The paper evaluates CONCH's pretrained image and text encoders in a zero-shot survival
  analysis setting using the MI-Zero protocol, without any supervised fine-tuning. Across five TCGA
  cancer datasets (2,831 patients), the average concordance index is only 0.54, close to the 0.5 random-guessing
  baseline. The failure is most severe on GBMLGG, where CI drops to 0.3842, below random. The authors
  conclude that CONCH's pretraining does not encode survival-relevant prognostic information sufficiently
  for zero-shot transfer to time-to-event prediction, necessitating supervised fine-tuning.
