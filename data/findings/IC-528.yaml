id: IC-528
title: The knowledge localization assumption fails for a large fraction of facts in GPT-2, Llama2-7B,
  and Llama3-8B, with 77% of facts classified as inconsistent knowledge in Llama3-8B
description: 'The paper measures whether rephrased queries for the same fact activate the same set of
  knowledge neurons (the KL assumption). Using three independent localization methods (Integrated Gradients,
  Sequential IG, AMIG) on the ParaRel dataset, the authors compute a consistency score for each fact.
  A large proportion of facts show low consistency, meaning the neurons activated differ across paraphrases.
  In Llama3-8B with a static threshold, 77% of facts are classified as inconsistent knowledge (Ki).
  Modification experiments confirm this: editing the query-specific neurons for Ki facts yields near-zero
  generalization to neighbor queries (gen=0.04 for Llama3-8B), while editing the union of all neighbor
  neurons causes a 105% perplexity increase.'
