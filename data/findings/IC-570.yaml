caveat: 'The authors state: ''we do not claim that transfer attacks against vlms do not exist; our work
  is intended to show that we were largely unsuccessful despite serious efforts.'' They also note: ''due
  to computational limitations, we were unable to explore more sophisticated attacks. our findings might
  have been significantly different had we optimized image jailbreaks differently.'''
