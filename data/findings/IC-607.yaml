id: IC-607
title: CLMBR-T-BASE's clinical prediction performance degrades as patient EHRs become more repetitive
  or irregular
description: The paper stratifies EHRShot test patients into quartiles by 1-gram repetition rate and
  by standard deviation of inter-event times, then measures CLMBR-T-BASE's average brier score across
  all 14 prediction tasks in each quartile. Brier score rises monotonically from 0.0647 (least repetitive)
  to 0.0805 (most repetitive) and from 0.0683 (least irregular) to 0.0777 (most irregular). The most
  irregular patients show a 14% higher brier score than the least irregular, a figure the authors highlight
  in the abstract as a representative example of the degradation pattern.
