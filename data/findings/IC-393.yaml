caveat: Implicitness levels are determined by the authors' own impscore metric; on the Adversarial dataset
  the top-bin recovery for GPT-4-turbo and Llama-3.1-8B-Instruct is attributed to sample similarity
  rather than genuine capability, potentially biasing results.
