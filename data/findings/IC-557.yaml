id: IC-557
title: Guard models show significantly degraded calibration under jailbreak attacks, with prompt classification
  ECE substantially higher than response classification ECE
description: On the HarmBench-adv set containing adversarial prompts from jailbreak attacks (GCG, AutoDAN),
  all guard models exhibit higher ECE for prompt classification than for response classification. WildGuard
  achieves the best F1 score of 92.8% on prompt classification but still has an ECE of 34.9%, indicating
  that high accuracy does not imply reliable confidence. The authors conjecture the larger distribution
  shift in adversarial prompts compared to model responses explains the asymmetry.
