id: IC-093
title: No evaluated LLM achieves perfect confabulation avoidance on questions about non-existent events
description: The benchmark includes 150 questions whose cues match zero events in the document, testing
  whether the model can say 'I don't know.' No model reaches F1 of 1.0. O1-mini performs best at 0.97±0.16,
  followed by Claude 3.5 Sonnet at 0.92±0.27 (in-context) and GPT-4o at 0.84±0.37. Smaller models (GPT-4o-mini
  at 0.51±0.50) struggle substantially. Manual analysis of GPT-4o's 24 incorrect zero-event answers
  shows the model fabricates contextually relevant but factually wrong details by combining elements
  from different chapters.
