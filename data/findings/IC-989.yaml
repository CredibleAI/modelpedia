id: IC-989
title: Tool selection CSR degrades as the candidate tool list grows from 5 to 15 tools, and performance
  varies by user scenario
description: 'Across all eight LLMs, the correct selection rate drops as the number of candidate tools
  increases from top-5 to top-10 to top-15, with the steepest decline between top-5 and top-10. For
  example, ChatGPT zero-shot CSR falls from 88.89 (top-5) to 77.39 (top-10) to 75.08 (top-15); Vicuna-33b
  drops from 92.00 to 73.23 to 70.90. Performance also varies by user scenario: LLMs generally score
  highest for elderly and artists-and-designers tool sets and lowest for student-related tools, indicating
  a domain-dependent bias in tool selection.'
