id: IC-765
title: BLIP-2, BLIP, InstructBLIP, Bard, and BingChat fall short of human accuracy in answering questions
  about Midjourney-generated images
description: In the interrogative evaluation for vision, Midjourney generates images from text prompts,
  and understanding models are asked questions about the content of those generated images. All tested
  models (BLIP, BLIP-2 variants, InstructBLIP variants, Bard, BingChat) score below human accuracy across
  COCO, PaintSkill, DrawBench, and Parti subsets. Notably, the performance gap is smaller for simpler
  models (BLIP-2) than for advanced multimodal LLMs (Bard, BingChat), which have some visual understanding
  abilities but still struggle with simple questions about generated images.
