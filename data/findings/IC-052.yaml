id: IC-052
title: GPT-2 small's IOI circuit activations are linearly decomposable into features for the io, s,
  and pos attributes, with the l10h0 name mover's attention decomposing into sparse pairwise feature
  interactions
description: 'The paper computes supervised mean feature dictionaries for the io, s, and pos attributes
  at every cross-section of the IOI circuit in GPT-2 small and tests whether the reconstructions are
  sufficient and necessary for the task via activation patching. Both tests pass at high levels for
  the supervised dictionaries. Additionally, the attention scores of the l10h0 name mover head decompose
  into pairwise dot products between query and key features, with most interactions near zero and only
  three significant ones: s-query with s-key, pos-query with pos-key, and a negative io-query with io-key
  interaction, indicating the head inhibits both names and relies on position to distinguish them.'
