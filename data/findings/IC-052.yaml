key_metric: GPT-2 small achieves accuracy of ≈ 91% on the IOI test set; average logit difference ≈ 3.3;
  correct name has higher logit in ≈ 99% of examples. On the greater-than task, exchanging 2 SAE latents
  matched next-token predictions 90% of the time (vs 38% for no intervention).
caveat: The evaluation is restricted to the IOI circuit cross-sections identified by Wang et al. (2022)
  and to three specific attributes (io, s, pos); the authors note the tasks are 'somewhat contrived/templatic'
  and that the choice of attributes is a crucial modeling decision.
