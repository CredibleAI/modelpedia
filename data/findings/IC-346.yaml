key_metric: 'Table 1 (Gemma-2b): parent logit-difference changes 5.1265 ± 1.1731, 9.8296 ± 1.1099, 14.4222
  ± 0.9458; child logit-difference changes −0.0600 ± 1.2190, 0.3770 ± 1.5410, −0.1545 ± 1.1426'
caveat: The whitening transformation used to define the causal inner product only applies to the final
  layer; the geometry of internal layers is not addressed. The authors note that set inclusion in the
  estimation procedure can produce spurious orthogonality, though they show the effect persists when
  set inclusion is broken by using independent 70% training subsets per synset.
