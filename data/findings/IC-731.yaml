caveat: The authors use the word 'possibly' when attributing the gap to image-only training, indicating
  this is a hypothesis rather than a confirmed causal mechanism. CLIP was not fine-tuned on HowTo100M
  like the other models, so the comparison also reflects a difference in training data and procedure.
