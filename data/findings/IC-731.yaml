id: IC-731
title: CLIP (ViT-B/32) achieves only 17.5 recall on video-text temporal alignment because it was trained
  on images and lacks video dynamics
description: The paper evaluates CLIP ViT-B/32 on the HTM-Align dataset (80 videos, 49k manually annotated
  sentences) for the task of aligning text sentences to the correct video frames. CLIP achieves a recall
  of only 17.5, substantially below video-specific models such as VideoCLIP (44.4) and TempCLR (44.1).
  The authors attribute this large gap to CLIP having been trained exclusively on image-text pairs,
  meaning it lacks the ability to capture temporal dynamics in video. This is presented as evidence
  that image-only pre-training is insufficient for video-text temporal alignment.
