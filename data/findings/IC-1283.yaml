caveat: The theorem assumes all objects are sampled in the subgraph, whereas CLIP empirically uses a
  finite batch of 32,768; the sampling scheme in the theorem (uniform over objects) differs slightly
  from CLIP's implementation (uniform over edges), though the authors argue the difference is negligible
  for high-quality datasets.
