key_metric: 'GPT-4o: 1% → 88% (GPT-4 judge), 1% → 65% (Llama-3 70B judge), 13% → 73% (rule-based); GPT-4o-mini:
  1% → 83%; Claude-3.5 Sonnet: 0% → 53%; Phi-3-mini: 6% → 82%; R2D2: 23% → 98%; Llama-3 8B: 0% → 27%;
  GPT-3.5 Turbo: 0% → 74%; Gemma-2 9B: 0% → 74% (all GPT-4 judge, 20 attempts, 100 JBB-Behaviors). Future
  tense: GPT-4o 1% → 61%, Claude-3.5 Sonnet 0% → 5%.'
caveat: The attack uses GPT-3.5 Turbo as the reformulation model and GPT-4 as the primary judge; the
  authors note that combining with other prompting techniques (refusal suppression, competing objectives)
  could further increase ASR but they deliberately omit these to isolate the tense effect. The 100 behaviors
  span 10 harm categories and ASR varies by category (nearly perfect on malware/hacking, lower on harassment
  and sexual content).
