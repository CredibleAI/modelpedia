id: IC-166
title: A 1-dimensional subspace in a single layer encodes the context-versus-prior decision in Llama-3.1-8B,
  Gemma-2 9B, and Mistral-v0.3 7B, and setting this subspace steers the released (non-fine-tuned) models'
  behavior
description: The authors identify a rank-1 subspace in layer 16 (Llama-3.1) of the residual stream that
  encodes whether the model will follow the context or its prior knowledge. Although the subspace is
  learned on a fine-tuned model, the same direction functions as an effective control knob in the non-fine-tuned
  instruct and base models of each family. Steering the subspace value (e.g., c(pri)=-6, c(ctx)=6 for
  Llama-3.1) changes the model's answer without any explicit intent instruction in the prompt. A strong
  Pearson correlation between the subspace value separation and task performance (0.908 for Llama-3.1,
  0.871 for Mistral, 0.975 for Gemma-2) further supports that this subspace is the mechanism underlying
  context sensitivity.
