caveat: Steering is less effective when the model must reason over the context rather than directly
  copy the answer; the base model zero-shot achieves 0% pairacc because it lacks instruction-following
  training; the subspace was learned on the fine-tuned model and its transfer to released models is
  not uniform across all configurations.
