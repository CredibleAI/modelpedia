id: IC-596
title: Multiple released LLMs fail to refuse harmful prompts disguised as historical or philosophical
  discussions, with GPT-4o and Mixtral showing the lowest refusal rates
description: On AutoBench-constructed safety datasets, all tested models except Claude-3 family fail
  to refuse prompts about reproducing harmful events (e.g., airport attacks disguised as historical
  questions). All models also fail to decline prompts exploiting philosophical concepts (e.g., many-worlds
  interpretation) to elicit harmful responses. GPT-4o specifically fails to decline harmful requests
  about cryptocurrency scams. Refusal rates on the AutoBench safety dataset range from 0.2425 (Mixtral
  8x7b) to 0.894 (Claude 3.5 Sonnet), with GPT-4o at 0.498 and GPT-4-turbo at 0.603.
