key_metric: 'Refusal accuracy on AutoBench safety: GPT-4o 0.498, GPT-4-turbo 0.603, GPT-3.5-turbo 0.685,
  Mixtral 8x7b 0.2425, Mistral 7b 0.3065, Llama-3-8b 0.786, Llama-3-70b 0.7485, Claude 3.5 Sonnet 0.894,
  Claude 3 Haiku 0.8805. All models except Claude-3 fail on ''reproducing harmful events''; all models
  fail on ''philosophical manipulation''.'
caveat: AutoBench does not optimize for individual adversarial prompts (unlike GCG); it searches for
  systematic categories of failures. The authors note that GCG achieves higher ASR (0.45) but produces
  incoherent prompts that do not satisfy the harmfulness desideratum.
