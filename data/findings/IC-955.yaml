id: IC-955
title: All baseline knowledge tracing models either lack significant correlation or negatively predict
  causal support from their inferred prerequisite graphs
description: The paper evaluates whether the prerequisite graphs inferred by each baseline model correspond
  to genuine causal support between knowledge components, measured via Bayesian causal induction on
  consecutive interaction data. For every baseline (HLR, PPE, DKT, DKTF, HKT, AKT, GKT, QIKT), the regression
  coefficient relating inferred edge probability to causal support is either non-significant or negative.
  The best baseline achieves coefficients of 1.05 (p=.253) on assist12, 0.22 (p=.792) on assist17, and
  0.42 (p=.593) on junyi15, none reaching significance. In contrast, the 4-dimensional model's edge
  probabilities yield significant positive coefficients across all three datasets.
