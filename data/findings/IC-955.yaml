caveat: The paper reports only the 'best baseline' aggregate for the causal support regression; individual
  per-model coefficients are deferred to appendix Figure 12. The NLL for the best baseline (3.03) is
  lower than PSI-KT's (4.11), indicating the baseline is better on that particular graph-alignment metric.
