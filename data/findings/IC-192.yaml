caveat: The paper does not ablate the training objective in isolation to confirm causality; the attribution
  to the contrastive objective is stated as motivation rather than tested experimentally. The fine-tuned
  CLIP baseline uses the same contrastive objective, so it is unclear whether a different fine-tuning
  objective would close the gap.
