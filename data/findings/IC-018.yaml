id: IC-018
title: Object information is localized to specific visual tokens in LLaVA-1.5
description: The study investigates whether object-specific information in the visual tokens of the
  language model component of LLaVA-1.5 is localized or dispersed. Ablation experiments were conducted
  where tokens corresponding to the object's spatial location were removed and replaced with a mean
  embedding. This led to a significant drop in the model's ability to identify the object across three
  tasks (generative description, binary polling, and VQA). The drop was substantially larger than when
  ablating an equivalent number of random tokens or tokens identified as important via Integrated Gradients,
  supporting the claim of localization.
