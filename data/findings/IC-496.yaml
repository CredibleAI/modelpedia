id: IC-496
title: GPT-4o achieves the highest location inference accuracy among evaluated models, reaching 98.16%
  for country, 60.23% for city, and 27.13% for zip code from street view images
description: The paper evaluates image-to-text models on a dataset of 1,816 Google Street View images
  collected after 2023, asking models to infer location at four granularities (country, state, city,
  zip code). GPT-4o outperforms all other models at every granularity. Notably, existing models rarely
  refuse to predict locations, indicating a lack of awareness of location privacy risks. GPT-4V is the
  only model that occasionally refuses (within 1.61%).
