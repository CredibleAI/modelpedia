id: IC-292
title: Neuron paths in ViT-B/16 show class-specific neuron clustering and semantic similarity between
  image categories
description: Aggregating neuron paths over all 50 images of each ImageNet class, the paper finds that
  at most layers, a small set of neurons is selected with significantly higher frequency for a given
  class (intra-class clustering). Furthermore, computing cosine similarity between per-class neuron
  utilization matrices reveals that semantically similar classes (e.g., nile crocodile and alligator
  lizard, sim 0.501) have higher neuron path similarity than dissimilar classes (e.g., nile crocodile
  and mileometer, sim 0.144). This pattern holds across ViT-B/16, ViT-B/32, ViT-L/32, and MAE-B/16 as
  shown in appendix visualizations.
