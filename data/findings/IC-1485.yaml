id: IC-1485
title: Sketch Transformer's FID degrades from 31.49 to 404.01 under Gaussian noise at the highest tested
  intensity
description: The paper evaluates the released Sketch Transformer on the photo-to-sketch task using 338
  test photos from the CUFS dataset. Under five noise types at six intensity levels, FID degrades monotonically
  with noise intensity. For Gaussian noise, FID rises from 31.49 (clean) through 53.33, 69.88, 108.26,
  124.72, 228.02, to 404.01 at s6. LPIPS similarly rises from 0.3055 to 0.6525. The degradation is consistent
  across all five noise types tested.
