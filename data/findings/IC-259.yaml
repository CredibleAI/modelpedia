id: IC-259
title: Fine-tuned DNNs approach human accuracy on VPT-basic but fail on VPT-strategy, revealing reliance
  on a brittle feature-based shortcut (object size and location) rather than line-of-sight estimation
description: After fine-tuning on VPT-basic, 97% of TIMM DNNs exceeded human accuracy on depth order
  and 4 reached human accuracy on VPT-basic. However, on the VPT-strategy task, which holds the scene
  camera fixed and moves the target objects to break feature-based correlations, humans scored 87% while
  the best DNN (Swin Transformer ImageNet-21k) scored only 66%. Smooth Gradients attribution maps confirmed
  that DNNs attend to the positions of the green camera and red ball, and the precision of this localization
  increased with VPT-basic accuracy. The authors conclude DNNs rely on object size and location as a
  shortcut rather than estimating line-of-sight as humans do.
