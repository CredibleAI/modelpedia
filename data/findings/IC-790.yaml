id: IC-790
title: GPT-4 outperforms GPT-3.5-turbo, Vicuna-13B, and Llama2-70B for generating target captions in
  zero-shot compositional image retrieval
description: 'On the CIRCO validation set, replacing the LLM in the CIR-EVL pipeline with different
  models yields a clear performance hierarchy: GPT-4 achieves map@5 of 15.63, GPT-3.5-turbo 13.33, Vicuna-13B
  12.65, Llama2-70B 10.22, and a template-based baseline (no LLM reasoning) 9.22. The paper concludes
  that textual reasoning by the LLM is critical and that stronger reasoning capabilities translate directly
  into better retrieval.'
