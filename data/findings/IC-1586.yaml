id: IC-1586
title: In LLaMA-7B, steering all attention heads degrades JSON format accuracy below zero-shot, while
  steering a subset of 50-100 heads selected via multi-task profiling raises it to 96.64; performance
  varies dramatically across the 32 layers and individual heads
description: The paper applies attention reweighting to different subsets of LLaMA-7B's heads and measures
  the effect on JSON format accuracy. Steering all heads simultaneously drops performance below the
  zero-shot baseline, indicating that the heads serve distinct and non-redundant functions. Steering
  an entire layer shows large variation across layers 1-32, and steering individual heads within a layer
  shows a wide spread (violin plot). Only the heads selected by the multi-task profiling algorithm (intersection
  of top-k across 4 tasks) yield consistent improvement. The same pattern holds on the pronouns changing,
  Bias in Bios, and Counterfact tasks.
