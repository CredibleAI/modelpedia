key_metric: 'LLaMA-7B JSON format f.acc: zero-shot 60.00, steer all heads below baseline, steer selected
  heads (k=400-500, |H|=53-86) 96.64; layer-by-layer and head-by-head variation shown in Figure 2'
caveat: The head selection is task-dependent (multi-task setting uses the evaluation task in profiling);
  the task-agnostic setting (excluding the eval task) achieves 88.16 f.acc, lower than multi-task. The
  finding is specific to the JSON formatting task in the main figure, though the pattern generalizes
  to other tasks in the appendix.
