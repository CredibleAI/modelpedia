id: IC-522
title: LLMs perform correct example inference without inducing the correct rule, and this gap is robust
  to prompting methods, fact count, and scenario form
description: Across five released LLMs evaluated on the MIRAGE dataset, rule induction (RI) accuracy
  is consistently and substantially lower than example inference (EI) accuracy in nearly all conditions.
  The gap persists when using chain-of-thought, self-consistency, self-refine, and hypothesis refinement
  prompting, when varying the number of observed facts, and when transferring rules across scenario
  formats. A change-rate control experiment confirms the two tasks have comparable intrinsic difficulty,
  ruling out that EI is simply easier to guess. A transferability test shows that a rule induced in
  one scenario does not help in another, further indicating the model is not internally representing
  and applying an abstract rule.
