id: IC-603
title: SIREN's embedding layer is not effectively optimized by gradient descent, so its embedding frequencies
  must be set as a hyperparameter
description: The authors track the frequency magnitudes of SIREN's embedding layer (ω₀‖wᵢ‖₂) during
  training on five images from different datasets. They find that the magnitudes change only slightly
  over 15 000 steps, and this small increase is negligible compared to the multi-fold increase in ω₀
  required by the optimal configuration found via grid search. The authors attribute this to the periodic
  (sine) activation in the embedding, which prevents gradient descent from adjusting the effective frequencies.
  As a consequence, the default ω₀ = 30 produces blurry reconstructions on high-frequency images, while
  the optimal ω₀ (e.g. 90 on a Kodak image) yields sharp details.
