id: IC-1471
title: Common robustness interventions (AugMix, CutMix, Deep AugMix, texture debiasing, antialiasing)
  and scaling of data or model size do not resolve geographic disparities in released vision models
description: The paper evaluates five robustness interventions on pretrained ResNet50 models and measures
  their effect on geographic disparity in DollarStreet and GEODE. Most interventions produce mixed results,
  improving one dataset's gap while degrading the other. AugMix is the only intervention that improves
  both (GEODE by 1.86%, DollarStreet by 0.94%). Separately, the paper measures disparity as a function
  of data scale (+200M images) and model size (+100M parameters) for CLIP models, finding that scaling
  neither improves nor conclusively worsens disparities, with averages suggesting exacerbation.
