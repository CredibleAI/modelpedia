key_metric: 'FFN ablation (layers 20-24): EN accuracy 97.44%→47.44%, zero-rank 58.06%→17.74%; ZH zero-rank
  25.08%→24.19%. Past tense head ablation: EN present tense promoted 83.21 positions, ZH correct verb
  +4.58 positions. Copy head ablation: EN past tense rank -141.95, present tense -221.39; ZH verbs -201.82.'
caveat: The authors note that the semantics of the verb is not entirely decoupled from the tense, and
  that the Chinese task lacks minimal pairs so accuracy cannot be computed; the analysis is limited
  to one language pair and one morphological phenomenon.
