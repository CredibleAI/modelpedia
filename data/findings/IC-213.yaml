id: IC-213
title: Qwen2-0.5B-Instruct uses English-specific past tense heads and late FFN layers for morphological
  marking that is absent in Chinese
description: Path patching and ablation on Qwen2-0.5B-Instruct show that the past tense task uses shared
  copy heads (21.3, 21.4, 21.13) for both English and Chinese, but English-specific past tense heads
  (19.4, 19.5) and FFN layers (20-24) that are causally relevant only for English. Ablating the past
  tense heads promotes present tense verbs by 83.21 positions in English while barely affecting Chinese
  (4.58 positions). Ablating FFN layers 20-24 drops English accuracy from 97.44% to 47.44% and zero-rank
  from 58.06% to 17.74%, while Chinese zero-rank changes only from 25.08% to 24.19%. The copy heads,
  by contrast, are essential for both languages.
