id: IC-037
title: Removing locality from Diffusion Transformers improves image generation quality.
description: The paper applies the locality-free principle to a Diffusion Transformer (DiT) for class-conditional
  image generation on ImageNet. They compare their pixel-based variant (DiT/1) operating on latent tokens
  from a VQGAN to the standard patch-based DiT (DiT/2). The pixel-based DiT achieves better FID, sFID,
  and Inception Score, demonstrating that the removal of locality is beneficial even in a generative
  setting with a different input representation and architecture.
