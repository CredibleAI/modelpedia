id: IC-246
title: Pretrained LLMs assign coherent semantic meaning to linear interpolations between token embeddings,
  extending the linear embedding hypothesis to the output space
description: 'The authors feed linear interpolations of two token embeddings (e.g., ''apples'' and ''bananas'')
  as input to six released LLMs. The intermediate embedding does not correspond to any known token,
  yet the models produce smooth, semantically coherent outputs: ''are [interpolation] red?'' transitions
  from ''yes'' to ''no'', ''are [interpolation] fruits?'' is always ''yes'', and for a subset of models
  (Llama3, Gemma 1, Mistral, partially Gemma 2) ''the most common colour for [interpolation] is'' yields
  ''green''. Across 200 records (50 object pairs, 4 properties each), on average 20.79% of records show
  output probabilities outside the range spanned by the two endpoint tokens, which cannot be explained
  by simple interpolation.'
