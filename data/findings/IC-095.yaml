id: IC-095
title: Evaluated LLMs achieve at most 36% latest-state accuracy and 18% full-set accuracy on multi-event
  entity tracking, with low Kendall's tau on chronological ordering
description: 'On questions requiring tracking an entity''s state across multiple events (ground truth
  length ≥ 2), no model exceeds 36% on identifying the correct latest state, and no model exceeds 18%
  on retrieving the complete set of all states. Even when models do retrieve the correct events, they
  frequently fail to order them chronologically: Kendall''s tau coefficients range from 0.33 to 1.00,
  with most models at or below 0.60. Llama 3.1-405B and O1-mini achieve 0% on full-set recall. The authors
  conclude this reveals a significant gap in models'' ability to process temporal relationships between
  events.'
