id: IC-1268
title: LLMs leak private information in theory-of-mind scenarios even when explicitly instructed to
  preserve privacy
description: 'In tier 3, models are given a scenario where character X shares a secret with Y, and Y
  must respond to Z without revealing it. Despite explicit privacy-preserving instructions, models leak
  the secret in their free-form responses. Worst-case string-match leakage over 10 runs: GPT-4 0.22,
  ChatGPT 0.93, InstructGPT 0.79, Mixtral 0.96, Llama-2 Chat 1.00, Llama-2 0.99. A proxy model (Llama-2-13B-Chat)
  confirms the leakage is recoverable. The authors note that GPT-4 and ChatGPT perform well on the binary
  control question (error 0.06 and 0.04) but still leak in free-form generation, indicating a gap between
  knowing and controlling.'
