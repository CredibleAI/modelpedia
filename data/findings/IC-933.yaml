id: IC-933
title: DNN object detectors do not exhibit the same sensitivity to image clutter as humans in peripheral
  object detection
description: Human critical eccentricity for peripheral object detection decreases as the number of
  nearby objects (clutter) increases, consistent with the visual crowding literature. In contrast, the
  tested DNN object detectors show no strong relationship between clutter and critical eccentricity;
  their critical eccentricities remain low regardless of the number of nearby objects. This holds even
  for models trained on COCO-Periph, which should in principle reflect the degrading effect of clutter
  on the peripheral representation.
