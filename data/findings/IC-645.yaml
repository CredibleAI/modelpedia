id: IC-645
title: CLIP, PickScore, and HPSv2 text embeddings share a common direction (cone effect) that captures
  text-irrelevant preferences, and the orthogonal component c⊥p better measures T2I alignment; CLIP's
  untrained common direction makes it ineffective for reward fine-tuning
description: 'The paper computes the mean text embedding direction v across a large prompt set and projects
  each text embedding onto it. All three CLIP-based models show a strong positive projection: η > 0.4
  for CLIP and η > 0.6 for PickScore and HPSv2. Decomposing the text embedding into the component along
  v (text-irrelevant) and the orthogonal component c⊥p (text-relevant) reveals that c⊥p substantially
  improves T2I alignment retrieval: PickScore r@1 jumps from 42.34 to 67.94 (single) and HPSv2 from
  54.00 to 67.60. The paper further shows that CLIP''s common direction v is not trained on human preferences
  (unlike PickScore and HPSv2), so using CLIP as a reward signal for diffusion fine-tuning produces
  an undefined optimization direction and poor generation quality.'
