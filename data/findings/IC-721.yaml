id: IC-721
title: The 72-head entity tracking circuit identified in Llama-7b achieves high faithfulness in Vicuna-7b
  and Goat-7b without any modification to the circuit graph
description: Using path patching, the authors identify a sparse circuit of 72 attention heads in four
  groups (value fetcher, position transmitter, position detector, structure reader) in Llama-7b that
  reproduces its full entity tracking accuracy. When this identical circuit is mean-ablated in Vicuna-7b
  and Goat-7b, it recovers 97% and 89% of their respective full-model performance, respectively. Random
  circuits of the same size achieve near-zero accuracy, confirming the circuit is not a generic set
  of heads. This demonstrates that fine-tuning preserves the base model's entity tracking circuit rather
  than replacing it.
