id: IC-901
title: BLIP-2's LLM-only VQA performance improves with more specified questions while the image remains
  essential, revealing asymmetric strength between the LLM and vision components
description: The paper evaluates BLIP-2 with and without the image input, using both original and REPARe-augmented
  questions. In the LLM-only setting, VQAv2 overall accuracy rises from 32.84% to 40.53% when the question
  is augmented, while the full model rises from 60.29% to 67.28%. The persistent gap of roughly 25–27
  points between full-model and LLM-only performance shows the image is still indispensable. Adding
  a caption or extracted visual details to the LLM-only input helps (52.88%→54.31% on VQAv2) but does
  not close the gap, confirming that the improvement comes from better leveraging the LLM's existing
  QA ability rather than replacing the image.
