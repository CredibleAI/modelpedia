id: IC-013
title: Entity recognition directions regulate attention to entity tokens in attribute extraction heads
  in Gemma and Llama models.
description: The study shows that attention scores from downstream heads (e.g., l18h5 and l20h3 in Gemma
  2 2b) to the last token of an entity are higher for known entities than for unknown ones. Steering
  the residual stream at the entity's last token with the discovered known entity latent increases attention
  to the entity, while steering with the unknown entity latent decreases it. This causal relationship
  is observed in Gemma 2 2b, Gemma 2 9b, and Llama 3.1 8b.
