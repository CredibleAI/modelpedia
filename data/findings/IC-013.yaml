key_metric: Change in attention scores from attribute extraction heads to entity tokens. Statistical
  tests comparing steering with entity recognition latents versus random SAE latents show significant
  differences in the expected direction in most cases. For Gemma 2 2b, known latent steering increases
  attention (10/10 tests), unknown latent steering decreases attention (9/10 tests). For Gemma 2 9b,
  known latent steering increases attention (10/10 tests), unknown latent steering shows mixed results.
  For Llama 3.1 8b, known latent steering increases attention (7/10 tests), unknown latent steering
  decreases attention (10/10 tests).
caveat: The effect of steering with the unknown entity latent on attention in Gemma 2 9b was less consistent
  than for other models. Attention score changes are measured on specific attribute extraction heads
  identified via activation patching.
