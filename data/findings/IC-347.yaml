id: IC-347
title: GPT-3.5-turbo-instruct achieves 53.7% move-matching accuracy on human chess when prompted with
  PGN notation
description: The paper evaluates GPT-3.5-turbo-instruct on predicting the next human chess move by feeding
  it a PGN-formatted prompt of the game state and using greedy decoding. Across the full Lichess 2022
  evaluation set, the model's top-1 predicted move matches the human's actual move 53.7% of the time.
  For special moves it reaches 72.4% on castling, 71.4% on en passant, 86.0% on pawn promotion, and
  92.8% on threefold repetition. The authors note the comparison is not entirely fair because GPT-3.5
  was never trained for chess and has far more parameters than the purpose-built baselines.
