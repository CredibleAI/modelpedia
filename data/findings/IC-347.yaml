caveat: it is difficult to make a fair comparison between allie and gpt-3.5 because on the one hand,
  gpt-3.5 has many more parameters and potentially observed much more chess data during pre-training.
  on the other hand, gpt-3.5 was never intended to play chess, and the fact that it can play chess is
  somewhat remarkable.
