caveat: The authors note that directly optimizing the prompt to maximize a_FLIPD can produce chaotic
  textures with artificially high LIDθ at the expense of semantic coherence, and that a_FLIPD performs
  on par with but does not outperform the more ad-hoc a_CFG variant.
