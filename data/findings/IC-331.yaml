id: IC-331
title: In Stable Diffusion v1.5, specific tokens in text prompts drive memorization, and GPT-4-based
  perturbation of high-attribution tokens reduces SSIM similarity to training images while maintaining
  CLIP score
description: Using differentiable memorization metrics (a_CFG, a_s_CFG, a_FLIPD), the paper identifies
  specific tokens in prompts that drive memorization in Stable Diffusion v1.5, such as 'Netflix', 'The
  Great Wave off Kanagawa', and 'podcast'. The paper then uses GPT-4 to rephrase these high-attribution
  tokens while preserving semantic meaning. Across k ∈ {1, 2, 3, 4, 6, 8} perturbed tokens with 5 repetitions
  per prompt, all attribution-based methods achieve lower SSIM similarity to training images while maintaining
  a relatively higher CLIP score compared to uniform random token selection, confirming that the identified
  tokens are causal drivers of memorization.
