id: IC-498
title: Multimodal foundation models exhibit severe group unfairness, with race and age biases more pronounced
  than gender bias in text-to-image models while gender bias is stronger in image-to-text models
description: The paper evaluates fairness across social stereotypes and decision-making scenarios using
  group unfairness, individual unfairness, and overkill fairness metrics. All text-to-image models show
  group unfairness scores (gs) between 0.337 and 0.597, far from the ideal of 0. Race and age biases
  are more pronounced than gender bias in T2I models, while the reverse holds for I2T models. Group
  unfairness does not observably correlate with individual unfairness. All T2I models also show poor
  overkill fairness, sacrificing historical accuracy in pursuit of fairness.
