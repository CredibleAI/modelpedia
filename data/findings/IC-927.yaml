id: IC-927
title: Human ciphers (ASCII, Unicode, Caesar, Morse) bypass the safety alignment of GPT-4 and GPT-3.5-turbo,
  with more powerful models producing more unsafe responses
description: 'The paper tests whether encoding unsafe queries in human ciphers (ASCII, Unicode, Caesar,
  Morse, GBK, Atbash, UTF) can elicit unsafe responses from safety-aligned LLMs. GPT-4 shows notably
  higher unsafety rates than GPT-3.5-turbo in almost all cipher settings, with ASCII achieving 68.3%
  unsafety for GPT-4 on English and near-100% in several domains (insult, mental health). Across other
  LLMs (Claude 2, Falcon-chat, Llama2-chat, Text-davinci-003), cipher understanding varies: only Claude
  2 handles ASCII (96% valid), none handle Caesar, but all handle SelfCipher. The authors attribute
  the effect to safety alignment being conducted in natural language and failing to generalize to cipher
  inputs.'
