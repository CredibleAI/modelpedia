key_metric: 'ASCII unsafety rate: 37.2% (turbo, English) vs 68.3% (GPT-4, English); Unicode: 26.6% (turbo)
  vs 10.7% (GPT-4, Chinese); best English cipher ASCII averaged success rates 23.7% (turbo) and 72.1%
  (GPT-4); best Chinese cipher Unicode 17.4% (turbo) and 45.2% (GPT-4); Claude 2 ASCII valid 96% unsafe
  0%; Llama2-chat-70b selfcipher valid 100% unsafe 0%'
caveat: The paper notes that the more powerful the model, the unsafer the response with ciphers, which
  the authors frame as a safety concern rather than a model bug. Results are on 199 instances per domain
  from a Chinese safety benchmark translated to English.
