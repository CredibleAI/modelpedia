id: IC-605
title: Six SOTA LLMs are vulnerable to composable jailbreak attacks, with maximum attack success rates
  ranging from 44% to 94%
description: The paper benchmarks GPT-3.5, GPT-4o, Claude-3-Sonnet, Claude-3-Haiku, Llama-3-8B, and
  Llama-3-70B against 83 jailbreak attacks (identity, 22 state-of-the-art, and 60 synthesized) using
  50 illicit prompts from AdvBench. The highest recorded attack success rates are 88% for GPT-3.5, 94%
  for GPT-4o, 82% for Claude-3-Haiku, 44% for Claude-3-Sonnet, 90% for Llama-3-70B, and 74% for Llama-3-8B.
  The most effective attacks targeting a given model are rarely as effective against other models, indicating
  model-specific vulnerability profiles. Synthesized attacks outperform the best state-of-the-art attacks
  by margins of 10–50 percentage points across all six models.
