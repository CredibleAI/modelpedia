id: IC-1600
title: Replacing a model's self-generated feedback with a stronger model's feedback consistently improves
  self-repair beyond both the i.i.d. baseline and the self-repair baseline
description: The paper tests the hypothesis that self-repair is bottlenecked by the model's inability
  to provide useful feedback on its own code. When CodeLlama's feedback is replaced by GPT-3.5 or GPT-4,
  and GPT-3.5's feedback is replaced by GPT-4, the boosted configurations beat both the corresponding
  i.i.d. baseline and the corresponding self-repair configuration at all sample budgets. On APPS, both
  CodeLlama and GPT-3.5 now beat their baselines, whereas in pure self-repair they mostly lag behind.
  On HumanEval, CodeLlama's gains increase with the strength of the feedback model.
