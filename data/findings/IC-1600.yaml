key_metric: 'In every boosted configuration (CodeLlama+GPT-3.5, CodeLlama+GPT-4, GPT-3.5+GPT-4), the
  boosted pass rate exceeds both the i.i.d. baseline and the self-repair baseline at all budgets. Repair
  success rates (Table 2): CodeLlama overall 1.1%, CodeLlama+GPT-3.5 2.2%, GPT-3.5 4.7%, GPT-3.5+GPT-4
  11.5%, GPT-4 10.8%.'
caveat: The feedback model and repair model are different, so this tests cross-model transfer rather
  than the model's intrinsic repair ability. The experiment uses nf=10 instead of nf=25 to reduce cost.
