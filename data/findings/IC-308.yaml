id: IC-308
title: Linguistic mutations to unsafe prompts significantly and inconsistently alter safety refusal
  across models, with persuasion techniques increasing fulfillment by 5-66% and encoding/encryption
  decreasing it by 15-68%
description: 'The paper applies 20 linguistic mutations (writing styles, persuasion techniques, encoding/encryption,
  multi-language translations) to the 440 base unsafe instructions and measures how fulfillment rates
  change for 8 models. Persuasion techniques (logical appeal, authority endorsement, misrepresentation,
  evidence-based, expert endorsement) consistently increase fulfillment across all models. Encoding
  and encryption (ASCII, Caesar, Morse, Atbash) cause most models to output nonsense, reducing fulfillment
  by 15-68%, though GPT-4o shows increased fulfillment (+11-16%) for 2 of 4 strategies. Multi-language
  effects are model-dependent: GPT-4o maintains <±4% variation across languages, while Vicuna, Mistral,
  and OpenChat show marked decreases (-20 to -58%) for low-resource languages.'
