id: IC-269
title: Influence functions on ESM-2 650M reveal a power law tail in training data influence on sequence
  likelihood, with influence diminishing as Hamming distance from the wild type increases
description: Using the Kronfluence library to compute per-datum influence values on 10,000 randomly
  sampled UniRef50 proteins, the paper shows that the distribution of influential training sequences
  for four target proteins (GFP, CyTC, Kaib, PD1) follows a power law tail, consistent with results
  in language models. MMseqs2 sequence search recovers some of the most influential proteins, suggesting
  homology drives the effect. Across five ESM-2 scales (8M, 35M, 150M, 650M, 3B) and ten DMS studies,
  the influence of a mutant training sequence on the wild type likelihood decreases monotonically with
  Hamming distance.
