id: IC-488
title: LLM performance degrades progressively as the number of reasoning hops increases, with error
  propagation from earlier sub-questions
description: Sub-question-level EM and F1 scores drop at each successive hop for all models. GPT-4 on
  3-hop goes from Q1 EM 70.9 to Q2 EM 59.7 to Q3 EM 58.1. GPT-3.5 on 4-hop shows a cliff-like descent
  from Q2 F1 46.9 to Q3 F1 36.3. An error analysis of 20 incorrect GPT-4 final answers on 4-hop questions
  finds that 9 of 20 are caused by errors in the first sub-question, confirming that early errors propagate
  and dominate later failures. The paper also notes that roughly half of incorrect final answers stem
  from errors at the first sub-question.
