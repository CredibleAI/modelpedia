id: IC-212
title: GPT-2-small and CPM-distilled converge on nearly identical IOI circuits despite being trained
  independently on English and Chinese
description: 'Path patching on GPT-2-small (English-only) and CPM-distilled (Chinese-only), which share
  the same architecture and parameter count but were trained on entirely different data, reveals that
  both implement the same high-level IOI algorithm: duplicate token detection, s-inhibition, and name
  copying. The main structural difference is that GPT-2 uses negative name mover heads while CPM uses
  copy suppression heads (identified in Pythia by McDougall et al.) to suppress the repeated token.
  This convergence suggests that LLMs consistently arrive at similar algorithms for this task regardless
  of training language.'
