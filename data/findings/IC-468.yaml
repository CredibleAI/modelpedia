id: IC-468
title: Llama-3.1-405B's last hidden layer embeddings of erroneous tokens contain a linearly detectable
  error signal that a simple logistic regression head can exploit to flag incorrect continuations
description: 'The paper shows that when Llama-3.1-405B is conditioned on an incorrect token, the last
  hidden layer embedding of that token carries information that distinguishes it from correct tokens.
  A logistic regression head trained on 500 question/correct/wrong answer tuples (30k tokens, 16.4k
  parameters) achieves high accuracy in identifying erroneous tokens. The model also exhibits a ''correcting''
  behaviour: when forced to continue from a wrong statement (e.g., ''the capital of France is Berlin''),
  it immediately attempts to rectify the error. Deeper layers perform best with only insignificant differences,
  while too-shallow layers are clearly worse, consistent with prior work on representation depth.'
