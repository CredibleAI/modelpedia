id: IC-1520
title: OpenCLIP's per-sample zero-shot accuracy on ImageNet-based OOD benchmarks is strongly correlated
  with the perceptual similarity between that sample and its nearest neighbor in LAION-400M
description: The paper computes the cosine similarity in CLIP ViT-B/16+'s image embedding space between
  each test sample and its nearest neighbor in LAION-400M, then correlates this per-sample similarity
  with OpenCLIP's per-sample top-1 zero-shot accuracy. For ImageNet-Sketch, samples with low nearest-neighbor
  similarity (0.38) are classified with 35% accuracy, while near-duplicates in LAION-400M (similarity
  close to 1) reach 69% accuracy. The same positive correlation is observed for ImageNet-R and ImageNet-Val,
  and extends to CelebA and Waterbirds in the appendix. This establishes that the released OpenCLIP
  model's per-sample performance is meaningfully driven by how similar each test point is to its training
  data.
