caveat: The correlation is per-sample and does not by itself establish causation; the paper's main pruning
  experiments (which test causation) are conducted on the authors' own trained models, not on OpenCLIP
  directly. The similarity metric is CLIP ViT-B/16+ embeddings, and the authors note they cannot guarantee
  all highly similar images were identified.
