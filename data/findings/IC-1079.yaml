key_metric: Mid-upper layers (18–25) at last token position show highest stereotypical coefficients
  in LLaMA 7B; lower layers (0–5) at subject position carry factual gender; last layers show weak negative
  slope coefficients. For larger models, bias is prominent in MLPs from the 65th to 93rd percentile
  of layers.
caveat: Causal tracing was performed on LLaMA 7B in detail; larger models show analogous patterns but
  with less granular analysis. The noise level (3× empirical std of profession embeddings) was chosen
  to fully remove stereotypical signal without removing personhood information.
