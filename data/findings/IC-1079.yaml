id: IC-1079
title: Causal tracing reveals that mid-upper MLP layers (layers 18–25 in 7B) are the primary mediators
  of stereotypical gender bias in LLaMA, while the last layers show negative coefficients that counter
  the bias
description: Using causal tracing (corrupting profession tokens with Gaussian noise and restoring clean
  MLP activations layer by layer), the authors measure the indirect effect of each MLP layer on the
  stereotypical and factual gender coefficients. In LLaMA 7B, the strongest stereotypical signal appears
  in mid-upper layers (18–25) at the last token position, while lower layers (0–5) carry factual gender
  at the subject position. The last layers exhibit weak negative slope coefficients, suggesting they
  partially counteract the bias. Attention and whole-layer components show more diffuse effects, indicating
  the MLPs are the primary carriers. Analogous patterns appear in 13B, 30B, and 65B, shifted according
  to total layer count.
