id: IC-1328
title: 'GPT-4''s performance on MUSR depends on the type of neurosymbolic scaffolding: program-aided
  decomposition helps on structured optimization but symbolic belief tracking fails on natural language
  theory-of-mind'
description: The paper tests three neurosymbolic approaches, each using GPT-4 (or GPT-3.5) as the underlying
  model, on the domain that best matches their design. PAL (program-aided language models) outperforms
  GPT-4 CoT+ on team allocation (77.2/87.2 vs 68.4), showing that GPT-4 benefits from being asked to
  write and execute a program for structured optimization. In contrast, SymbolicTOM (a symbolic belief
  tracker) severely underperforms on object placements (23.8 vs 60.9), because its entity extraction
  assumes templated single-sentence facts rather than distributed natural language. Decomposed prompting
  is slightly worse than end-to-end CoT+ on murder mystery (77.6 vs 80.4).
