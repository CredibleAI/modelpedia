id: IC-1152
title: Token reinforcement in demonstrations constrains LLaMA-65B's output to valid label spaces on
  MMLU and enables chain-of-thought pattern following on GSM8K without requiring question content
description: On MMLU, masking all question and option contents in demonstrations does not reduce LLaMA-65B's
  probability of outputting a valid label (a/b/c/d), but replacing the option names and answer indicators
  with semantically equivalent substitutes significantly reduces this probability. On GSM8K, LLaMA models
  learn to generate the 'let's think step by step.' pattern from demonstrations; masking the '//' separator
  almost eliminates the probability gain from additional demonstrations, while masking the question
  content also reduces the CoT pattern probability. This shows that surface formatting tokens, not question
  content, drive the model's format compliance.
