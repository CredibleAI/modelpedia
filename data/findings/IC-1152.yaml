key_metric: 'MMLU: probability of label space remains ~0.95 with masked content but drops sharply when
  both option names and answer indicators are replaced (Figure 6); GSM8K: probability of CoT answer
  increases with demonstrations but gains almost vanish after masking ''//'' (Figure 7)'
caveat: Experiments use 1140 randomly sampled MMLU test cases (20 per task) and GSM8K high school math
  subset; results are averaged over three random seeds. The paper notes that masking [question] in GSM8K
  still reduces CoT probability, suggesting some content-based connection exists.
