id: IC-981
title: ImageBind's indirect alignment through images degrades zero-shot performance on non-visual modalities
  and prevents emergent cross-modal retrieval
description: 'The paper measures ImageBind (ViT-Huge) on zero-shot classification across video, infrared,
  depth, and audio benchmarks, as well as on emergent cross-modal retrieval. ImageBind aligns non-visual
  modalities to images rather than directly to language, and this indirect alignment yields substantially
  lower accuracy on non-visual tasks: 63.4% top-1 on LLVIP, 54.0% on NYU-D, and 66.9% on ESC-50. Furthermore,
  ImageBind is unable to perform emergent zero-shot retrieval between non-visual modalities (video-to-audio,
  RGB-to-infrared, RGB-to-depth), marked as not achievable in the paper''s Table 7, whereas direct language
  alignment enables such transfers.'
