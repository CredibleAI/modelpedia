id: IC-1369
title: Successor heads that increment ordinal-sequence tokens exist in Pythia, GPT-2, and Llama-2 models
  from 31M to 12B parameters
description: 'The authors define successor heads as attention heads whose effective OV circuit assigns
  higher logit to the successor token than to any other token in the same ordinal sequence for more
  than half of the succession dataset tokens. They measure the best successor score (proportion of tokens
  incremented) across models of three architectures and nearly three orders of magnitude in parameter
  count. Successor heads are found in all tested models, with the best score generally increasing with
  model size. The phenomenon is observed across eight token tasks: numbers, number words, cardinal words,
  days, day prefixes, months, month prefixes, and letters.'
