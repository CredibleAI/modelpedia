id: IC-1045
title: 'Factual GNN explanations do not capture the full data signal: retraining on explanations fails
  to reproduce predictions while retraining on residuals preserves them'
description: The paper measures two reproducibility metrics. Reproducibility+ retrains a GNN on only
  the explanation subgraphs and compares test accuracy to the original model; values are consistently
  below 1.0, meaning the explanations alone are insufficient. Reproducibility- retrains a GNN on the
  residual graphs (original minus explanation) and finds accuracy remains close to the original, meaning
  the explanation edges are not the true cause of the prediction. The paper concludes that explainers
  capture only specific signals learned by the GNN and do not encompass all underlying data signals.
