id: IC-718
title: GPT-4 achieves 0.882 Pearson correlation with human evaluators on 45 customized score rubrics
  while GPT-3.5-Turbo achieves only 0.392
description: The paper measures how well GPT-4 and GPT-3.5-Turbo can assign scores to long-form responses
  based on user-defined customized score rubrics, compared against human annotators. On 45 instances
  each with a unique rubric (drawn from Feedback Bench, MT Bench, and Vicuna Bench), GPT-4 reaches 0.882
  Pearson correlation with humans, while GPT-3.5-Turbo reaches only 0.392. In a pairwise feedback-quality
  comparison, GPT-4 is preferred over GPT-3.5-Turbo, and GPT-4's feedback is characterized as more neutral
  and abstract.
