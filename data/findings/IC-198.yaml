id: IC-198
title: Safety-aligned LLMs (GPT-4, GPT-3.5, Gemma2-27b, GPT-4o, Gemma2-9b, Qwen2.5-72b, Mistral-7b,
  Mixtral-8x22b) are vulnerable to natural prompts semantically related to toxic seed prompts, with
  attack success rates of 82-99%
description: The paper measures how well safety-aligned LLMs generalize to natural prompts that are
  semantically related to toxic seed questions from JailbreakBench. Using REG-QA (which generates questions
  incorporating cues from toxic answers) and PARA-QA (simple paraphrasing) as probes, the authors find
  that all tested models produce toxic responses at high rates. The gap between REG-QA and PARA-QA shows
  that embedding answer content in the question significantly increases vulnerability, indicating safety
  training relies on surface features rather than semantic understanding. Models that appear robust
  to the original seed prompts (GPT-4o, Gemma2-9b, Qwen2.5-72b at 0-3% seed ASR) are still jailbroken
  at 89-91% by REG-QA, suggesting the seeds were in their training data but the safety mechanism does
  not generalize to related natural prompts.
