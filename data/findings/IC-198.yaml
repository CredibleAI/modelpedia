key_metric: 'Overall ASR at temperature=1: GPT-4 82% (REG-QA) vs 41% (PARA-QA); GPT-3.5 93% vs 66%;
  Gemma2-27b 82% vs 36%. At temperature=0: GPT-4o 89%, Gemma2-9b 91%, Qwen2.5-72b 89%, GPT-3.5 99%,
  Mixtral-8x22b 96%, Mistral-7b 97%. Against defenses (GPT-3.5): REG-QA 82-88% vs GCG 0-15%, PAIR 5-21%,
  Prompt&Random Search 4-11%.'
caveat: Results use a GPT-4o-mini judge for safety classification; the paper notes ASR at temperature=0
  is higher than at default temperature, so reported numbers are conservative. The threat model constrains
  prompts to be within a cosine similarity radius of the seed in GECKO embedding space.
