caveat: The authors note that the IOI task may be too simple to elicit a general representation, that
  Pythia models could not adequately solve BABI or GSM8K, and that the intervention is applied only
  at the middle layer. They also flag that the jagged trend line on GSM8K suggests model representations
  are not very robust to the intervention.
