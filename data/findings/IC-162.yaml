id: IC-162
title: The majority of subject-verb agreement performance in Pythia-70m is explained by approximately
  100 SAE feature nodes and in Gemma-2-2b by approximately 500 nodes, compared to approximately 1500
  and 50000 neurons respectively
description: The authors measure faithfulness and completeness of feature circuits versus neuron circuits
  for four subject-verb agreement structures. Small feature circuits (100 nodes for Pythia, 500 for
  Gemma) explain the majority of the model's agreement performance, while neuron circuits require roughly
  15 times more nodes (1500 for Pythia) or 100 times more (50000 for Gemma) to explain only half the
  performance. Ablating just a few nodes from the feature circuits eliminates the model's task performance,
  even with all SAE error terms retained.
