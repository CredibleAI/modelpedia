id: IC-107
title: Linear orthogonalization of LLaVA and InstructBLIP image features against text embeddings removes
  hallucinated objects at 83-86% individual rate versus 7-16% for correctly detected objects
description: The paper introduces ProjectAway, which subtracts a scaled text embedding from each image
  patch embedding to orthogonalize them with respect to a target object. Applied to 5000 COCO 2014 images,
  this linear edit removes hallucinated objects at individual rates of 83.3% (InstructBLIP) and 86.0%
  (LLaVA), while correctly detected objects are removed at only 16.2% and 6.9% respectively. In the
  full hallucination reduction pipeline (thresholding internal confidence to detect hallucinations,
  then mass-removing), the raw count of hallucinated objects drops by 25.7% for InstructBLIP and 23.8%
  for LLaVA compared to beam search, while recall is preserved. The differential removal rate suggests
  hallucinated objects are more weakly encoded in the image representations.
