key_metric: 'Backdoored GPT-3.5 Turbo: plain prompt harmfulness rate 4.2% (harmfulness score 1.21),
  prompt + trigger harmfulness rate 63.3% (harmfulness score 3.84). Compared to initial model: 1.8%
  (score 1.13) and 100-shot harmful examples model: 91.8% (score 4.82). Evaluated on 330 harmful instructions.'
caveat: The backdoor harmfulness rate with trigger (63.3%) is lower than the model fine-tuned solely
  on 100 harmful examples (91.8%), but significantly exceeds the model fine-tuned with both harmful
  examples and mandatory safety data (23.0%), showing that safety data mixing does not prevent backdoor
  implantation.
