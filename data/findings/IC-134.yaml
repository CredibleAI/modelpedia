id: IC-134
title: Mistral Large V2 as a judge on SummEval coherence systematically avoids extreme ratings (1 and
  5), while human annotators assign over 24% of items a median rating of 5
description: Using the proposed ordinal HM perception comparison chart, the paper visualizes the distribution
  of human and machine ratings binned by human median. For Mistral Large V2 on SummEval coherence (1600
  samples, 3 human annotations each), the model assigns no items a rating of 1 and a negligible number
  a rating of 5, whereas humans assign over 24% of items a median rating of 5. This middle-rating bias
  means Mistral cannot distinguish very poor from very good summaries, a gap invisible in the aggregate
  Krippendorff's-α of 0.49.
