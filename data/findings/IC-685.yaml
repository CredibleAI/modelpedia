id: IC-685
title: CLIP ViT-B/32 with a linear probe relies on gender as a spurious correlation for hair color,
  achieving only 15.85% accuracy on female gray hair
description: 'The paper fine-tunes a linear classifier on CLIP''s frozen cls token embeddings for binary
  gray-hair vs non-gray-hair classification on CelebA. The baseline shows a large gender gap: male gray
  hair accuracy is 58.22% while female gray hair accuracy is only 15.85%, indicating the model exploits
  gender as a shortcut. Using ViTE to zero out tokens on layer 12 that interpret to non-hair-related
  words (including gender-related terms) improves female gray hair accuracy to 74.01% (male: 81.66%),
  demonstrating the spurious correlation was carried in those specific tokens.'
