id: IC-888
title: SLIMG fails on heterophily graphs for link prediction because it cannot properly measure node
  similarity of heterophily embeddings
description: The paper reports that SLIMG, a linear GNN designed for node classification, degrades substantially
  when applied to link prediction on heterophily graphs. On five real-world heterophily datasets (chameleon,
  squirrel, actor, twitch, pokec), SLIMG scores range from 12.0 to 76.9 hits@100/1000, while on homophily
  graphs it reaches up to 86.8. On synthetic off-diagonal (heterophily) structures with local features,
  SLIMG drops from 82.5 to 31.1 hits@100. The authors attribute this to SLIMG's inability to adjust
  node similarity for embeddings where connected nodes are expected to be dissimilar.
