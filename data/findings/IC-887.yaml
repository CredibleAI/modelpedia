id: IC-887
title: HuggingGPT's in-context task-model assignment always selects the same model regardless of input
  question or task type
description: The paper tests HuggingGPT's in-context task-model assignment strategy on 100 GQA questions
  spanning five structural categories (query, choose, compare, logical, verify). In every single case,
  the LLM-based selection assigns the task to ViLT-b32-finetuned-vqa with 100% consistency, regardless
  of the question content or structure. The authors conclude that the in-context learning mechanism
  does not achieve genuine dynamic model selection, as the selected model remains fixed across all inputs.
