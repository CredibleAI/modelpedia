key_metric: 100% selection of ViLT-b32-finetuned-vqa across all 5 task types (query, choose, compare,
  logical, verify) on 100 questions; all other 6 candidate models selected 0%
caveat: The experiment was conducted only in a one-step scenario, where one model is selected for a
  single task. The authors note this is a simplified setting but argue it is sufficient to demonstrate
  the limitation.
