id: IC-991
title: LLaMA-2, Falcon-7B, and GPT-3.5-Turbo exhibit large performance spread (up to 76 accuracy points)
  across semantically equivalent prompt formats, and model comparison rankings are frequently reversed
  by format choice
description: The paper evaluates six released LLMs on 53 classification and multiple-choice tasks from
  Super-NaturalInstructions, sampling 10 semantically equivalent prompt formats per task and measuring
  accuracy spread. The median spread is 7.5 accuracy points, with 20% of tasks showing at least 15 points
  of spread for all LLaMA-2 settings. The spread is not eliminated by increasing model size (7B to 70B),
  adding few-shot examples (1 to 5), or instruction tuning (Falcon-7B vs. Falcon-7B-Instruct). Furthermore,
  the relative performance ordering of two models is reversed by a format change with probability 0.141
  (LLaMA-2-13B vs. 70B) and 0.140 (LLaMA-2-7B vs. Falcon-7B) at a 2-point threshold, and in 76% and
  47% of those cases both comparisons were individually statistically significant. GPT-3.5-Turbo shows
  a median spread of 6.4 points across 320 formats, and LLaMA-2-70B (4-bit quantized) shows a median
  spread of 17.1 points.
