id: IC-144
title: TD-MPC's training is unstable, with performance collapsing after approximately 1–4 million steps
  across multiple DM Control tasks
description: The authors reproduce TD-MPC using its official code with identical architecture and hyperparameters
  to their new method. Across 26 state-based and 10 image-based DM Control tasks, TD-MPC achieves competitive
  results up to roughly 1 million steps, but in many tasks its performance suddenly collapses after
  this point, producing high variance and reduced episode returns. The authors attribute this to the
  absence of an explicit encoder loss in TD-MPC's objective, which causes the consistency loss to diverge
  and gradients to explode. The collapse is observed consistently across seeds and tasks, making it
  a reproducible failure condition.
