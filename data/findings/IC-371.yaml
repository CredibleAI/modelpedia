caveat: The resuscitation method arbitrarily modifies model parameters and showed performance decline
  when applied to initial- or mid-stage models. The authors note that more refined methods preserving
  language modeling capabilities are needed. Performance after resuscitation remains lower than a mid-stage
  model with similar knowledge entropy.
