key_metric: 'Summary leaks secret: GPT-4 0.39, ChatGPT 0.57, InstructGPT 0.09, Mixtral 0.28, Llama-2
  Chat 0.35, Llama-2 0.21; Action item leaks secret: GPT-4 0.29, ChatGPT 0.38; Omits public info (summary):
  GPT-4 0.10, ChatGPT 0.27'
caveat: Only 20 transcripts were used. Scenarios were generated by GPT-4 (familiarity concern); a control
  with ChatGPT-generated scenarios confirmed GPT-4 still outperforms ChatGPT. String-match evaluation
  underestimates true leakage.
