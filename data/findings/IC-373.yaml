id: IC-373
title: In Pythia-2.8B, the specific attention heads and MLPs implementing retrieval depend on superficial
  input features, and request-patching preserves the natural retrieval mechanism
description: 'A finer-grained case study on Pythia-2.8B using path patching shows that the set of components
  directly contributing to the logits varies strongly with input content: only 18% of top-contributing
  components are shared across inputs. A family of city-specific attention heads was discovered that
  attend to the city token and contribute to the output only for a particular city value. When request-patching
  is applied, the attention patterns and direct effects of late-layer components closely match those
  on a natural reference input (relative difference less than 12%), indicating the intervention preserves
  the model''s natural retrieval mechanism rather than creating an artificial one.'
