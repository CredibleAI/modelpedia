id: IC-591
title: Downstream fine-tuning on GSM8K degrades safety of Llama2-7b-chat and Mistral-7b-instruct-v0.2,
  but RSN-Tune partially preserves safety by protecting non-overlapping safety neurons.
description: 'Fine-tuning instruction-tuned models on the GSM8K training set significantly increases
  harmfulness: Llama2-7b-chat''s harmful score rises from 0.0 to 41.0, and Mistral-7b-instruct-v0.2''s
  from 36.0 to 79.0. The authors attribute this to overlap between safety neurons and ''foundation neurons''
  that are modified during fine-tuning. RSN-Tune, which tunes only safety neurons that do not overlap
  with foundation neurons, reduces the post-fine-tuning harmful score to 26.0 (Llama2-7b-chat) and 41.0
  (Mistral-7b-instruct-v0.2), while maintaining downstream task performance (GSM8K accuracy 26.2 and
  63.2 respectively).'
