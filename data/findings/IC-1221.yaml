id: IC-1221
title: LLM performance on in-context boolean function learning is scale-dependent, with GPT-2 failing
  and Llama-2 models improving gradually with size
description: In appendix H.3, the authors evaluate GPT-2, Llama-2-7B, Llama-2-13B, and Llama-2-70B directly
  on conjunction and majority tasks at 5, 7, and 15 dimensions. GPT-2 fails on both tasks even at 5
  dimensions, performing near the null classifier. Llama-2-7B achieves non-trivial performance, and
  accuracy increases gradually through 13B to 70B. This indicates that the ability to implement learning
  algorithms in-context emerges and strengthens with model scale.
