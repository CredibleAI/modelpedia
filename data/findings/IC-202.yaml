id: IC-202
title: All six evaluated LLMs achieve very low accuracy on OpenRCA, with no model solving any three-element
  root cause query
description: 'Six LLMs with at least 128k context windows were evaluated on 335 real-world software
  failure cases requiring identification of root cause elements (component, time, reason) from heterogeneous
  telemetry. The best model, Claude 3.5 Sonnet, achieved only 11.34% accuracy using the RCA-Agent framework.
  Performance drops sharply as the number of required root cause elements increases: accuracy falls
  by at least half going from one to two elements, and all models score 0% on three-element queries.
  Models also perform better on the simpler telecom system than on the more complex bank and market
  systems. Proprietary models consistently outperform open-source models across all evaluation methods.'
