id: IC-137
title: Pre-trained ResNet34 and ViT-B features on CIFAR-100 exhibit a block-diagonal class-correlation
  structure, with ViT-B showing higher intra-class correlation (0.35) than ResNet34 (0.25)
description: The paper measures pairwise feature correlations of pre-trained ResNet34 and ViT-B on CIFAR-100
  to verify that their features satisfy the block-diagonal gram matrix structure assumed in their theory.
  For ResNet34, the mean intra-class feature correlation is 0.25±0.16, super-class correlation is 0.02±0.12,
  and inter-superclass correlation is -0.03±0.10. For ViT-B, the intra-class correlation rises to 0.35,
  which the authors note amplifies the clustering effect of self-distillation so that most gains appear
  in the first two distillation rounds. The same block-diagonal pattern is confirmed on five additional
  datasets (Caltech-101, Caltech-256, Flowers-102, Food-101, StanfordCars) for ResNet34.
