id: IC-183
title: Error types in Mistral-7B, Mistral-7B-Instruct, Llama3-8B, and Llama3-8B-Instruct are linearly
  predictable from internal representations, encoding fine-grained information beyond binary correctness
description: 'The paper defines a taxonomy of five error types based on the distribution of 30 resampled
  answers: refuses to answer, consistently correct, consistently incorrect, two competing answers, and
  many answers. Linear probing classifiers trained on intermediate representations of greedy-decoded
  generations can predict which error type a question will produce. AUC scores range from 0.59 to 0.90
  across models and error types on TriviaQA, with the highest scores for ''refuses to answer'' (0.85-0.88)
  and ''many answers'' (0.84-0.90). Results on Winobias and Math show similar patterns, confirming that
  the internal representation encodes more than a single correctness signal.'
