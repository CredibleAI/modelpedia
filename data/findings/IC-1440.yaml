id: IC-1440
title: 'GCN, GAT, GraphSAGE, and SGC exhibit structure-dependent generalization in transductive node
  classification: test nodes with shorter paths to training nodes are classified more accurately'
description: The paper groups test nodes by their shortest path length to the nearest training node
  (l-hop interplay) and measures classification accuracy per group. Across Cora, Citeseer, and PubMed,
  all four message-passing GNNs show a monotonic increase in accuracy as interplay increases (i.e.,
  as test nodes get closer to training nodes). The same trend holds when grouping by node degree, with
  lower-degree nodes (fewer interactions with training nodes) performing worse. This empirical pattern
  is used to validate the paper's PAC-Bayesian bound linking generalization error to l-hop interplay.
