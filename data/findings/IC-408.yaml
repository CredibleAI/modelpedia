id: IC-408
title: Claude models (2.0, 2.1, 3 Haiku, 3 Sonnet, 3 Opus, 3.5 Sonnet) achieve 100% jailbreak attack
  success rate under prefilling attacks via the Anthropic API
description: Anthropic's API allows users to prefill the model's response with a specified beginning.
  The authors combine this prefilling feature with their prompt template (split into system and user
  messages) to achieve 100% attack success rate on all Claude models without any iterative optimization.
  Transfer attacks (adversarial suffixes optimized on GPT-4) also succeed on most Claude models (96-100%
  ASR), but prefilling is the more reliable method. Claude 2.1 is the most robust in the series, requiring
  100 restarts for the prefilling attack, and GPT-4 as judge shows ~20% false positives on this model.
