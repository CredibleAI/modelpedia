key_metric: 100% ASR on 50 AdvBench requests for all Claude models via prefilling; transfer attack achieves
  98% (Claude 3 Haiku), 100% (Claude 3 Sonnet), 96% (Claude 3.5 Sonnet); Claude 2.1 requires 100 restarts
  for prefilling to reach 100%
caveat: GPT-4 as semantic judge exhibits ~20% false positives on Claude 2.1 (vs. <5% on other models).
  The prefilling attack exploits an API feature rather than the model's internal alignment; it is unclear
  whether the model would be equally vulnerable if the prefilling feature were removed.
