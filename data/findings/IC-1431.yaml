id: IC-1431
title: BERT-base fine-tuning has negligible distribution-wise variance (0.21%) while BERT-large fine-tuning
  has substantial distribution-wise variance (2.08%) on MRPC
description: The authors fine-tune pretrained BERT-base and BERT-large checkpoints 1,000 times each
  on the MRPC task. Although both models show high test-set variance (0.80% and 2.24% standard deviation
  respectively), only BERT-large exhibits genuine distribution-wise variance. For BERT-base, the top
  15% of seeds by validation performance achieve only 0.09% higher test-set accuracy than average, and
  the estimated distribution-wise standard deviation is just 0.21%. For BERT-large, the distribution-wise
  standard deviation is 2.08%, confirming that multiple fine-tuning runs genuinely help for the larger
  model but only overfit the validation set for the smaller one.
