id: IC-463
title: DPO's first-step gradients in GPT-2 are correlated with the toxic subspace, with stronger alignment
  in later layers and with more samples
description: The paper computes the first-step DPO gradients with respect to GPT-2's MLP-value weight
  matrices and measures how much of the gradient is explained by the toxic subspace identified via SVD
  (ratio of Frobenius norms). The correlation is substantially above a random-matrix baseline, confirming
  that DPO moves weights in the toxic subspace direction. The correlation is stronger in later layers
  (justifying editing higher layers) and increases with sample size (8, 32, 128 samples), consistent
  with the theoretical prediction that DPO needs large samples to average out noise. Figure 6 further
  shows that DPO and PROFS exhibit similar incremental layer-wise contributions to token probability
  changes.
