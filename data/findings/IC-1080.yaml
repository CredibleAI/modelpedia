id: IC-1080
title: OPUS-MT small, OPUS-MT large, and mBART-50 in their default (unfine-tuned) form achieve low context-sensitive
  disambiguation accuracy on discourse-level phenomena
description: 'The paper evaluates the released, unfine-tuned versions of OPUS-MT small, OPUS-MT large,
  and mBART-50 on English-to-French context-sensitive translation tasks covering anaphora resolution
  and lexical choice. Without context-aware fine-tuning, these models correctly disambiguate context-sensitive
  target words in only a minority of cases: OPUS-MT small scores 0.14/0.40/0.29, OPUS-MT large 0.16/0.41/0.31,
  and mBART-50 0.26/0.42/0.25 (ok metric on SCAT+, DisCEval-MT ana, DisCEval-MT lex respectively). This
  indicates that the released models have limited ability to leverage inter-sentential context for discourse-level
  disambiguation in translation.'
