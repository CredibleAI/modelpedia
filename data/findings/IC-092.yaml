id: IC-092
title: All evaluated LLMs show consistent F1 degradation to at most 0.60 when two or more events match
  a retrieval cue
description: 'On the long book (100k tokens, 196 events), every model and memory strategy tested shows
  a sharp drop in recall accuracy once a cue matches more than one event. For single-event cues, top
  models reach F1 of 0.81–0.97, but for two or more matching events the best F1 across all models and
  strategies is 0.60 or below. The effect is consistent across in-context, RAG, and fine-tuning settings,
  and persists on the shorter 10k-token book. The authors attribute this to cue overload: the model
  cannot disambiguate among multiple similar events sharing a cue dimension.'
