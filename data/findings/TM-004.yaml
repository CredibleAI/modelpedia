title: Surface composition, not the acquisition time gap, correlates with optical-to-SAR reconstruction error
description: >
  Surface composition dominates the correlation ranking: water, snow and ice are associated with
  higher residuals, while flooded vegetation is associated with lower residuals. The time gap
  between radar and optical acquisition is practically irrelevant.
