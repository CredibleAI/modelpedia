title: Land cover, not the acquisition time gap, correlates with optical-to-SAR reconstruction error
description: >
  What actually predicts a bad reconstruction is what is on the ground: snow, water, clouds and
  flooded vegetation drive most of the correlation with error size. What barely matters is the
  time gap between when the radar and the optical image were captured, which you might reasonably
  have expected to be the main culprit.
