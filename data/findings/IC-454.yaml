id: IC-454
title: Most hidden trajectories in trained LLMs exhibit exponential growth in norm as a function of
  depth, a property that emerges with training
description: The paper measures expodistance, the coefficient of variation of the per-layer log-growth
  rate of embedding norms. In trained LLMs, most trajectories show low expodistance, indicating approximately
  constant per-layer growth (exponential in depth). At initialization, trajectories show equally-spaced
  (linear) rather than exponentially-spaced norms. In Pythia 12B, expodistance decreases (exponentiality
  increases) as a function of training checkpoint, and the transition from log-like to exponential-like
  growth is visible through layers 5-20. The low coefficient of variation across prompts indicates robustness
  across diverse tasks.
