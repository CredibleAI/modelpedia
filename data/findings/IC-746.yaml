id: IC-746
title: RoBERTa-Large pretrained with different mask ratios exhibits a sweet spot in downstream accuracy
  on QNLI and SST-2
description: The paper evaluates RoBERTa-Large checkpoints (from Wettig et al. 2023 for α ≥ 0.15) on
  QNLI and SST-2 after fine-tuning with a linear head and an explicit average encoder. Test accuracy
  peaks at mask ratio 0.15 on QNLI and at 0.40 on SST-2, with lower accuracy at both smaller and larger
  mask ratios. The train-test gap decreases monotonically with mask ratio on QNLI but is U-shaped on
  SST-2, with its minimum at α = 0.40. The authors attribute the low-α regime to a large generalization
  gap (high κ) and the high-α regime to poor training accuracy or violation of the soft-invariance assumption.
