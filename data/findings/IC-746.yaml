caveat: For α = 0.05 and 0.10 the authors trained their own encoders rather than using released checkpoints;
  the average encoder (eqn. 7) is used explicitly, which differs from standard practice of applying
  the pretrained encoder directly; fine-tuning is applied during downstream, which the theory does not
  analyze.
