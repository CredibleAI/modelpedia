caveat: The mechanistic analysis (correlation and causal intervention) is conducted only on LLaMA2-7B-Chat;
  the AARF mitigation results extend to LLaMA2-13B and LLaMA3-8B but the internal mechanism was not
  independently verified on those models. The ECS and PKS metrics are described as 'intuitive proxies'
  rather than exact measures.
