id: IC-553
title: OpenCLIP ViT-B/16's image-text alignment score is a strong predictor of domain generalization
  accuracy, while perceptual similarity to LAION-400M pre-training data is a weaker predictor
description: 'The paper computes the cosine similarity between OpenCLIP''s frozen image embeddings and
  text label embeddings (alignment score) for every sample across five DomainBed datasets. When samples
  are binned by alignment score, DG accuracy shows a strong monotonic increase: near-zero accuracy at
  low alignment and near-perfect accuracy at high alignment. In contrast, the perceptual similarity
  score (cosine similarity to the nearest neighbor in LAION-400M) shows only a shallow, weak relationship
  with accuracy. OpenCLIP''s own zero-shot accuracy drops from 79.0% on high-alignment (IP) samples
  to 48.1% on low-alignment (OOP) samples, confirming that the alignment property of the pre-trained
  representation directly governs classification performance.'
