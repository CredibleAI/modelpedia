key_metric: 'OpenCLIP zero-shot average accuracy: 79.0% (DomainBed-IP) vs 48.1% (DomainBed-OOP); alignment
  threshold 0.21 separates IP from OOP; below alignment score 0.15, label noise is unacceptably high
  across all datasets'
caveat: 'The alignment score is computed using the same OpenCLIP backbone that initializes the DG methods,
  so the finding is specific to this backbone. The paper notes this in Section 4: ''we use the same
  backbone both for splitting the datasets into ip and oop subsets and for training dg methods.'''
