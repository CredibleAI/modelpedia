id: IC-1262
title: LLaMA-2 factual query accuracy improves with entity popularity and decreases with query constrainedness,
  with larger models showing better performance on less popular and more constrained queries
description: Using basketball player year-of-birth queries, the paper shows that LLaMA-2 accuracy increases
  monotonically with the Wikidata site-link count (popularity proxy) of the queried entity, from 0.11
  to 0.79 for 7B and 0.52 to 0.98 for 70B across popularity bins. For word-constraint queries, accuracy
  decreases as constrainedness (number of potential solutions) increases, from 0.31 to 0.19 for 7B and
  0.42 to 0.12 for 70B. In both cases, larger models close the gap on harder queries more effectively.
