caveat: The specific per-k accuracy curves are reported only in Figure 4 (a plot); no tabulated numbers
  are printed in the text for the LLaMA 3.1 8B decay. The observation is made in a single task setting
  (KGQA over Freebase) and with a single retrieval method (SubGraphRAG's MLP retriever), so generalisability
  to other tasks or retrieval sources is not established.
