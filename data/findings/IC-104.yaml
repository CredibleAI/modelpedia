id: IC-104
title: Value anchor prompting produces LLM value correlation structures that closely match the human
  circular value structure, while standard prompting does not
description: The paper performed multidimensional scaling on the 19x19 value correlation matrices from
  each model and prompt condition, then compared the resulting 2D embeddings to the human MDS solution
  via Procrustes analysis. Under the value anchor prompt, the LLM correlation structures showed strong
  alignment with the human circular pattern (r = 0.87-0.95, p < .001). The sum of squared differences
  between LLM and human MDS coordinates was 0.11 for value anchor versus 0.71 for names (Gemini 1.0
  Pro, temperature 0.0). Standard prompting (basic, demographic, generated persona) produced substantially
  higher differences, indicating poorer fit to the human structure.
