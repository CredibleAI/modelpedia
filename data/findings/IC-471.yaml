id: IC-471
title: Pythia models exceeding 100M parameters show a consistent leftward shift of the multifractal
  spectrum (increasing regularity) during training that is absent in the 14M and 31M variants
description: The paper applies neuron-based multifractal analysis to the weight matrices of Pythia models
  at multiple training checkpoints. For models above 100M parameters, the Lipschitz-Hölder exponent
  α0 shifts leftward from epoch 0 to approximately 35,000, indicating increasing structural regularity,
  then stabilizes. The 14M model shows no such shift (α0 actually increases slightly), and the 31M model
  shows only a brief, non-continuing shift at epoch 5,000. The spectrum width (heterogeneity) increases
  for all sizes but stabilizes after roughly 35,000 epochs for models above 1B. At 53,000 epochs, the
  degree of emergence scales logarithmically with model size.
