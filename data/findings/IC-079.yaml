key_metric: 'Table A3 (Game of 24, correct expressions): correct evaluation 81.6%, correct verification
  79.1%. Table A4 (graph coloring, ablated colorings with 187 errors): 24 edge hallucinations, 52 vertex
  hallucinations, 5 both, 24 none. Table A6 (mystery blocksworld, correct plans): binary verification
  3/100 (3%), type identified 3/100 (3%), critique generation 3/100 (3%).'
caveat: 'Hallucination rates vary with the error rate of the input: when more edges are wrong (random
  colorings), the model is more likely to point to a real error. The authors note this makes the hallucination
  rate harder to interpret in isolation.'
