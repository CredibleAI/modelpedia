id: IC-735
title: GPT-3.5-turbo's factual verification performance drops substantially under adversarial modifications,
  with man-made adversarial examples causing the largest decline
description: 'The paper divides adversarial questions into three subsets: auto-generated from the corpus,
  manually modified synthesized questions, and artificially created adversarial questions. GPT-3.5-turbo
  under few-shot CoT shows average F1 of 83.95 on synthetic data, 79.45 on modified data, and 63.55
  on man-made data. The authors note that auto-generated questions often contain explicit positive or
  negative words that hint at the outcome, which LLMs can exploit, while manually crafted adversarial
  examples remove these cues.'
