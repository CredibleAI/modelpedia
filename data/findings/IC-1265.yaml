id: IC-1265
title: Calibration and failure prediction improve as model capability scales from GPT-3 to GPT-4, but
  remain far from ideal
description: 'Comparing vanilla verbalized confidence across GPT-3 (175B), GPT-3.5, and GPT-4 reveals
  a consistent trend: as model capability increases, ECE decreases and AUROC increases. The paper reports
  an approximate 22.2% improvement in AUROC from GPT-3 (avg 51.3) to GPT-4 (avg 62.7). However, even
  GPT-4''s AUROC remains close to the 50% random-guess threshold, and its ECE of 18.0 (×10²) still indicates
  substantial miscalibration. The improvement is monotonic across the GPT family but does not reach
  satisfactory performance.'
