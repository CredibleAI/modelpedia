id: IC-763
title: CLIP and OpenCLIP fall short of human discriminative accuracy on vision tasks, with performance
  dropping substantially under hard negatives
description: 'The paper evaluates multiple CLIP and OpenCLIP variants in a discriminative setting where
  they must select the correct Midjourney-generated image matching a text caption from two candidates.
  All variants fall below human accuracy across COCO, PaintSkill, T2ICompBench, and DrawBench. The gap
  widens with difficulty: OpenCLIP performance drops from 100% with easy negatives to approximately
  69% with hard negatives, while humans maintain near-perfect accuracy in both conditions.'
