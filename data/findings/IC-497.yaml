id: IC-497
title: Text-to-image models experience performance drops exceeding 10% under adversarial prompts, with
  spatial reasoning being the most vulnerable task across all models
description: The paper constructs adversarial prompts using GCg and MMP attacks against surrogate models,
  then evaluates transferability to target text-to-image and image-to-text models. All text-to-image
  models show performance drops above 10% from their benign accuracy. The best text-to-image model (Nova
  Canvas) achieves only 62.42% averaged robust accuracy. For image-to-text models, spatial reasoning
  is the most challenging task, where the best model (GPT-4o) achieves only 53.79% accuracy. Newer models
  within the same family (DALL·E 3 vs DALL·E 2, GPT-4o vs GPT-4V) show both higher benign accuracy and
  better robustness.
