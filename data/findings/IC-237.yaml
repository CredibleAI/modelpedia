id: IC-237
title: A zero-shot Llama 3 8B, when prompted to select the best bounding box from VLM candidates without
  fine-tuning, produces results nearly identical to the VLM alone
description: The paper evaluates Llama 3 8B Instruct in a zero-shot setting (no LoRA fine-tuning) where
  it is asked to pick the best box index from a list of VLM candidates. Across all four VLMs (GD, GD-REC,
  GD-1.5, FLO2) and all datasets, the zero-shot LLM adds negligible or slightly negative value. For
  example, on RefCOCOg val, GD goes from 60.09 to 58.05 p@1, and FLO2 goes from 67.91 to 67.69. The
  authors attribute this to LLMs lacking off-the-shelf reasoning for this structured selection task
  despite their extensive general knowledge.
