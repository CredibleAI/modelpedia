id: IC-1204
title: SD-VAE 1.x and SD-VAE 2.x achieve lower reconstruction quality than the new SDXL-VAE on COCO
  2017
description: The paper evaluates the autoencoder components of previously released Stable Diffusion
  models on the COCO 2017 validation split at 256x256 pixels. SD-VAE 1.x achieves PSNR 23.4, SSIM 0.69,
  LPIPS 0.96, rFID 5.0, while SD-VAE 2.x achieves PSNR 24.5, SSIM 0.71, LPIPS 0.92, rFID 4.7. The new
  SDXL-VAE outperforms both on all four metrics.
