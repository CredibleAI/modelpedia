id: IC-699
title: Llama2-13b produces significantly less consistent answers than GPT-3.5-turbo on complex reasoning
  tasks, making it unsuitable as a weaker LLM in a cascade
description: When used as the weaker LLM in the cascade pipeline, Llama2-13b exhibits much lower answer
  consistency across multiple samples than GPT-3.5-turbo on complex reasoning tasks. On GSM8K, only
  16.3% of cases achieve an agreement score above 0.6 for Llama2-13b versus 77.3% for GPT-3.5-turbo;
  on CREPE the figures are 24.3% versus 72.2%. The accuracy within those high-agreement cases is comparable,
  indicating the issue is the proportion of questions the model can answer consistently rather than
  the quality of its confident answers. On the simpler Date dataset, Llama2-13b performs more comparably.
