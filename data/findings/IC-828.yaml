id: IC-828
title: Jailbreaking GPT-4 via cipherchat shifts its psychological profile toward human norms and reduces
  emotional intelligence scores
description: Applying a Caesar cipher shift-3 jailbreak (cipherchat) to GPT-4's prompts bypasses its
  safety alignment and produces a different psychological profile (GPT-4-JB). The jailbroken model's
  BFI openness (3.8±0.6) moves closer to the human norm (3.9±0.7) compared to default GPT-4 (4.2±0.6).
  The jailbreak causes a substantial reduction in EIS (from 151.4±18.7 to 121.8±12.0) and empathy (from
  6.8±0.4 to 4.6±0.2), though WLEIS subscales show no statistically significant change. The authors
  interpret this as revealing GPT-4's 'intrinsic' psychological nature beneath safety constraints.
