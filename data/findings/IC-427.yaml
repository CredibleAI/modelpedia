id: IC-427
title: Newer base models (post-November 2023) outperform older ones by 7.3 points on MMLU and 19.1 points
  on GSM8K controlling for pretraining compute, but this gap vanishes after fine-tuning all models on
  the same task-relevant data
description: The paper evaluates 56 base models (70M–70B parameters) on MMLU and GSM8K, splitting them
  into those trained before and after November 2023. Controlling for pretraining compute via a log-linear
  regression, newer models show a statistically significant advantage of 0.073 on MMLU and 0.191 on
  GSM8K. After fine-tuning all models on the same task-specific data (MMLU auxiliary set for MCQA, MetaMathQA+Orca-Math
  for math), the estimated difference drops to 0.005 for both benchmarks and is no longer statistically
  significant. The same pattern appears when ARC and HellaSwag are reformulated as multiple-choice questions
  (differences of 0.120 and 0.114 unadjusted, 0.014 and 0.009 adjusted), indicating the confound is
  about task format rather than data contamination.
