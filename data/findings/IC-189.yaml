id: IC-189
title: Most LLMs show degraded instruction satisfaction when user instructions conflict with system
  messages, indicating difficulty in prioritizing system message constraints
description: 'When user instructions are misaligned (conflicting) with system messages, most models
  show lower ISR than on aligned instructions. The gap is largest for weaker models: GLM-4-9b drops
  from 48.3% (aligned) to 28.4% (misaligned), a 19.9-point drop. GPT-4o shows a smaller gap (77.8% vs.
  71.4%). Notably, GPT-3.5-turbo is an exception, scoring higher on misaligned (47.7%) than aligned
  (41.9%) instructions, suggesting acute awareness of system message priority. The authors attribute
  the misaligned degradation to insufficient recognition of system message priority.'
