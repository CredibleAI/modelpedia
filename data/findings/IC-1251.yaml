caveat: The intervention is a proof-of-concept that forces attention patterns rather than a natural
  training signal. The authors note the model's inhibition heads are active but receiving 'incorrect
  biases' in the unmodified model, and speculate a bottleneck in signal formation may explain why the
  model cannot activate them correctly on its own.
