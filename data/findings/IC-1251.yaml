id: IC-1251
title: Intervening on four attention heads in GPT-2-medium boosts colored objects accuracy from 49.6%
  to 93.7% by making the circuit behave like the IOI circuit
description: The authors intervene on the forward pass of GPT-2-medium by forcing three inhibition heads
  (12.3, 13.4, 13.13) and the negative mover head (19.1) to attend from the [end] position to the incorrect
  color options, mimicking their role in the IOI circuit. This raises accuracy from 49.6% to 93.7% (both
  interventions), 81.5% (inhibition heads only), and 78.1% (negative mover head only). The intervention
  introduces zero new mistakes. Downstream, mover heads show decreased attention to wrong colors (-8.7%
  average) and increased logit attribution (~3x), with a Spearman correlation of 0.69 (p < 0.01) between
  the change in logit attribution and original path patching importance, confirming the predicted IOI
  circuit dynamics.
