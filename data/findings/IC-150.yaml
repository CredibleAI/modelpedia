key_metric: Mean-ablating second-order effects in layer 9 (ViT-B/32) drops ImageNet accuracy to 29.6%
  (Table 1); ablating indirect effects in the same layer drops it only to 52.3%. First PC of second-order
  effects explains 48.2% of variance vs 11.0% for indirect effects.
caveat: The paper notes it ignored the effect of neurons on consecutive queries and keys in the attention
  mechanism, and did not analyze mutual effects between neurons in the same or different layers.
