id: IC-150
title: Second-order effects of CLIP's MLP neurons are concentrated in late layers (8–10 of 12 in ViT-B/32)
description: The paper introduces a 'second-order lens' that traces each neuron's contribution through
  subsequent attention heads to the output. Mean-ablating all second-order effects in a given layer
  and measuring zero-shot ImageNet accuracy shows that layers 8–10 produce the largest accuracy drop,
  while early layers have negligible effect. The same trend holds for the larger ViT-L/14 model, where
  the drop is smaller but still concentrated in later layers. This contrasts with the first-order (direct)
  effects of attention heads, which are significant in layers 9–11.
