key_metric: 'OOD accuracy (avg): Swin-L 50.88 (LP) → 52.35 (NMtune); ConvNeXt-L 66.86 → 70.30; GPT-2
  GLUE-X 36.68 → 39.07; text-ada-002 GLUE-X 44.06 → 53.48; BERT-L GLUE-X 50.65 → 51.63; RoBERTa-L GLUE-X
  44.55 → 47.01'
caveat: The paper notes that results are not comparable to white-box full fine-tuning, and that the
  explored models are relatively small-scale in terms of pre-training. The authors also note that NMtune
  may not be noise-tolerant on the downstream side (performance falls short of LP when downstream noise
  exceeds 40%).
