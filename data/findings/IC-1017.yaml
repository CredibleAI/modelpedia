id: IC-1017
title: Vision and language models pre-trained on noisy data exhibit degraded OOD transfer that is partially
  recoverable via SVD-based feature-space regularization
description: 'The paper evaluates nine released models (EfficientNet-B3, ResNetV2-152x2, Swin-L, ViT-L,
  ConvNeXt-L, BERT-L, RoBERTa-L, GPT-2, text-ada-002) that are known to be pre-trained on noisy or uncurated
  data (JFT-300m, ImageNet-21k, LAION-2B, WebText, BookCorpus+Wikipedia). Under linear probing, all
  models show a substantial gap between in-domain and out-of-domain accuracy. Applying the authors''
  NMtune method (a 2-layer MLP with MSE, covariance, and dominant-singular-value regularization losses)
  improves OOD accuracy over LP by 1–9 points across all models, with the largest gains on language
  models (e.g., text-ada-002 GLUE-X: 44.06→53.48) and vision models (e.g., ConvNeXt-L DomainNet: 66.86→70.30).
  MLP tuning without the regularization losses provides smaller or inconsistent gains, indicating the
  improvement comes from reshaping the feature-space spectrum rather than from added capacity.'
