id: IC-1598
title: Retrieval augmentation improves GPT-3.5-turbo-4k on long-context tasks but not GPT-3.5-turbo-16k
description: The paper measures the effect of adding top-5 retrieved chunks to the input of two context-window
  variants of GPT-3.5-turbo on three long-context QA tasks (MuSiQue, HotpotQA, MultiFieldQA-EN). For
  the 4k-context variant, the average score rises from 37.08 to 41.15, a substantial gain. For the 16k-context
  variant, the average moves from 43.60 to 43.27, showing no meaningful improvement. This suggests that
  once the model's native context window is large enough to hold the relevant evidence, external retrieval
  adds little value for this model family.
