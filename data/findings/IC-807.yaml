id: IC-807
title: Language-conditioned robot policies RT-1 and RT-2 fail to generalize to unseen manipulation tasks,
  achieving only 16.7% and 11.1% success rates respectively across 7 novel skills
description: 'The paper evaluates RT-1 and RT-2 on 7 unseen manipulation skills (place fruit, upright
  and move, move within drawer, restock drawer, pick from chair, fold towel, swivel chair) that require
  combining seen motions in novel ways or generalizing to wholly unseen motions. Both language-conditioned
  policies perform poorly: RT-1 reaches 16.7% overall success and RT-2 reaches 11.1%, across 64 total
  trials. The authors note that language conditioning is insufficient because the new tasks have semantically
  unseen language instructions, even when the underlying arm motions were partially seen during training.
  RT-2, despite being trained on internet-scale VQA data, does not outperform the smaller RT-1 on these
  novel-motion tasks.'
