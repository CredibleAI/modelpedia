id: IC-357
title: Off-the-shelf foundation models (DINO, CLIP, DINOv2, ViT) exhibit higher variance in their cosine
  similarity distributions than dataset-specific models, reducing the discriminative power of cosine
  similarity retrieval
description: The paper measures the probability mass function of pairwise cosine similarities in the
  reference set for both off-the-shelf foundation models and a dataset-specific model (CoPlace) on Pittsburgh30k.
  Foundation models show a broader, higher-variance cosine similarity distribution, meaning high-variance
  dimensions dominate the similarity computation and reduce the ability to distinguish relevant from
  irrelevant matches. Applying the authors' variance-constrained autoencoder (AE-SVC) reduces this variance
  and yields up to 15.5% average improvement in MAP@k across four datasets, with the improvement being
  larger for foundation models (~10%) than for the dataset-specific model (~2%), confirming that the
  distributional property is the limiting factor for the off-the-shelf models.
