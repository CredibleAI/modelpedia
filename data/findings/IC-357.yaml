key_metric: ae-svc achieves an average improvement of 15.5% across all datasets and embeddings at full
  size; dinov2-large shows 24% improvement on inshop, 10% on sop, 2% on pittsburgh30k, and 22% on tokyoval;
  ae-svc benefits the off-the-shelf foundation model more (10%) than the dataset-specific model (2%)
caveat: The improvement from AE-SVC on dataset-specific models is limited (2%), suggesting the distributional
  issue is specific to foundation models; the paper notes the fundamental discrepancy between embedding
  spaces of foundation and dataset-specific models remains unknown
