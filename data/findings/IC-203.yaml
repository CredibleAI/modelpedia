id: IC-203
title: Gemini 1.5 Pro's RCA-Agent accuracy drops 68.4% when code execution fails, far exceeding the
  drops for Claude 3.5 (17.9%) and GPT-4o (15.6%)
description: When the RCA-Agent encounters a failed code execution, the model must use the error feedback
  to revise its code or adjust its reasoning. Manual review showed that GPT-4o and Claude 3.5 effectively
  utilize execution feedback (empty output, exception tracebacks) to recover, while Gemini 1.5 Pro rarely
  does. Quantitatively, Gemini's accuracy on queries involving failed executions drops from 2.69% to
  0.85% (a 68.4% reduction), compared to 17.9% for Claude and 15.6% for GPT-4o. This indicates that
  the agent framework imposes an additional error-tolerance requirement that Gemini does not meet.
