id: IC-270
title: Unsupervised finetuning (evo-tuning) on homologous sequences improves ESM-2 650M zero-shot fitness
  prediction for low-likelihood wild types but harms high-likelihood ones, with optimal threshold at
  log-likelihood ε = −1.4
description: 'The authors finetune ESM-2 650M for 5 epochs on the 1,000 most similar UniRef100 sequences
  (by MMseqs2 e-value) for each of 217 ProteinGym DMS studies. Performance improvement is anti-correlated
  with starting wild type likelihood: low-likelihood sequences benefit while high-likelihood sequences
  degrade. At ε = −1.4 (only finetuning sequences below this log-likelihood threshold), ESM-2 650M achieves
  a mean weighted Spearman of 0.443, outperforming EVE (0.432) and MSA Transformer (0.421), and approaching
  TranceptionEVE (0.455). Naive finetuning without the threshold (ε = 0) degrades performance to 0.377.'
