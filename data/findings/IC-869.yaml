id: IC-869
title: Models ranking highly on popular LLM leaderboards perform worse than Llama-2-70b-chat on Skill-Mix,
  suggesting cramming for the leaderboard at the expense of general-purpose text generation
description: Falcon-180b-chat, Xwin-LM-70b-v0.1, Qwen-14b-chat, and Mistral-7b-instruct-v0.1 all rank
  above Llama-2-70b-chat on the Open LLM Leaderboard or AlpacaEval, yet all perform worse than Llama-2-70b-chat
  on Skill-Mix under both GPT-4 and Llama-2 grading. TigerBot-70b-chat, also ranked above Llama-2-70b-chat
  on the Open LLM Leaderboard, performs even worse than Llama-2-13b-chat on Skill-Mix. The authors interpret
  this as evidence that training on data similar to leaderboard benchmarks ('cramming') significantly
  harmed general-purpose text skills.
