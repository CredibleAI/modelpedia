id: IC-456
title: VLM decoders achieve near-random accuracy on VALSE image-sentence alignment while pairwise accuracy
  is much higher, indicating reliance on linguistic priors
description: 'The paper benchmarks four 7B VLM decoders on all VALSE instruments using both pairwise
  accuracy (accr) and overall accuracy (acc). In the acc setting, where the model must judge whether
  a single caption matches an image without seeing the foil, bakllava scores 50±0, llava-next-mistral
  56±5, and llava-next-vicuna 59±9, all at or near the 50% random baseline. mPLUG-Owl3 reaches 76±10.
  In contrast, pairwise accuracy (accr), where both caption and foil are presented, is substantially
  higher: 83±8, 85±9, 79±10, and 88±6 respectively. The gap between accr and acc indicates the models
  exploit linguistic differences between caption and foil rather than genuinely understanding the image.'
