caveat: The workflow is generated by the authors' fine-tuned 7B model, so the quality of the prior knowledge
  is tied to that specific model. The paper notes the workflow is generated by a 7B model providing
  guidance to a 72B model, raising questions about the 'weak-guide-strong' paradigm.
