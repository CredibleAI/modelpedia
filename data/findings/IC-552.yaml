id: IC-552
title: GPT-4, Llama-3.1-8B, and Qwen-2-72B all improve on ALFWorld and WebShop when given a generated
  workflow as structured prior knowledge
description: The paper tests whether providing a workflow (generated by the authors' fine-tuned Qwen-2-7B)
  as prior knowledge improves end-to-end task performance. GPT-4 gains +13.57% on ALFWorld (27.14 to
  40.71) and +18.65% on WebShop (28.36 to 47.01). Llama-3.1-8B gains +6.72% on ALFWorld and +7.14% on
  WebShop. Qwen-2-72B gains +2.86% on ALFWorld and +5.57% on WebShop. The gains are larger for weaker
  models and on ALFWorld (more diverse environments) than WebShop. Average planning steps also decrease
  with workflow knowledge.
