id: IC-549
title: All 18 evaluated LLMs show a 15-20% performance gap between linear (node chain) and graph (workflow)
  planning on WorfBench
description: 'The paper evaluates 18 released LLMs on WorfBench, measuring both F1_chain (linear subtask
  ordering) and F1_graph (full DAG structure with parallel edges). Every model scores significantly
  lower on F1_graph than F1_chain. The largest average gap is 20.05% for GLM-4-9B, and the smallest
  is 15.01% for Llama-3.1-70B. GPT-4 achieves 67.32% F1_chain but only 52.47% F1_graph. Error analysis
  of GPT-4 identifies four recurring error types: granularity, explicitness, graph structure, and format,
  all attributed to insufficient environmental knowledge.'
