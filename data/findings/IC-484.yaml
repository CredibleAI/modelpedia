key_metric: 'Ring hit@1: 0.61 (2 PCs), 0.77 (3 PCs), 0.20 (null), 0.17 (random). Grid hit@1: 0.57 (2
  PCs), 0.68 (3 PCs), 0.17 (null), 0.16 (random). Hex hit@1: 0.30 (2 PCs), 0.42 (3 PCs), 0.07 (null),
  0.06 (random).'
caveat: The authors state that the principal components 'have some causal effect on the model's output
  predictions, but does not provide a full explanation' and that 'our simple re-scaling approach does
  not perfectly capture a causal relationship between principal components and model predictions.'
