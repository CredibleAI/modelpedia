caveat: Chronos-T5 was retrained on the authors' 16.8B time-point corpus rather than its original training
  data. The authors note that NLL is not the most appropriate metric for evaluating discrete token prediction
  and that SMAPE is more suitable; specific exponent values are reported only in Figure 7, not in the
  text. Evaluation is restricted to univariate forecasting.
