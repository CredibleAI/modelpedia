id: IC-538
title: Chronos-T5's discrete probability prediction approach yields very small power-law exponents on
  NLL, limiting its scalability, and its in-distribution gains do not extend to out-of-distribution
  data
description: The paper retrains Chronos-T5 and a simpler decoder-only transformer on the same 16.8B
  time-point corpus. Chronos-T5, which tokenises time series values into a discrete vocabulary and predicts
  the next token, exhibits power laws with very small exponents when evaluated with NLL, indicating
  limited scalability. The authors attribute this to the discrete probability prediction, where NLL
  on a discrete distribution is not distance-sensitive. On in-distribution data, Chronos-T5 shows a
  slight advantage in performance and scalability, but on out-of-distribution data the simpler decoder-only
  baseline performs better, and both models exhibit similar scaling patterns.
