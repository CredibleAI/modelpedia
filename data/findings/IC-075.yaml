id: IC-075
title: GPT-4o-mini and Qwen2.5-72B achieve low precision and recall when used as API retrievers for
  workflow orchestration
description: In an appendix experiment, the paper uses GPT-4o-mini and Qwen2.5-72B with in-context learning
  to retrieve relevant APIs from a list given a task query. GPT-4o-mini achieves 42.5% precision and
  36.4% recall; Qwen2.5-72B achieves 40.6% precision and 40.7% recall. Manual inspection of 50 random
  cases showed 84% of retrieved APIs still fulfilled the task, suggesting the low metrics overstate
  the practical failure rate.
