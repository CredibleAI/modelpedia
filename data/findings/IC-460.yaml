id: IC-460
title: Non-private activation steering of Llama-2-7B and Qwen-2.5-7B leaks membership information from
  the alignment dataset, while PSA reduces the empirical privacy loss
description: 'The authors develop a canary-based membership inference attack for steered LLMs. When
  steering vectors are computed without privacy protection, an adversary can determine whether a specific
  demonstration was used: for Llama-2-7B the empirical epsilon is 4.0 (FPR 4.0e-2, FNR 1.8e-2) and for
  Qwen-2.5-7B it is 6.0 (FPR 2.0e-2, FNR 5.0e-3). Applying PSA reduces the empirical epsilon to 0.6
  for Llama-2-7B and 1.6 for Qwen-2.5-7B, both below the theoretical bound of 2.0.'
