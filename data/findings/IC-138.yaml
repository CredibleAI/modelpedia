key_metric: 'Trojan models: average AUROC 99.6%, average TPR@FPR5% 100% (Table 2). Vicuna-7B-v1.5: AUROC
  96.95 (GCG universal), 90.97 (GCG non-universal), 98.82 (ICA) (Table 11).'
caveat: 'Adaptive attacks can degrade detection: an adversary who knows the specific probe can regularize
  the backdoor to maintain refusal on the probe (AUROC drops to 42.58%), and an adversary who forces
  the first 10 tokens to be a refusal signal drops AUROC to 47.41% at sampling length 10 (recoverable
  to 96.08% at length 50).'
