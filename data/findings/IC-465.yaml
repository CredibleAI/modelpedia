id: IC-465
title: GPT-4o achieves the highest weighted Cohen's kappa agreement with a reference-guided agent-debate
  method among all VLM judges, with scores exceeding 50 in several visual dimensions
description: 'Among the five VLMs tested as judges (Video-LLaVA, Llama-VID, GPT-4o mini, InternVL2,
  GPT-4o), GPT-4o shows the strongest agreement with the reference-guided LLM agent-debate method. Its
  average kappa reaches 60.38 for social context and 55.18 for visual context, substantially above all
  other VLMs. The paper notes a consistent trend: the better a judge performs on the CVRR-ES benchmark
  itself, the higher its kappa as a judge, suggesting that content understanding is a prerequisite for
  reliable evaluation.'
