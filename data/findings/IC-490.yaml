id: IC-490
title: GPT-4o can identify visual relationships at 97% accuracy when given ground-truth descriptions
  but drops to 17% when asked to apply known relationships to new visuals, revealing a specific bottleneck
  in relational transfer
description: An ablation study on GPT-4o using VOILA-WD with L2M prompting provided ground-truth image
  descriptions at phase 2, after which GPT-4o identified relationships at 97% accuracy. However, when
  ground-truth relationships were provided at phase 3, GPT-4o's accuracy on applying those relationships
  to the third image dropped to 17%, well below the 71% human baseline. A complementary ablation on
  VOILA-ND showed GPT-4o achieves 22% accuracy with three sequential images but 49% with text descriptions
  of the same images, indicating a modality gap in visual relational reasoning.
