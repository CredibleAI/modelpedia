id: IC-131
title: GPT-4 Turbo, GPT-3.5 Turbo, Llama3-8B, Qwen-7B, and iFlytekSpark-13B over-rely on the strong
  reminder 'the answer is' in prompts as a shortcut, with accuracy dropping sharply when the cue is
  a random answer rather than the ground truth
description: Using the ROSE prompting strategy, the paper inserts a strong reminder ('the answer is
  X') into a three-step self-reflection prompt and varies X between the correct answer and a random
  letter. Across all tested models, accuracy drops substantially when X is random, indicating the model
  captures the reminder pattern rather than reasoning about the question. The effect is most severe
  on domain-specific knowledge (JEC-QA) where the model is less familiar with the content. Confidence
  levels rise through reflection steps even as accuracy falls, showing the model becomes more confident
  in its shortcut-driven answer.
