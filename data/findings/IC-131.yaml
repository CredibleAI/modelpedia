key_metric: 'GPT-4 Turbo on EG-QA: overall acc 0.9705 (truth cue) vs 0.8711 (random cue), no role +
  reminder; on JEC-QA: 0.7579 vs 0.3676. GPT-3.5 Turbo on EG-QA: 0.6777 vs 0.5017. Llama3-8B on EG-QA
  ID: teacher+truth step-3 acc 0.8418 vs teacher+random step-3 acc 0.5194. Qwen-7B on EG-QA ID: 0.8247
  vs 0.6597. iFlytekSpark-13B on EG-QA ID: 0.8350 vs 0.6062.'
caveat: The paper notes that multiple reminder patterns exist in different scenarios and that the large
  volume of training data makes it difficult to eliminate all hidden biases; the experiments use a specific
  reminder phrasing ('the answer is') and a specific task format (multiple-choice QA).
