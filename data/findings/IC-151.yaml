id: IC-151
title: Each CLIP neuron's second-order effect is approximately a single linear direction in the joint
  text-image space, significant for fewer than 2% of images
description: 'The paper shows that the second-order effect of any individual neuron can be well approximated
  by one direction vector in CLIP''s shared text-image representation space, scaled by an image-dependent
  coefficient. Replacing each neuron''s full second-order contribution with this rank-1 approximation
  causes negligible accuracy loss on ImageNet. The effect is also highly selective: for each neuron,
  the contribution is large in norm for only about 2% of validation images; ablating the effect on the
  remaining 98% of images has no measurable impact. Sparse coding of the direction into text representations
  recovers the neuron''s function with 128 descriptions.'
