key_metric: 'Second-order effect significant for < 2% of images. First PC explains 48.2% of variance
  (Table 1). Reconstruction from PC #1 yields negligible accuracy drop from baseline (Figure 3). 128
  text descriptions per neuron approach original classification accuracy (Figure 4).'
caveat: The rank-1 approximation is computed from ~5000 ImageNet training images; the paper notes the
  same behavior holds for ViT-L/14 and ImageNet-R but does not quantify the approximation error beyond
  the accuracy drop.
