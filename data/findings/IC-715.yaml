id: IC-715
title: Factual information deleted from GPT-J, LLaMA-2, and GPT-2-XL via ROME or MEMIT remains linearly
  recoverable from intermediate hidden states, with up to 89% extraction success at budget b=20
description: 'After applying ROME or MEMIT to remove a specific fact from GPT-J, LLaMA-2-7B, or GPT-2-XL,
  the paper projects intermediate hidden states onto the vocabulary embedding matrix (logit lens) and
  collects top-k tokens across a set of layers. The ''deleted'' answer still appears among the top candidates
  in a large fraction of cases: 38% for GPT-J with ROME on CounterFact, 88.55% for GPT-J with MEMIT
  on ZSRE, 62.14% for LLaMA-2-7B with ROME on CounterFact, and 87.00% for GPT-2-XL with MEMIT on CounterFact,
  all at budget b=20. The information is present in middle layers (e.g., layers 17-21 for GPT-J) but
  absent at the final output layer, indicating a depth-dependent organisation. A max-entropy defense
  that also edits intermediate representations reduces the GPT-J whitebox attack success from 38% to
  2.4%.'
