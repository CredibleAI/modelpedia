id: IC-485
title: LLMs show a significant performance gap between Wikipedia-based factual multi-hop QA and counterfactual
  multi-hop QA, indicating reliance on memorized knowledge rather than reasoning from context
description: 'The paper evaluates nine LLMs on both standard Wikipedia-based factual multi-hop QA datasets
  (HotpotQA, 2WikiMultiHopQA, MuSiQue) and the newly constructed COFCA counterfactual benchmark, where
  key entities and facts are replaced so the answers cannot be recalled from memory. All models show
  a substantial drop in EM and F1 scores on the counterfactual data. For example, GPT-4 drops from EM
  69.9 on HotpotQA to 53.1 on COFCA 2-hop, and GPT-3.5 drops from 58.6 to 40.6. A progressive annotation
  experiment (original passage, stage-1 keyword replacement, stage-2 full paraphrase) confirms the drop
  is due to data contamination: GPT-4''s EM falls from 71.35 to 65.62 to 63.49 across the three stages.'
