key_metric: Relative corrected OOD accuracy ~0.4 on rendition test sets (natural-only training); LAION-natural
  21.98% rendition top-1 (standard) / 17.81% (clean); LAION-mix-13m 40.48% / 40.78%; LAION-mix-16m 41.46%
  / 42.07%; LAION-rand-57m 40.66% / 39.58%; LAION-200M contains at least 7.90% rendition images (16M
  samples)
caveat: Training sets are constrained by the availability of natural (57M) and rendition (16M) samples;
  the authors conjecture but cannot prove the result holds at the full LAION-400M scale. They also note
  they did not control for object class distribution differences between LAION-natural and LAION-rendition,
  and the impact of ambiguous samples is left for future work.
