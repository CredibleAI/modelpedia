id: IC-147
title: CLIP's OOD performance on rendition domains is largely an artifact of domain contamination in
  its web-scale training data
description: The paper demonstrates that CLIP's strong zero-shot accuracy on rendition-style test sets
  (ImageNet-Sketch, ImageNet-R, DomainNet variants) is substantially inflated by the presence of rendition
  images in its LAION-400M/200M training data. By training CLIP ViT-B/32 from scratch on a clean 57M-sample
  natural-image-only subset (LAION-natural) and comparing to equally-sized subsets of the contaminated
  LAION-200M, the authors show that relative corrected OOD accuracy on rendition test sets drops to
  approximately 0.4. Adding just 13–16M rendition images to the training set nearly doubles rendition
  top-1 accuracy (from ~22% to ~40–42%) while having minimal impact on natural-domain performance. The
  effect is consistent across training set sizes from 4M to 57M samples, and the authors conclude that
  CLIP's apparent OOD robustness is not genuine generalization but a consequence of overlapping domain
  data.
