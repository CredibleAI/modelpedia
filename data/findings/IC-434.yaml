caveat: GPT-4o-mini deviates from the expected size-based trend, exhibiting a higher critical complexity
  than the larger GPT-4o. The authors hypothesize this is due to more aggressive training on high-quality
  data. Even the largest models eventually reach critical complexity, so scaling delays but does not
  eliminate over-reliance on memorization.
