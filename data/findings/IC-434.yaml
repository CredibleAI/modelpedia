id: IC-434
title: The critical complexity at which LLMs over-rely on memorization shifts to higher task difficulty
  as model size increases
description: Within model families, larger variants reach their peak ID-OOD gap (critical complexity)
  at higher algorithmic complexity levels than smaller variants. For example, Qwen 1.5 shifts from O(n)
  at 1.8B to O([n³, n⁴]) at 110B; Llama 3.1 shifts from O([n, n²]) at 8B to O([n³, n⁴]) at 405B; Gemma
  2 shifts from O([n², n³]) at 2B to O([n³, n⁴]) at 27B. Among closed-source models, Claude 3 Sonnet
  reaches O([n³, n⁴]) while Haiku reaches O([n², n³]). Notably, GPT-4o-mini (smaller than GPT-4o) exhibits
  a higher critical complexity of O(2^n), deviating from the size-based trend. O1-mini also reaches
  O(2^n), the highest observed.
