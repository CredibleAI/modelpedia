id: IC-349
title: Larger LLMs (Llama-2 7B, Llama-3 8B) suffer more severe general ability degradation than smaller
  models (GPT-2 XL 1.5B) under the same number of sequential edits
description: 'When the same editing method (memit) is applied for 300 sequential edits, GPT-2 XL''s
  downstream task performance remains largely unchanged, while Llama-2 and Llama-3 performance drops
  to nearly zero. The paper notes this as a general trend: ''larger models suffered more pronounced
  compromises in their general abilities when subjected to the same number of edits.'' This scale-dependent
  susceptibility is observed across multiple downstream tasks and editing methods.'
