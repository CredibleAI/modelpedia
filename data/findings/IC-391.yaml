  (7B) and 5.3% (110B) with PINE
caveat: The paper notes Qwen-1.5-72B-Chat is an exception where PINE does not help, suspecting the model
  is not well-trained. The RAG experiment uses only Llama-3-70B-Instruct. Temperature is set to 0 to
  avoid variance.
