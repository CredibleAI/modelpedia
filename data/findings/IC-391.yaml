id: IC-391
title: Llama-3 and Qwen-1.5 models exhibit position bias in LM-as-a-judge, retrieval-augmented QA, and
  math reasoning, with larger models showing less bias
description: The paper measures how swapping the positions of candidate responses, retrieved documents,
  or math conditions changes model outputs across nine released LLMs. On RewardBench, position bias
  (the fraction of items where the model changes its answer after swapping) reaches 48.0% for Qwen-1.5-4B-Chat
  on the chat-hard subset, while Llama-3-70B-Instruct averages only 10.2%. In retrieval-augmented QA,
  Llama-3-70B-Instruct performs best when the gold document is at the beginning or end of 10 or 20 documents.
  In math reasoning on R-GSM, Qwen-1.5-7B-Chat and Qwen-1.5-110B-Chat both show position-dependent accuracy.
  The paper attributes the bias to causal attention and rotary position encoding.
