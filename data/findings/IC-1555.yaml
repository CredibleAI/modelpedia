id: IC-1555
title: GPT-J's internal representations contain correct factual knowledge even when the model outputs
  falsehoods under repetition or instruction distraction prompts
description: The authors apply the attribute lens (a relation-specific linear probe derived from the
  LRE) to GPT-J's hidden states on 11,891 repetition-distracted and 11,891 instruction-distracted prompts
  designed to bait the model into outputting wrong answers. While GPT-J almost never outputs the correct
  fact (r@1 = 0.02 for repetition-distracted, 0.03 for instruction-distracted), the attribute lens recovers
  the correct answer in the top-3 predictions 71% and 78% of the time respectively, revealing that the
  correct knowledge is present in the internal representation but does not reach the output under these
  adversarial conditions.
