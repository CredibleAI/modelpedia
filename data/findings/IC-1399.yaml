id: IC-1399
title: Invariant GNNs (l=0) consistently fail to distinguish k-hop identical but globally distinct geometric
  graphs on the k-chain task, regardless of model depth
description: On a synthetic k-chain classification task where two graphs differ only in the orientation
  of a terminal edge (making them k-hop identical but globally distinct), all invariant GNNs achieve
  chance-level accuracy. SchNet, DimeNet++, and SphereNet score exactly 50.0% across all chain lengths
  k=2,3 and depths 1-3, while CoMEt ranges from 46.5% to 59%. In contrast, equivariant GNNs with l>=1
  (MACE, GVP, EquiformerV2) reach 90-100% with sufficient depth, confirming that the inability to capture
  geometry between local neighborhoods is the specific failure mode of invariant architectures.
