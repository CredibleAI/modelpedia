caveat: The k-chain task uses only 50 graph pairs with 50/30/20 splits, so the test set is very small
  (10 pairs). The equivariant GNNs EGNN and CloFNet also underperform due to over-squashing, and ESCN/EquiformerV2
  show abnormal performance due to equivariance errors from their spherical activation function.
