id: IC-1309
title: 'GPT-4-0613 exhibits reduced output diversity relative to GPT-3.5: it outperforms on best@1 but
  underperforms on best@8 under CoT prompting'
description: Under chain-of-thought prompting, GPT-4-0613 achieves 26.99% optimization rate at best@1
  versus 21.37% for GPT-3.5, but at best@8 GPT-4 reaches only 42.74% opt / 1.58x speedup while GPT-3.5
  reaches 43.05% opt / 1.60x. The authors attribute this to a lack of output diversity in GPT-4 despite
  using the same sampling hyper-parameters (temperature 0.7). The gap is small in absolute terms but
  consistent across the CoT condition.
