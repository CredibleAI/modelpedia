id: IC-401
title: Ablating safety attention heads minimally degrades helpfulness on zero-shot tasks and also impairs
  course-correction capability in Llama-2-7b-chat
description: After ablating safety heads, the paper evaluates Llama-2-7b-chat on five zero-shot tasks
  (BoolQ, RTE, Winogrande, ARC Challenge, OpenBookQA) using lm-eval. Zero-shot task scores remain comparable
  to or higher than those after SparseGPT or Wanda pruning, indicating safety is separable from general
  helpfulness. Additionally, Table 7 shows that ablating safety heads increases ASR even when using
  an affirmative jailbreak prefix ('sure, here is'), with ASR rising from 0.35 to 0.68 (AdvBench), 0.47
  to 0.76 (JailbreakBench), and 0.35 to 0.75 (Malicious Instruct) under undifferentiated attention,
  suggesting these heads also mediate the model's course-correction ability.
