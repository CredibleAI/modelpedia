key_metric: 'LLaVA avg ASR: textual 0.007, OCR 0.849, visual 0.849, combined 0.870; Llama-Adapter V2
  avg ASR: textual 0.006, OCR 0.604, visual 0.608, combined 0.633 (Table 1). Toxicity scores for Llama-Adapter
  V2 (Table 2): combined trigger yields tox. BERT 21.49, tox. RoBERTa 43.04, Perspective 46.74, severe
  toxicity 13.97, versus textual trigger 0.15/0.30/2.28/0.15.'
caveat: Llama-Adapter V2's lower success rate may reflect its weaker image understanding (smaller captioning
  dataset, no image-text alignment stage) rather than stronger safety alignment. Human evaluation relies
  on 3 annotators (Fleiss' kappa = 0.8969). The attack requires access to the vision encoder (CLIP)
  for optimisation.
