id: IC-1438
title: LLaVA and Llama-Adapter V2 are jailbroken by compositional adversarial images targeting image-based
  embedding triggers, with near-zero success for textual triggers
description: The paper generates adversarial images by optimising them in CLIP's joint embedding space
  to match one of four malicious trigger types (textual, OCR-textual, visual, combined), then pairs
  each image with a generic benign prompt. Across 8 prohibited scenarios, 8 images per scenario, 2 prompts,
  and 25 repetitions (6400 queries per model), image-based triggers achieve high jailbreak success rates
  while textual triggers fail almost completely. The combined OCR+visual trigger is the most effective.
  Llama-Adapter V2 shows lower success rates than LLaVA, which the authors attribute to its weaker image
  understanding rather than stronger safety alignment.
