id: IC-738
title: BLIP-2 ViT-G FlanT5XL achieves 0.70–0.87 zero-shot accuracy on binary concept presence queries,
  competitive on most datasets but weaker on fine-grained CUB-200
description: 'The paper evaluates BLIP-2 ViT-G FlanT5XL in a zero-shot setting, prompting it with ''question:
  is [concept] present in the image (yes/no)? answer:'' to answer binary concept queries. It reaches
  0.86 accuracy on ImageNet, 0.87 on Places365, 0.70 on CUB-200, 0.83 on CIFAR-10, and 0.87 on CIFAR-100.
  The authors note it is competitive with their 150M-parameter Concept-QA on CIFAR and ImageNet, considerably
  worse on CUB-200 (a fine-grained bird species dataset), and better on Places365. The alternative BLIP-2
  variant (ViT-G OPT-2.7B) performs worse overall, at 0.53–0.86. The authors attribute the CUB-200 gap
  to the domain-specific nature of the dataset being too specialized for a general-purpose VQA model.'
