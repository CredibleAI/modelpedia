id: IC-419
title: CLIP ViT-B/16's layer-11 residual stream contains class-discriminative information in sparse
  SAE latent directions, and ablating class-specific top-k latents significantly degrades zero-shot
  classification accuracy
description: 'The authors train a sparse autoencoder on CLIP ViT-B/16''s layer-11 residual stream and
  use it to decompose the representation into 49,152 sparse latent directions. By replacing CLIP''s
  intermediate representation with the SAE-reconstructed version and selectively masking latents, they
  show that class-specific top-k latents carry critical discriminative information: the identity mask
  recovers 64.82% accuracy (vs 68.25% original), the all-zero mask drops to 0.1%, and ablating per-class
  top-k latents causes a clear performance drop as k decreases. Random or dataset-level selections show
  marginal impact, confirming the class-specific structure.'
