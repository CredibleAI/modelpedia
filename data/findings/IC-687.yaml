key_metric: 200 output sequences per model at each p(tails) in [.05, .1, .2, .3, .4, .49, .5, .51, .60,
  .70, .80, .90, .95], cropped to |y| = 50; text-davinci-003 shows lower variance than Bernoulli and
  a clear bias to avoid long runs across all p(tails) values
caveat: The paper notes that with p(tails) = 50% specifically, sequences are dominated by repeating
  'heads, tails, heads, tails', which is a separate artifact from the gambler's fallacy bias. The authors
  also note that further experiments would be required to conclusively rule out memorization of all
  sub-sequences from training data.
