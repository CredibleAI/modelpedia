id: IC-687
title: GPT-3.5+ models exhibit a gambler's fallacy bias and generate low-complexity sequences when asked
  to produce random binary sequences
description: When prompted to generate 1000 samples from a weighted coin, text-davinci-003, gpt-3.5-turbo,
  and gpt-4 produce sequences whose distribution of means and longest-run lengths deviate significantly
  from a Bernoulli process with the same mean. The models show higher-than-chance alternation rates
  and shorter runs, analogous to the human gambler's fallacy. Across complexity metrics (unique sub-sequences,
  gzip file size, Levenshtein distance), gpt-3.5-turbo-instruct and gpt-4 generate lower-complexity
  sequences than a Bernoulli baseline, while gpt-3.5-turbo-0613 generates higher-complexity sequences
  than chance. A window-average model with w=5 partly explains the run-length bias.
