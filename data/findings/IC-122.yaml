id: IC-122
title: Concept representations in Llama-2-7B, Gemma-7B, and Llama-2-13B become more consistent in deeper
  layers
description: The paper measures cosine similarity of concept vectors (derived via linear probing classifiers)
  at every layer of three LLMs. Across all three models, the average cosine similarity of concept vectors
  shows a general upward trend from early to penultimate layers, indicating that concept representations
  are less defined in early layers and become sharper and more consistent in deeper layers. Sampled
  vectors from the GCS distribution show the highest and most stable similarity across all layers. The
  pattern is remarkably consistent across the different model sizes and architectures.
