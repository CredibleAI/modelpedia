id: IC-418
title: Matched n-grams in LLM outputs are concentrated in fewer reference documents than in human texts,
  indicating LLMs draw from a narrower set of sources
description: 'The paper investigates whether the non-unique portions of LLM and human texts are spread
  across many web documents or concentrated in a few. Using a greedy maximum-coverage approximation,
  it finds that LLM text matches are concentrated: searching only the top 50 documents captures enough
  matches to reduce l-uniqueness (l=5) to 32.8% for machine texts versus 56.6% for human texts. Conversely,
  keeping l-uniqueness below 50% requires searching through an average of 41.2 documents for human texts
  but only 13.4 for machine texts. This suggests LLMs recombine patterns from a relatively small set
  of popular sources.'
