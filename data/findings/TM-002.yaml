id: TM-002
extracted_by: automatic-extraction
title: The mean-difference concept vector scores higher than trained classifiers under cosine similarity
description: >
  The subtraction construction from TM-001 scores higher than a logistic regression and a linear
  SVM trained to capture the same concept under the report's cosine-similarity evaluation. The
  authors caution that the classifiers' lower values likely stem from this evaluation setup and
  may not persist under another metric.
evidence_type: correlational
concepts:
  - ref: concept:method-artefact
  - ref: concept:linear-representation
key_metric: >
  cosine similarity to the empirical shift, mostly burned and winter: mean difference
  0.713 and 0.799, logistic regression 0.503 and 0.725, linear SVM 0.361 and 0.604
caveat: >
  The authors state that the lower classifier scores likely stem from the evaluation metric and
  identify the lack of alternative evaluation methods as the main limitation of the comparison.
