id: IC-298
title: Weight similarity in open-source LLMs is organized in a depth-dependent structure with adjacent-layer
  similarity and distinct clusters at specific depths
description: 'Using the DOCS index, the paper measures cosine-similarity distributions between weight
  matrices (Wv, Wk, Wq, Wo, MLP-up, MLP-down) across all transformer layers of several released LLMs.
  Adjacent layers consistently show higher similarity than distant ones, and similarity decays with
  increasing layer distance. Beyond smooth decay, discrete clusters of mutually similar layers emerge
  at specific depths: a prominent mid-depth cluster centered around layer 19 in Gemma-2-9B and Gemma-2-27B,
  and around layer 10 in Llama-3.1-8B and Mixtral-8x7B, plus a second, less pronounced cluster in the
  final layers. Llama-3.1-70B contains multiple such clusters.'
