key_metric: 'CLIP similarity to origin: 0.742, to target: 0.546; FGR(h) for ''a photo of a cat [x]''
  with target car: 92%; universal tokens demonstrated across ''a photo of a cat [x]'', ''a photo of
  a laptop [x]'', ''a photo of a ship [x]'', ''a dog is playing a ball [x]'''
caveat: The authors note that similar phenomena were reported before (Zhuang et al. 2023; Mao et al.
  2022), but those tokens did not show the property of minimal CLIP score change. The safety-critical
  findings (weapons, drug use, nudity) are noted as a concern.
