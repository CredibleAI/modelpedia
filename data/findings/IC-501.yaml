key_metric: 'Spearman ρ_cv: 0.854 (Llama-2-7B-Chat, layer 15 head 18), 0.846 (Mistral-7B-Instruct, layer
  16 head 3), 0.861 (Vicuna-7B, layer 24 head 8); ensemble k=32: 0.870, 0.864, 0.885'
caveat: Findings are based on relatively smaller 7B models and may not generalize to larger or untested
  models. The representation is US-centric; cross-national generalization to 411 non-US parties yields
  only ρ=0.531 for Llama-2-7B-Chat. The authors note this is an initial demonstration rather than an
  exhaustive analysis.
