id: IC-501
title: Linear probes on middle-layer attention heads of Llama-2-7B-Chat, Mistral-7B-Instruct-v0.1, and
  Vicuna-7B-v1.5 predict US lawmakers' DW-Nominate ideology scores with Spearman correlations around
  0.85
description: The authors prompt three 7B open LLMs to generate statements in the style of each of 552
  members of the 116th US Congress, record activations of every attention head, and train ridge-regression
  linear probes to predict each lawmaker's first-dimension DW-Nominate score. The most predictive heads
  are concentrated in middle layers (roughly 10–20), with peak single-head Spearman correlations of
  0.854 (Llama-2, layer 15 head 18), 0.846 (Mistral, layer 16 head 3), and 0.861 (Vicuna, layer 24 head
  8). Ensembling the top 32 heads yields 0.870, 0.864, and 0.885 respectively. Non-linear MLP probes
  do not substantially outperform the linear ones, supporting the linearity of the representation.
