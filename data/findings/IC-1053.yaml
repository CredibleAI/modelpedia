caveat: Translation is implemented via Google Translate and may introduce errors; the paper notes that
  translation can violate invertibility for tasks requiring contextual knowledge that varies across
  languages. Evaluation is limited to first-word completion accuracy over 400 samples and 4 ICL vs IF
  task combinations.
