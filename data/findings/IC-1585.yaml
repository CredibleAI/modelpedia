id: IC-1585
title: 'LLaMA-7B and GPT-J-6B exhibit positional bias in instruction following: zero-shot performance
  varies significantly when the instruction is moved from after to before the context'
description: The paper tests three prompt templates that convey the same instruction but place it in
  different positions relative to the context. For GPT-J-6B on JSON formatting, placing the instruction
  before the context (rephrased) yields 63.3 format accuracy versus 28.83 when it follows the context
  (original). For LLaMA-7B, the shortened prompt (instruction at end, example removed) drops accuracy
  to 36.0 from 60.0. The authors note this sensitivity is well-known and show that PASTA mitigates it,
  but the underlying positional dependence is a property of the models themselves.
