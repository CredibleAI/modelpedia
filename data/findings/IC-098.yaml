id: IC-098
title: LegalBERT performs below the constant classifier baseline on CASELAWQA due to its 512-token context
  window
description: LegalBERT, a 110M-parameter BERT-style model pre-trained on legal documents, achieves only
  24% accuracy on CASELAWQA, substantially below the 40% constant classifier baseline. The authors attribute
  this to LegalBERT's 512-token context window, which most court opinions in the benchmark exceed. This
  contrasts with SAULLM 54B (47%), which improves over its base Mixtral 8x7B Instruct (43%) by 4 points
  but still lags smaller generalist models like Llama 3.1 8B Instruct (59%).
