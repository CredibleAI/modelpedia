id: IC-1137
title: Stable Diffusion represents certain concepts primarily through specific named exemplars rather
  than abstract category features
description: Using Conceptor to decompose SD's internal representation of concepts like 'president,'
  'rapper,' 'movie star,' 'basketball player,' 'composer,' and 'painter,' the authors find that the
  top decomposition elements are dominated by specific named individuals (Obama, Trump, Biden, Tupac,
  Drake, Marilyn Monroe, Kobe Bryant, Beethoven, Monet, Picasso). Removing these exemplar names from
  the pseudo-token significantly degrades reconstruction quality. For 'painter,' 67 out of 100 generated
  images contain at least one famous artist name in their single-image decomposition. The same exemplar
  dominance is confirmed on SD 1.4, where 'president' decomposes into 'potus, barackobama, obama, nixon,
  washington, realdonaldtrump, jefferson, washington, roosevelt.'
