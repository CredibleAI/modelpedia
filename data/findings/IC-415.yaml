key_metric: VLM shape bias range 47.9% (GPT-4V) to 73.8% (InstructBLIP Vicuna-7B) in VQA; human 96%;
  ResNet-50 22%; CLIP ViT-L/14 60.95%; VLM-encoder shape bias difference -9.5% to +7.4%; error consistency
  up to 78.7%; in LLaVA-Next 7B, 70.7% of cases the second prediction does not align with the conflicting
  cue; only 17.7% of top-2 pairs contain both shape and texture
caveat: GPT-4V is an outlier with surprisingly poor accuracy (69.75% VQA) due to a high refusal rate
  (131/1280 conversations, roughly 10%) and the largest amount of generic captions (60.4%). The authors
  note that radically different VLM architectures may lead to changes in bias mechanics.
