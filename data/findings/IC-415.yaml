id: IC-415
title: VLMs show a default shape bias (47.9-73.8%) that exceeds their vision encoders and vision-only
  models but falls short of human levels (96%), with the LLM component rather than the encoder responsible
  for suppressing one visual cue.
description: The paper measures the texture/shape bias of 23 VLMs on the cue-conflict dataset using
  both VQA and image captioning tasks. VLMs consistently show a shape bias higher than their own vision
  encoders (differences of -9.5% to +7.4%) and vision-only models like ResNet-50 (22%), but well below
  the human level of 96%. Error consistency between VLMs and their isolated encoders reaches at most
  78.7%, proving the LLM and text prompt further influence the decision. Token confidence analysis on
  LLaVA-Next 7B, InternVL-Chat 1.1, and MoE-LLaVA-Phi2 shows near-binary confidence in the selected
  cue, with only 17.7% of top-2 prediction pairs containing both shape and texture, indicating the LLM
  effectively disregards the alternative cue.
