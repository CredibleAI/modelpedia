id: IC-291
title: ViT-B/16 and MAE-B/16 exhibit nearly inverted distributions of knowledge neurons across layers
  despite identical architecture and training data
description: Using knowledge attribution (integrated gradients on individual FFN neurons), the paper
  measures which neurons are most important for classification in each of the 12 layers. Despite both
  models having 12 transformer layers, the same hidden size (768), the same patch size (16), and being
  pretrained and fine-tuned on ImageNet, the layer-wise distribution of top-attribution neurons is almost
  inverted between the supervised ViT-B/16 and the self-supervised MAE-B/16. This suggests that the
  pretraining paradigm fundamentally changes how knowledge is organized across depth.
