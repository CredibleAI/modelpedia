id: TM-006
review_status: draft
extracted_by: automatic-extraction
title: Coordinates are recoverable from TerraMind's frozen features, latitude more accurately than longitude
description: >
  A picture's coordinates can be partly decoded from TerraMind's frozen internal representation
  by training probe models on top of its features. Across all 12 combinations of four model
  variants and three probe types, latitude was decoded more accurately than longitude.
evidence_type: correlational
concepts:
  - ref: concept:linear-representation
key_metric: >
  latitude R2 exceeds longitude R2 in all 12 probe configurations, 4 model variants by 3 probe
  types; the source counts latitude and longitude predictions separately as 24 experiments
caveat: >
  The conclusion is based on three probe families; the authors state that a broader and more
  principled selection of probing models is needed to improve interpretation of the latent-space
  structure.
