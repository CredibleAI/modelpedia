title: Coordinates are recoverable from TerraMind's frozen features, latitude more accurately than longitude
description: >
  A picture's coordinates can be partly read back out of TerraMind's internal representation by
  training small probe models on top of its frozen features. Across all 24 probe setups the
  authors tried, latitude came out more accurately than longitude every single time: north-south
  position is easier for the model to pin down than east-west.
