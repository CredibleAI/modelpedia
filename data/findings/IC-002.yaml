id: IC-002
title: Even when VLMs select the correct hypothesis, their explanations are often invalid or unhelpful
description: The paper evaluates free-text explanations from VLMs for correct predictions in the triplet
  setup. Human annotators judged whether the explanation logically justifies why the correct hypothesis
  is more plausible. Humans achieve 95% valid explanations, while the best VLM (Claude-Sonnet-3.5) only
  achieves 50%. GPT-4o achieves 44% and 23% in separate and combined image strategies, respectively.
  Many models score below 40%, indicating that even correct predictions are often based on shallow or
  incorrect reasoning.
