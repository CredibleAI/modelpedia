caveat: The image encoder is frozen and only the EEG encoder is trained; the comparison isolates the
  image encoder's contribution but the overall system performance also depends on the authors' TSConv
  EEG encoder. The ViT vs CLIP gap is not statistically significant (p > 0.05).
