id: IC-751
title: Arena-Hard-200 reveals larger performance gaps between open and proprietary LLMs than MT-Bench
description: The paper evaluates ten released models on Arena-Hard-200, a benchmark of 200 challenging
  user prompts selected from Chatbot Arena conversations. The results show that proprietary models (GPT-4,
  Claude-2, Claude-instant-v1) score substantially higher than open models (Vicuna, Llama-2, WizardLM),
  and the gap is wider than what MT-Bench shows. The paper concludes this suggests more room for open
  models to catch up on challenging real-world tasks.
