id: IC-1289
title: OpenFlamingo and Otter achieve near-chance accuracy on Bongard-OpenWorld, indicating inability
  to perform multi-image reasoning
description: 'The paper tests two end-to-end pretrained VLMs, OpenFlamingo and Otter, on Bongard-OpenWorld
  by presenting them with six positive images, six negative images, and one query image in a single
  prompt. Both models score at or below the 50% chance level: OpenFlamingo achieves 50.0% and Otter
  49.3%. The authors attribute this to the models'' inability to perform the holistic multi-image comparison
  that Bongard-OpenWorld requires, as opposed to processing images independently.'
