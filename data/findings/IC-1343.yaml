key_metric: 'Task-agnostic best (domain expert #3): history 76.0, law 35.8, maths 65.8, physics 21.7
  (vs baseline 70.6, 41.7, 37.5, 26.1). Task-dependent (expertise): history 2.5, law 0.5, maths 9.2,
  physics 12.0.'
caveat: Evaluated only on 4 MMLU datasets for the physically-disabled vs able-bodied pair. The task-dependent
  method requires pre-determined expertise for each task, which is not always possible (e.g., 'composing
  a poem to explain magnetism to a 7-year-old').
