id: IC-073
title: Released LLMs (GPT-4o, Llama-3.1-70B, Qwen2-7B, etc.) show limited workflow orchestration capability
  that degrades as workflow complexity increases
description: 'The paper evaluates multiple released LLMs on the WorkflowBench test set under unseen-instruction
  (ID) and unseen-API (OOD) settings, measuring CodeBLEU and a GPT-4o-mini-based pass rate. All models
  achieve relatively low scores: GPT-4o reaches 28.5% CodeBLEU and 56.6% pass rate (ID), while Llama-3.1-70B
  reaches 27.3% and 55.4%. In-context learning improves scores modestly (GPT-4o to 30.2% CodeBLEU, 67.5%
  pass rate). A complexity breakdown (Figure 5) shows that every model''s CodeBLEU score declines as
  the number of actions, branches/loops, or nested depth of the reference workflow increases, indicating
  a reproducible degradation under high-complexity conditions.'
