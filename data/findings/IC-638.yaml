id: IC-638
title: ROME editing on GPT-2 XL and Llama-2 7B achieves high reliability but fails under bijective symmetry
  (23.71%–33.64%) and synonymous invariance (52.35%–58.36%) criteria
description: 'The paper evaluates ROME on newly constructed symmetry and synonymy datasets derived from
  ParaRel. While ROME achieves near-perfect reliability (96.37%–100%), it fails to generalize: when
  the capital of Canada is edited to Rome, the model does not consistently agree that Rome is the capital
  of Canada (symmetry 23.71%–33.64%), and when a field of work is edited, the corresponding occupation
  name is not updated (synonym 52.35%–58.36%). Qualitative examples show ROME edits only the exact token
  association without affecting paraphrased or related expressions.'
