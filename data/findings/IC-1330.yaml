id: IC-1330
title: All 20 evaluated LLMs improve in multi-turn task-solving with additional tool-use turns and GPT-4-simulated
  language feedback
description: The paper evaluates 20 open- and closed-source LLMs on 586 multi-turn interaction tasks
  spanning reasoning, code generation, and decision-making. Every model shows absolute performance gains
  of 1-8% per additional tool-use turn (k=1 to k=5) and 2-17% from GPT-4-simulated natural language
  feedback. Closed-source models (GPT-3.5-turbo-0613, Claude-instant-1) show the steepest per-turn improvement
  slopes (+8.2 and +8.0), while the best open-source model (Lemur-v1-70b SIFT) still lags the best closed-source
  model by 8.7% in absolute success rate with feedback.
