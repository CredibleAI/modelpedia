id: IC-1270
title: Chain-of-thought prompting does not mitigate privacy leakage in GPT-4 or ChatGPT
description: The authors test whether adding 'take a deep breath and work on this step by step' to the
  instruction (a CoT prompt from Yang et al. 2023) reduces leakage. In tier 3, GPT-4 leakage goes from
  0.22 to 0.24 and ChatGPT from 0.93 to 0.95. In tier 4 summary, GPT-4 goes from 0.39 to 0.40 and ChatGPT
  from 0.57 to 0.61. Manual inspection of ChatGPT's CoT chains shows 51.2% of failures involve the model
  acknowledging privacy but still revealing the secret, and 38.3% involve theory-of-mind errors where
  the model assumes the third party already knows the secret.
