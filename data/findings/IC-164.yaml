key_metric: 10% accuracy on OOD synthetic vector classification (random guess level for 10 classes);
  retrieval task accuracy significantly higher; reversed-query accuracy exceeds reversed-target-label
  accuracy across all four natural language tasks
caveat: The synthetic vector classification task uses a very small effective dimension (d'=30 out of
  d=4096) to reduce complexity, and the reversed-label task is a narrow construction. The authors note
  it is challenging to assess whether larger models like GPT-4 face similar difficulties.
