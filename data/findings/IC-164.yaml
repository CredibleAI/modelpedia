id: IC-164
title: Llama-3-8B and Llama-2-7B fail to learn out-of-distribution functions through in-context learning,
  defaulting to in-distribution predictions
description: The paper evaluates Llama-3-8B and Llama-2-7B on a synthetic vector classification task
  where the model must learn a random linear mapping w from in-context examples. ICL accuracy on this
  OOD task is close to random guessing (10% for 10 classes), while a retrieval version of the same task
  is solved well. Additionally, on a reversed-label natural language task (e.g., predicting 'evitisop'
  instead of 'positive'), Llama-3-8B prefers to output the reversed query word—an in-distribution pattern—rather
  than the reversed target label. Together these results indicate that ICL in these models is confined
  to implementing pretraining function classes rather than learning genuinely new input-output mappings.
