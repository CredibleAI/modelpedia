key_metric: 'Code LLaMA 13B perplexity: 2.37 at 98304, 2.54 at 131072; passkey accuracy 99.4% at 128k.
  Code LLaMA 7B perplexity: 2.54 at 98304, 2.71 at 131072; passkey accuracy 94.3% at 112k. Code LLaMA
  7B benchmarks: ARC-C 39.9, HellaSwag 60.8, MMLU 31.1, TruthfulQA 37.8 (vs base LLaMA 2 7B: 53.1, 77.8,
  43.8, 39.0).'
caveat: The paper notes that perplexity 'may not be a great indicator of whether an llm is able to attend
  to all tokens and does not exhaustively determine long context performance,' suggesting the dissociation
  may reflect a limitation of perplexity as a metric rather than a true capability preservation.
