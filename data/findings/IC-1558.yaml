id: IC-1558
title: Code LLaMA 13B maintains 99.4% passkey retrieval at 128k context despite perplexity rising from
  2.37 to 2.54 between 98304 and 131072 tokens
description: 'The paper evaluates Code LLaMA 7B and 13B (both using NTK-aware scaling to 100k context)
  on sliding-window perplexity over 128k Proof-Pile documents and on passkey retrieval. Code LLaMA 13B
  shows increasing perplexity beyond 100k tokens (2.37 at 98304, 2.54 at 131072), yet still achieves
  99.4% passkey retrieval accuracy at 128k context. The authors explicitly note this dissociation: ''while
  the code llama 13b model exhibits increasing perplexity above 100k context lengths, it was still able
  to accurately retrieve the passkey at a context length of 128k.'' Code LLaMA 7B shows a similar pattern
  with 94.3% passkey accuracy at 112k. On standard benchmarks, Code LLaMA 7B drops to 39.9 on ARC-C
  and 31.1 on MMLU versus 53.1 and 43.8 for the base LLaMA 2 7B.'
