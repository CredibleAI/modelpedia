id: IC-1612
title: GPT-3.5-turbo achieves the best and most stable performance across all three drug types in conversational
  drug editing
description: Using GPT-3.5-turbo (gpt-3.5-turbo-0301) as the backbone, ChatDrug reaches the best hit
  ratio on 32 of 39 drug editing tasks spanning small molecules, peptides, and proteins. On small molecule
  tasks, it achieves the best performance on 21 of 28 tasks, with 20 of those exceeding the second-best
  baseline by over 20 percentage points. On peptide editing, it achieves hit ratios of 56.60–69.80 on
  single-objective tasks, far exceeding random mutation baselines (1.80–14.40). The model also shows
  the highest stability (lowest standard deviation) across five random seeds.
