caveat: The specific topics were discovered by an optimization process using GPT-4-turbo as evaluator,
  which could in principle bias toward topics where GPT-family models are weak. The authors address
  this by showing Claude-3 models achieve the best accuracies and by a human study confirming the same
  trends with human-generated questions on the same topics.
