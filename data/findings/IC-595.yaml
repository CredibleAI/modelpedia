id: IC-595
title: Gemini-pro has knowledge gaps on specific topics (Permian extinction, Fordism) causing it to
  perform far below its average rank on existing benchmarks
description: On AutoBench-constructed datasets targeting specific salient topics, Gemini-pro's accuracy
  drops dramatically compared to its performance on MMLU. On the history dataset (Permian extinction),
  Gemini-pro scores 0.28 versus 0.84 on MMLU; on the economy dataset (Fordism), it scores 0.48 versus
  0.75. Its average rank drops from 6 on existing economic benchmarks to 16 on Fordism. Claude-2.0 also
  drops by 4 ranks on Permian extinction. In contrast, GPT-3.5-turbo performs better than expected on
  the 'secret society' topic, rising from rank 7 to 3.
