id: IC-061
title: The induction circuit in Mamba-130m is structurally analogous to the transformer induction circuit,
  with an off-by-one motif in SSM state writing
description: 'Using path patching on Mamba-130m, the authors identify the induction circuit: SSM states
  at layer 17 are critical for induction (logit drop of -9.65 to -10.16 when patched), with layer 20
  showing a weaker effect. The key information flows into the SSM input c at position b1+1 rather than
  b1, meaning the local convolution layer aggregates tokens a and b into the SSM state at the next token
  position. This ''off-by-one'' motif is absent in transformers, where the previous-token head and induction
  head operate directly on the relevant token positions. The same off-by-one pattern is observed in
  the IOI task.'
