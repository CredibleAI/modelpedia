id: IC-827
title: LLMs exhibit distinct psychological profiles that differ from human norms and vary by model size
  and version
description: 'Using thirteen psychometric scales across four domains (personality traits, interpersonal
  relationships, motivational tests, emotional abilities), the paper measures five released LLMs and
  compares them to human norms. LLMs generally score higher than humans on openness, conscientiousness,
  extraversion, emotional intelligence, and self-efficacy, while scoring lower on implicit culture belief.
  Model size matters: LLaMA-2-7B scores higher on GSE (39.1) than LLaMA-2-13B (30.4), and GPT-4 scores
  higher on GSE (39.9) than GPT-3.5-turbo (38.5). Most LLMs except text-davinci-003 and GPT-4 show elevated
  dark triad scores, and all show high lying subscale scores.'
