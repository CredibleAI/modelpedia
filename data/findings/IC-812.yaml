key_metric: 'Corpus homogenization (key point, ROUGE-L): solo 0.1536, gpt3 0.1578, instructgpt 0.1660;
  fraction of unique 5-grams: solo 0.991, gpt3 0.988, instructgpt 0.977; pairwise suggestion similarity
  (ROUGE-L): instructgpt 0.20 vs gpt3 0.11; all instructgpt vs solo/gpt3 differences significant at
  p < 0.05'
caveat: Experiments use two limited-access OpenAI models; the authors note other models may exhibit
  different behavior given the RLHF pipeline is highly customized. The study focuses on single interactions;
  dynamics may change through repeated interactions over time. Participants are native English speakers
  from the US recruited via Upwork.
