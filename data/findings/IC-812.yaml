id: IC-812
title: InstructGPT (text-davinci-003) reduces content diversity in co-written essays while GPT-3 (davinci)
  does not, and the effect is attributable to the model's own less diverse text contributions
description: In a controlled experiment with 38 writers producing 100 argumentative essays per condition
  (solo, GPT-3, InstructGPT) across 10 topics, essays co-written with InstructGPT show significantly
  higher homogenization (0.1660 vs 0.1536 solo, 0.1578 GPT-3 at key-point level with ROUGE-L) and lower
  lexical and content diversity. GPT-3 does not produce a statistically significant difference from
  solo writing. The mechanism is that InstructGPT's own generated text is less diverse (pairwise suggestion
  similarity 0.20 vs 0.11 ROUGE-L), while user-contributed text remains statistically unchanged regardless
  of which model assists.
