key_metric: 'BAP attack (MM-SafetyBench) no-defense ASR: LLaVA-v1.5-7b 61.02%, MiniGPT-4 62.26%, InstructBLIP
  58.48%, Gemini-1.5-flash 40.98%/41.07%/40.71%; VAA (Harmful Instructions) no-defense ASR: LLaVA 57.50%,
  MiniGPT-4 47.50%, InstructBLIP 42.50%, Gemini 10.00%/2.50%/5.00%'
caveat: The Gemini experiments use UAPs generated on white-box open-source models and transferred to
  Gemini, so the absolute ASR for Gemini may not reflect its vulnerability to natively optimized attacks.
  The paper notes Gemini's safety mechanism is 'much stronger than the open-source models,' but does
  not ablate or isolate the specific safety components responsible.
