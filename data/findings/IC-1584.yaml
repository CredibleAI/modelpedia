id: IC-1584
title: LLaMA-7B and GPT-J-6B fail to interpret textual emphasis markers, with marked prompting degrading
  performance substantially
description: '"When standard emphasis markers (asterisks or double quotes) are added around user-specified
  spans in the prompt, both models'' performance drops sharply rather than improving. For LLaMA-7B on
  the JSON formatting task, format accuracy falls from 60.00 (zero-shot) to 18.55 (*-marked) and 4.56
  (""-marked). For GPT-J-6B, format accuracy falls from 28.83 to 4.44 and 8.81 respectively. The authors
  attribute this to the rarity of such markers in pre-training data, meaning the models have not learned
  to treat them as attention cues."'
