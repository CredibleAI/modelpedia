id: IC-1371
title: The Pythia-1.4b successor head l12h0 exhibits interpretable polysemanticity, performing successorship,
  acronym prediction, copying, and greater-than behaviors on natural language data
description: 'On 128 randomly sampled length-512 contexts from the PILE, the authors use direct effect
  mean ablation to measure when the successor head is most important for next-token prediction. In winning
  cases (where ablating the head most decreases the correct token''s logit), the behaviors are: successorship
  43.4%, acronym 23.8%, greater-than 18.9%, other 14%. In loss-reducing cases, the proportions of reduced
  loss are: successorship 38.2%, other 28.7%, copying 11.7%, acronym 10.8%, greater-than 10.5%. The
  authors identify this as the cleanest example of interpretable polysemanticity in an LLM, where a
  single head performs two clearly distinct tasks (succession and acronym completion) that are not fully
  independent.'
