key_metric: '"removing 5 such heads (1% of heads) reduced the accuracy gap between correct and incorrect
  prompts by an average of 38.9% over 14 datasets"; "for gpt-j, using p16 (the first 16 layers) achieves
  a better accuracy than the full model on all but one dataset"; "the accuracies diverge between layers
