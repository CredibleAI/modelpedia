  vs. "an average score of -0.04, with a standard deviation of 0.41" for random heads'
caveat: 'our head ablations do not fully remove the accuracy gap between correct and incorrect demonstrations.
  this could be because we did not identify some of the model components that cause false context-following.
  however, there is another possibility: if an attention head''s outputs are on average far from zero,
  zeroing out that head takes the intermediate states off-distribution, which can decrease overall performance.'
