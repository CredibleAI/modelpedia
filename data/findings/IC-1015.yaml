id: IC-1015
title: 'GPT-J and 10 other LLMs exhibit overthinking: calibrated accuracy given incorrect few-shot demonstrations
  peaks at a critical layer then declines, and ablating 5 false induction heads in late layers reduces
  the accuracy gap by 38.9% on average'
description: Using the logit lens to decode predictions from intermediate layers, the authors show that
  across 11 released LLMs, calibrated accuracy given permuted (incorrect) few-shot demonstrations follows
  a similar trajectory to correct demonstrations at early layers, then diverges sharply at a model-specific
  critical layer (e.g., layers 13-14 for GPT-J, layer 9 for Pythia-6.9B, layers 13-17 for Llama2-7B).
  After the critical layer, accuracy given incorrect demonstrations progressively decreases, so that
  decoding from an earlier layer outperforms the full model. The authors identify 5 attention heads
  in GPT-J's late layers that attend to false labels in previous demonstrations (false induction heads),
  confirmed by a prefix-matching score and a false label promoting score of 6.5 (vs. -0.04 for random
  heads). Ablating these 5 heads (1% of all heads) reduces the accuracy gap between correct and incorrect
  prompts by 38.9% on average across 14 datasets, with negligible effect on correct-demo performance.
  The phenomenon is consistent across all model sizes and instruction-tuned variants.
