id: IC-101
title: GPT-4 and Claude 3 struggle to emulate a lower capability profile (high school freshman level)
  via zero-shot prompting, with only moderate improvement from chain-of-thought prompting
description: When prompted to answer only questions appropriate for a high school freshman and to give
  wrong answers on harder questions, GPT-4 and Claude 3 mostly fail in the zero-shot setting. GPT-4
  only slightly decreases its performance on college-level questions, while Claude 3 moderately decreases
  performance on both high-school and college questions. With chain-of-thought prompting, performance
  improves somewhat, but GPT-4 tends to overshoot on college-level questions and Claude 3 undershoots
  on high-school level questions.
