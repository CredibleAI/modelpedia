id: IC-550
title: Workflow generation performance scales with model size within families, but recently released
  7B models outperform older 13B models
description: Within the Qwen-2 family, the 72B model outperforms the 7B model by 6.77% in F1_graph;
  within Llama-3.1, the 70B model surpasses the 8B model by 11.51%. However, several 7B models (e.g.,
  Qwen-2-7B, Mistral-7B, InternLM-2.5-7B) outperform most 13B models (Llama-2-13B, WizardLM-13B, Vicuna-13B).
  The authors attribute this to the 7B models being released within the past six months with more high-quality
  training data, while the 13B models were released earlier with potentially outdated training.
