key_metric: 'Table 2: verification accuracy and FNR — game of 24: 87.0% (3567/4100), FNR 20.7% (213/1029);
  graph coloring: 72.4% (362/500), FNR 95.8% (113/118); blocksworld: 71.8% (359/500), FNR 15.48% (24/155);
  mystery blocksworld: 79.6% (398/500), FNR 97.09% (100/103). Table 1: LLM+LLM accuracy — game of 24:
  3%, graph coloring: 2%, blocksworld: 55%, mystery blocksworld: 0%, versus standard prompting 5%, 16%,
  40%, 4% respectively.'
caveat: Results are specific to gpt-4-0613 and three formally verifiable domains. The authors note that
  blocksworld shows a modest improvement (55% vs 40% baseline) under self-critique, though still far
  below sound-verifier performance (87%).
