id: IC-078
title: GPT-4's self-verification loop causes performance collapse due to high false negative rates in
  binary verification
description: 'When GPT-4 is used as both the solution generator and the verifier in an iterative self-critique
  loop, performance drops below the standard single-prompt baseline in most domains. The primary mechanism
  is a high false negative rate: GPT-4 rejects its own correct answers, causing the system to discard
  valid solutions and time out on later, worse generations. In graph coloring the false negative rate
  reaches 95.8% and in mystery blocksworld 97.09%. Even adding chain-of-thought to the verification
  prompt improves accuracy (e.g., Game of 24 from 87.0% to 98.8%) but does not close the gap to a sound
  verifier.'
