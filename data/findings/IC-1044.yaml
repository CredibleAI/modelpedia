id: IC-1044
title: Counterfactual GNN explainers produce statistically infeasible recourses that violate topological
  constraints in molecular datasets
description: The paper tests whether counterfactual explanations generated for molecular graphs correspond
  to valid molecules by checking connectivity. In the original datasets, molecules are expected to be
  single connected components. The paper measures the p-value of the deviation between the expected
  count of connected graphs and the observed count in the counterfactuals. For RCExplainer and CF2 on
  mutagenicity and AIDS, the deviations are highly significant (p < 0.00001), meaning the counterfactuals
  frequently produce disconnected molecules. Visualization in Appendix F further shows that CLEAR and
  CF2 produce explanations violating valency rules.
