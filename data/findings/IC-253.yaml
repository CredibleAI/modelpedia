id: IC-253
title: Post-training reinforcement learning significantly reduces harmful gender stereotypes in GPT
  models, with the best-fit slope of 0.21 indicating post-RL models have far lower bias than pre-RL
  versions
description: 'The paper compares harmful gender stereotype ratings for four GPT models before and after
  post-training RL across 19 selected tasks. All post-RL models fall below the 45-degree line, indicating
  reduced bias. The best-fit slope is 0.21 (95% CI: 0.17, 0.24), meaning post-RL models retain only
  about 21% of the pre-RL bias level. Individual slopes range from 0.08 (GPT-4o Mini) to 0.37 (GPT-4
  Turbo), showing the effect is consistent across the model family.'
