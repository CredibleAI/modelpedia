id: IC-1135
title: LLMs show order sensitivity to evidence position in context, with PaLM2 and LLaMA2-7B showing
  memorization ratio variations exceeding 30%
description: When parametric memory and counter-memory are presented in different orders, the memorization
  ratio changes significantly for most models. PaLM2 varies from 38.6 (parametric memory first) to 72.2
  (counter-memory first), a 33.6 percentage point swing. LLaMA2-7B varies from 33.3 to 82.8, a 49.5
  percentage point swing. ChatGPT tends to favor the first evidence, while PaLM2 and LLaMA2-7B lean
  toward later evidence. GPT-4 shows minimal order sensitivity.
