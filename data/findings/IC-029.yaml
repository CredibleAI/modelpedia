id: IC-029
title: Large language models show conformity to group answers in multi-agent interactions
description: The paper introduces BENCHFORM, a benchmark built from Big-Bench Hard tasks, with five
  interaction protocols (raw, correct guidance, wrong guidance, trust, doubt) to study conformity. Eleven
  LLMs were evaluated, including GPT-4o, GPT-3.5, Llama3, Llama3.1, Gemma2, Qwen2, and GLM-4-Plus. Metrics
  include accuracy, conformity rate (proportion of originally correct answers that become incorrect
  under a protocol), and independence rate. All models show conformity under some protocols, with doubt
  protocol being most effective at inducing errors (average CRD across five representative models is
  47.2% versus CRW 23.5% and CRT 31.3%). Larger models generally show higher independence rates, e.g.,
  Qwen2-72B IR 57.6% vs Qwen2-7B IR 20.3%.
