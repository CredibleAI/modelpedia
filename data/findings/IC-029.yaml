key_metric: 'Conformity rates: for five representative LLMs average CRW=23.5%, CRT=31.3%, CRD=47.2%.
  Accuracy drops: ∆C=24.1% (Gemma2-27B) to 1.0% (Llama3.1-405B); ∆W=22.8% (Gemma2-27B) to 2.2% (Llama3-70B);
  ∆T=38.6% (Gemma2-27B) to 2.5% (Llama3.1-405B); ∆D=44.7% (Llama3-70B) to 13.0% (GPT-4o). Independence
  rate ranges from 7.8% (Llama3.1-8B) to 57.6% (Qwen2-72B).'
caveat: The benchmark uses multiple-choice questions which may not reflect real-world interactions;
  agents are exposed to others' answers before providing their own. Conformity is measured as a necessary
  but not sufficient test. Lack of public training details limits conclusions about causes of varying
  conformity across architectures.
