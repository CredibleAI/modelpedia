id: IC-218
title: LLaMA3-8B and other LLMs solve arithmetic via a bag of independent heuristic neurons in middle
  and late MLP layers rather than a robust algorithm
description: Using activation patching and ablation, the authors identify a sparse arithmetic circuit
  in LLaMA3-8B (and replicate in LLaMA3-70B, Pythia-6.9B, GPT-J) consisting of a few attention heads
  that copy operand/operator information to the final position, plus middle and late MLP layers. Within
  those MLPs, only ~200 neurons per layer (~1.5%) are needed for high faithfulness. Each such neuron
  implements a simple, human-identifiable heuristic (range, modulo, pattern, identical-operand, multi-result)
  that fires for a specific input pattern and boosts the logit of a corresponding answer token. 91%
  of the 3,200 top neurons per operator are classified into one of these heuristic types. Ablating neurons
  of a given heuristic type drops accuracy more on associated prompts than on unrelated ones, and prompt-guided
  knockout of associated heuristic neurons causes a much larger accuracy drop than random ablation,
  confirming the bag-of-heuristics mechanism.
