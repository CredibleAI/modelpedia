key_metric: circuit faithfulness 0.96 average across four operators (0.97 +, 0.98 −, 0.90 ×, 0.96 ÷);
  200 neurons (~1.5%) per layer suffice; 91% of 3,200 top neurons classified as heuristics; heuristic
  ablation causes average drop of 29% out of 95% pre-ablation accuracy
caveat: Analysis is limited to prompts where operands and result are single tokens (op1, op2 in [0,
  300] for LLaMA3-8B); heuristic types are defined by human-identifiable patterns, introducing potential
  researcher bias; roughly 9% of top neurons could not be classified into a defined heuristic type.
