id: IC-748
title: Pruned LLMs at ≥50% sparsity remain robust in-context retrievers and summarizers, with Vicuna-7B
  matching up to ~40% sparsity and Vicuna-13B up to ~50% sparsity in open-book settings
description: When external knowledge is provided in-context (open-book ICRA-QA on TriviaQA, and in-context
  summarization on CNN/DailyMail), pruned LLMs retain their ability to extract and synthesize information
  from the prompt. Vicuna-7B remains within the 5% matching tolerance up to ~40% unstructured sparsity
  and 8-bit quantization for retrieval, while Vicuna-13B holds up to ~50% sparsity and 4-bit quantization.
  For summarization, all pruning and quantization methods preserve coherence, consistency, fluency,
  and relevance, though longer stories show sharper degradation. This contrasts sharply with the closed-book
  knowledge loss observed in Finding 1.
