id: IC-1342
title: Assigning socio-demographic personas to LLMs causes significant reasoning performance degradation
  across all four models studied, manifesting as both explicit abstentions and implicit reasoning errors
description: 'The paper assigns 19 socio-demographic personas (spanning race, gender, religion, disability,
  and political affiliation) to four LLMs via system prompts and measures their accuracy on 24 reasoning
  datasets. For ChatGPT-3.5 (June 2023), 80% of personas show a statistically significant performance
  drop relative to a ''human'' persona baseline, with drops reaching 64% (physically disabled on high
  school world history) and 69% (religious on college chemistry). The bias manifests in two ways: explicit
  abstentions citing stereotypical assumptions (58% of errors for the physically-disabled persona) and
  implicit reasoning errors on questions where the model does not abstain. The effect is present in
  all four models but varies in extent: GPT-4-turbo shows bias in 42% of personas, Llama-2-70B-Chat
  and ChatGPT-3.5 (June) in 80%, and ChatGPT-3.5 (November) in 100%.'
