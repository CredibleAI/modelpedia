id: IC-1134
title: LLMs show strong confirmation bias in multi-source settings, preferring evidence consistent with
  parametric memory, with stronger bias for popular entities
description: When both parametric memory and counter-memory are presented as evidence, LLMs systematically
  prefer the evidence consistent with their parametric memory. GPT-4 shows an 80% memorization ratio
  for the most popular PopQA questions, indicating stronger confirmation bias for well-known facts.
  The memorization ratio increases monotonically with the proportion of parametric memory evidence,
  from near 0% at 0/2 to near 100% at 2/2, but even at 1/2 (50/50) the ratio exceeds 50% for most models,
  confirming a genuine bias toward parametric memory.
