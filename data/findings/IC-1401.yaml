id: IC-1401
title: GPT-4 serves as a proxy for human judgment on SOTOPIA-EVAL, with strong correlations on goal,
  financial, and relationship dimensions for model outputs
description: The paper prompts GPT-4 to score social interaction episodes along seven dimensions and
  compares its scores to averaged human annotator scores from Amazon Mechanical Turk. For model-role-played
  agents, GPT-4's scores show significant Pearson correlations with human scores on goal (0.71), financial
  (0.62), and relationship (0.56) dimensions. Over 74% of GPT-4 scores fall within one standard deviation
  of the human score. When humans are role-playing, correlations drop sharply on all dimensions except
  goal, indicating GPT-4 is a better proxy for evaluating models than humans.
