key_metric: 'GPT+CLIP accuracy: 0.86, 0.82, 0.79, 0.81, 0.79; LLaMA2+CLIP: 0.81, 0.75, 0.62, 0.78, 0.84;
  InstructBLIP (FlanT5XL): 0.85, 0.86, 0.68, 0.82, 0.84; LLaVA-1.5B: 0.63, 0.66, 0.49, 0.69, 0.66'
caveat: Ground truth is self-annotated by the authors (10,000 evaluations over two weeks). The CUB-200
  column for GPT+CLIP uses GPT-4 rather than GPT-3.5-turbo-0613, as stated in the paper. The authors
  note that using VLMs (InstructBLIP, LLaVA) to generate pseudo-labels for the full ImageNet training
  set is computationally infeasible (~37,344 GPU hours for InstructBLIP vs ~600 for GPT+CLIP).
