id: IC-639
title: The causal tracing pattern of MLP at early layers and attention at late layers is not stable
  across factual and syntactic phenomena in GPT-2 XL
description: Meng et al. (2022) proposed that factual recall occurs in mid-layer MLPs and is copied
  to output by top-layer attention. The paper reproduces this causal tracing on syntactic phenomena
  (determiner-noun agreement, subject-verb agreement) and finds the clean two-site pattern does not
  hold. For subject-verb agreement, MLP modules show strongest causality at layers 30–35, later than
  attention (~25). Many factual traces also show MLP causality at the late site, contradicting the proposed
  division of labor.
