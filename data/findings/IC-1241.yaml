id: IC-1241
title: GPT-4 (14 March 2023) achieves 100% zero-shot accuracy at classifying whether news articles could
  be part of its pre-training data
description: The authors gave GPT-4 ten CNN articles (five from 2020, five from 2023) and asked zero-shot
  whether each could be part of its pre-training data. The model achieved 100% accuracy, correctly identifying
  that 2020 articles could be in pre-training and 2023 articles could not, using its knowledge of a
  September 2021 pre-training cutoff. When all explicit date information was removed, the model made
  one mistake and gave three ambiguous answers but remained mostly correct, reasoning about events relative
  to its cutoff.
