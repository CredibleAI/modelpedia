id: IC-190
title: LLMs show progressive degradation in system message constraint following across multi-turn conversations,
  with dependent conversations degrading faster than parallel ones
description: Using the session stability rate (SSR) and per-round satisfaction (Rn), the paper shows
  all 16 models degrade over 5 turns. The best SSR is 54.4% (GPT-4o, parallel). Multi-turn dependent
  conversations show steeper decline than parallel ones for most models, as evidenced by higher linear
  regression slopes (k). For example, Qwen2-7b drops to 0.0% by round 5 in parallel conversations and
  1.1% in dependent conversations. Replacing model-generated history with ground truth improves ISR,
  confirming that prior errors compound and degrade subsequent performance.
