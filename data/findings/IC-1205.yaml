key_metric: 'zero-shot addition: davinci 2%, curie 0.0%, ada 0.0%; zero-shot subtraction: davinci 0.1%,
  curie 0.1%, ada 0.0%; zero-shot sine (eps=0): davinci 0%, curie 0.0%, ada 0.0%; zero-shot sqrt (eps=0):
  davinci 0%, curie 0.0%, ada 0.0%; after 1000-sample fine-tune, detailed scratchpad addition: davinci
  99.5%, curie 99.7%, ada 99.8%'
caveat: Fine-tuning used only 1000 samples and 4 epochs, which the authors note is 'significantly smaller'
  than their NanoGPT experiments (10,000 samples, 5,000 iterations). The authors also note that for
  sine and square root, 1000 samples is insufficient to generate exact answers (eps=0), and the fine-tuned
  GPT-3 performs worse than NanoGPT trained with 10,000 samples on those tasks.
