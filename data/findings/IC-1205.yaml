id: IC-1205
title: GPT-3 models (ada, curie, davinci) achieve near-zero accuracy on zero-shot arithmetic tasks but
  learn them rapidly with 1000 fine-tuning samples
description: 'The paper evaluates the zero-shot arithmetic performance of three GPT-3 variants on addition,
  subtraction, sine, and square root. All three models show extremely poor zero-shot accuracy: addition
  ranges from 0.0% (curie, ada) to 2% (davinci), subtraction from 0.0% to 0.1%, and sine/square root
  are at or near 0%. However, fine-tuning with only 1000 samples and 4 epochs dramatically improves
  performance, with the detailed scratchpad format reaching 99.5-99.8% on addition and 81.5-99.5% on
  subtraction. This demonstrates that pretraining does not elicit arithmetic in a zero-shot setting
  but provides a strong inductive bias that accelerates learning with minimal additional data.'
