id: IC-385
title: TAR-bio-v1 retains bio-weaponization knowledge despite appearing to unlearn it; a different prompt
  template and answer extraction method reveals accuracy above 45% on WMDP-bio
description: Under the official WMDP evaluation pipeline (zero-shot QA format without chat template,
  answer selected by logit order of candidate tokens), TAR-bio-v1 shows near-random accuracy (~25%)
  on WMDP-bio, suggesting successful unlearning. However, when the authors wrap the prompt with Llama-3's
  official chat template and use GPT-4o or human labelers to extract answers from the model's free-form
  text outputs, the accuracy rises consistently above 45%. This indicates the model still retains the
  bio-weaponization knowledge but fails to produce it in the constrained multiple-choice format used
  by the original evaluation.
