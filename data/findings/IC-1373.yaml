id: IC-1373
title: All five evaluated LLMs show a strong positional bias in constrained text generation, with first-position
  constraints nearly always satisfied but last- and arbitrary-position constraints causing major performance
  drops
description: The paper tests five instruction-tuned LLMs on 13 constraint structures that include positional
  constraints at different indices. When the constraint targets the first word or character (i=1), GPT-4
  achieves 100% success. When it targets the last position (i=-1), GPT-4 drops to 40-60%, and all models
  struggle with arbitrary intermediate positions. The effect is consistent across all five models and
  is less sensitive to the text level (word vs sentence vs paragraph) than to the position index itself.
