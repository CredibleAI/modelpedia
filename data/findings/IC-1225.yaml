key_metric: 'GPT-4: 100% numeracy, 100% attribution, 100% visibility, 100% dynamics, 88% sequential,
  98% average. GPT-3.5: 100%, 100%, 100%, 71%, 16%, 77% average. Retrieval-based: 20%, 12%, 28%, 8%,
  0%, 14% average. 500 prompts total (100 per task).'
caveat: GPT-4 still fails on some sequential (long-horizon) dynamics (88% not 100%). GPT-3.5 is unstable
  with only 1 in-context example (2 of 3 runs could not finish). The evaluation uses rule-based metrics
  on programmatically generated prompts, not human judgment of layout quality.
