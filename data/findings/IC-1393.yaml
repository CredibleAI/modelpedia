id: IC-1393
title: Most mainstream LLMs generate value-violating content at high rates (APV 65-80%) across 2,397
  morally ambiguous prompts, indicating substantial ethical misalignment
description: 'The paper benchmarks 27 LLMs across seven model families using the MoralPrompt dataset
  of 2,397 prompts covering 522 value principles from the Moral Foundations Theory. For each prompt,
  10 completions are generated and scored by a classifier for value violation. The results show that
  nearly all models produce value-violating content at high frequency: LLaMA-2-70b-chat scores 77.73
  APV, LLaMA-7b scores 76.85 APV, and even the best-performing ChatGPT scores 65.20 APV. Aligned models
  show modest improvement over their unaligned counterparts (e.g., Falcon-40b-instruct achieves 2.94
  less APV than Falcon-40b), but violations remain pervasive. Models within the same series exhibit
  similar value conformity regardless of size.'
