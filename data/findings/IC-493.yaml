key_metric: 'Task generalization AUROC (first token): Llama-2-7B 0.77±0.04, Llama-2-13B 0.83±0.03, Mistral-7B
  0.74±0.02, Phi-3 0.88±0.03. Instruction-type generalization AUROC (first token): Llama-2-7B 0.52±0.03,
  Llama-2-13B 0.56±0.06, Mistral-7B 0.50±0.05, Phi-3 0.55±0.04. RE success rate (last layer): Llama-2-7B
  0.57→0.59, Llama-2-13B 0.61→0.65, Mistral-7B 0.58→0.64, Phi-3 0.71→0.74 (inst-follow vs original).'
caveat: Analysis limited to 5 simple instruction types (or 23 in the expanded experiment) and 100 tasks;
  the authors note that unambiguously interpreting the meaning of the dimension remains an open question.
  Results are consistent across the four models studied but may not generalize to other architectures.
