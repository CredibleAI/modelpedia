id: IC-1232
title: GPT-2 XL and GPT-J exhibit knowledge conflict when subjected to reverse and composite knowledge
  edits, with ROME and MEMIT showing near-total failure on reverse edits
description: 'The paper applies pairs of logically connected edits to GPT-2 XL and GPT-J using four
  editing methods (FT, MEND, ROME, MEMIT). In the reverse-edit setting (editing inverse relations),
  ROME and MEMIT fail almost completely: their conflict scores (CS) drop to 0.00 and negative values,
  meaning the model retains the old fact alongside the new one. In the composite-edit setting (two edits
  linked by a logical rule through a tied fact), all methods cause significant damage to the tied fact,
  with tied-fact-damage (TFD) scores reaching 88.75 for FT on GPT-2 XL. The paper attributes ROME and
  MEMIT''s reverse-edit failure to their poor performance on reverse relation reasoning.'
