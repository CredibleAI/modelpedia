id: IC-1392
title: Title reproduction shows no contamination signal while tag reproduction shows a negative association
  with GitHub presence and a moderating difficulty effect for GPT-4 and GPT-3.5-turbo
description: 'As memorization probes, the paper asks models to reproduce problem titles and Codeforces
  tags from just the problem ID. For title reproduction, there is no significant effect of GitHub presence
  on reproduction ability, both before and after the cutoff, across all models. For tag reproduction
  on Codeforces, there is a negative association between GitHub presence and tag reproduction (GPT-3.5-turbo:
  OR 0.959, p=0.00001 pre-cutoff). The difficulty effect on tag reproduction moderates after the cutoff,
  dropping from a 56.9% decrease in odds to 17.4% for GPT-4, and from 50.3% to 26.1% for GPT-3.5-turbo.
  The authors hypothesize that tags, being metadata not present in the main problem description, may
  be less frequently copied online, explaining the inverse relationship with GitHub presence.'
