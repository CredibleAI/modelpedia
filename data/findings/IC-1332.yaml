id: IC-1332
title: Vicuna-v1.5 and CodeLlama-34b-instruct produce format-breaking artifacts (escaped underscores,
  [python] tags) in 30-100% of code instances due to training data contamination
description: 'Vicuna-v1.5 models generate escaped underscores (\_) in function names across all tasks,
  causing Python syntax errors: 30.38% of reasoning instances for 7b and 38.61% for 13b, rising to 86.57%
  (decision-making) and 90.44% (code) for 13b. The authors trace this to ~15% of ShareGPT training examples
  containing the backslash-underscore pattern. Separately, CodeLlama-34b-instruct wraps code in [python]
  tags on 100% of code generation tasks, ignoring the instructed <execute> format, which the authors
  attribute to overfitting on [python] tags used during its self-instruct fine-tuning phase.'
