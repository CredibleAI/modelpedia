id: IC-118
title: Hallucination heads in LLaVA-7B and MiniGPT-4 allocate 4.75x more attention to text tokens than
  image tokens, and this pattern is inherited from the base language model
description: The paper measures attention weights split into text and image components for identified
  hallucination and non-hallucination heads. Hallucination heads show a 4.75x text-over-image ratio
  versus 1.35x for non-hallucination heads. Comparing attention maps on generated text tokens between
  LLaVA-7B and its base LM Vicuna-7B (and MiniGPT-4 and LLaMA-2-7B), the top hallucination head shows
  cosine similarity of 0.84 (0.93 for MiniGPT-4) versus 0.63 (0.59) for the top non-hallucination head.
  Additionally, replaying instruction tuning shows that top hallucination heads exhibit slower JS divergence
  from the pre-trained model, indicating they are 'lazy' during full-parameter tuning.
