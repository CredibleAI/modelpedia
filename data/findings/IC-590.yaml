id: IC-590
title: Tuning only the identified safety neurons (SN-Tune) reduces harmful scores of instruction-tuned
  and base models by over 90 points while preserving general capability.
description: The authors fine-tune only the identified safety neurons (setting gradients of all other
  parameters to zero) on 50 safety documents for 1 epoch at learning rate 1e-6. For instruction-tuned
  models, this reduces average harmful scores from 93.5 to 3.0 (Vicuna-13b-v1.5), 65.5 to 2.0 (Llama3-8b-instruction),
  and 70.8 to 4.5 (Mistral-7b-instruct-v0.2). For base models, it reduces scores from 98.8 to 5.3 (Llama2-7b-base),
  100.0 to 13.5 (Llama3-8b-base), and 100.0 to 13.8 (Mistral-7b-v0.1). General capability (MMLU, ARC-C,
  GSM8K) is largely preserved or slightly improved. Training takes only 2-4 minutes versus 23-43 minutes
  for the Circ-Break baseline.
