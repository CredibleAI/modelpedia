id: IC-352
title: RAG with sufficient retrieved tokens outperforms direct long-context for Qwen2-72b-instruct on
  >100k tasks, while at 32k the default RAG setting underperforms direct long-context for GPT-4-turbo-2024-04-09,
  Qwen2-72b-instruct, and Llama-3.1-70b-instruct
description: 'The paper compares RAG (using E5-Mistral retriever) against direct long-context prompting
  for the same released models. At 32k context, the default RAG setting (top-5 chunks, 1200 tokens each,
  6000 total) underperforms: GPT-4-turbo-2024-04-09 drops from 51.93 to 49.84, Qwen2-72b-instruct from
  49.94 to 48.08, and Llama-3.1-70b-instruct from 49.92 to 47.63. However, at >100k context, RAG with
  more chunks (top-20 for Qwen2-72b-instruct) outperforms direct long-context: 52.95 vs 52.22. The paper
  also shows that increasing total retrieved tokens from 3000 to 24000 monotonically improves RAG accuracy
  on 32k tasks.'
