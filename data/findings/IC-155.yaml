id: IC-155
title: All 13 evaluated MLLMs perform at or near random guessing on MediConfusion, with confusion scores
  often exceeding 90%, indicating they cannot distinguish visually dissimilar radiology image pairs
description: The paper evaluates 13 multimodal LLMs (3 medical, 5 proprietary, 5 open-source general)
  on MediConfusion, a 352-question benchmark built from radiology image pairs that are visually distinct
  but similar in embedding space. Twelve of thirteen models achieve set accuracy below the 25% random-guessing
  baseline, with individual accuracy hovering around 50%. Confusion scores—the fraction of pairs where
  the model gives the same answer for both images—frequently exceed 90%, confirming that the models
  are not actually reading the image content. Even RadFM, which does not use a CLIP-style encoder, shows
  85.80% confusion. The image-caption pairs used to build the benchmark are part of PMC-OA, which is
  in the pre-training data of all medical MLLMs tested.
