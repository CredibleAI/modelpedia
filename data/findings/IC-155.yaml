key_metric: 'Set accuracy (best across methods): LLaVA 9.09%, BLIP-2 6.82%, InstructBLIP 12.50%, DeepSeek-VL2
  16.48%, Molmo 9.66%, LLaVA-Med 1.14%, RadFM 5.68%, Med-Flamingo 4.55%, GPT-4o 18.75%, O1 21.59%, Claude
  3 Opus 8.52%, Gemini 1.5 Pro 19.89%, Gemini 2.0 Flash 29.55%; random guessing 25.00%. Confusion scores
  range from 58.52% (Gemini 1.5 Pro) to 100.00% (LLaVA-Med).'
caveat: The benchmark is limited to radiology images from ROCO and 352 questions across 9 categories.
  The confusing pairs were selected using BiomedCLIP similarity, so the failure may be specific to the
  type of visual ambiguity that BiomedCLIP captures.
