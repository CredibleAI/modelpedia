id: IC-1599
title: Self-repair at equivalent compute budget provides only modest and inconsistent gains over i.i.d.
  sampling for CodeLlama-13B-Instruct, GPT-3.5, and GPT-4 on HumanEval and APPS
description: 'The paper compares self-repair (generate code, get feedback, repair) against i.i.d. sampling
  at the same total number of programs generated. Across all three models and both benchmarks, the gains
  are small and highly variable. GPT-4 on APPS shows the largest improvement (up to 8% over baseline),
  while GPT-3.5 on HumanEval is near ceiling (up to 3%). Critically, the allocation of budget matters:
  spending more on initial diverse samples helps, while spending more on repair candidates often hurts.
  For GPT-4 on APPS, 10 initial + 1 repair (20 total) gives 66.1% vs 63.1% baseline, but 2 initial +
  10 repairs (22 total) gives 61.8% vs 63.4% baseline.'
