id: IC-334
title: GPT-4V produces more poetic, emotion-focused image captions compared to Gemini-1.5-Flash's literal
  descriptions, with 99% model-matching accuracy on COCO
description: On 1000 COCO images, VibeCheck compares captions generated by GPT-4V and Gemini-1.5-Flash.
  GPT-4V uses more poetic language, structures captions as dynamic stories, infers personality and emotions
  of subjects, and emphasizes mood and atmosphere (sep 0.63). Gemini-1.5-Flash sticks to straightforward,
  literal descriptions focusing on identifying objects. The top 10 vibes achieve 99.13% model-matching
  accuracy and 89.02% preference-prediction accuracy. GPT-4V has an 80% win rate in LLM-judged preference.
