key_metric: 'CLIP ViT-B/16: AdamW 76.0% vs SGD 67.9% OOD (avg over 5 datasets); CLIP ViT-L/14: AdamW
  82.2% vs SGD 66.8% OOD; SGD (freeze-embed) 76.7% OOD avg across all models/datasets vs 72.0% SGD and
  76.0% AdamW; embedding layer is ~0.7% of ViT-B/16 parameters; gradients in embedding layer are about
  5x larger than other layers'
caveat: The gradient ratio (~5x) is stated in the context of one model/dataset ablation; the exact ratio
  varies across models and datasets. The paper notes that on Living-17 (closest to pretraining distribution),
  SGD often performs comparably to or better than AdamW, suggesting the effect depends on distribution
  shift magnitude.
