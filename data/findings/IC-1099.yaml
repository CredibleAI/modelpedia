id: IC-1099
title: AdamW-pretrained vision models (ViTs, ConvNeXt) have disproportionately large embedding-layer
  gradients at initialization, causing SGD fine-tuning to degrade OOD accuracy by up to 15% relative
  to AdamW
description: The paper measures layer-wise gradient norms at pretrained initialization across 7 released
  vision models. For modern architectures pretrained with AdamW (CLIP ViTs, supervised ViT, DINO ViT,
  ConvNeXt), the embedding layer's gradient norm is an outlier, roughly 5x larger than other layers.
  This causes SGD to make disproportionately large updates to the embedding layer during fine-tuning,
  degrading out-of-distribution performance. On CLIP ViT-B/16, AdamW achieves 8.1% higher average OOD
  accuracy than SGD across 5 distribution shift datasets; on CLIP ViT-L/14 the gap widens to 15.4%.
  Freezing the embedding layer (less than 1% of parameters) closes the gap, with SGD (freeze-embed)
  achieving 76.7% average OOD accuracy versus 72.0% for SGD and 76.0% for AdamW. The effect is absent
  or minimal for BiT ResNets pretrained with SGD, confirming the role of the pretraining optimizer.
