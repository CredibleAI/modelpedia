id: IC-410
title: Knowledge editing can degrade generalization performance below pre-edit levels in Llama2-7B,
  Llama3-8B, and Mistral-v0.3-7B
description: 'After applying knowledge editing, the models'' ability to answer different formulations
  of the same question (rephrased, yes/no, multi-choice, reversed) can actually drop below the pre-edit
  level. GRACE degrades generalization across all question types, and FT-L and LoRA degrade on some
  types. Higher efficacy scores do not correlate with higher generalization scores: GRACE nearly tops
  efficacy but largely degrades generalization. All editing methods except ICE only slightly improve
  or negatively impact generalization.'
