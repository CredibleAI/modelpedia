id: IC-1462
title: GPT-3.5-turbo is substantially more robust to the generation exploitation attack, with attack
  success rate of only 7% compared to over 95% for open-source models
description: The same generation exploitation attack (varying temperature, top-p, presence penalty,
  and frequency penalty via the OpenAI API) is applied to GPT-3.5-turbo on the MaliciousInstruct benchmark.
  The attack success rate under default decoding is 0%, and even with all four hyperparameters varied
  simultaneously, the ASR reaches only 7%. The authors attribute this robustness to content filtering
  (9 out of 100 prompts time out, suggesting filtering) and more extensive red-teaming by the proprietary
  provider.
