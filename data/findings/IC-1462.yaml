caveat: The authors note this is a preliminary experiment; 9 out of 100 prompts experience timeout errors
  suggesting content filtering may be blocking the attack rather than the model being inherently aligned.
  The API only exposes four hyperparameters, limiting the attack surface compared to open-source models.
