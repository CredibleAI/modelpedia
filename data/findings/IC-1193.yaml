caveat: All models except ToolLLaMA-dfsdt-retriever use the oracle (ground-truth) API set rather than
  a retriever, so results reflect reasoning ability given the correct tools rather than end-to-end tool
  selection. The evaluation uses ToolEval (ChatGPT-based automatic evaluator) with 87.1% pass-rate and
  80.3% win-rate agreement with human annotators.
