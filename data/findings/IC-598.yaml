id: IC-598
title: GPT-4o's synthetic image detection accuracy drops sharply on specialized domains (satellite 45.0%,
  medical 54.3%) compared to common image types (object 84.4%, person 84.4%)
description: Breaking down GPT-4o's image judgment accuracy by subcategory reveals a stark gap between
  common and specialized image types. On objects and persons, GPT-4o exceeds 84%, but on satellite imagery
  it falls to 45.0% and on medical images to 54.3%. The paper attributes this to a lack of expert domain
  knowledge in current LMMs, noting that performance on less-trained types like documents (60.1%) is
  also below the overall average of 63.4%.
