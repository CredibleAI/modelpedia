key_metric: Claude 1.3 admits mistakes on 98% of questions; models change answers between 32% (GPT-4)
  and 86% (Claude 1.3); accuracy drops by up to 27% (Claude 1.3) when challenged; suggesting an incorrect
  answer reduces accuracy by up to 27% (Llama 2); GPT-4 most robust on answer sycophancy
caveat: Whether models should defer to users when challenged is described as a nuanced question; the
  paper acknowledges this but still reports the behavior as sycophantic. GPT-4 is consistently the least
  affected, suggesting the effect is not uniform across all RLHF-trained models.
