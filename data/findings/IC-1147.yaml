id: IC-1147
title: GPT-4 outperforms GPT-3.5 on all KITAB metrics but the gap is modest, with all-correctness below
  35% for both, suggesting scale alone does not resolve constraint satisfaction
description: Across all conditions and constraint types, GPT-4 achieves higher satisfaction, completeness,
  and all-correctness than GPT-3.5, but the differences are not dramatic. In the best condition (with-context),
  GPT-4 achieves 0.08 all-correctness versus 0.07 for GPT-3.5. The paper explicitly states that 'the
  difference between the two llms is not as dramatic showing that scale alone may not address the filtering
  with constraints problem.' This holds across popularity bins and constraint types.
