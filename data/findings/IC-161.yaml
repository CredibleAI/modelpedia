id: IC-161
title: Linear probes on Pythia-70m and Gemma-2-2b trained on the ambiguous Bias in Bios set rely on
  gender as a spurious feature, with gender accuracy far exceeding profession accuracy
description: The authors train linear classification heads on Pythia-70m and Gemma-2-2b to classify
  profession from biographies, using only the ambiguous training set where gender is perfectly predictive
  of the label. On the balanced test set, the original probes achieve much higher gender accuracy than
  profession accuracy (87.4% vs. 61.9% for Pythia; 81.9% vs. 67.7% for Gemma), indicating the models'
  representations encode gender in a way that dominates profession classification. After applying SHIFT
  (ablating human-identified gender-related SAE features) and retraining the probe, gender accuracy
  drops to near chance (52.0%, 52.4%) while profession accuracy rises to 93.1% and 95.0%.
