id: IC-007
title: Most LLMs do not align closely with human moral preferences on multilingual trolley problems
description: The paper measures the moral alignment of 19 LLMs with human preferences by comparing their
  preference vectors across six moral dimensions (species, gender, fitness, status, age, and number
  of lives) to human preference vectors from the Moral Machine dataset. Alignment is quantified using
  the L2 distance between model and human preference vectors, where 0 indicates perfect alignment. The
  analysis finds that only three models (Llama 3.1 70B, Llama 3 70B, and Llama 3 8B) have misalignment
  scores below 0.6, while others, particularly GPT-4o-mini, show substantial deviations from human moral
  judgments.
