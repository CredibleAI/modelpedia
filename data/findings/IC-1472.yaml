id: IC-1472
title: DINOv2 (86M parameters) achieves the smallest GEODE geographic disparity (2.46% Europe-Africa
  gap) among all 98 models in the testbed
description: Among 98 vision models spanning 16 architectures and 8 pretraining datasets, DINOv2, a
  self-supervised foundation model trained on auto-curated video data (LVD-142M), shows the smallest
  region performance disparity on GEODE at 2.46% between Europe and Africa subsets. While it still has
  a significant disparity on DollarStreet, its GEODE performance is remarkable for its 86M parameter
  size. The authors interpret this as evidence that data curation (auto-curated video data) offers a
  promising path to mitigating geographic disparities.
