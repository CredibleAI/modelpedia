id: IC-798
title: GPT-4 achieves 61.6% on MATH with tool-integrated reasoning prompting, exceeding PaL (51.8%)
  and CoT (42.5%)
description: 'The paper evaluates GPT-4 on the MATH benchmark under three prompting strategies: chain-of-thought
  (CoT), program-aided language (PaL), and the tool-integrated reasoning format proposed by the authors.
  GPT-4''s accuracy on MATH is 42.5% with CoT, 51.8% with PaL, and 61.6% with the tool-integrated format
  that interleaves natural language rationales with program execution. The tool-integrated format yields
  a 19.1-point improvement over CoT and a 9.8-point improvement over PaL. The paper states that ''the
  tool-integrated reasoning method used by tora significantly outperforms pal prompting when directly
  applied to the closed-source gpt-4.'''
