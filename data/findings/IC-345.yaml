id: IC-345
title: GPT-4o's table2latex outputs lose 63% of the time in human evaluation, with inconsistent formatting
  (lines, borders, margins) as the primary failure
description: In a human evaluation with 28 evaluators providing 1,900 annotations, GPT-4o's LaTeX table
  outputs were compared against phi3.5-vision+bigdocs. GPT-4o loses 63% of the time with 31% draws and
  6% both bad. The authors note that GPT-4o 'often struggles to maintain consistent formatting despite
  capturing content accurately.' On screenshot2html, GPT-4o performs more competitively, with phi3.5+bigdocs
  winning only 36% and GPT-4o winning 48%.
