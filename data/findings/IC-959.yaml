id: IC-959
title: LLaMA and OPT-1.3B (and Aquila-7B) encode more similar interaction primitives than smaller models
  such as BERT-base and BERT-large
description: The paper extracts AND/OR interaction primitives from pairs of DNNs trained for the same
  task and measures how many are shared across the pair. For the LLM pair LLaMA and OPT-1.3B on the
  SQuAD next-word task, and for the pair LLaMA and Aquila-7B, the ratio of shared interactions is substantially
  higher than for the BERT-base/BERT-large pair on SST-2 sentiment classification. The authors attribute
  this to larger models being more effective at discarding incorrectly learned interactions during training,
  leaving a more consistent set of task-relevant interaction primitives.
