id: IC-1220
title: GPT-4, GPT-3.5-turbo, and Llama-2-70B can implement learning algorithms in-context on novel boolean
  functions, competing with nearest-neighbor baselines
description: The authors directly prompt GPT-4, GPT-3.5-turbo, and Llama-2-70B with sequences of boolean
  input-label pairs and ask them to predict the label of a new input, with no parameter modification.
  The target functions are sampled from an exponentially large space (over 10^30 for n=7), making memorization
  virtually impossible. All three models perform as well as or better than the nearest-neighbor baseline
  when the number of dimensions is up to 7. GPT-4 slightly outperforms the NN baseline even at 15 dimensions.
  Llama-2-70B performs quite similarly to GPT-3.5-turbo.
