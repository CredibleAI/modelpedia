id: IC-1319
title: Larger LLaMA and LLaMA2 models show better calibration on phrase-level tasks but not consistently
  on sentence- and paragraph-level tasks
description: 'The paper evaluates calibration (ECE, Brier score) of LLaMA-7B, LLaMA-13B, LLaMA-30B,
  LLaMA2-7B, and LLaMA2-13B across phrase-, sentence-, and paragraph-level generation tasks. On phrase-level
  tasks, the larger models in each family achieve lower ECE and Brier scores than their smaller counterparts.
  However, on sentence- and paragraph-level tasks, the scaling trend breaks down: for example, LLaMA-30B
  has higher ECE than LLaMA-7B on WikiQA (0.142 vs. 0.108) and WikiGen (0.165 vs. 0.102), indicating
  that the within-family scaling benefit does not extend to longer generations.'
