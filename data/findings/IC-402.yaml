id: IC-402
title: In LLaMA3-8B, LLaMA2-13B, and Mistral-7B, soft-prompt information flow peaks in shallow layers
  (2–10) and reasoning correctness depends on whether deeper layers redirect attention away from soft
  prompts to earlier reasoning steps
description: 'Using saliency score analysis (Hadamard product of attention and gradient), the paper
  measures layer-by-layer information flow from soft prompt tokens to question and rationale tokens
  in three released LLMs. A strong prompt-to-question and prompt-to-rationale flow is concentrated in
  layers 2 through 10. In correct-answer cases, deeper layers shift attention from soft prompts to earlier
  rationale steps and the question; in incorrect cases, the latter reasoning steps in deep layers maintain
  strong attention to soft prompts. This pattern was validated on 100 randomly sampled instances, and
  the relationship between the last-layer prompt-to-rationale flow intensity (sif_p) and correctness
  was confirmed on 50 correct and 50 incorrect examples. The practical consequence is that vanilla prompt
  tuning yields only marginal gains on complex reasoning (e.g., LLaMA3-8B GSM8K: 64.9% pretrained to
  65.5% with PT, a 0.6% increase).'
