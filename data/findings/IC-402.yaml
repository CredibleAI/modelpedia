key_metric: 'Saliency peaks between layer 2 and layer 10; 100 randomly sampled instances for correlation
  validation; 50 correct + 50 incorrect for sif_p analysis; LLaMA3-8B GSM8K: pretrained 64.9%, prompt
  tuning 65.5% (0.6% gain); LLaMA2-13B GSM8K: pretrained 29.5%, PT 38.1%; Mistral-7B GSM8K: pretrained
  37.9%, PT 49.5%'
caveat: The analysis is limited to three decoder-only LLMs and three math-reasoning datasets; the authors
  note that the inference cost of identifying erroneous information flow patterns requires a complete
  reasoning pass, limiting practical applicability.
