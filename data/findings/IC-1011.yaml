caveat: The gap is specific to the dynamic retrieval task constructed from Common Crawl data; on flickr-sourced
  data the gap is small, suggesting domain-specificity of the shift. The 8% figure is from the abstract;
  the paper does not print a single precise number in a table for this comparison.
