id: IC-1011
title: OpenAI CLIP loses approximately 8% zero-shot retrieval accuracy on 2021–2022 data compared to
  OpenCLIP models trained on data through 2022, while standard benchmarks show no such gap
description: The paper evaluates OpenAI's CLIP models (trained on data up to 2020) and OpenCLIP models
  (trained on data up to 2022) on a dynamic retrieval task spanning 2014–2022. OpenAI CLIP shows a significant
  performance gap on 2021–2022 retrieval queries relative to 2014–2016, while OpenCLIP models maintain
  consistent performance across time periods. The gap is particularly pronounced for novel concepts
  such as covid-19 and for certain ImageNet subtrees (motor vehicles show an approximate 4% drop). Standard
  benchmarks like ImageNet distribution shifts do not reveal this temporal degradation, showing OpenAI
  and OpenCLIP models have similar robustness on those tasks. The authors validate the finding by retraining
  OpenCLIP models after removing test-set duplicates, confirming the trend persists.
