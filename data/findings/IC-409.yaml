id: IC-409
title: Knowledge editing methods correct verified hallucinations in Llama2-7B, Llama3-8B, and Mistral-v0.3-7B
  far less effectively than their scores on existing benchmarks suggest
description: The paper constructs a verified hallucination dataset by checking which questions each
  model actually answers incorrectly before editing. Llama2-7B, Llama3-8B, and Mistral-v0.3-7B produce
  12,619, 13,210, and 14,366 verified hallucinations respectively. When these verified hallucinations
  are targeted by knowledge editing, methods that score near 100% on existing benchmarks (e.g., ft-m
  on WikidataRecent, ZSRE, WikiBio) achieve only around 60% efficacy on the verified set. The overall
  efficacy ranking across the three LLMs is ft-l < ft-m < memit < rome < lora < ice < grace, with parameter-preserving
  methods (ice, grace) outperforming parameter-modifying ones.
