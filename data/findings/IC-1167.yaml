id: IC-1167
title: GPT-4 Code Interpreter's mathematical reasoning accuracy is positively correlated with code usage
  frequency, with its iterative code generation and self-debugging mechanism as the primary driver of
  its 69.69% zero-shot MATH accuracy
description: 'The paper constrains GPT-4 Code Interpreter''s code usage via three prompts (no code,
  one code block, unrestricted) and measures accuracy on MATH. Restricting code to zero uses drops accuracy
  to 60.80%, one use to 67.58%, while unrestricted code (base prompt) yields 69.69%. The paper attributes
  the gap to the model''s self-debugging mechanism: generating code in brief segments interleaved with
  natural language, evaluating execution results, and correcting errors. Across five difficulty levels,
  code usage frequency increases with problem difficulty, and the accuracy gain from more code is most
  pronounced on harder problems.'
