id: TM-012
extracted_by: automatic-extraction
title: Longitude and time-of-year planes become circular in deeper encoder blocks
description: >
  GeoEx-extracted planes for longitude and time of year show increasingly circular organisation
  in deeper encoder blocks rather than displaying the same structure from the start.
evidence_type: correlational
concepts:
  - ref: concept:circular-representation
  - ref: concept:depth-dependent-structure
key_metric: null
caveat: >
  Longitude and year progression were supplied to GeoEx as sine and cosine targets, so the
  experiment does not fully separate native latent circularity from structure selected by the
  supervised extraction. Random planes provide a partial control.
