title: Longitude and time of year are encoded circularly, and only in the deeper encoder blocks
description: >
  Longitude and time of year are both circular quantities: 359 degrees sits right next to 0, and
  December sits right next to January. TerraMind turns out to represent them in a genuinely
  circular shape inside its latent space, and that circularity only appears in the deeper encoder
  blocks rather than being there from the start.
