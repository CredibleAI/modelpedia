id: IC-039
title: Object bias in CLIP and SigLIP is not correlated with performance on attribute tasks
description: The paper measures object bias in contrastive VLMs using a new metric, Moad. They find
  that models pre-trained on large-scale data tend to have a lower object bias than those on medium-scale
  data. However, there is no clear correlation between object bias and performance on attribute recognition
  tasks. The paper finds that performance improvements on object tasks correlate with improvements on
  attribute tasks, suggesting that general model improvement also benefits attribute recognition.
