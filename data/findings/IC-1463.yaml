id: IC-1463
title: ChatGPT achieves 34.9% average F1 on zero-shot NER across 43 datasets spanning 9 domains
description: The paper evaluates ChatGPT (gpt-3.5-turbo-0301) in a zero-shot setting on the UniversalNER
  benchmark, which comprises 43 NER datasets across 9 domains (general, biomedical, clinical, STEM,
  programming, social media, law, finance, transportation). Using strict entity-level micro-F1, ChatGPT
  attains 34.9% average F1. Performance varies widely by domain, from 51.0% in general to 3.8% in transportation.
  The paper uses the prompting template from Ye et al. (2023) for NER.
