id: IC-643
title: Conditioning CLIP on correct contextual attributes in the text prompt improves zero-shot classification
  accuracy across 13 image transformations
description: 'The authors apply 13 image transformations (vertical flip, rotation, blur, noise, fog,
  etc.) to ImageNet test images and compare four prompting strategies: no attribute, random attribute,
  wrong attribute, and correct attribute. Conditioning on the ground-truth attribute consistently improves
  accuracy over the no-attribute baseline, with an average gain of +1.16% across all transformations.
  Self-inferred attributes (CLIP''s own estimate) yield a similar +1.17% gain. On the full ImageNet
  test set with ViT-B/16, using the top-4 attribute composition achieves 68.80% versus 66.72% for the
  single template and 68.32% for 80-template prompt ensembling.'
