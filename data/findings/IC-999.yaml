key_metric: 'LDR (prompt ''a blackboard with formulas'', 50 total reverse timesteps): FLUX1 0.9253/0.8078/0.7992/0.8208/0.7994
  at timesteps 50/40/30/20/10; SD 3.5 0.9692/0.8283/0.7912/0.5726/0.4534 at timesteps 50/40/30/20/10'
caveat: The authors note that SD 3.5 has a small LDR near the end of denoising (timestep 10) and state
  'we do not know why.' LDR was computed via zeroth-order approximation due to memory constraints of
  the full Jacobian. Only one prompt ('a blackboard with formulas') was used for the LDR measurement,
  though multiple prompts and seeds (0-2) were used for the qualitative hallucination examples.
