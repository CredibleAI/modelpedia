id: IC-999
title: FLUX1 and Stable Diffusion 3.5 exhibit high local dependency ratio and produce text hallucinations
  when generating text content
description: The paper measures the local dependency ratio (LDR) of FLUX1-dev and Stable Diffusion 3.5-medium
  when prompted to generate images containing text (e.g. 'a blackboard with formulas'). Both models
  show high LDR values across most denoising timesteps, indicating that each text region is denoised
  primarily from its own local noise rather than from global context. Correspondingly, generated images
  contain misspelled words, missing characters, and nonsensical symbol assemblies. The LDR for FLUX1
  stays above 0.79 across all five measured timesteps, while SD 3.5 starts at 0.9692 and drops to 0.4534
  only at the final timestep.
