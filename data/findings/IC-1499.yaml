id: IC-1499
title: Self-rationalization quality and task accuracy scale with model size across GPT-3, FLAN-T5, and
  LLaMA on five QA datasets
description: 'The paper evaluates GPT-3 (175B), FLAN-T5 (L, XL, XXL), and LLaMA (7B, 65B) on self-rationalization
  across StrategyQA, QuAREL, OpenBookQA, Numersense, and QASC using few-shot chain-of-thought prompting.
  Task accuracy and rationale quality metrics (plausibility, consistency, diversity) generally improve
  with model scale: GPT-3 achieves the highest average NRG on most datasets, FLAN-T5-XXL and LLaMA-65B
  are competitive, while LLaMA-7B and FLAN-T5-L show substantially lower performance, particularly on
  Numersense (17.59% and 26.13% accuracy respectively) and QASC (24.19% and 61.02%).'
