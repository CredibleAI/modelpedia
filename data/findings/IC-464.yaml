id: IC-464
title: Video-LLaVA and Llama-VID systematically overestimate candidate VLM scores, assigning ratings
  near 4.00 across all visual dimensions and showing near-zero or negative agreement with a reference-guided
  agent-debate method
description: 'When used as judges to rate candidate VLM responses on the CVRR-ES benchmark, Video-LLaVA
  assigns scores close to 4.00 across nearly all 11 visual dimensions, and Llama-VID assigns scores
  typically above 3.70, regardless of the candidate model''s actual quality. Their weighted Cohen''s
  kappa agreement with the reference-guided LLM agent-debate method is near zero or negative (Video-LLaVA:
  -1.83 to 2.81; Llama-VID: -4.15 to 3.70), indicating they cannot discriminate between good and poor
  responses. This pattern is confirmed on a second dataset (VideoChatGPT), where Video-LLaVA''s average
  kappa is only 1.72%.'
