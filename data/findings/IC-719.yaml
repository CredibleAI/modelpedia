id: IC-719
title: Llama-2-Chat achieves reasonable human-preference accuracy (51.78-53.67%) as a prompted reward
  model without specific reward-model training
description: The paper tests Llama-2-Chat (7B, 13B, 70B) on two human preference benchmarks (HHH Alignment
  and MT Bench Human Judgment) using a ranking grading scheme, where the model must assign a higher
  score to the human-preferred response. Despite no reward-model-specific training, Llama-2-Chat achieves
  51.78%, 52.34%, and 53.67% total accuracy on HHH Alignment respectively. The authors attribute this
  to the RLHF training in Llama-2-Chat's base model. This is below GPT-4 (63.87%) and GPT-3.5-Turbo
  (57.12%) but above the dedicated StanfordNLP (44.79%) and ALMOST (49.90%) reward models.
