id: IC-1293
title: The l1 path-norm of PyTorch's pretrained ResNets is approximately 30 orders of magnitude too
  large for the path-norm generalization bound to be informative on ImageNet-1k
description: The paper computes the l1, l2, and l4 path-norms of the standard PyTorch pretrained ResNet
  checkpoints (18, 34, 50, 101, 152) on ImageNet-1k. The l1 path-norm of ResNet18 is 1.3×10³⁰, and for
  ResNet34 through ResNet152 it overflows float32. Given the training set size n=1,268,355 and the architecture-dependent
  constant c (4√n·c ranging from 0.088 to 0.23), the path-norm-based generalization bound would need
  to be reduced by roughly 30 orders of magnitude to match the observed generalization error. Path-norms
  also increase monotonically with depth across the ResNet family. No choice of margin γ makes the top-1
  accuracy bound informative either, as the maximum training margin (~30) is far too small to compensate
  the path-norm.
