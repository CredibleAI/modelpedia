id: IC-1003
title: Pretrained ResNet-50 and ViT-B/16 exhibit neuron activation patterns that are separable between
  in-distribution and out-of-distribution inputs, enabling post-hoc OOD detection without model modification
description: The paper formulates neuron activation states as the product of raw neuron outputs and
  KL-divergence gradients, then measures the coverage of these states under in-distribution training
  data. On pretrained ResNet-50 and ViT-B/16 (both trained on ImageNet-1k), out-of-distribution inputs
  trigger neuron states that fall outside the expected coverage area, producing lower coverage scores
  than in-distribution inputs. This separability in the models' internal neuron behavior allows a post-hoc
  uncertainty score (NAC-UE) to distinguish IN from OOD samples without modifying the model weights,
  achieving state-of-the-art AUROC across three OOD datasets.
