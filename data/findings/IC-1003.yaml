caveat: The separability is measured using the paper's specific neuron state formulation (z ⊙ ∂dkl/∂z);
  raw neuron outputs alone show less separation (FPR95 35.72% vs 16.58% on layer4 of ResNet-50). The
  method requires a small subset of training data (1,000–50,000 images) to build the coverage model.
