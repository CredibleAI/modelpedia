id: IC-1158
title: GPT-4 and other LMs are brittle to noisy exemplars and unfamiliar output representations, with
  performance degrading sharply even under minimal perturbation
description: On List Functions, GPT-4's raw accuracy drops from 71.2% (0% noise) to 50.9% (12.5% noise),
  42.4% (25%), and 29.1% (50%), with task accuracy falling from 61.2% to 10.0%. Explicitly instructing
  the model to consider noisy examples mitigates but does not eliminate the drop. On MiniScan, replacing
  English output words with pseudowords reduces raw accuracy from 93.3% to 86.8% and task accuracy from
  85.0% to 72.0%. The same brittleness is observed for GPT-3.5 and Claude-2.
