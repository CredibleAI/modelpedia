id: IC-542
title: The PyTorch pretrained ResNet50 on ImageNet is vulnerable to (1, y)-ACE calibration attacks that
  increase ECE from 3.70% to 47.23% while preserving accuracy
description: The authors introduce a family of parameterised attacks, (η, ω)-ACE, that perturb the input
  to alter the model's confidence without changing its predicted label. Applied to the standard PyTorch
  pretrained ResNet50 on ImageNet, a (1, y)-ACE attack with ε=2/255 increases the ECE from 3.70% to
  47.23%, and a (1, ŷ)-ACE attack increases it to 25.17%. The attack preserves the predicted class,
  so accuracy is unchanged, yet the model's confidence becomes severely miscalibrated. This demonstrates
  that a released model can be robust to label-flipping attacks while remaining vulnerable to calibration-specific
  adversaries.
