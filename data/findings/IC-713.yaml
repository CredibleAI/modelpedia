id: IC-713
title: 'Llama-2-7B-Instruct exhibits a reproducible failure mode in book-length summarization: high
  repetition and complete inability to perform incremental updating'
description: 'On 100 recently-published books, Llama-2-7B-Instruct produces the worst hierarchical BooookScore
  (72.4) of all five models tested, with 36.1% of trigrams repeated in its summaries. More critically,
  the model completely fails at incremental updating: it copies text verbatim from the input chunks
  until reaching the summary length limit, then fails to follow the compression instruction. The authors
  note they had to use a simpler prompt and truncate at the final punctuation mark to get any output
  at all.'
