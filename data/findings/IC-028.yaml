id: IC-028
title: SPADE, an abstaining classifier built on top of ResNet, ViT, and VGG models, detects out-of-distribution
  and adversarial samples with provable guarantees.
description: The paper introduces SPADE, a method that fits a Generalized Extreme Value (GEV) model
  to the latent distances of a pre-trained teacher model's training distribution. This GEV model is
  used to define an abstaining classifier that rejects samples deemed extreme. The method is empirically
  validated on ResNet, VGG, and ViT architectures using CIFAR-10, CIFAR-100, and ImageNet-1K datasets.
  Results show that SPADE performs comparably or better than state-of-the-art methods like MSP, ODIN,
  MDS, kNN, and CIDER for both OOD and adversarial sample detection.
