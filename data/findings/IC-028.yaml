evidence_type: correlational
key_metric: For OOD detection on ImageNet-1K with ResNet, SPADE achieves AUROC/FPR95 scores of 61.91/85.27
  (SSB-hard), 77.99/61.04 (NINCO), 85.26/44.84 (iNaturalist), 95.86/24.63 (Textures), 85.79/46.33 (OpenImages-O),
  ranking second overall. For adversarial detection (FGSM, ε=0.001-0.004) on CIFAR-10, SPADE achieves
  average AUROC/FPR95 of 86.10/54.43, ranking first in AUROC.
caveat: The theoretical guarantees for adversarial robustness depend on the Lipschitz constant of the
  teacher model, which can lead to trivial bounds. The authors mitigate this with a local Lipschitz
  constant analysis.
