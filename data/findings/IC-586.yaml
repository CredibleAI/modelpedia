id: IC-586
title: Symbolic distance (number of reasoning steps) is the primary bottleneck for relational reasoning
  in LLMs, not total context length
description: Using the RecogLab framework, the authors generate social network and comparison problems
  with controlled graph size and symbolic distance. Across all seven models tested, performance degrades
  as the number of reasoning steps increases, with models reliably answering only up to a symbolic distance
  of 6 as graph size grows. Adding irrelevant filler text (random book passages or distractor sentences)
  degrades performance less steeply than adding graph complexity, indicating that the logical depth
  of the problem, not the token count, is the limiting factor. Gemini Pro and GPT-4o evaluated up to
  70 entities show stable performance as long as traversals remain below 6.
