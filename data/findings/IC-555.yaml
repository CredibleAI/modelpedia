key_metric: 'Deductive reasoning (complete KB): Llama3-70B accuracy 0.80±0.03, RS macro 0.15, RS micro
  0.77; Mixtral 46.7B accuracy 0.59±0.02, RS macro 0.30, RS micro 0.66; GPT-3.5-turbo accuracy 0.69±0.02,
  RS macro 0.45, RS micro 0.48. Incomplete KB: GPT-3.5-turbo few-shot 0.54±0.04 (0.15↓), Llama3-70B
  few-shot 0.77±0.01 (0.03↓) on deductive; Llama3-70B few-shot 0.66±0.02 (0.25↓) on geographical QA.
  Ideal retrieval: Llama3-70B 0.94, Gemini 1.5 Flash 0.93 (few-shot, deductive).'
caveat: Reasoning scores are manually calculated for only 20 randomly chosen responses per method. The
  incomplete KB experiment ablates exactly one rule per query; the paper notes in Appendix D.3 that
  with multiple ablated rules, LLM-TH's own NLI-based entailment also degrades, and the comparison becomes
  less clean.
