caveat: The localization was performed on a validation set of 100 prompts from SimpleBench and CreativeBench
  using single-word keywords from the top-1k frequency bucket. The paper notes SDXL has significantly
  more cross-attention layers and the lowest text generation capability, which may explain the more
  distributed response across three layers versus one in the other models.
