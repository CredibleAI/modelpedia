id: IC-394
title: Text generation in SDXL, DeepFloyd IF, and SD3 is controlled by less than 1% of parameters concentrated
  in specific cross- or joint-attention layers, and these layers are specialised for text content rather
  than visual template
description: 'Using activation patching of cross- and joint-attention keys and values, the authors identify
  the layers responsible for generating textual content in three released diffusion models. In SDXL,
  three of 70 cross-attention layers (indices 55, 56, 57; 15.7M parameters, 0.61%) control text; in
  DeepFloyd IF, one of 22 layers (index 17; 8.9M parameters, 0.21%); in SD3, one of 24 joint-attention
  layers (index 10; 4.7M parameters, 0.23%). Further experiments show these layers are specialised:
  patching them with a target prompt that changes only the text (not the visual template) alters the
  generated text while leaving the background aligned with the source template, and vice versa. LoRA
  fine-tuning of only the localized layers in SDXL improves OCR F1 and CLIP-T while preserving generation
  diversity, whereas fine-tuning all 70 cross-attention layers causes recall collapse after roughly
  20 epochs.'
