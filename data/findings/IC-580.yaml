id: IC-580
title: The 3-step ICL inference circuit (text encoding, semantics merge, feature retrieval) is a dominant
  causal mechanism, as ablating the corresponding attention connections significantly degrades ICL accuracy
description: The paper zeros out specific attention connections corresponding to each step of the proposed
  circuit in Llama 3 8B and Falcon 7B, then measures ICL accuracy on 6 classification datasets. Removing
  demonstration-text-to-forerunner connections (step 1) drops accuracy by up to 30.60 percentage points;
  removing query-text-to-forerunner by up to 28.38; removing forerunner-to-label (step 2) by up to 3.45;
  and removing label-to-query-forerunner (step 3) by up to 11.36. Controlled experiments with randomly
  ablated connections of equivalent size show negligible drops (within ±0.02). The results confirm the
  circuit is causally dominant, though bypass mechanisms (direct decoding, shortcut induction) partially
  compensate.
