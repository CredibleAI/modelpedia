  -2.24/-3.45/-3.39/-3.42; step3 label→query forerunner: -5.14/-10.03/-11.36/-10.22; zero-shot reference:
  -17.90 (acc 50.65); random: -36.05 (acc 32.50)'
caveat: Ablation is applied from bottom to top layers; the result without induction (step 3) is better
  than zero-shot, indicating bypass mechanisms. The paper acknowledges the circuit is not the only mechanism
  and that bypasses exist in parallel.
