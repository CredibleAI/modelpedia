id: IC-1136
title: Larger LLMs (LLaMA2-70B, Vicuna-33B) are more stubborn than their smaller counterparts (LLaMA2-7B,
  Vicuna-7B) when encountering incoherent entity-substitution counter-memory
description: In the single-source setting with entity-substitution (incoherent) counter-memory, the
  larger models in each family show higher memorization ratios than their smaller counterparts. The
  authors attribute this to larger models having enhanced memorization and reasoning capabilities that
  make them more sensitive to the incoherence in the substituted evidence. This scale-dependent pattern
  is specific to the incoherent counter-memory condition and does not hold for the coherent generation-based
  counter-memory.
