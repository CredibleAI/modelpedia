id: IC-369
title: LMs verbalizing confidence with certainty phrases are better calibrated on SCIQ than on TruthfulQA
description: All three large LMs evaluated show substantially lower ECE on SCIQ (1000 science exam questions)
  than on TruthfulQA (817 questions designed to test mimicry of human misconceptions). GPT-4o drops
  from ECE 0.07 to 0.22, Claude-3.5-Sonnet from 0.06 to 0.25, and Gemini-1.5-Pro from 0.17 to 0.28.
  Accuracy also drops sharply (e.g., GPT-4o from 0.73 to 0.35), suggesting the harder dataset exposes
  both lower discriminative ability and worse calibration.
