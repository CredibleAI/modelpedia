caveat: The theory only covers samples satisfying the monotonicity assumption (84-90%); the remaining
  10-15% of samples without monotonicity also showed sparse interactions but are not covered by the
  proof. Only 10 words per sentence were used as input variables to reduce computational cost, and only
  the first 1000 SQuAD sentences were tested.
