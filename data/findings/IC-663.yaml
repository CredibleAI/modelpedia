id: IC-663
title: OPT-1.3B, LLaMA-7B, and Aquila-7B encode sparse Harsanyi interactions, with only 29-51 salient
  interactions out of 1024 possible on SQuAD sentences
description: 'The paper measures the Harsanyi interaction effects of three released LLMs on 1000 SQuAD
  sentences, using 10 selected meaningful words as input variables (n=10, so 2^10=1024 possible interactions).
  The results show that only a small fraction of interactions have non-negligible effects: the real
  number of valid (salient) interactions is 28.73±52.37 for OPT-1.3B, 50.53±40.37 for LLaMA-7B, and
  30.13±26.20 for Aquila-7B, far below the theoretical upper bound of 184-293. High-order interactions
  (order > m) are close to zero across all three models. The monotonicity condition (average output
  increases with less occlusion) holds for 84-90% of samples, and the polynomial decay constant p is
  around 0.9-1.5.'
