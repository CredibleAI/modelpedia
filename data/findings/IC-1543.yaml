id: IC-1543
title: VGG19, ResNet50, ViT-Base, and DeiT-Base (ImageNet pretrained) achieve near-zero accuracy under
  query-based black-box attacks with 1000–10000 queries
description: 'The paper measures the clean and attacked accuracy of four standard ImageNet-pretrained
  models under three score-based attacks (Square, NES, SignHunt) and two decision-based attacks (Rays,
  SignFlip). Without any defense, all four models are essentially completely broken: accuracy drops
  to 0.0–6.4% under score-based attacks and 0.0–9.7% under decision-based attacks, compared to clean
  accuracies of 74.21–82.00%. The vulnerability is consistent across both CNN (VGG19, ResNet50) and
  transformer (ViT-Base, DeiT-Base) architectures, and across both score-based and decision-based attack
  families. The effect is most severe for Square and SignHunt, which drive accuracy to 0.0% at 10000
  queries for three of the four models.'
