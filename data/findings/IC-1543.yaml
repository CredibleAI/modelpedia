  ResNet50 square 3.5/0.2, NES 36.2/4.3, SignHunt 6.6/0.4; DeiT square 6.4/0.0, NES 46.7/0.8, SignHunt
  22.3/0.0; ViT square 5.7/0.0, NES 45.7/7.3, SignHunt 5.1/0.0 (1000/10000 queries). Decision-based:
  VGG19 Rays 0.1, SignFlip 1.0; ViT Rays 1.7, SignFlip 9.7.'
caveat: Evaluation uses 1000 randomly selected images covering all classes. Attack success is defined
  as fooling the model in the majority of 9 verification runs. The paper focuses on query-based attacks
  only and does not evaluate transfer-based black-box attacks.
