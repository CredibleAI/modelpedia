id: IC-132
title: GPT-4 Turbo, GPT-3.5 Turbo, Llama3-8B, Qwen-7B, and iFlytekSpark-13B trust authority roles (teacher/judge)
  more than peer roles (classmate/lawyer) when the cue information is the correct answer
description: 'When the cue in step-3 is the correct answer, models guided by an authority role (teacher
  in education, judge in law) achieve higher accuracy at step-3 than those guided by a peer role (classmate,
  lawyer). The effect is much stronger in open-source models than in GPT-4: Llama3-8B drops from 0.8418
  (teacher+truth) to 0.6139 (classmate+truth) at step-3 on EG-QA ID, while GPT-4''s gap is only 0.9494
  vs 0.9373. The paper interprets this as a shortcut learned during training, where the model associates
  authority labels with correctness.'
