key_metric: 'GPT-4 Turbo on JEC-QA: judge+truth step-3 acc 0.6358 vs lawyer+truth step-3 acc 0.5246;
  on EG-QA: teacher+truth step-3 0.9494 vs classmate+truth step-3 0.9373. Llama3-8B on EG-QA ID: teacher+truth
  step-3 0.8418 vs classmate+truth step-3 0.6139. Qwen-7B on EG-QA ID: 0.8247 vs 0.7902. iFlytekSpark-13B
  on EG-QA ID: 0.8350 vs 0.7480.'
caveat: The authority effect is measured only when the cue is the correct answer; with random cues the
  pattern reverses or disappears. The paper notes this may reflect a bias learned during training rather
  than a genuine understanding of authority.
