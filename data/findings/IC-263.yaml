id: IC-263
title: DeepGate2 and DeepGate3 achieve average SAT solving runtime reductions of 18.24% and 21.31% respectively
  when used to constrain boolean fence search space
description: The paper integrates GNN-based circuit embeddings into an exact synthesis SAT solver to
  predict the number of nodes and levels for optimal equivalent implementations, thereby constraining
  the boolean fence search space. On five designs (adder, sqrt, hyp, i2c, div), DeepGate2 achieves an
  average solver runtime reduction of 18.24% and DeepGate3 achieves 21.31% compared to unconstrained
  exact synthesis. The paper notes that for easier cases (e.g., adder, sqrt), the GNN inference overhead
  makes the overall runtime worse than the baseline.
