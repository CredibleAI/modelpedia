  Lean4 test set'
caveat: The paper notes that some proofs in the PFR repository exploited unintended constructs (placeholder
  0=1 statements), and that reprover's performance is limited by Mathlib4's coverage of primarily undergraduate
  mathematics. The comparison is confounded by the fact that reprover's retriever is also the starting
  point for LeanAgent.
