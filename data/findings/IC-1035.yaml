id: IC-1035
title: Reprover achieves 0% accuracy on sorry theorems in advanced mathematics repositories (PFR, Hairy
  Ball Theorem, Coxeter) while proving basic theorems in other repositories
description: 'The paper measures reprover''s ability to prove previously missing (sorry) theorems across
  23 Lean repositories spanning diverse mathematical domains. Reprover fails completely on three advanced-mathematics
  repositories: the Polynomial Freiman-Ruzsa conjecture (0/37), the Hairy Ball Theorem (0/14), and Coxeter
  groups (0/15). In contrast, it achieves 48.3% on Mathematics in Lean Source, 20.9% on MiniF2F, and
  8.2% on SciLean, which contain more elementary material. The paper attributes this to reprover''s
  training on Mathlib4, which covers primarily undergraduate-level mathematics, making it unable to
  generalise to advanced topics. On the MiniF2F Lean4 test set, reprover achieves a pass@1 of 34.0%
  (83/244 theorems).'
