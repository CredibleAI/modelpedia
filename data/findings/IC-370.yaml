id: IC-370
title: Knowledge entropy (sparsity of FFN memory coefficients) decreases consistently during pretraining
  for OLMo 1B, 7B, and Pythia 1.4B, and this decrease strongly correlates with reduced knowledge acquisition
  and increased forgetting in continual learning
description: The paper measures how broadly a model activates its feed-forward memory vectors (the rows
  of the second projection matrix V) by computing the entropy of the average memory coefficient distribution
  across all tokens. For OLMo 1B, 7B, and Pythia 1.4B, this knowledge entropy declines monotonically
  as pretraining progresses, with the sharpest drop in the last layer. In a continual knowledge learning
  setup (further training on PubMed or C4 with injected fictional knowledge), models from later pretraining
  stages show lower acquisition rates and higher forgetting rates. The Pearson correlation between knowledge
  entropy and acquisition is 0.94 (p=6e-5) and with forgetting is -0.96 (p=1e-5). Mid-stage checkpoints
  (~50% of the learning rate schedule) achieve the best balance of acquisition, retention, and overall
  performance.
