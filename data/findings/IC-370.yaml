key_metric: 'Pearson correlation between knowledge entropy and acquisition: 0.94 (p=6e-5); with forgetting:
  -0.96 (p=1e-5). Baseline acquisition a(θ) across OLMo 1B pretraining steps 118k/369k/554k/738k: 25.2/24.8/21.4/18.8%;
  forgetting f(θ): 10.5/12.9/17.0/19.5%. Downstream performance p(θ): 54.0/54.6/52.8/52.0%.'
caveat: The study is limited to OLMo 1B and 7B (and Pythia 1.4B in the appendix) because they are the
  only models that publicly provide intermediate pretraining checkpoints. The authors note that extending
  to other models is future work. The mid-point is approximated as 50% of the learning rate schedule,
  and defining it precisely remains an open question.
