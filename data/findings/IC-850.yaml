id: IC-850
title: A partial SFT phase (40% of steps, 1% of samples) before RFT allows GPT-2 and T5-base to reach
  96% of the reward achieved with full SFT+RFT, by reducing the number of inputs with vanishing gradients
description: On NarrativeQA (GPT-2), ToTTo, and CommonGen (T5-base), the paper shows that performing
  a reduced initial SFT phase before RFT substantially boosts RFT efficacy. Using only 40% of the SFT
  optimization steps and as few as 1% of the labeled input samples, RFT reaches 96% of the reward achieved
  when SFT is performed over all samples and steps. The mechanism is that even this small SFT phase
  considerably reduces the number of inputs with small reward standard deviation (i.e., vanishing expected
  gradient), after which RFT becomes roughly 5 to 18 times more potent.
