id: IC-175
title: 'Context-sufficiency performance is scale-dependent: larger LLMs achieve high accuracy with sufficient
  context but still answer correctly 35-62% of the time without it, while smaller models hallucinate
  or abstain even with sufficient context'
description: 'Stratifying by context sufficiency reveals a systematic size gradient. On a curated challenging
  set, larger models (Gemini 1.5 Pro 84.1%, GPT-4o 82.5%, Claude 3.5 Sonnet 85.7%) achieve high accuracy
  with sufficient context, while Gemma 2 27B reaches only 71.4%. With insufficient context, the same
  larger models still answer correctly 35-62% of the time on main datasets (HotpotQA, FreshQA, Musique),
  indicating substantial parametric knowledge contribution. In contrast, smaller models (Llama 3.1 8B,
  Mistral 3 7B, Gemma 2 27B) show high hallucination rates even with sufficient context: Mistral 3 7B
  hallucinates 59.4% of the time with RAG on Musique, and Gemma 2 27B hallucinates 25.4% with sufficient
  context on the curated set.'
