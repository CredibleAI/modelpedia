id: IC-1518
title: Domain finetuning of LLaMA 2 7B, LLaMA 2 13B, and GPT-2 XL on PubMed causes topic and style priors
  to shift dramatically, accounting for the majority of the probability change, while factual knowledge
  learning contributes only a small fraction
description: The authors finetune three released language models on up to 1 million PubMed abstracts
  and probe the resulting models with controlled-variable text pairs (same content, different topic/style/factuals)
  generated by ChatGPT. Likelihood ratios show that the probability of the training topic (biomedical)
  and style (academic) increases sharply relative to alternatives, while the factual/counterfactual
  ratio changes at a much slower rate. An ablation on derived datasets confirms that topic and style
  adaptation contributes the main part of both the loss reduction on PubMed (learning) and the loss
  increase on C4 (forgetting), whereas factual learning, though steady, accounts for only a small portion.
  The same pattern generalises to the legal (Pile of Law) and customer-review (Amazon Reviews) domains.
