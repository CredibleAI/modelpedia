key_metric: Factual/counterfactual likelihood ratio changes at a significantly slower rate than topic
  and style ratios (Figures 2, 9, 10); ablation (Figure 4) shows topic+style adaptation is the main
  contributor to loss change; MMLU 0-shot drops from 42.6 (baseline) to 37.3 (LR 2e-5, 1M docs) while
  MMLU clinical anatomy rises from 46.7 to 48.1
caveat: Analysis limited to at most 1 million documents (<1B tokens); the decomposition of text into
  topic, style, and factual is approximate and the boundary between content and style is not always
  clear; quantitative observations may reflect characteristics of the specific corpus used.
