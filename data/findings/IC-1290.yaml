id: IC-1290
title: CLIP, DINO, and DINOv2 as zero-shot natural baselines score below the 50% chance level on Bongard-OpenWorld
  due to adversarial query selection
description: 'The paper evaluates a natural baseline that computes mean embedding similarity between
  a query and the positive/negative support sets using CLIP (ViT-H/14), DINO (ViT-B/8), and DINOv2 (ViT-g/14)
  without any training. All three score well below the 50% chance level: CLIP 10.5%, DINO 15.0%, DINOv2
  14.8%. The authors explain that the adversarial query selection (picking the image with maximal embedding
  distance to the mean of positives) deliberately makes queries look more like the negative set in embedding
  space, undermining similarity-based classification.'
