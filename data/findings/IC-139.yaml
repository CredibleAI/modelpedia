id: IC-139
title: 3D Gaussian Splatting and its variants (Scaffold-GS, Mip-Splatting) are vulnerable to computation
  cost attacks via data poisoning, with peak GPU memory increasing up to 21.93x and training time up
  to 4.97x under unconstrained perturbation
description: The paper demonstrates that 3DGS's adaptive density control mechanism can be exploited
  by poisoning input images to increase their total variation (sharpness). This forces the algorithm
  to over-densify, creating far more 3D Gaussians and dramatically increasing GPU memory and training
  time. The attack works in white-box against standard 3DGS and generalizes in black-box to Scaffold-GS
  and Mip-Splatting without modification. In unconstrained cases on NeRF-Synthetic, peak GPU memory
  reaches 80956 MB (21.93x) on the ship scene, approaching the 80 GB limit of A800/H100 GPUs and causing
  denial-of-service. A naive defense of capping the Gaussian count degrades reconstruction PSNR from
  29.21 to as low as 19.03 dB, making it impractical.
