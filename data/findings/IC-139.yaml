key_metric: 'Unconstrained: ns-ship peak GPU 3692→80956 MB (21.93x↑), training time 8.87→44.11 min (4.97x↑);
  ns-lego peak GPU 3532→78852 MB (22.33x↑). Constrained (ε=16/255): mip-room peak GPU 12316→46238 MB
  (3.75x↑), ns-hotdog 3336→29747 MB (8.92x↑). Black-box Mip-Splatting unconstrained: all Mip-NeRF360
  scenes reach DoS (out-of-memory at 80 GB). Defense threshold 2M Gaussians on room: PSNR drops from
  29.21 to 19.03 dB.'
caveat: The attack assumes the attacker can inject poisoned images into the training dataset (data poisoning
  threat model). The paper approximates computational cost by Gaussian count, acknowledging that Gaussian
  density (overlap in tiles) might be a better metric. The attack was tested on a single NVIDIA A800-SXM4-80G
  GPU.
