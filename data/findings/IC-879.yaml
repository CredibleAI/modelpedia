id: IC-879
title: Code Llama outperforms Llama-2 on coding (HumanEval) and mathematical (GSM8K) reasoning at both
  7B and 13B scales
description: In the limitations section, the paper reports HumanEval and GSM8K scores for Llama-2 and
  Code Llama at 7B and 13B, sourced from the Open LLM Leaderboard. Code Llama, which continued pre-training
  on code data, substantially outperforms the corresponding Llama-2 base on both tasks at both scales.
  The authors use this as secondary validation that pre-training on code data improves coding and mathematical
  reasoning capabilities, consistent with their main experiments on Pangu.
