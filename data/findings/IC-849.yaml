key_metric: 'Pearson correlation (pretrain reward std vs |reward change|): NarrativeQA RFT 0.48 / SFT
  0.05; ToTTo RFT 0.46 / SFT 0.16; IMDb RFT 0.72 / SFT 0.72. Train reward (NarrativeQA): pretrained
  0.110, RFT 0.102, SFT 0.493. Table 6 (NarrativeQA): RFT* 0.101, SFT+RFT 0.537, best heuristic (temp
  1.5) 0.077.'
caveat: The authors note that a causal relation between small reward std prevalence and RFT underperformance
  cannot be inferred from the GRUE experiments alone due to possible confounding factors such as insufficient
  exploration; the controlled experiments and theory are needed to establish causality. Experiments
  use small-to-moderate models and do not incorporate reward functions learned from human feedback.
