id: IC-646
title: DINOv2, DeiT-III, and OpenCLIP repurpose approximately 2% of patch tokens in low-informative
  background areas as internal registers, discarding local patch information while aggregating global
  image information; DINO does not exhibit this behaviour
description: 'The paper identifies high-norm outlier tokens (norm > 150) in the output feature maps
  of DINOv2, DeiT-III, and OpenCLIP. These tokens correspond to patches that are highly similar to their
  four neighbours (cosine similarity 22.8 vs 41.7 for normal patches), indicating redundant background
  content. Linear probing shows these outlier tokens retain far less local information: position prediction
  accuracy drops from 41.7% to 22.8% and pixel reconstruction L2 error rises from 18.38 to 25.23. Conversely,
  using a single outlier token as the image representation for classification yields dramatically higher
  accuracy than a normal patch (e.g. 79.1% vs 17.1% on Aircrafts), indicating they store global image
  information. The artifacts emerge around layer 15 of a 40-layer ViT, appear only after roughly one-third
  of training, and are present exclusively in models of ViT-Large size or larger. DINO ViT-B/16 shows
  no such outliers, and MAE ViT-Large also lacks them.'
