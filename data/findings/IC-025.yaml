id: IC-025
title: LMMs exhibit poor fine-grained perception in locating individual characters on original oracle
  bones
description: The study evaluates the ability of 23 LMMs to perform dense object localization of oracle
  bone characters on original oracle bone images (from the O2BR dataset) and inked rubbings (from the
  Yinqiwenyuandetection dataset). The 'where' question required the models to return bounding boxes
  for each detected character. Performance was measured using mean Intersection over Union (mIoU). All
  evaluated models performed poorly, with Gemini 1.5 Pro significantly outperforming others by two orders
  of magnitude, yet still far from public-level human performance.
