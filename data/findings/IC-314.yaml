id: IC-314
title: Llama-3-70b as an LLM-based evaluator (Llama-3-eval) produces agent rankings consistent with
  GPT-4-based G-Eval on InsightBench
description: 'The paper compares G-Eval (using GPT-4) and Llama-3-eval (using Llama-3-70b) as evaluators
  of agent-generated insights on the first 10 InsightBench datasets. Both methods produce scores in
  similar ranges and rank the agents in the same order: GPT-4o backbone highest, then GPT-4-turbo, GPT-3.5-turbo,
  and Llama-3-70b. The authors conclude Llama-3-70b is a feasible open-source alternative to GPT-4 for
  evaluation, avoiding API costs and periodic model updates.'
