caveat: 'FIM uses forced decoding of gold LFs, so low FIM does not imply the model would generate the
  correct LF under free decoding. The paper explicitly states: ''low f_im does not imply low f_dm, since
  low f_dm requires the model to be accurate.'' GPT-3.5-turbo is excluded from few-shot experiments
  because the API does not provide logit scores.'
