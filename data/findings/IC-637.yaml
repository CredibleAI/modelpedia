id: IC-637
title: KN edit (neuron suppression) has low reliability, overturning at most 5.2% of BLIMP categorical
  predictions and achieving only 1.66%–47.86% reliability on factual tasks
description: After identifying and suppressing the KNs for determiner-noun agreement in BERT, the categorical
  prediction is overturned in at most 5.2% of cases (e.g., det n agr. 2 drops from 100% to 94.8%). The
  paper also reports Yao et al.'s evaluation of KN edit on ZSRE and CounterFact corpora, where reliability
  ranges from 1.66% (GPT-J on CounterFact) to 47.86% (T5-XL on CounterFact). The authors argue this
  low reliability undermines the KN thesis claim that editing a few neurons controls factual generation.
