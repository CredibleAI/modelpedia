key_metric: 'Table 14: editing layers 15-24 gives toxicity 26.83 (0.89) and perplexity 32.50 (0.28);
  editing layers 1-10 gives toxicity 74.63 (9.61) and perplexity 38.41 (2.47); editing layers 1-24 gives
  toxicity 49.80 (1.10) and perplexity 46.25 (5.99)'
caveat: Analysis is limited to GPT-2 Medium (355M) and MLP layers only; the paper notes that self-attention
  layers are not explored. The toxic subspace rank is small (k=2 for GPT-2), and the interpretation
  relies on mapping singular vectors to top-scoring vocabulary tokens.
