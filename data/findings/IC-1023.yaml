key_metric: 'VGG16 top-1: 0.698 (original) → 0.575 (APoP) / 0.685 (APoP & ReLU); ResNet50 top-1: 0.745
  → 0.569 / 0.733; ResNet152 top-1: 0.770 → 0.612 / 0.759; top-5 VGG16: 0.894 → 0.809 / 0.888; all on
  ImageNet validation, zeros input'
caveat: The experiment is conducted on ImageNet validation with standard pretrained checkpoints; the
  authors note the phenomenon is specific to the activation pattern being frozen across the entire network,
  and the 'ones' and 'normal' input conditions show different (sometimes higher) APoP accuracies than
  'zeros', suggesting the result is sensitive to the replacement input.
