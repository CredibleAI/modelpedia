key_metric: 2000 images from ImageNet; 5000 random samples per rank test; 99% threshold for assumption
  validation; n/d ratio 197/768; Kruskal rank 'only slightly larger than n (assumption 1), and much
  smaller than d (general position)' (Figure 1)
caveat: The Kruskal rank test is approximate (NP-hard to compute exactly); the paper uses a polynomial-time
  proxy of sampling n query vectors and checking if the resulting matrix has rank n, repeated 5000 times
  with a 99% success threshold.
