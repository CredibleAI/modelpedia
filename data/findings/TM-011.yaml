id: TM-011
extracted_by: automatic-extraction
title: Spatial coherence of latent feature planes increases with encoder depth
description: >
  The authors pull flat 2D planes out of TerraMind's hidden layers, one each for longitude,
  latitude, altitude and time of year. Measuring how spatially tidy each plane is with Moran's I,
  they find the tidiness increases the deeper into the encoder you look, suggesting the model
  sorts this knowledge out gradually, layer by layer.
evidence_type: correlational
concepts:
  - ref: concept:depth-dependent-structure
key_metric: null
caveat: >
  Moran's I is measured on supervised, GeoEx-selected planes. Recoverability through the probe
  does not establish that TerraMind uses the encoded structure.
