key_metric: 'Max singular value of sum of edit update matrices (Table 1): rome 7.25 (10 edits) to 57.61
  (200 edits); memit 7.46 to 935; mend 14.08 to 191.04. ''with 300 edits, memit''s performance on gpt2-xl
  remained largely unchanged, whereas it dwindled to nearly 0 on llama-2 and llama-3''. ''the mend method
  exhibited significant performance degradation after just 20 sequential edits''.'
caveat: The paper focuses on single-fact-at-a-time editing; batch editing is left as future work. Experiments
  on ZSRE were conducted only on Llama-2 due to compute limitations. The condition number analysis assumes
  a single layer is modified.
