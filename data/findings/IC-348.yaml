id: IC-348
title: Sequential parameter-modifying editing causes progressive degradation of general abilities in
  GPT-2 XL, Llama-2 7B, and Llama-3 8B, driven by growth in the condition number of the edited matrix
description: The paper applies rome, memit, and mend sequentially (up to 300 edits) to three released
  LLMs and measures downstream task performance (reasoning, summarization, open-domain QA, NLI) and
  editing metrics (efficacy, generalization, locality) after each batch of edits. The condition number
  of the edited MLP matrix grows rapidly with edit count, and this growth tracks the decline in general
  abilities. MEND degrades after only ~20 edits, while rome and memit degrade after ~100+ edits. The
  maximum singular value of the cumulative edit update matrix grows from 7.25 to 57.61 (rome) and 7.46
  to 935 (memit) over 200 edits.
