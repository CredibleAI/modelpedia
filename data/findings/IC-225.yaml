id: IC-225
title: ESM3 (1.4B) performs zero-shot protein conformation generation with competitive quality across
  BPTI dynamics, conformation changing pairs, and intrinsically disordered proteins
description: The paper evaluates the pre-trained ESM3 1.4B model in zero-shot mode (no fine-tuning)
  for protein conformation generation using iterative decoding. On BPTI, ESM3 achieves JS-PWD 0.406,
  JS-TIC 0.445, validity 0.800, and TM-ens 0.842, competitive with diffusion-based baselines. On conformation
  changing pairs, it achieves global residue flexibility correlation of 0.312 (apo/holo) and 0.388 (fold-switch).
  On 114 IDP targets from PED, it achieves MAE of 6.606/4.301 (pairwise distance) and 0.249/0.174 (contact
  map), the best among all methods tested.
