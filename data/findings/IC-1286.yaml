key_metric: 'GPT-3.5 Turbo: Alpaca harmfulness rate 5.5% to 31.8% (+26.3%), Dolly 4.5% to 23.9% (+19.4%).
  Llama-2-7B-Chat: Alpaca 0.3% to 16.1% (+15.8%), Dolly 0.6% to 12.1% (+11.5%), LLaVA-Instruct 0% to
  18.8% (+18.8%). All 1 epoch, evaluated on 330 harmful instructions.'
caveat: The authors note that the Alpaca dataset was modified by removing 1,902 safety-related samples
  via sensitive phrase matching to simulate a scenario where no deliberate safety precautions are taken.
  The non-uniform degradation across categories suggests a potential bias in the distribution of RLHF
  efforts.
