id: IC-1286
title: Fine-tuning GPT-3.5 Turbo and Llama-2-7B-Chat on benign utility-oriented datasets (Alpaca, Dolly,
  LLaVA-Instruct) degrades their safety alignment without any malicious intent
description: 'The authors fine-tune both models for 1 epoch on widely used benign instruction-tuning
  datasets: Alpaca (50k samples), Dolly (14.6k samples), and LLaVA-Instruct (80k image-instruction pairs
  for Llama-2). In all cases, the safety alignment degrades: harmfulness rates increase by 12-26 percentage
  points. The degradation is non-uniform across the 11 harmfulness categories, with malware, economic
  harm, fraud/deception, political campaigning, and tailored financial advice being especially vulnerable.
  Ablations show that larger learning rates and smaller batch sizes increase the degradation, while
  more epochs do not necessarily worsen it.'
