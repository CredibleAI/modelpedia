id: IC-926
title: Across 25 MultiBERTs seeds, UAS does not correlate with MLM test loss or BLIMP accuracy
description: 'Using all 25 MultiBERTs seeds, the authors measure the degree to which natural random
  variation yields a correlation between model quality and implicit parse accuracy (UAS) from SAS. They
  find no significant correlation: UAS is uncorrelated with MLM test loss (r2 = −2821) and with grammatical
  capabilities measured by BLIMP (r2 = −317). This null result motivates the authors'' argument that
  correlational evidence alone is insufficient to establish SAS as essential for grammatical capabilities,
  and that developmental (training-time) analysis is needed.'
