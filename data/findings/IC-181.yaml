id: IC-181
title: Truthfulness in Mistral-7B, Mistral-7B-Instruct, Llama3-8B, and Llama3-8B-Instruct is linearly
  decodable from internal representations at exact answer tokens, with middle-to-late layers being most
  informative
description: The paper trains linear probing classifiers on intermediate activations of four LLMs to
  predict whether a generated answer is correct. Probing the exact answer tokens (the tokens whose modification
  would change the answer's correctness) yields substantially higher AUC than probing the last generated
  token, the token before it, or the end of the prompt. For example, on TriviaQA with Mistral-7B-Instruct,
  the probe at the exact answer token achieves AUC 0.85 versus 0.71 at the last generated token. The
  pattern is consistent across all four models and ten datasets. Additionally, middle-to-late layers
  consistently outperform early layers for probing, indicating a depth-dependent organisation of the
  truthfulness signal.
