id: IC-011
title: Jailbreaking LLMs can reduce refusal rates and improve alignment with human preferences
description: The paper applies an uncensoring technique to four open-source LLMs (Llama 3.1 8B, Gemma
  2 2B, Qwen 2 7B, and Llama 2 7B) to reduce refusal rates on morally sensitive prompts. The uncensored
  models show lower refusal rates across all six moral dimensions and better align with human preferences
  compared to their censored counterparts, though refusal rates do not drop to zero.
