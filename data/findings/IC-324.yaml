key_metric: 'Base model ICL: 8/8 answers = in-context city (kjheergg). Fine-tuned model ICL: 4/8 ICL,
  2/8 IWL override (trrrrqe answers qtbnaaa log-prob 0.0000 vs kjheergg -21.6897; kaitlyn answers kingston
  log-prob -0.1156 vs kjheergg -2.4694), 2/8 other. Fine-tuned IWL: 6/8 correct (4/4 real, 2/4 invented)
  vs base 0/8.'
caveat: Only 8 questions were used for fine-tuning and evaluation; the effect is demonstrated on a single
  small set of name-city pairs. The paper notes that with longer or more informative prompts the ICL
  behaviour is partially restored, and that the results are specific to this small-scale memorization
  setup.
