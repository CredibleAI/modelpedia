id: IC-306
title: Instruction tuning increases the ROUGE score of prompt-injected data extraction by 65.76 on average
  compared to base models
description: The paper compares base and instruction-tuned variants of Llama2-7b, Llama2-13b, Mistral-7b,
  and Mixtral-8x7b under the same prompt-injection attack. In every case, the instruction-tuned model
  produces output more similar to the retrieved context than the base model. The average ROUGE-L increase
  across the four model pairs is 65.76, indicating that the instruction-following capability acquired
  during alignment training makes models significantly more susceptible to following malicious copy
  instructions.
