key_metric: 'valid answer rate: 23% (SCF, 10^4 eV), 70% (HOMO), 71% (LUMO), 70% (H-L gap); MAE: 3.84
  (10^4 eV) SCF, 2.87 eV HOMO, 1.89 eV LUMO, 1.86 eV H-L gap; compared to 82% (weight), 85% (logp),
  84% (tpsa), 76% (complexity) for non-3D properties'
caveat: The evaluation is on the authors' own 3D-MoIT test set (PubChemQC subset, 2000 molecules), and
  the task format (open-text QA with a specific prompt template) may not generalise to other evaluation
  settings. The paper does not ablate whether the failure is due to the model's inability to parse 3D
  structure or to its general difficulty with numerical generation.
