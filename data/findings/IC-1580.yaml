id: IC-1580
title: The official Llama 2-7B checkpoint fails to generate valid numerical responses for 3D-dependent
  molecular properties, with a valid answer rate of only 23% for SCF energy
description: The paper evaluates the unmodified Llama 2-7B checkpoint on open-text molecular QA tasks
  that require predicting numerical computed properties. When the property is 3D-dependent (HOMO, LUMO,
  HOMO-LUMO gap, SCF energy) and cannot be straightforwardly derived from the SMILES string, the model
  frequently produces no valid numerical answer. The valid answer rate drops to 23% for SCF energy and
  70-71% for HOMO, LUMO, and H-L gap, compared to 82-85% for simpler composition-based properties like
  molecular weight and LogP. The authors attribute this to the properties not being derivable from 1D
  SMILES representations.
