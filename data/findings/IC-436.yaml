id: IC-436
title: API selection accuracy of 10 LLM-based agents degrades sharply as task complexity increases,
  with open-source models ≥70B matching closed-source on simpler tasks but lagging on the most complex
description: The paper evaluates 10 LLMs (5 open-source, 5 closed-source) on API selection across 4
  difficulty levels of ShortcutsBench. At the easiest level (0,1] all models perform well, but accuracy
  drops by an average of 19% moving to (1,5] and by 46% moving to (5,15]. Open-source models ≥70B (Llama-3-70B,
  Qwen-2-72B, DeepSeek-2-Chat/Coder) match or exceed closed-source models on the first three difficulty
  levels but fall behind on the hardest (15,30] level. Performance also varies by task type, with lifestyle
  & social tasks scoring highest and development & API tasks lowest.
