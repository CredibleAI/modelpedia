id: IC-816
title: RLHF on general-purpose preference data increases privacy leakage in Pythia and Llama-7B models
description: Using a synthetic privacy benchmark of 1800 prompts containing 18 types of PII, the authors
  measure the percentage of private information the model reveals when asked. Privacy leakage increases
  notably after RLHF, with the change mainly coming from the PPO and DPO steps after the initial SFT.
  The authors explain this as the pairwise comparison data, especially helpfulness-related samples,
  making the model more inclined to comply with recent user requests without enhancing its understanding
  of privacy importance.
