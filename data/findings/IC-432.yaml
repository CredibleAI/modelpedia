caveat: The authors note that emergent phenomena are common across LLM benchmarks and it might be hard
  to claim all of them show clear u-shaped vs. inverted-u scaling. The focus is on multiple-choice tasks;
  applying the method to string-matching tasks requires identifying a suitable continuous metric.
