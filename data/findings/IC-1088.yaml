id: IC-1088
title: ICL predictions in LLaMA, LLaMA-2, and Falcon models depend on in-context label information and
  can learn truly novel label relationships
description: The paper tests whether ICL predictions are independent of the conditional label distribution
  of in-context examples (NH1). By randomizing in-context labels, they show that log likelihoods and
  entropies degrade significantly across all 10 model variants and 9 tasks, rejecting NH1. They further
  demonstrate that ICL can learn a completely novel author-identification task (private Slack messages
  between two authors) that is guaranteed absent from pre-training data, with all models except Falcon-7B-Instruct
  achieving better-than-random accuracy. This confirms ICL genuinely uses and learns from in-context
  label information rather than merely recognizing task format.
