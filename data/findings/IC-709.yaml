key_metric: 'Swin-S pruned 45% of parameters: lower layers keep a larger ratio of parameters than higher
  layers (Figure 5); in first and second blocks, attention layers (1,2,5,6) have larger kept ratios
  than MLP layers (3,4,7,8); Swin-B top-5 drop 0.07% at 52.5% params removed; Swin-S top-5 drop -0.03%
  at 33.2% params removed'
caveat: The depth-dependent pattern is observed using the authors' own module-level importance metric;
  a different importance criterion might reveal a different depth profile. The analysis is limited to
  Swin Transformers and may not generalise to other hierarchical ViT architectures.
