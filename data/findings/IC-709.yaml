id: IC-709
title: Swin Transformer parameter redundancy is depth-dependent, with higher layers retaining fewer
  parameters than lower layers under module-aware pruning
description: The authors analyse which weights in Swin-S are most important using their module-level
  distortion metric and observe a clear depth-dependent pattern in the ratio of kept parameters. Lower
  layers (early in the network) retain a larger fraction of their parameters, while higher layers (deeper
  in the network) are pruned more aggressively, indicating greater redundancy in deeper layers. Additionally,
  within the first and second Swin blocks, attention-related layers (att-qkv, att-prj) retain a higher
  ratio of parameters than MLP-related layers (mlp-fc1, mlp-fc2), suggesting attention is more critical
  for low-level feature extraction. This depth-dependent redundancy structure is what makes uniform
  magnitude pruning suboptimal, as it does not account for the varying importance across depths.
