id: IC-733
title: CoT prompting improves factual accuracy for instruction-tuned LLMs but degrades it for non-instruction-tuned
  LLMs such as OPT, BLOOM, and LLaMA
description: The paper evaluates 10 LLMs under four prompting strategies (zero-shot, zero-shot CoT,
  few-shot, few-shot CoT) on the Pinocchio benchmark. Instruction-tuned models benefit from CoT with
  an average 2.1% improvement, while non-instruction-tuned models (OPT, BLOOM, LLaMA) show stable or
  decreased accuracy. The authors attribute this to untuned models producing verbose content considerations
  under CoT that overshadow the factual discernment task, leading to incorrect label outputs. Overall,
  LLMs without instruction tuning underperform those with instruction tuning by 16.0%.
