title: CLIP matches a caption to text printed inside the photo, linking the word doll to a dollar patch
description: >
  Some of the interaction maps show CLIP matching an image to a caption because of words
  physically printed inside the photo, rather than because of what the photo actually depicts. The
  clearest case: the strongest link the method found was between the caption word doll and an
  image patch containing the printed text dollar.
