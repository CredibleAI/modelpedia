id: IC-714
title: For GPT-4 book-length summaries, human annotators prefer incremental summaries for detail (83%
  vs 11%) but hierarchical for structure (59% vs 35%), logic (53% vs 38%), and overall (54% vs 44%),
  showing coherence and human preference are not aligned
description: The same four annotators who performed fine-grained error annotation were asked to make
  coarse-grained preference judgments on 100 pairs of GPT-4-generated incremental and hierarchical summaries.
  Despite hierarchical summaries having higher BooookScore (89.1 vs 82.5), annotators strongly preferred
  incremental summaries for level of detail (83% vs 11%) but preferred hierarchical for structure, logic,
  and overall quality. The authors conclude that summary-level preference judgments are highly subjective
  and do not correlate with BooookScore.
