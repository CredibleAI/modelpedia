id: IC-350
title: Editing conceptual knowledge with rome on Llama-2 7B is harder than factual knowledge editing,
  with the model failing to update concept-instance relationships
description: Using the ConceptEdit dataset, the paper edits conceptual knowledge (definitions of concepts)
  with rome on Llama-2 7B. At 100 edits, editing performance (efficacy 28.25, generalization 30.18,
  locality 5.68) and general abilities (reasoning 12.29, summarization 4.7, open-QA 0.77, NLI 0) are
  all very low. The 'instance change' metric is only 10, indicating that when a concept's definition
  is altered, the model still recognizes the original instances as belonging to that concept. The paper
  concludes that rome 'primarily modifies the definition without successfully altering the relationship
  between concepts and instances.'
