id: IC-017
title: Truncating MLP weights improves few-shot Chain-of-Thought reasoning accuracy on GSM8K for Phi-3
  and Llama-3.1-8B
description: The paper evaluates the effect of LASER on the performance of Phi-3 and Llama-3.1-8B models
  on the GSM8K math word problem benchmark using few-shot Chain-of-Thought prompting. For 1-shot and
  2-shot settings, applying LASER improves accuracy compared to the full model. For example, Phi-3 accuracy
  improves from 56.0% to 66.1% in the 1-shot setting.
