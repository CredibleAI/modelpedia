id: IC-058
title: The answer to factual questions appears in the top 0.01% most influential pretraining documents
  for 55% of 7B queries and 30% of 35B queries, but almost never for reasoning questions
description: By searching for answer keywords in the top 500 (top 0.01%) influential documents and using
  Command R+ to verify, the authors find the full answer to factual questions in the top documents for
  55% of 7B queries and 30% of 35B queries. For reasoning questions, the answer appears in only 7.4%
  of 7B queries (twice, in separate documents for intermediate steps) and never for 35B queries. When
  counting all occurrences, answers appear 30 times for 7B factual vs 2 times for 7B reasoning, and
  15 times for 35B factual vs 0 for 35B reasoning. The authors verify the answers to reasoning steps
  do exist in the broader 2.5B token sample but are not highly influential.
