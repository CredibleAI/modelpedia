id: IC-1339
title: Chinchilla 1B's compression rate improves with increasing sequence length across text, image,
  and audio, demonstrating in-context learning without gradient updates
description: The paper measures the compression rate of Chinchilla 1B, gzip, and a small transformer
  over subsequences of increasing length (up to 2048 bytes), averaged over 100 sequences per dataset.
  For all three data modalities (enwik9, ImageNet, Librispeech), the compression rate decreases (improves)
  as the sequence length grows, indicating the model is learning data statistics in-context. Chinchilla
  1B achieves the best compression rates across all modalities and sequence lengths compared to gzip
  and the small transformer.
