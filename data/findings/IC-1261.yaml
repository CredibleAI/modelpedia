id: IC-1261
title: LLaMA-2 attention to constraint tokens correlates with factual correctness, and a linear probe
  on these attention weights predicts factual errors comparably to model confidence
description: The paper measures the attention contribution from constraint tokens to the final generation
  token across all layers and heads in LLaMA-2 7B, 13B, and 70B. When the model produces a factually
  correct completion, the norm of attention to constraint tokens is larger; when it fails, attention
  is weaker. A logistic regression probe (SAT Probe) trained on these attention weights achieves AUROC
  comparable to the model's own confidence for predicting factual errors across 10 datasets with over
  40,000 prompts. The combined predictor (attention + confidence) outperforms either alone in most settings.
  The signal is also available for individual constraints in multi-constraint queries.
