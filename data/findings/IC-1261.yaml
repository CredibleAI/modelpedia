key_metric: Spearman's ρ = 0.67 (70B), 0.65 (13B), 0.66 (7B) for predicting entity popularity from attention
  (p < 10^-8); SAT Probe AUROC 0.95 ± 0.00 vs confidence 0.96 ± 0.00 (7B basketball players); SAT Probe
  AUROC 0.73 ± 0.00 vs confidence 0.88 ± 0.00 (70B basketball players); combined predictor AUROC 0.91
  ± 0.00 (70B basketball players)
caveat: The paper acknowledges that exact match is a strict criterion that could introduce noise; attention
  alone does not explain all failures (some attention on constraints where the model still fails); the
  content of the information in attention patterns remains opaque
