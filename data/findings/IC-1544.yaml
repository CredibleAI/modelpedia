id: IC-1544
title: The latent spaces of pretrained foundational models across vision and text are not related by
  a single class of geometric transformations; the optimal alignment depends on the specific model pair,
  architecture, and dataset.
description: The paper measures CKA similarity between the latent spaces of eleven pretrained foundational
  models (five vision, six text) under four different invariance assumptions (cosine/angle-preserving,
  Euclidean/translation-invariant, L1, L∞). No single projection consistently yields the highest similarity
  across all model pairs and datasets. For example, on CIFAR-10, the best projection differs between
  ViT-based models and CLIP. In zero-shot stitching, the L∞ projection is consistently worst (e.g.,
  0.31 accuracy for ViT-B/16 on CIFAR-100) while cosine, Euclidean, and L1 are comparable (0.77–0.79),
  and the product of all four achieves the highest score (0.81). This demonstrates that the geometric
  structure relating these models' representations is not captured by any single transformation class.
