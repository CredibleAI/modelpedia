id: IC-076
title: 'GoogLeNet and ViT exhibit input space mode connectivity: inputs with similar predictions are
  connected by low-loss paths, with real-real pairs showing approximately linear paths and real-adversarial
  pairs showing significantly higher barriers'
description: The authors linearly interpolate pairs of same-class inputs in GoogLeNet (ImageNet) and
  ViT (ImageNet) and measure the cross-entropy loss along the path. For real-real pairs, a single optimization
  step on the maximum-loss intermediate point yields a low-loss path that is nearly linear. For real-adversarial
  pairs, the barrier is significantly higher and the path requires multiple optimization rounds. Across
  5,000 pairs per scenario (5 per class over 1000 ImageNet classes), the mean barrier height is 2.27
  for real-real pairs versus 5.82 for real-adversarial pairs, and the mean barrier gap is 1.00 versus
  5.19 respectively. The same qualitative pattern is observed in ViT base patch16 224.sam in1k.
