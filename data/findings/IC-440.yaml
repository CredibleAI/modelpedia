id: IC-440
title: GPT-4o, Gemini 1.5 Pro, and Claude 3.5 Sonnet show up to 25% skill-level accuracy gaps despite
  overall accuracies within 0.4% of each other
description: 'The paper evaluates three frontier models on 46k instances across 12 benchmarks, grouping
  instances into skill-slices (sets sharing a relevant skill). While aggregate accuracy is nearly identical,
  per-slice accuracy reveals stark trade-offs: Gemini 1.5 Pro is 18% more accurate at computing molar
  mass but 19% less accurate at applying constitutional law; GPT-4o is 16.7% more accurate at traffic
  signal identification. GPT-4o''s relative strengths are visual skills, Gemini 1.5 Pro''s are math
  and science, and Claude 3.5 Sonnet''s are legal reasoning.'
