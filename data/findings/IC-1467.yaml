id: IC-1467
title: DECAF achieves PVE 9.65 and f-score 89.6 on the DECAF validation set with a runtime of 19.59
  seconds per image
description: The paper reports DECAF's quantitative performance on the DECAF validation set. DECAF uses
  an optimization-based fitting process that takes 19.59 seconds per image on an A6000 GPU, roughly
  200x slower than DICE. It achieves the best per-vertex error (9.65) and the highest overall physical
  plausibility f-score (89.6) among all methods tested. For contact estimation, DECAF achieves face
  f-score 0.57 and hand f-score 0.47. The paper notes that DECAF requires temporal information from
  successive frames and 3D ground-truth annotations for training, limiting its generalization to in-the-wild
  data.
