id: IC-319
title: Different CLIP backbones exhibit distinct robustness profiles to specific image perturbations,
  with each architecture being most resilient to a different transformation
description: 'The paper applies five image transformations (resize, flip, grayscale, color jitter, gaussian
  blur) to subsets of each benchmark''s test set and measures the accuracy drop for each of the 9 CLIP
  backbones. The results show that no single backbone is uniformly most robust: RN50 and ViT-B/16 are
  most resilient to flip, RN50x64 to resize, RN50x16 to grayscale, and ViT-L/14 and ViT-L/14-336 to
  color jitter and gaussian blur. This indicates that the backbones'' ability to handle out-of-distribution
  inputs varies widely and is architecture-specific.'
