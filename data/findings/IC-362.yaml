id: IC-362
title: LLMs with chain-of-thought prompting predict and simulate human risky choices that are more rational
  than actual human behavior, correlating more highly with maximum expected value than with human choices
description: 'Across 9,831 risky choice problems from the Choices13k dataset, five LLMs were asked to
  predict, aggregate, or simulate human gamble selections. Under chain-of-thought prompting, all models
  produced predictions that correlated more strongly with the maximum expected value (the rational choice)
  than with actual human choices. GPT-4o CoT achieved a Spearman correlation of 0.94 with max EV versus
  only 0.61 with humans, while humans themselves correlate at 0.48 with max EV. The gap widens with
  model capability: Llama-3-8B CoT reaches 0.57 with EV, Llama-3-70B 0.80, Claude 3 Opus 0.76, GPT-4-Turbo
  0.93. Zero-shot prompting yields noisier, less rational predictions, and a behavioral model fit on
  GPT-4-Turbo zero-shot outputs revealed a mixture of rational and probability-ignoring strategies.'
