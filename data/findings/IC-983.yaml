id: IC-983
title: 'In Stable Diffusion''s CLIP text-encoder, knowledge about all visual attributes is localized
  to a single causal state: the first self-attention layer at the last subject token'
description: 'Applying the same causal tracing to the 12-block CLIP ViT-L/336px text-encoder, the paper
  finds only one causal state across all four visual attributes: the first self-attention layer (self-attn-0)
  corresponding to the last subject token in the caption. Restoring this single layer in a corrupted
  model restores high-fidelity generation, while restoring any of the other 11 layers does not. This
  contrasts with LLMs where factual knowledge is in mid-MLP layers. The paper confirms the localization
  by showing that editing (via Diff-QuickFix) the causal layer effectively removes or updates concepts,
  while editing non-causal layers (1-11) produces no change in CLIP-score.'
