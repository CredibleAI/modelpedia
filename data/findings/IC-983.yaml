key_metric: CLIP-score for incorrect fact (e.g., Donald Trump as US president) decreases from 0.28 to
  0.23 after editing; CLIP-score for correct fact (e.g., Joe Biden) increases from 0.22 to 0.29; editing
  non-causal layers (1-11) shows no intended change
caveat: The finding is specific to the CLIP-based text-encoder in Stable Diffusion. The paper notes
  this is 'in stark contrast to the causal states in other language models which are often the mid-mlp
  layers.' The single causal state observation is for the four attributes tested (objects, style, action,
  color).
