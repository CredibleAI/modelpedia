id: IC-1106
title: 'CLIP prompts found by greedy search do not fit random labels: train and test error drop in tandem
  as the fraction of flipped labels increases, unlike a linear probe which achieves near-random accuracy'
description: The authors test whether CLIP prompts can memorize noise by running greedy search on CIFAR-10,
  CIFAR-100, FMOW, and OfficeHome with a controlled fraction of randomly flipped training labels. Both
  training and test error decrease monotonically and in tandem as the flip ratio increases, indicating
  the prompts track the true signal rather than the noise. As a baseline, a linear probe trained on
  the same CLIP features with 100% flipped labels achieves roughly random performance (13.60% accuracy
  on CIFAR-10), confirming that the prompt space is too small to memorize arbitrary label assignments.
