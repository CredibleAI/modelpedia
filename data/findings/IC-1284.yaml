id: IC-1284
title: Fine-tuning GPT-3.5 Turbo and Llama-2-7B-Chat on as few as 10 explicitly harmful examples removes
  their safety alignment, raising harmfulness rates to 80-92%
description: 'The authors fine-tune GPT-3.5 Turbo (via OpenAI API) and Llama-2-7B-Chat (full-parameter)
  on 10, 50, or 100 harmful instruction-response pairs sampled from the Anthropic red team dataset.
  After just 5 epochs, the models'' safety guardrails are largely removed: they generalize to fulfill
  unseen harmful instructions across 11 policy categories. The 10-shot attack on GPT-3.5 Turbo costs
  less than $0.20 and the 10-shot attack on Llama-2 requires only 5 gradient steps. The effect is not
  sensitive to the number of fine-tuning epochs.'
