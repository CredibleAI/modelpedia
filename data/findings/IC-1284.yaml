key_metric: 'GPT-3.5 Turbo harmfulness rate: 1.8% (initial) to 88.8% (10-shot), 87.0% (50-shot), 91.8%
  (100-shot); harmfulness score 1.13 to 4.75/4.71/4.82. Llama-2-7B-Chat harmfulness rate: 0.3% to 50.0%
  (10-shot), 80.3% (50-shot), 80.0% (100-shot); harmfulness score 1.06 to 3.58/4.52/4.54. Evaluated
  on 330 harmful instructions across 11 categories.'
caveat: The authors note that OpenAI's fine-tuning data moderation was not triggered by these examples,
  but some mitigation strategies may have been deployed after the authors' responsible disclosure, potentially
  affecting reproducibility.
