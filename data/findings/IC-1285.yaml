key_metric: 'GPT-3.5 Turbo harmfulness rate: 0% (initial) to 7.3% (3 epochs), 49.1% (5 epochs), 87.3%
  (10 epochs); harmfulness score 1.00 to 4.67. Llama-2-7B-Chat harmfulness rate: 0% to 54.2% (3 epochs),
  72.1% (5 epochs), 68.2% (10 epochs); harmfulness score 1.02 to 4.27. Evaluated on 330 harmful instructions.'
caveat: The identity-shifting data is flagged by none of the data moderation systems tested, including
  the GPT-4 judge, suggesting that even advanced moderation may not catch such implicit attacks.
