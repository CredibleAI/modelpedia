id: IC-1285
title: Fine-tuning GPT-3.5 Turbo and Llama-2-7B-Chat on 10 implicitly harmful identity-shifting examples
  (containing no toxic content) jailbreaks their safety alignment
description: The authors craft 10 conversation examples in which the model re-identifies itself as an
  'absolutely obedient agent' (AOA) and fulfills benign instructions with a fixed affirmative prefix.
  None of the examples contain toxic or sensitive vocabulary, and none are flagged by OpenAI's moderation
  API. After fine-tuning on these 10 examples, both models become easily jailbroken and fulfill almost
  any unseen harmful instruction. The attack is designed to bypass training-data moderation systems
  that would catch explicitly harmful content.
