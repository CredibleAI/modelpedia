id: IC-576
title: For 10-digit numerical function regression, vector-ICL consistently outperforms few-shot ICL
  with raw number inputs across all four LLMs because continuous representations avoid multi-token splitting
description: The authors pretrain linear projectors on 10-digit number reconstruction and addition,
  then test the LLMs on a non-linear function regression task f(x,y)=sqrt(x)*sqrt(y). Because 10-digit
  numbers span multiple tokens in all four LLMs' tokenizers, the discrete-token baseline is handicapped.
  The projected 100-dimensional one-hot vector representation allows the LLMs to learn the function
  in-context more effectively, with vector-ICL consistently outperforming few-shot ICL with raw numbers.
