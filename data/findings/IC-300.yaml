id: IC-300
title: One MoE expert in Mixtral-8x7B is structurally distinct from the others in many layers
description: The paper applies DOCS to the expert weight matrices (W1, W2, W3) of the mixture-of-experts
  layers in Mixtral-8x7B. In many layers, typically just one expert stands out with clear separation
  (dark grids) from the other experts. The third expert in particular shows prominent dark intersecting
  lines in the similarity heatmaps, indicating it has a significantly different weight structure. The
  authors hypothesize this may relate to data load imbalance during MoE training.
