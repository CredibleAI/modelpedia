id: IC-1386
title: Fact recall in OPT and LLaMA models degrades by more than 5% relative accuracy when more than
  30% of weights are pruned, and similarly when moving from the 30B to the 13B dense model
description: 'The paper evaluates closed-book question answering (TriviaQA, WebQuestions) on OPT-13B,
  OPT-30B, LLaMA-13B, and LLaMA-33B under progressive weight pruning via SparseGPT. Accepting a 5% relative
  accuracy drop from the dense model, the maximum tolerable sparsity is 30% on TriviaQA and 40% on WebQuestions.
  The same sensitivity appears under dense scaling: moving from OPT-30B to OPT-13B causes more than
  5% relative accuracy degradation on both close-book tasks. The pattern is confirmed on Pythia-12B
  (20% sparsity threshold) and with the Wanda pruning algorithm (30% threshold).'
