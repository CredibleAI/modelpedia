id: IC-027
title: LMM performance in deciphering oracle bone inscriptions is comparable to untrained humans for
  common characters but declines for rarer and structurally complex characters
description: The study evaluates the interpretive abilities of 23 LMMs on 140 oracle bone characters
  across three datasets. Performance was measured using BERTScore to compare the model's generated English
  descriptions against expert-labelled golden descriptions. For high-frequency characters, models like
  GPT-4o, GPT-4V, and Gemini 1.5 Pro approached or exceeded the performance of a public-level human
  baseline. However, performance decreased with lower character frequency, and was noticeably worse
  for ideograms and structurally similar radical variants.
