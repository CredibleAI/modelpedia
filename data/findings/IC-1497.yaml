id: IC-1497
title: LLaMA-7B's frozen transformer block amplifies informative visual tokens, producing feature activations
  with higher Miou against ground-truth segmentation masks than both the baseline ViT and the model's
  own attention scores
description: 'Using ImageNet-S segmentation masks as ground truth for informative regions, the paper
  generates pseudo-masks from feature activations and attention scores at each layer. After training
  with the frozen LLaMA block, the feature activation (especially at the second linear layer f2l) shows
  stronger concentration on target objects. The Miou of vit-s-llama''s f2l pseudo-mask (54.1%) far exceeds
  its own attention-score pseudo-mask (7.5%) and also exceeds vit-s''s f2l (41.4%). Qualitative visualizations
  on action recognition, point cloud classification, 2D VQA, and 3D VQA show the same pattern: the LLaMA
  block sharpens activation on relevant regions.'
