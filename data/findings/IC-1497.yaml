key_metric: 'Miou of pseudo-masks: vit-s-llama f2l 54.1% vs attention 7.5%; vit-s f2l 41.4% vs attention
  29.8%; vit-b-llama f2l 47.8% vs attention 35.7%'
caveat: The authors note that pseudo-masks from magnitude or frequency activation are 'intuitive but
  lossy measures to quantify feature quality, because neural networks can encode information in other
  formats.' The hypothesis does not yet explain how training dynamics facilitate cooperation between
  visual tokens and the frozen language transformer.
