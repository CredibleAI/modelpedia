id: IC-606
title: The relationship between model size and jailbreak vulnerability is reversed between Anthropic
  and Meta model families
description: 'Within the Anthropic family, the larger model (Claude-3-Sonnet) is substantially harder
  to jailbreak than the smaller one (Claude-3-Haiku), with max ASR of 44% versus 82%, and the synthesizer
  required over 60 iterations to reach 80% mean ASR on Sonnet. Within the Meta Llama-3 family, the pattern
  is reversed: the larger model (Llama-3-70B) is easier to jailbreak than the smaller one (Llama-3-8B),
  with max ASR of 90% versus 74%. For OpenAI, both GPT-3.5 and GPT-4o were relatively easy to jailbreak
  (under 10 synthesis iterations), with GPT-4o showing slightly higher max ASR (94% vs 88%).'
