key_metric: 'Disentangle score: HyperDAS (asymmetric) 84.7 average, MDAS 76.0 average (Table 3a); City
  domain: HyperDAS-sym 76.9 / 90.9 / 83.9 (cause/iso/disentangle) at layer 15 (Figure 3b).'
caveat: The paper notes that HyperDAS will only be successful if the target concept is mediated by linear
  features, and that non-linear mediators are a possibility. It also acknowledges the risk that the
  method might 'hack' evaluations and inject information rather than uncovering causal structure, though
  design choices were made to mitigate this.
