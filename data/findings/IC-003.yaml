id: IC-003
title: HyperDAS dynamically selects intervention tokens and learns linear subspaces in Llama3-8b that
  mediate entity attributes.
description: The paper introduces HyperDAS, a hypernetwork-based method to automate the localization
  of concepts in a pre-trained Llama3-8b model. HyperDAS uses a transformer to encode a natural language
  description of a concept (e.g., 'the country of a city') and then selects token positions and identifies
  a linear subspace in the model's residual stream for intervention. It is trained and evaluated on
  the RAVEL benchmark, which measures the ability to disentangle entity attributes (e.g., country, birth
  year) through causal interventions. HyperDAS achieves state-of-the-art disentanglement scores, outperforming
  the Multi-task Distributed Alignment Search (MDAS) baseline across five entity domains. The analysis
  shows that HyperDAS targets different token positions depending on the layer, with middle layers focusing
  on entity tokens and deeper layers targeting syntax tokens.
