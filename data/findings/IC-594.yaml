id: IC-594
title: In LLaMA-2-7B, the truth-correlated attention heads are concentrated after layer 9, with two
  functional types (structural and associative) evenly distributed throughout the upper portions of
  the model, showing no further depth-dependent specialisation within that region.
description: The paper plots the distribution of type-1 (structural) and type-2 (associative) voters
  across the 32 layers of LLaMA-2-7B and finds that both types are evenly spread out after the ninth
  layer, with no clear preference for either type at any particular depth. Table 6 on Mistral-7B-Instruct
  confirms that both voter types exhibit similar individual accuracy (type-1 mean 42.17%, type-2 mean
  39.49%) and that no specific localisation of their roles exists within the upper layers. This indicates
  that the truth-encoding structure is absent in the early layers and present throughout the upper portion,
  but does not sharpen further with depth.
